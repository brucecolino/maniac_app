<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Maniac — Post 10 Launch CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #0A0A0F;
    font-family: 'Inter', sans-serif;
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(139,111,209,0.15); border-radius: 24px; pointer-events: none; }

  /* Multi-layer glow */
  .glow-1 { position: absolute; width: 900px; height: 900px; top: 50%; left: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(139,111,209,0.2) 0%, transparent 60%); }
  .glow-2 { position: absolute; width: 500px; height: 500px; top: 30%; left: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(166,143,224,0.15) 0%, transparent 65%); }

  /* Rings */
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(139,111,209,0.08);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  .ring-1 { width: 320px; height: 320px; border-color: rgba(139,111,209,0.15); }
  .ring-2 { width: 520px; height: 520px; }
  .ring-3 { width: 720px; height: 720px; border-color: rgba(139,111,209,0.05); }
  .ring-4 { width: 920px; height: 920px; border-color: rgba(139,111,209,0.03); }

  /* Logo center */
  .logo-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -68%);
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .logo-center img {
    width: 180px; height: 180px;
    filter: drop-shadow(0 0 50px rgba(139,111,209,0.9)) drop-shadow(0 0 100px rgba(139,111,209,0.5));
  }
  .brand-name {
    font-size: 80px; font-weight: 800; letter-spacing: -2px;
    color: #F2F2F5;
    text-shadow: 0 0 40px rgba(139,111,209,0.3);
  }

  /* DISPONIBILE ORA badge */
  .live-badge {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, 2%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(63,184,131,0.12);
    border: 1px solid rgba(63,184,131,0.4);
    border-radius: 100px;
    padding: 12px 28px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #3FB883; box-shadow: 0 0 8px #3FB883; }
  .live-text { font-size: 16px; font-weight: 800; color: #3FB883; letter-spacing: 2px; text-transform: uppercase; }

  /* Feature checklist */
  .checklist {
    position: absolute;
    bottom: 220px; left: 50%; transform: translateX(-50%);
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 48px;
    white-space: nowrap;
  }
  .ci { display: flex; align-items: center; gap: 10px; }
  .ci-check { width: 20px; height: 20px; border-radius: 50%; background: rgba(139,111,209,0.2); border: 1px solid rgba(139,111,209,0.5); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8B6FD1; font-weight: 700; flex-shrink: 0; }
  .ci-text { font-size: 15px; font-weight: 500; color: #A0A0B3; }

  /* Bottom CTA */
  .bottom-cta {
    position: absolute;
    bottom: 72px; left: 80px; right: 80px;
    display: flex; align-items: center; gap: 16px;
  }
  .url-card {
    flex: 1;
    background: #14141C;
    border: 1px solid rgba(139,111,209,0.3);
    border-radius: 12px;
    padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .url-text { font-size: 20px; font-weight: 700; color: #8B6FD1; }
  .url-sub { font-size: 13px; color: #60607A; }
  .dl-btn {
    padding: 18px 36px;
    background: linear-gradient(135deg, #8B6FD1, #A68FE0);
    border-radius: 12px;
    font-size: 16px; font-weight: 800; color: #fff;
    box-shadow: 0 8px 32px rgba(139,111,209,0.4);
    text-align: center; white-space: nowrap;
  }
  .dl-btn-sub { font-size: 11px; font-weight: 400; opacity: 0.8; }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="frame"></div>

  <div class="logo-center">
    <img src="../../assets/maniac_logo.png" alt="Maniac">
    <div class="brand-name">MANIAC</div>
  </div>

  <div class="live-badge">
    <div class="live-dot"></div>
    <div class="live-text">Disponibile ora</div>
  </div>

  <div class="checklist">
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">AI Face Recognition</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Suite audio pro</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Sottotitoli automatici</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Color grading live</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Multi-view 1/2/3/4</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Nessun cloud · Privacy</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Download integrato</div></div>
    <div class="ci"><div class="ci-check">✓</div><div class="ci-text">Tag system 32 colori</div></div>
  </div>

  <div class="bottom-cta">
    <div class="url-card">
      <div>
        <div class="url-text">maniacplayer.app</div>
        <div class="url-sub">Windows 10 / 11 · Gratis 30 giorni</div>
      </div>
      <div style="font-size:22px;color:rgba(139,111,209,0.4)">→</div>
    </div>
    <div class="dl-btn">
      Scarica gratis<br>
      <span class="dl-btn-sub">poi €4.99 / anno</span>
    </div>
  </div>
</body>
</html>
