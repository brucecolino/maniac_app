<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Maniac — Post 03 Face Recognition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #0A0A0F;
    font-family: 'Inter', sans-serif;
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(139,111,209,0.12); border-radius: 24px; pointer-events: none; }

  /* Background glow */
  .bg-glow {
    position: absolute;
    width: 600px; height: 600px;
    top: 50%; left: 50%; transform: translate(-50%, -60%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,111,209,0.12) 0%, transparent 70%);
  }

  /* Grid lines background */
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(139,111,209,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,111,209,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Center face area */
  .face-area {
    position: absolute;
    top: 130px; left: 50%; transform: translateX(-50%);
    width: 440px; height: 440px;
  }

  /* SVG face silhouette */
  .face-svg { width: 100%; height: 100%; }

  /* Bounding box */
  .bbox {
    position: absolute;
    top: 50px; left: 80px; right: 80px; bottom: 30px;
    border: 2px solid #8B6FD1;
    box-shadow: 0 0 20px rgba(139,111,209,0.4), inset 0 0 20px rgba(139,111,209,0.05);
  }
  /* Corner accents */
  .bbox::before, .bbox::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: #A68FE0;
    border-style: solid;
  }
  .bbox::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
  .bbox::after  { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

  /* Corner accents 2 */
  .bbox-c2::before, .bbox-c2::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: #A68FE0;
    border-style: solid;
  }
  .bbox-c2::before { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
  .bbox-c2::after  { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }

  /* Name badge */
  .name-badge {
    position: absolute;
    top: 46px; left: 50%; transform: translateX(-50%);
    background: #8B6FD1;
    border-radius: 6px;
    padding: 6px 14px;
    white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .name-badge .name { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .name-badge .count { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); }

  /* Scan line animation placeholder */
  .scan-line {
    position: absolute;
    left: 80px; right: 80px;
    top: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #8B6FD1, transparent);
    box-shadow: 0 0 8px rgba(139,111,209,0.8);
  }

  /* Dots overlay */
  .dot-grid {
    position: absolute; top: 50px; left: 80px; right: 80px; bottom: 30px;
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(10, 1fr);
    gap: 0;
  }
  .dot-grid span {
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(139,111,209,0.15);
    place-self: center;
  }
  .dot-grid span.active { background: rgba(139,111,209,0.6); box-shadow: 0 0 4px rgba(139,111,209,0.8); }

  /* Bottom content */
  .bottom { position: absolute; bottom: 72px; left: 80px; right: 80px; }
  .headline { font-size: 44px; font-weight: 800; color: #F2F2F5; line-height: 1.1; margin-bottom: 14px; }
  .headline em { color: #8B6FD1; font-style: normal; }
  .tags { display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { padding: 7px 16px; border: 1px solid rgba(139,111,209,0.3); border-radius: 100px; font-size: 13px; font-weight: 600; color: #A0A0B3; }
  .tag.active { background: rgba(139,111,209,0.15); color: #8B6FD1; border-color: #8B6FD1; }

  /* Logo small */
  .logo-small { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 10px; }
  .logo-small img { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(139,111,209,0.6)); }
  .logo-small span { font-size: 13px; font-weight: 800; color: #8B6FD1; letter-spacing: 1px; }

  .top-label { position: absolute; top: 72px; right: 72px; font-size: 12px; font-weight: 600; letter-spacing: 4px; color: rgba(139,111,209,0.6); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="bg-glow"></div>
  <div class="frame"></div>

  <div class="logo-small">
    <img src="../../assets/maniac_logo.png" alt="">
    <span>MANIAC</span>
  </div>
  <div class="top-label">Feature #2</div>

  <div class="face-area">
    <!-- Stylized face silhouette using SVG -->
    <svg class="face-svg" viewBox="0 0 440 440" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Head shape -->
      <ellipse cx="220" cy="200" rx="110" ry="130" fill="rgba(139,111,209,0.06)" stroke="rgba(139,111,209,0.2)" stroke-width="1"/>
      <!-- Eyes -->
      <ellipse cx="185" cy="185" rx="14" ry="10" fill="rgba(139,111,209,0.3)"/>
      <ellipse cx="255" cy="185" rx="14" ry="10" fill="rgba(139,111,209,0.3)"/>
      <!-- Iris -->
      <circle cx="185" cy="185" r="6" fill="#8B6FD1" opacity="0.8"/>
      <circle cx="255" cy="185" r="6" fill="#8B6FD1" opacity="0.8"/>
      <!-- Nose -->
      <path d="M220 200 L210 225 L230 225" stroke="rgba(139,111,209,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Mouth -->
      <path d="M200 248 Q220 262 240 248" stroke="rgba(139,111,209,0.35)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Neck -->
      <rect x="200" y="325" width="40" height="40" rx="4" fill="rgba(139,111,209,0.06)" stroke="rgba(139,111,209,0.15)" stroke-width="1"/>
      <!-- Feature points -->
      <circle cx="185" cy="185" r="3" fill="#8B6FD1"/>
      <circle cx="255" cy="185" r="3" fill="#8B6FD1"/>
      <circle cx="220" cy="225" r="3" fill="#8B6FD1" opacity="0.6"/>
      <circle cx="220" cy="248" r="3" fill="#8B6FD1" opacity="0.6"/>
      <circle cx="160" cy="200" r="3" fill="#8B6FD1" opacity="0.4"/>
      <circle cx="280" cy="200" r="3" fill="#8B6FD1" opacity="0.4"/>
      <!-- Connection lines -->
      <line x1="185" y1="185" x2="220" y2="225" stroke="rgba(139,111,209,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="255" y1="185" x2="220" y2="225" stroke="rgba(139,111,209,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="185" y1="185" x2="160" y2="200" stroke="rgba(139,111,209,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="255" y1="185" x2="280" y2="200" stroke="rgba(139,111,209,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
    </svg>

    <div class="bbox">
      <div class="bbox-c2"></div>
      <div class="scan-line"></div>
    </div>
    <div class="name-badge">
      <div class="name">MARCO</div>
      <div class="count">47 clip trovate</div>
    </div>
  </div>

  <div class="bottom">
    <div class="headline"><em>AI riconosce</em> i volti.<br>Tu trovi ogni scena.</div>
    <div class="tags">
      <div class="tag active">On-device · Privacy</div>
      <div class="tag">YOLOv8 + face-api.js</div>
      <div class="tag">Nessun cloud</div>
    </div>
  </div>
</body>
</html>
