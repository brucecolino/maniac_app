// ═══ RECENT FILES (persistito in config) ═══
function addRecentFile(path,name,opts){
  if(!path)return;
  S.recent=S.recent||[];
  const existing=S.recent.find(r=>r.path===path);
  const prevThumb=existing&&existing.thumb;
  const prevOpen=(existing&&existing.openCount)||0;
  S.recent=S.recent.filter(r=>r.path!==path);
  const entry={path,name:name||path.split(/[\\/]/).pop(),ts:Date.now(),openCount:prevOpen};
  // Ripristina thumb dalla cache (localStorage) se disponibile
  if(prevThumb) entry.thumb=prevThumb;
  const silent=!!(opts&&opts.silent);
  // Bulk (es. apertura cartella): salta thumb IPC, queue e saveConfig per-file.
  // S.recent è comunque limitata a 10, quindi non serve lavoro extra per voce.
  if(silent){
    S.recent.unshift(entry);
    if(S.recent.length>10)S.recent.length=10;
    return;
  }
  if(!entry.thumb){
    try{
      const ls=localStorage.getItem(_thumbLsKey(path));
      if(ls) entry.thumb=ls;
    }catch(e){}
  }
  S.recent.unshift(entry);
  if(S.recent.length>10)S.recent.length=10;
  // Se non ho thumb, provo cache persistente Electron e queue generazione
  if(!entry.thumb){
    if(window.maniac&&window.maniac.thumbGet){
      window.maniac.thumbGet(path).then(r=>{
        if(r&&r.found&&r.dataUrl){
          entry.thumb=r.dataUrl;
          try{ localStorage.setItem(_thumbLsKey(path),r.dataUrl); }catch(e){}
          saveConfig();
          if(S.panel==='file'||S.panel==='history') renderPanel&&renderPanel();
        }
      }).catch(()=>{});
    }
    _thumbQueueAdd({path,url:mkUrl(path)});
  }
  saveConfig();
}

// ═══ Anteprime recenti — popolate IN-PLACE senza re-render ═══
// Trova ogni <img data-recent-thumb="path"> nel pannello File e ne richiede
// il dataURL (cache LS / Electron / generazione offscreen). Una volta pronto
// imposta direttamente .src senza coinvolgere renderPanel().
async function _populateRecentThumbs(){
  if(S.panel!=='file')return;
  const imgs=Array.from(document.querySelectorAll('img[data-recent-thumb]'));
  for(const img of imgs){
    const p=img.getAttribute('data-recent-thumb'); if(!p)continue;
    if(img.dataset._busy==='1')continue;
    img.dataset._busy='1';
    try{
      // 1) cache localStorage
      let d=null;
      try{d=localStorage.getItem(_thumbLsKey(p))||null;}catch(_){}
      // 2) cache Electron persistente
      if(!d && window.maniac && window.maniac.thumbGet){
        try{const r=await window.maniac.thumbGet(p); if(r&&r.found&&r.dataUrl)d=r.dataUrl;}catch(_){}
      }
      // 3) genera offscreen
      if(!d){
        try{d=await _ensureThumbCache(p,mkUrl(p));}catch(_){d=null;}
      }
      if(d && img.isConnected){
        img.src=d;
        img.removeAttribute('data-recent-thumb');
        // Aggiorna l'entry in S.recent senza ri-renderizzare
        try{(S.recent||[]).forEach(r=>{if(r.path===p&&!r.thumb)r.thumb=d;});}catch(_){}
      }
    }finally{
      img.dataset._busy='';
    }
  }
}

// C1: helper toggle direzione ordine. Cambiare voce ordina, ri-cliccare la stessa voce inverte.
// Stato: S[scope+'Sort'] (valore voce), S[scope+'SortDir'] ('asc'|'desc'),
//        S[scope+'SortLast'] (ultima voce selezionata via UI per riconoscere il click ripetuto).
function _sortHandler(scope, newVal){
  const sortKey=scope+'Sort', dirKey=scope+'SortDir', lastKey=scope+'SortLast';
  const cur=S[sortKey];
  if (S[lastKey] === newVal) {
    S[dirKey] = (S[dirKey]==='asc') ? 'desc' : 'asc';
  } else {
    S[sortKey] = newVal;
    // Default direzione per le voci tipiche: "name"=asc, altre=desc.
    S[dirKey] = (newVal==='name') ? 'asc' : 'desc';
  }
  S[lastKey] = newVal;
  try { saveConfig && saveConfig(); } catch(_) {}
  if (typeof renderPanel === 'function') renderPanel();
}
function _sortDir(scope){ return S[scope+'SortDir']==='asc' ? 1 : -1; }

// B4: img onerror handler — invalida cache LS, segna placeholder e ritenta una volta.
function _recentThumbRetry(img, path){
  try {
    if (img.dataset._retried === '1') { img.style.display='none'; return; }
    img.dataset._retried = '1';
    if (path) {
      try { localStorage.removeItem(_thumbLsKey(path)); } catch(_) {}
      // Riassegna l'attributo per attivare _populateRecentThumbs alla prossima chiamata
      img.setAttribute('data-recent-thumb', path);
      img.removeAttribute('src');
      setTimeout(() => { try { _populateRecentThumbs(); } catch(_) {} }, 600);
    }
  } catch(_) {}
}
// Retry generico per <img> di anteprima file (Esplora/Preferiti/Cronologia/grid AI):
// invalida LS cache, riaccoda generazione thumbnail, sostituisce con placeholder.
function _thumbImgRetry(img, path){
  try {
    if (img.dataset._retried === '1') { img.style.display='none'; return; }
    img.dataset._retried = '1';
    if (path) {
      try { localStorage.removeItem(_thumbLsKey(path)); } catch(_) {}
      try { _thumbQueueAdd({path, url: mkUrl(path)}); } catch(_) {}
      // Re-fetch da disk cache (userData/thumbnails) — può esistere anche se LS non c'è.
      if (window.maniac && window.maniac.thumbGet) {
        window.maniac.thumbGet(path).then(r => {
          if (r && r.found && r.dataUrl && img.isConnected) {
            img.src = r.dataUrl;
            try { localStorage.setItem(_thumbLsKey(path), r.dataUrl); } catch(_) {}
          } else {
            img.style.display='none';
          }
        }).catch(()=>{ try{img.style.display='none';}catch(_){} });
      } else {
        img.style.display='none';
      }
    } else {
      img.style.display='none';
    }
  } catch(_) {}
}
function toggleThumbs(scope){
  S.hideThumbs=S.hideThumbs||{};
  S.hideThumbs[scope]=!S.hideThumbs[scope];
  saveConfig();
  // Quando l'utente RIATTIVA le anteprime, accoda generazione per gli item senza thumb
  if(!S.hideThumbs[scope]){
    if(scope==='recent'&&Array.isArray(S.recent)){
      S.recent.forEach(r=>{
        if(!r||!r.path||r.thumb)return;
        try{const ls=localStorage.getItem(_thumbLsKey(r.path));if(ls){r.thumb=ls;return;}}catch(e){}
        _thumbQueueAdd({path:r.path,url:mkUrl(r.path)});
        if(window.maniac&&window.maniac.thumbGet){
          window.maniac.thumbGet(r.path).then(rr=>{if(rr&&rr.found&&rr.dataUrl){r.thumb=rr.dataUrl;try{localStorage.setItem(_thumbLsKey(r.path),rr.dataUrl);}catch(_){}if(S.panel==='file')renderPanel();}}).catch(()=>{});
        }
      });
    } else if(scope==='history'&&Array.isArray(S.history)){
      S.history.forEach(e=>{if(e&&e.path&&!e.thumb){try{const ls=localStorage.getItem(_thumbLsKey(e.path));if(ls)e.thumb=ls;else _thumbQueueAdd({path:e.path,url:mkUrl(e.path)});}catch(_){}}});
    }
  }
  renderPanel();
}

// Helper drop to specific playlist player
async function _dropToPlaylist(e,pid){
  const items=Array.from(e.dataTransfer.items||[]);
  const files=Array.from(e.dataTransfer.files||[]);
  for(const item of items){
    const entry=item.webkitGetAsEntry&&item.webkitGetAsEntry();
    const f=item.getAsFile&&item.getAsFile();
    const fp=f?_filePath(f):'';
    if(entry&&entry.isDirectory&&fp&&API&&API.scanFolder){
      try{const scanned=await API.scanFolder(fp); scanned.forEach(sf=>{addFileByPathInto(pid,sf.path,sf.name,{silent:true});}); toast('Aggiunti '+scanned.length+' file a P'+(pid+1));}catch(err){}
    }else if(f&&fp){addFileByPathInto(pid,fp,f.name);}
    else if(f){const u=URL.createObjectURL(f);P(pid).playlist.push(newFile(f.name,u,null));}
  }
  if(!items.length)files.forEach(f=>{const fp=_filePath(f); if(fp)addFileByPathInto(pid,fp,f.name,{silent:true}); else{const u=URL.createObjectURL(f);P(pid).playlist.push(newFile(f.name,u,null));}});
  renderGrid();
  saveConfig();
  if(S.panel==='playlist'&&S.panelPlayer===pid)renderPanel();
}

function newFile(name,url,fullPath){
  const saved=(fullPath && S._fileTags && S._fileTags[fullPath]) ? JSON.parse(JSON.stringify(S._fileTags[fullPath])) : [];
  const f={uid:S.nextUid++, name, url, path:fullPath, tags:saved, duration:0};
  // Queue thumbnail generation (concurrency 2, idle)
  if(fullPath){
    try{
      const lsKey=_thumbLsKey(fullPath);
      const cached=localStorage.getItem(lsKey);
      if(cached){ f.thumb=cached; }
      else{ _thumbQueueAdd(f); }
    }catch(e){ _thumbQueueAdd(f); }
  }
  return f;
}
window._thumbQ=[]; window._thumbInFlight=0;
function _thumbQueueAdd(f){
  if(!f||!f.path)return;
  if(window._thumbQ.some(x=>x.path===f.path))return;
  window._thumbQ.push(f);
  _thumbQueueKick();
}
function _thumbQueueKick(){
  while(window._thumbInFlight<4 && window._thumbQ.length){
    const f=window._thumbQ.shift();
    window._thumbInFlight++;
    const run=()=>{
      _ensureThumbCache(f.path,f.url,null).then(d=>{
        if(d){
          f.thumb=d;
          // Propaga a tutte le istanze dello stesso path (playlist, history, recent)
          try{
            (S.players||[]).forEach(p=>(p.playlist||[]).forEach(x=>{if(x.path===f.path&&!x.thumb)x.thumb=d;}));
            (S.recent||[]).forEach(r=>{if(r.path===f.path&&!r.thumb)r.thumb=d;});
            (S.history||[]).forEach(h=>{if(h.path===f.path&&!h.thumb)h.thumb=d;});
          }catch(e){}
          // Re-render del panel corrente se mostra liste con thumb
          // Debounce a 600ms: con molte thumb in coda evitiamo flicker da re-render rapidi.
          // Inoltre saltiamo il re-render se il pannello sta già processando un wizard
          // (S._wizard) per non disturbare la UI di analisi/verifica.
          clearTimeout(window._thumbRerenderT);
          window._thumbRerenderT=setTimeout(()=>{
            try{
              if(S._wizard && (S.panel==='ai' || S.panel==='analizza')) return;
              if(['playlist','history','file','favorites','explore','organizer','tags'].includes(S.panel)){
                if(typeof renderPanel==='function')renderPanel();
              }
            }catch(e){}
          },1000);
        }
      }).catch(()=>{}).finally(()=>{
        window._thumbInFlight--;
        _thumbQueueKick();
      });
    };
    if(window.requestIdleCallback)window.requestIdleCallback(run,{timeout:2000});
    else setTimeout(run,50);
  }
}
function persistFileTags(){
  if(!API||!API.fileTagsSave)return;
  const map={};
  S.players.forEach(p=>p.playlist.forEach(f=>{
    if(f.path && f.tags && f.tags.length) map[f.path]=f.tags;
  }));
  // keep tags for files not currently in any playlist
  if(S._fileTags){
    Object.keys(S._fileTags).forEach(k=>{ if(!map[k] && S._fileTags[k] && S._fileTags[k].length) map[k]=S._fileTags[k]; });
  }
  S._fileTags=map;
  clearTimeout(S._fileTagsSaveT);
  S._fileTagsSaveT=setTimeout(()=>{ try{API.fileTagsSave(map);}catch(e){} },400);
}
function mkUrl(path,fallback){
  if(path){
    try{
      // encodeURI lascia `[`, `]`, `#`, `?` non-codificati. In file:// URL
      // Chromium può rifiutarli o interpretarli come fragment/query → percent-encode esplicito.
      let u=encodeURI('file:///'+path.replace(/\\/g,'/').replace(/^\/+/,''));
      return u.replace(/\[/g,'%5B').replace(/\]/g,'%5D').replace(/#/g,'%23').replace(/\?/g,'%3F');
    }catch(e){
      return 'file:///'+path.replace(/\\/g,'/').replace(/^\/+/,'');
    }
  }
  return fallback||'';
}
// Estensioni immagini → trattate come video 10s
const IMG_EXTS=['jpg','jpeg','jpe','jfif','png','gif','webp','bmp','ico','tiff','tif','svg','avif','heic','heif'];
function _extOf(f){
  const s=(f&&(f.name||f.path||f.url))||'';
  const m=/\.([a-z0-9]+)(\?|$|#)/i.exec(s);
  return m?m[1].toLowerCase():'';
}
function isImageFile(f){ return IMG_EXTS.includes(_extOf(f)); }
// Estensioni URL video streaming diretto
const DIRECT_VIDEO_URL_EXTS=['mp4','webm','m3u8','ogg','ogv','mov','mkv','avi','mpd','ts'];
function isDirectVideoUrl(url){
  try{
    const u=new URL(url);
    const pathLow=u.pathname.toLowerCase();
    return DIRECT_VIDEO_URL_EXTS.some(e=>pathLow.endsWith('.'+e));
  }catch(e){ return /\.(mp4|webm|m3u8|ogg|mov|mkv|avi)(\?|#|$)/i.test(url||''); }
}

// ═══ Themed color picker (shared widget) ═══
function openClrPop(anchor,currentColor,onPick){
  document.querySelectorAll('.clr-pop').forEach(el=>el.remove());
  const palette=['#FFFFFF','#000000','#E05565','#FF6B88','#FF8C42','#FFB836','#FFD97A','#A3D977',
    '#4CAF7D','#3ECBAA','#6BE3D9','#6BC5E8','#4FA8D8','#3B82C4','#7B5EA7','#9674C4',
    '#B39BD8','#D1BEE8','#D48AC4','#B45CA0','#8C3F7C','#5E2C52','#2E2E3A','#55556A',
    '#8888A0','#C0C0C8','#FFE49B','#FFA8B8','#FFCC99','#A7F0E7','#82C755','#2B5FA0'];
  const pop=document.createElement('div');
  pop.className='clr-pop';
  const hex=(currentColor||'#ffffff').replace('#','').toUpperCase();
  const swatches=palette.map(c=>`<span class="tag-sw" data-c="${c}" style="background:${c}" title="${c}"></span>`).join('');
  pop.innerHTML=`
    <div class="clr-grid">${swatches}</div>
    <div class="clr-row">
      <span class="clr-prev" id="_clrPrev" style="background:#${hex}"></span>
      <span class="clr-hash">#</span>
      <input class="clr-hex" id="_clrHex" type="text" maxlength="6" value="${hex}" spellcheck="false">
    </div>`;
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  const pw=pop.offsetWidth||232, ph=pop.offsetHeight||140;
  let L=r.left, T=r.bottom+6;
  if(L+pw>window.innerWidth-8)L=Math.max(8,window.innerWidth-pw-8);
  if(T+ph>window.innerHeight-8)T=Math.max(8,r.top-ph-6);
  pop.style.left=L+'px'; pop.style.top=T+'px';
  requestAnimationFrame(()=>pop.classList.add('show'));
  const prev=pop.querySelector('#_clrPrev');
  const input=pop.querySelector('#_clrHex');
  const commit=(c)=>{
    if(!/^#[0-9A-Fa-f]{6}$/.test(c))return;
    prev.style.background=c;
    anchor.style.background=c;
    input.value=c.replace('#','').toUpperCase();
    onPick&&onPick(c);
  };
  pop.querySelectorAll('.tag-sw[data-c]').forEach(el=>{
    el.addEventListener('click',()=>commit(el.getAttribute('data-c')));
  });
  input.addEventListener('input',()=>{
    const v=input.value.replace(/[^0-9a-fA-F]/g,'').slice(0,6);
    if(input.value!==v.toUpperCase())input.value=v.toUpperCase();
    if(v.length===6)commit('#'+v);
  });
  const close=(ev)=>{
    if(ev&&(pop.contains(ev.target)||anchor.contains(ev.target)))return;
    pop.classList.remove('show');
    setTimeout(()=>{if(pop.parentNode)pop.parentNode.removeChild(pop);},140);
    document.removeEventListener('mousedown',close,true);
  };
  setTimeout(()=>document.addEventListener('mousedown',close,true),0);
}

function addToPlayer(pid, name, url, fullPath, opts){
  const p=P(pid);
  const f=newFile(name,url,fullPath);
  p.playlist.push(f);
  const wasEmpty=(p.idx<0);
  if(wasEmpty){p.idx=p.playlist.length-1;}
  if(pid>=S.multi&&S.multi<4){
    S.multi=Math.min(4,pid+1);
    renderMultiDots();
  }
  // G16: if caller requested immediate play (e.g. openRecent), switch idx to this new file
  if(opts&&opts.silent){return;} // batch mode: caller renders once at the end
  if(opts&&opts.playNow){
    p.idx=p.playlist.length-1;
    renderGrid();
    setTimeout(()=>loadFileIntoPlayer(pid),40);
  } else {
    renderGrid();
    if(wasEmpty&&S.autoStart)setTimeout(()=>playInPlayer(pid),80);
  }
  if(S.panel==='playlist'&&S.panelPlayer===pid)renderPanel();
}

function addFileByPath(fullPath, name, opts){
  const n=name||fullPath.split(/[\\/]/).pop();
  const url=mkUrl(fullPath);
  addRecentFile(fullPath,n,opts);
  // Target: rispetta sempre il lock dell'utente (S.activePlayer se valido).
  // Solo override esplicito via opts.playerId.
  let target=(opts&&Number.isFinite(opts.playerId))?opts.playerId:S.activePlayer;
  if(!Number.isFinite(target)||target<0||target>=S.multi){
    target=0;
    if(S.multi>1){for(let i=0;i<S.multi;i++){if(P(i)&&P(i).playlist.length===0){target=i;break;}}}
  }
  const tp=P(target);
  if(tp&&(tp._stream||tp.source==='stream')){
    if(tp._stream){try{tp._stream.getTracks().forEach(t=>t.stop());}catch(e){}}
    tp._stream=null;tp.source=null;
    tp.playlist=tp.playlist.filter(f=>!f._live);
    if(tp.vidEl){try{tp.vidEl.srcObject=null;tp.vidEl.removeAttribute('src');}catch(e){}}
    if(tp.idx>=tp.playlist.length)tp.idx=Math.max(0,tp.playlist.length-1);
  }
  addToPlayer(target,n,url,fullPath,opts);
}

function addFileObj(file){

  }
  const tp=P(target);
  if(tp&&(tp._stream||tp.source==='stream')){
    if(tp._stream){try{tp._stream.getTracks().forEach(t=>t.stop());}catch(e){}}
    tp._stream=null;tp.source=null;
    tp.playlist=tp.playlist.filter(f=>!f._live);
    if(tp.vidEl){try{tp.vidEl.srcObject=null;tp.vidEl.removeAttribute('src');}catch(e){}}

function playInPlayer(pid){

// (Wheel scrub tooltip floating rimosso: ora la rotella usa solo il tip della
// progress bar — vedi cell._scrubTipShow in wirePlayerControls.)

function loadFileIntoPlayer(pid){
  const p=P(pid);
  const f=p.playlist[p.idx]; if(!f)return;
  // Reset stato sub: nuovo file → dimentica eventuale SRT del precedente
  p._subsSrtPath=null; p.subtitles=null;
  renderGrid();
  // Pre-flight check: se il path locale non esiste più (file spostato/cancellato),
  // mostra toast chiaro invece di lasciar lanciare un MEDIA_ERROR opaco.
  if(f.path && /^(file:|[A-Za-z]:|\/)/.test(f.path) && window.maniac && window.maniac.fileExists){
    window.maniac.fileExists(f.path).then(r=>{
      if(r && !r.exists){
        toast('File non trovato (spostato o cancellato)\n'+f.path);
        try{ if(typeof logError==='function') logError('File mancante: '+f.path,''); }catch(_){}
      }
    }).catch(()=>{});
  }
  setTimeout(()=>{
    if(p.vidEl){
      const targetUrl=f.url||mkUrl(f.path);
      // Wire error handler: in caso di MEDIA_ERR_SRC_NOT_SUPPORTED (codec/file mancante)
      // mostriamo diagnostica chiara invece di silent fail.
      if(!p.vidEl._maniacErrorBound){
        p.vidEl._maniacErrorBound=true;
        p.vidEl.addEventListener('error',()=>_handleMediaError(p,pid));
      }
      try{
        if(p.vidEl._imgMode){
          if(p.vidEl.src!==targetUrl)p.vidEl.src=targetUrl;
        }else{
          const cur=p.vidEl.getAttribute('src')||p.vidEl.src||'';
          if(!cur||cur!==targetUrl){p.vidEl.src=targetUrl;try{p.vidEl.load();}catch(e){}}
        }
      }catch(e){}
      p.vidEl.play().catch(()=>{});
      pushHistory(pid);
    }
    // Auto-carica sottotitoli salvati accanto al video (es. video.srt o video.it.srt)
    _autoLoadSiblingSubs(pid,f.path);
  },60);
  if(S.panel==='playlist'&&S.panelPlayer===pid)renderPanel();
}

async function _autoLoadSiblingSubs(pid,videoPath){
  if(!videoPath)return;
  if(!window.maniac||!window.maniac.subs||!window.maniac.subs.findSibling)return;
  try{
    const r=await window.maniac.subs.findSibling(videoPath);
    if(!r||!r.ok||!r.path)return;
    const p=P(pid); if(!p)return;
    // Verifica che il player non sia già passato a un altro file
    const cur=p.playlist[p.idx]; if(!cur||cur.path!==videoPath)return;
    const txtR=await window.maniac.subs.readText(r.path);
    if(!txtR||!txtR.ok||!txtR.text)return;
    const text=txtR.text;
    const subs=r.path.toLowerCase().endsWith('.vtt')?parseVTT(text):parseSRT(text);
    if(!subs.length)return;
    p.subtitles=subs; p.subtitlesOn=true; p._subsSrtPath=r.path;
    _attachSubtitleOverlay(pid);
  }catch(_){}
}

// Diagnostica errori <video>: codec non supportato, file spostato/cancellato, ecc.
// Mostra toast con dettaglio e bottone "Apri esternamente" per delegare al player di sistema.
function _handleMediaError(p,pid){
  const v=p&&p.vidEl; if(!v||!v.error)return;
  const f=p.playlist[p.idx]; if(!f)return;
  const code=v.error.code; // 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED
  const codeMsg={1:'Caricamento interrotto',2:'Errore di rete',3:'Errore di decodifica',4:'Formato/codec non supportato'}[code]||('Errore '+code);
  const detail=(v.error.message||'').slice(0,200);
  const filePath=f.path||'';
  const fname=(f.name||filePath.split(/[\\/]/).pop()||'').slice(0,80);
  // Anti-spam: stesso file/error code negli ultimi 2s → silenzia
  const k=pid+'|'+(filePath||f.url)+'|'+code;
  const now=Date.now();
  window._mediaErrLast=window._mediaErrLast||{};
  if(window._mediaErrLast[k]&&now-window._mediaErrLast[k]<2000)return;
  window._mediaErrLast[k]=now;
  // Tentativo di transcodifica con ffmpeg PRIMA di arrendersi: i codec come
  // HEVC/AC3/DTS o il container MKV non sono supportati da Chromium ma il file
  // è valido. code 3=DECODE, 4=SRC_NOT_SUPPORTED → proviamo a convertirlo.
  if((code===3||code===4) && filePath && !f._transcoded && !f._transcodeTried &&
     window.maniac && window.maniac.media && window.maniac.media.transcode){
    f._transcodeTried=true;
    _attemptTranscode(p,pid,f,codeMsg,detail);
    return;
  }
  // Log dettagliato nei log dell'app
  try{ logError && logError(`[Player ${pid+1}] ${codeMsg}: ${fname}`, (detail||'')+(filePath?'\nPath: '+filePath:'')); }catch(_){}
  _showMediaErrorModal(codeMsg,fname,filePath,detail);
}

function _showMediaErrorModal(codeMsg,fname,filePath,detail){
  if(typeof toast==='function')toast(`${codeMsg} — ${fname}`);
  if(!(filePath && window.maniac))return;
  const ov=document.createElement('div'); ov.className='mdl-ov';
  ov.innerHTML=`<div class="mdl" style="max-width:560px">
    <div class="mdl-ttl">${codeMsg}</div>
    <div class="mdl-msg" style="font-size:12px;color:var(--t2);margin:6px 0 12px;word-break:break-word">${fname}<br><span style="color:var(--t3);font:400 10px 'JetBrains Mono',monospace">${(filePath||'').replace(/</g,'&lt;')}</span>${detail?`<br><span style="color:var(--t3);font:400 10px 'JetBrains Mono',monospace">${detail.replace(/</g,'&lt;')}</span>`:''}</div>
    <div class="mdl-btns">
      <button class="mdl-btn" data-act="cancel">Chiudi</button>
      <button class="mdl-btn" data-act="folder">Mostra in cartella</button>
      <button class="mdl-btn primary" data-act="ext">Apri esternamente</button>
    </div>
  </div>`;

// Overlay di avanzamento transcodifica (riusa lo stile .mdl). Ritorna un updater.
function _showTranscodeOverlay(name,id,onCancel){
  const ov=document.createElement('div'); ov.className='mdl-ov'; ov.dataset.txid=id;

function _attemptTranscode(p,pid,f,codeMsg,detail){

    window._txProgBound=true;

  }
  window._txOverlays[id]=_showTranscodeOverlay(f.name||src,id,()=>{ try{window.maniac.media.cancel(id);}catch(_){ } f._transcodeTried=false; });
  window.maniac.media.transcode(id,src).then(r=>{

    if(r&&r.ok&&r.outPath){
      f.url=mkUrl(r.outPath); f._transcoded=true;
      const cur=p.playlist[p.idx];
      if(cur===f && p.vidEl){
        try{ p.vidEl.src=f.url; p.vidEl.load(); p.vidEl.play().catch(()=>{}); }catch(_){}
      }

function playerNext(pid){
  const p=P(pid);
  // Player vuoto: "Avanti" eredita la playlist da un altro player.
  if(p.playlist.length===0){ if(sharePlaylistEmpty(pid))return; return; }
  if(p.shuffle){
    // FIX drift: pool ristretto al SOLO player attivo (pid). Niente cross-player.
    const pool=(p.playlist||[]).map((f,fi)=> (f&&f.path)?{fi,path:f.path}:null).filter(Boolean);
    if(!pool.length){
      if(p.playlist.length===0)return;
      p.idx=Math.floor(Math.random()*p.playlist.length); loadFileIntoPlayer(pid); return;
    }
    p._shufHistory=p._shufHistory||[];
    let avail=pool.filter(x=>!p._shufHistory.includes(x.path));
    if(!avail.length){ p._shufHistory=[]; avail=pool; }
    const pick=avail[Math.floor(Math.random()*avail.length)];
    p._shufHistory.push(pick.path);
    if(p._shufHistory.length>200)p._shufHistory=p._shufHistory.slice(-200);
    // Stack di navigazione PER-player (per playerPrev "ritroso casuale")
    p._shufStack=p._shufStack||[];
    // se già contiene la corrente, ok; altrimenti inseriamo prima
    p._shufStack.push(pick.fi);
    if(p._shufStack.length>100)p._shufStack=p._shufStack.slice(-100);
    p.idx=pick.fi;
    loadFileIntoPlayer(pid); // sempre lo stesso pid → niente drift
    saveConfig();
    return;
  }
  if(p.playlist.length===0)return;
  p.idx=(p.idx+1)%p.playlist.length;
  loadFileIntoPlayer(pid);
}
function playerPrev(pid){
  const p=P(pid);
  if(p.playlist.length===0){ if(sharePlaylistEmpty(pid))return; return; }
  // Feature 12: se shuffle attivo, torna indietro nello stack di navigazione
  if(p.shuffle){
    // Stack di navigazione per-player (compagno di playerNext shuffle)
    p._shufStack=p._shufStack||[];
    if(p._shufStack.length>=2){
      p._shufStack.pop(); // rimuovi corrente
      const prevIdx=p._shufStack[p._shufStack.length-1];
      if(typeof prevIdx==='number' && p.playlist[prevIdx]){
        p.idx=prevIdx;
        loadFileIntoPlayer(pid);
        return;
      }
    }
    toast('Nessun video precedente nello shuffle');
    return;
  }
  p.idx=(p.idx-1+p.playlist.length)%p.playlist.length;
  loadFileIntoPlayer(pid);
}

function pushHistory(pid){
  const p=P(pid); const cur=p.playlist[p.idx]; if(!cur)return;
  const snap=[];
  for(let i=0;i<S.multi;i++){
    const pl=P(i); const cf=pl.playlist[pl.idx];
    if(cf){
      // Salva l'INTERA playlist + idx per permettere navigazione completa al restore.
      const files=(pl.playlist||[]).map(f=>({name:f.name,path:f.path,url:f.url,duration:f.duration}));
      snap.push({playerId:i,idx:pl.idx,files,name:cf.name,path:cf.path,url:cf.url});
    }
  }
  // Rimuove eventuali occorrenze precedenti dello stesso path (qualsiasi player)
  S.history=S.history.filter(h=>!(h.path===cur.path));
  // Session ID per raggruppare voci di una sessione multi
  const sessionId=S.multi>1?('s_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)):null;
  // Inserisce in cima
  S.history.unshift({ts:Date.now(),playerId:pid,name:cur.name,path:cur.path,url:cur.url,layout:S.multi,snapshot:snap,sessionId});
  // Ordine cronologico discendente (ts più recente primo)
  S.history.sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(S.history.length>50)S.history.length=50;
  saveConfig();
  if(S.panel==='history')renderPanel();
  // Genera miniatura in cache persistente (punto 10)
  _ensureThumbCache(cur.path,cur.url,p.vidEl).then(dataUrl=>{
    if(!dataUrl)return;
    const e=S.history.find(h=>h.path===cur.path); if(e){e.thumb=dataUrl;saveConfig();if(S.panel==='history')renderPanel();}
  }).catch(()=>{});
}
function _thumbLsKey(path){try{return 'maniac_thumb_'+btoa(unescape(encodeURIComponent(path))).slice(0,120);}catch(e){return 'maniac_thumb_'+path.length+'_'+path.slice(-40);}}
async function _ensureThumbCache(path,url,srcVid){
  if(!path)return null;
  const lsKey=_thumbLsKey(path);
  // Prima prova localStorage (cache veloce, sopravvive tra sessioni)
  try{const ls=localStorage.getItem(lsKey);if(ls)return ls;}catch(e){}
  try{
    if(window.maniac&&window.maniac.thumbGet){
      const cached=await window.maniac.thumbGet(path);
      if(cached&&cached.found&&cached.dataUrl){try{localStorage.setItem(lsKey,cached.dataUrl);}catch(e){}return cached.dataUrl;}
    }
    // Genera offscreen con retry
    const tryCapture=async(seekT)=>{
      const v=document.createElement('video');
      v.crossOrigin='anonymous'; v.muted=true; v.preload='auto'; v.playsInline=true; v.src=url||mkUrl(path);
      await new Promise((res,rej)=>{
        let done=false;
        const ok=()=>{if(done)return;done=true;res();};
        v.addEventListener('loadeddata',ok,{once:true});
        v.addEventListener('canplay',ok,{once:true});
        v.addEventListener('error',()=>{if(done)return;done=true;rej();},{once:true});
        setTimeout(()=>{if(!done){done=true;rej();}},6000);
      });
      if(v.readyState<2||!v.videoWidth){await new Promise(r=>setTimeout(r,200));}
      try{v.currentTime=seekT;}catch(e){}
      await new Promise(r=>{const t=setTimeout(r,500);v.addEventListener('seeked',()=>{clearTimeout(t);r();},{once:true});});
      if(!v.videoWidth){try{v.src='';}catch(e){} return null;}
      const c=document.createElement('canvas');
      c.width=160; c.height=Math.round(160*((v.videoHeight/v.videoWidth)||0.5625));
      try{c.getContext('2d').drawImage(v,0,0,c.width,c.height);}catch(e){try{v.src='';}catch(_){} return null;}
      let d=null;
      try{d=c.toDataURL('image/jpeg',0.7);}catch(e){}
      try{v.src='';}catch(e){}
      return d;
    };
    let d=null;
    try{ d=await tryCapture(1.2); }catch(e){}
    if(!d){ try{ d=await tryCapture(0.5); }catch(e){} }
    if(!d){
      // Placeholder dark gradient so UI isn't black
      const c=document.createElement('canvas');c.width=160;c.height=90;
      const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,160,90);
      gr.addColorStop(0,'#1a1a28');gr.addColorStop(1,'#2a2540');g.fillStyle=gr;g.fillRect(0,0,160,90);
      g.fillStyle='rgba(255,255,255,0.15)';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText('▶',80,52);
      d=c.toDataURL('image/jpeg',0.6);
    }
    if(window.maniac&&window.maniac.thumbSave)await window.maniac.thumbSave(path,d);
    try{localStorage.setItem(lsKey,d);}catch(e){}
    return d;
  }catch(e){return null;}
}

function fmtTime(s){
  if(!s||isNaN(s))return'0:00';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
  return h>0?h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'):m+':'+String(sec).padStart(2,'0');
}

// ═══ AUDIO PROCESSING (EQ + BOOST) ═══
function setupAudioChain(fileId,videoEl){
  try{
    if(videoEl&&videoEl._imgMode)return null;
    if(S.audioContexts[fileId])return S.audioContexts[fileId];
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    const ctx=new AC();
    const src=ctx.createMediaElementSource(videoEl);
    const bassF=ctx.createBiquadFilter();bassF.type='lowshelf';bassF.frequency.value=200;bassF.gain.value=0;
    const midF=ctx.createBiquadFilter();midF.type='peaking';midF.frequency.value=1000;midF.Q.value=0.7;midF.gain.value=0;
    const highF=ctx.createBiquadFilter();highF.type='highshelf';highF.frequency.value=5000;highF.gain.value=0;
    const boostGain=ctx.createGain();boostGain.gain.value=1;
    const volGain=ctx.createGain();volGain.gain.value=1;
    src.connect(bassF);bassF.connect(midF);midF.connect(highF);highF.connect(boostGain);boostGain.connect(volGain);volGain.connect(ctx.destination);
    const chain={ctx,src,bassF,midF,highF,boostGain,volGain};
    S.audioContexts[fileId]=chain;
    return chain;
  }catch(e){console.warn('Audio chain failed:',e);return null}
}

function applyEqToAll(){
  S.players.forEach(p=>{
    if(!p)return;
    const f=p.playlist[p.idx]; if(!f)return;
    const c=S.audioContexts[f.uid]; if(!c)return;
    c.bassF.gain.value=p.eqB||0;
    c.midF.gain.value=p.eqM||0;
    c.highF.gain.value=p.eqH||0;
    c.boostGain.gain.value=(p.boost||100)/100;
  });
}
function applyEqToPlayer(p){
  if(!p)return;
  const f=p.playlist[p.idx]; if(!f)return;
  const c=S.audioContexts[f.uid]; if(!c)return;
  c.bassF.gain.value=p.eqB||0;
  c.midF.gain.value=p.eqM||0;
  c.highF.gain.value=p.eqH||0;
  c.boostGain.gain.value=(p.boost||100)/100;
}

function applyPlayerVol(p){
  if(!p||!p.vidEl)return;
  const v=(p.vol/100)*((p.muted||S.muted)?0:1);
  try{p.vidEl.volume=v;}catch(e){}
  const f=p.playlist[p.idx];
  if(f){const ch=S.audioContexts[f.uid]; if(ch&&ch.volGain){try{ch.volGain.gain.value=v;}catch(e){}}}
  const cell=document.querySelector(`.vc[data-pid="${p.id}"] .vc-vol-fill`);
  if(cell)cell.style.width=p.vol+'%';
}

  const isReorderable=btn=>{if(!btn||btn.tagName!=='BUTTON')return false;if(!btn.classList.contains('vc-btn'))return false;for(const a of CORE_ATTRS){if(btn.hasAttribute(a))return false;}return true;};

  // Recording buttons (visible only on live cells via CSS)

  const wcSetBtn=tb.querySelector('[data-wcsettings]');
  if(wcSetBtn)wcSetBtn.onclick=e=>{e.stopPropagation();S.activePlayer=pid;S.webcamPlayer=pid;S.settingsPlayer=pid;S.stab='webcam';openPanel('settings');};

  const prog=wrap.querySelector('.vc-progress');
  const tip=wrap.querySelector('.vc-tip');
  const tipT=tip&&tip.querySelector('.vc-tip-t');
  const tipCv=tip&&tip.querySelector('canvas');
  const tipCtx=tipCv&&tipCv.getContext('2d');
  let previewVid=null, previewReq=0, previewLastSrc='';
  function ensurePreviewVid(){
    if(!vid||!vid.src)return null;
    if(previewVid&&previewLastSrc===vid.src)return previewVid;
    if(previewVid){try{previewVid.pause();previewVid.src='';}catch(e){}}

  function seekPreview(time){
    const pv=ensurePreviewVid();if(!pv||!tipCtx)return;
    const doDraw=()=>{try{tipCtx.drawImage(pv,0,0,tipCv.width,tipCv.height);}catch(e){}};
    const id=++previewReq;
    const onSeeked=()=>{if(id===previewReq)doDraw();pv.removeEventListener('seeked',onSeeked);};
    pv.addEventListener('seeked',onSeeked);
    try{pv.currentTime=time;}catch(e){}
  }
  let _pendingSeek=null,_seekRaf=0;
  function _commitSeek(){
    _seekRaf=0;
    if(_pendingSeek==null||!vid)return;
    const t=_pendingSeek;_pendingSeek=null;
    try{ if(typeof vid.fastSeek==='function') vid.fastSeek(t); else vid.currentTime=t; }catch(_){ try{vid.currentTime=t;}catch(__){} }
  }
  function setSeekFromEv(e){
    if(!vid||!vid.duration||!isFinite(vid.duration))return;
    const r=prog.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const time=pct*vid.duration;
    // Update visuali immediati (lineari) — la seek vera viene committata in rAF
    const pf=wrap.querySelector('.vc-pf'); if(pf) pf.style.width=(pct*100)+'%';
    const th=wrap.querySelector('.vc-pthumb'); if(th) th.style.left=(pct*100)+'%';
    const tcEl=tb.querySelector('.vc-tc'); if(tcEl) tcEl.textContent=fmtTime(time);
    _pendingSeek=time;
    if(!_seekRaf) _seekRaf=requestAnimationFrame(_commitSeek);
  }
  let seekDrag=false;
  prog.addEventListener('mousedown',e=>{e.stopPropagation();seekDrag=true;setSeekFromEv(e);});
  window.addEventListener('mousemove',e=>{if(seekDrag)setSeekFromEv(e);});
  window.addEventListener('mouseup',()=>{if(seekDrag){seekDrag=false;_commitSeek();}});
  prog.addEventListener('click',e=>e.stopPropagation());
  prog.addEventListener('mousemove',e=>{
    if(!vid||!vid.duration||!isFinite(vid.duration)){if(tip)tip.style.opacity='0';return;}
    if(S.scrubPreview===false){if(tip)tip.style.opacity='0';return;}
    const r=prog.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const time=pct*vid.duration;
    if(tipT)tipT.textContent=fmtTime(time);

  prog.addEventListener('mouseleave',()=>{if(tip)tip.style.opacity='0';});

  // Esposto per la rotella sul video: aggiorna il tip della progress bar
  // alla posizione del tempo target, riusando il preview thumbnail già esistente.
  // NB: lo agganciamo al wrap (toolbar wrapper) perché qui dentro `cell` non

  let _scrubTipHideT=null;
  wrap._scrubTipShow=(time)=>{
    if(!vid||!vid.duration||!isFinite(vid.duration))return;
    if(S.scrubPreview===false)return;

  // Volume per-cella cliccabile/trascinabile

    });
    vid.addEventListener('play',()=>{
      const cellEl=tb.closest('.vc');
      const isWcCell=cellEl&&cellEl.classList.contains('webcam');
      const wcPid=cellEl?+cellEl.getAttribute('data-pid'):-1;
      const recState=(typeof CELL_RECS!=='undefined')?CELL_RECS[wcPid]:null;
      const isRecording=recState&&recState.rec&&recState.rec.state==='recording';
      const path=tb.querySelector('[data-play] svg path');
      if(path){
        // In webcam: REC iniziale (cerchio) finché non si registra; durante REC → pause (||).

        if(isWcCell&&!isRecording) path.setAttribute('d','M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z');
        else path.setAttribute('d','M6 19h4V5H6v14zm8-14v14h4V5h-4z');
      }
      updatePlayIcons();
    });
    vid.addEventListener('pause',()=>{
      const cellEl=tb.closest('.vc');
      const isWcCell=cellEl&&cellEl.classList.contains('webcam');

      if(path){

  // Responsive toolbar overflow
  const ovBtn=tb.querySelector('[data-overflow]');

  const isCollapsible=btn=>{
    if(!btn||btn.tagName!=='BUTTON'||!btn.classList.contains('vc-btn'))return false;

    };
  }
  const applyOverflow=()=>{
    // Reset
    Array.from(tb.querySelectorAll('.vc-btn.ov-hide')).forEach(b=>b.classList.remove('ov-hide'));
    tb.classList.remove('has-overflow');
    closeOvMenu();
    // Measure; if overflow, hide collapsibles from right-to-left
    const needsCollapse=()=>tb.scrollWidth>tb.clientWidth+1;
    if(!needsCollapse())return;
    const candidates=Array.from(tb.querySelectorAll('.vc-btn')).filter(isCollapsible).reverse();
    tb.classList.add('has-overflow');
    for(const btn of candidates){
      btn.classList.add('ov-hide');
      if(!needsCollapse())break;
    }
    // If still overflowing even after collapsing all, leave as-is
  };
  try{
    const ro=new ResizeObserver(()=>{clearTimeout(tb._ovT);tb._ovT=setTimeout(applyOverflow,60);});
    ro.observe(tb);
    wrap._ovRO=ro;
  }catch(_){}
  setTimeout(applyOverflow,50);
  return wrap;
}

function createCell(pid){
  const p=P(pid);
  const f=p.playlist[p.idx];
  const cell=document.createElement('div');
  if(!f) cell.classList.add('empty');
  cell.className='vc';
  if(S.multi>1)cell.classList.add('multi');
  cell.setAttribute('data-pid',pid);
  cell.setAttribute('data-file-uid',f?String(f.uid):'');

  const area=document.createElement('div');
  area.className='video-area';

  if(f){
    const isImg=isImageFile(f);
    let vid;
    if(isImg){
      // Immagine → wrapper <img> trattato come video 10s con timer virtuale
      vid=document.createElement('img');
      // f.url è già percent-encoded da mkUrl(): NON ri-codificare (porterebbe %5B→%255B).
      try{ vid.src = f.url || ''; }catch(e){ vid.src=f.url||''; }
      vid.style.cssText='width:100%;height:100%;object-fit:contain;display:block;background:#000';
      vid.draggable=false;
      // Shim minimale per compat con il resto del codice
      vid._imgMode=true;
      vid._imgDuration=10;
      vid._imgPos=0;
      vid._imgPaused=true;
      vid._imgListeners={timeupdate:[],play:[],pause:[],ended:[],loadedmetadata:[],error:[]};
      Object.defineProperty(vid,'duration',{get(){return vid._imgDuration||10;}});
      Object.defineProperty(vid,'currentTime',{get(){return vid._imgPos||0;},set(v){vid._imgPos=Math.max(0,Math.min(vid._imgDuration,+v||0));(vid._imgListeners.timeupdate||[]).forEach(fn=>{try{fn();}catch(e){}});}});
      Object.defineProperty(vid,'paused',{get(){return !!vid._imgPaused;}});
      Object.defineProperty(vid,'volume',{get(){return vid._imgVol||0;},set(v){vid._imgVol=v;}});
      Object.defineProperty(vid,'muted',{get(){return !!vid._imgMuted;},set(v){vid._imgMuted=!!v;}});
      Object.defineProperty(vid,'playbackRate',{get(){return vid._imgRate||1;},set(v){vid._imgRate=+v||1;}});
      Object.defineProperty(vid,'buffered',{get(){return {length:1,end:()=>vid._imgDuration||10};}});
      vid.play=function(){
        vid._imgPaused=false;
        (vid._imgListeners.play||[]).forEach(fn=>{try{fn();}catch(e){}});
        if(vid._imgTimer)clearInterval(vid._imgTimer);
        const step=0.1;
        vid._imgTimer=setInterval(()=>{
          if(vid._imgPaused)return;
          vid._imgPos=(vid._imgPos||0)+step*(vid._imgRate||1);
          (vid._imgListeners.timeupdate||[]).forEach(fn=>{try{fn();}catch(e){}});
          if(vid._imgPos>=vid._imgDuration){
            clearInterval(vid._imgTimer);vid._imgTimer=null;vid._imgPaused=true;
            (vid._imgListeners.ended||[]).forEach(fn=>{try{fn();}catch(e){}});
          }
        },100);
        return Promise.resolve();
      };
      vid.pause=function(){
        vid._imgPaused=true;
        if(vid._imgTimer){clearInterval(vid._imgTimer);vid._imgTimer=null;}
        (vid._imgListeners.pause||[]).forEach(fn=>{try{fn();}catch(e){}});
      };
      const origAdd=vid.addEventListener.bind(vid);
      vid.addEventListener=function(ev,fn){
        if(vid._imgListeners[ev]){vid._imgListeners[ev].push(fn);return;}
        return origAdd(ev,fn);
      };
      const origRem=vid.removeEventListener.bind(vid);
      vid.removeEventListener=function(ev,fn){
        if(vid._imgListeners[ev]){const i=vid._imgListeners[ev].indexOf(fn);if(i>=0)vid._imgListeners[ev].splice(i,1);return;}
        return origRem(ev,fn);
      };
      // Trigger loadedmetadata
      const fireLoaded=()=>{ f.duration=10; setTimeout(()=>{(vid._imgListeners.loadedmetadata||[]).forEach(fn=>{try{fn();}catch(e){}});},0); };
      if(vid.complete)fireLoaded(); else vid.onload=fireLoaded;
      vid.load=function(){};
    }else{
      vid=document.createElement('video');
    }
    const isLive=!!(f._live||p.source==='stream');
    if(!isImg && !isLive && f.url) {
      const isHttp=/^https?:/i.test(f.url);
      // f.url è già percent-encoded da mkUrl() per i file locali: NON ri-codificare
      // (encodeURI doppio porta %5B→%255B, file non trovato → MEDIA_ELEMENT_ERROR).
      vid.src = f.url;
      if(isHttp){try{vid.crossOrigin='anonymous';}catch(e){}}
    }
    if(!isImg){ vid.autoplay=isLive;vid.playsInline=true; }
    if(!isImg){ vid.volume=(p.vol/100)*((p.muted||S.muted)?0:1); }
    if(!isImg){ vid.preload='auto'; }
    p.vidEl=vid;
    if(p.sinkId&&vid.setSinkId){try{vid.setSinkId(p.sinkId).catch(()=>{});}catch(e){}}
    // Webcam mirror + rotation (fit rotato)
    if(isLive){
      const applyWcFit=()=>{
        const rot=((p.webcamRotation||0)%360+360)%360;
        const mirror=!!S.webcamMirror;
        vid.style.position='absolute';
        vid.style.left='0'; vid.style.top='0'; vid.style.right='0'; vid.style.bottom='0';
        vid.style.width='100%'; vid.style.height='100%';
        // cover (non contain): la webcam riempie SEMPRE il 100% della cella, niente barre.
        vid.style.objectFit='cover';
        vid.style.transformOrigin='50% 50%';
        // FIX: mirror orizzontale → applichiamo scaleX(-1) PRIMA della rotation.
        // Se mirror viene applicato DOPO rotate(90), l'asse X del transform diventa
        // l'asse verticale del video → l'utente vede inversione verticale.
        let t='';
        if(mirror) t += ' scaleX(-1)';
        if(rot) t += ` rotate(${rot}deg)`;
        if(rot===90||rot===270){
          const cw=area.clientWidth||area.offsetWidth||0;
          const ch=area.clientHeight||area.offsetHeight||0;
          if(cw&&ch){
            // scale = lato lungo / lato corto (>1): dopo rotate(90) il frame copre
            // tutta la cella senza barre (prima era min/max <1 = contain → barre).
            const s=Math.max(cw,ch)/Math.min(cw,ch);
            t += ` scale(${s})`;
          }
        }
        vid.style.transform = t.trim() || 'none';
        // Latenza minima per stream live
        try{ vid.preload='none'; vid.disablePictureInPicture=true; }catch(_){}
      };
      area.style.position='relative';
      applyWcFit();
      try{ const ro=new ResizeObserver(()=>applyWcFit()); ro.observe(area); p._wcResizeObs=ro; }catch(e){}
      p._wcApplyFit=applyWcFit;
    }
    area.appendChild(vid);
    // Se è uno stream live, collega subito
    if(isLive && p._stream){try{vid.srcObject=p._stream;vid.play().catch(()=>{});}catch(e){}}

    vid.addEventListener('loadedmetadata',()=>{
      f.duration=vid.duration||0;
      if(S.panel==='playlist'&&S.panelPlayer===pid)renderPanel();
      // Per stream live (webcam/IP cam) NON instradiamo l'audio attraverso la
      // Web Audio API: la MediaElementSource introduce buffering / latenza che
      // rende l'anteprima a scatti. Il volume resta gestito via vid.volume.
      if(!isLive){
        setupAudioChain(f.uid,vid);
        applyEqToAll();
      }
      applyPlayerVol(p);
    });
    vid.addEventListener('play',()=>{
      if(S.titleAtStart && !f._titleShown){
        f._titleShown=true;
        showTitleOverlay(cell,f);
      }
    });
    vid.addEventListener('ended',()=>{
      if(isLive)return;
      // G15: ensure controls remain interactive
      try{cell.style.pointerEvents='';vid.style.pointerEvents='';}catch(_){}
      if(p.loop){vid.currentTime=0;vid.play().catch(()=>{});}
      else if(p.playlist.length>1)playerNext(pid);
    });
    vid.addEventListener('error',()=>{
      if(isLive)return;
      if(!vid.src||!f.url)return;
      const errCode=vid.error?vid.error.code:null;
      const errMsg=vid.error?(vid.error.message||''):'';
      // Anti-spam: stessa entry+code negli ultimi 1.5s → silenzia (load() può
      // emettere error transitorio durante il replace di src in restoreHistory).
      const ek=pid+'|'+(f.path||f.url)+'|'+errCode;
      const now=Date.now();
      window._vidErrLast=window._vidErrLast||{};
      if(window._vidErrLast[ek]&&now-window._vidErrLast[ek]<1500)return;
      window._vidErrLast[ek]=now;
      logError('Errore riproduzione: '+f.name,'code='+errCode+' msg='+errMsg+' path='+(f.path||f.url||''));
      toast('Errore: '+f.name+(errMsg?' — '+errMsg.slice(0,100):(errCode?' (code '+errCode+')':'')));
      try{vid.pause();}catch(e){}
      // NON rimuoviamo l'entry dalla playlist: una rimozione automatica
      // scatenerebbe renderGrid che ricrea i <video> degli altri player in
      // multi, perdendo i loro caricamenti pendenti (cascata di fallimenti).
      // Lasciamo la entry: l'utente può riprovare, eliminarla manualmente,
      // o aprire esternamente.
    });

    cell.appendChild(area);
    cell.appendChild(buildCellToolbar(pid,vid));
    if(isLive){
      cell.classList.add('live');cell.classList.add('webcam');
      // Webcam mode: trasforma il play in icona REC (cerchio bianco)
      const _pp=cell.querySelector('[data-play] svg path');
      if(_pp)_pp.setAttribute('d','M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z');
    }
  }else{
    const _ejectSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="44" height="44"><path d="M5 17h14M12 4l7 10H5z" fill="currentColor" fill-opacity=".15"/></svg>';
    area.innerHTML=`<div class="ph m2-empty m2-empty-min" data-pid="${pid}"
        onmouseenter="this._tipT=setTimeout(()=>this.classList.add('tip-on'),5000)"
        onmouseleave="clearTimeout(this._tipT);this.classList.remove('tip-on')">
      <button class="m2-empty-eject" onclick="event.stopPropagation();S.activePlayer=${pid};if(sharePlaylistEmpty(${pid}))return;if(!autoFillEmptyPlayer(${pid}))act_openFile()">${_ejectSvg}</button>
      <div class="m2-empty-tip">Trascina qui un file<br>o apri dal menu</div>
    </div>`;
    cell.appendChild(area);
    // Toolbar visibile anche su player vuoto
    cell.appendChild(buildCellToolbar(pid,null));
  }

  updateBadge(cell,pid);

  // Wheel: deltaY=vol, deltaX=seek con lerp animato (6 scroll = full duration).
  // Tooltip floating: durante lo scroll mostra "00:12:34" + thumbnail vicino al cursore
  // ovunque sul cell, non solo sulla progress bar.
  cell.addEventListener('wheel',e=>{
    e.preventDefault();
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&e.deltaX!==0&&p.vidEl){
      const vid=p.vidEl;
      const dur=vid.duration||0;
      if(!dur||!isFinite(dur))return;
      // notch (deltaX=120 ciascuno) percorrono l'intero video; cap ±240 per evento.
      const d=Math.max(-240,Math.min(240,e.deltaX));
      const stepPerUnit=(dur/(S.wheelNotch||12))/120;
      const cur=(p._wTargetT!=null?p._wTargetT:(vid.currentTime||0));
      p._wTargetT=Math.max(0,Math.min(dur,cur+d*stepPerUnit));
      // Mostra il tip della progress bar (no tooltip floating accanto al cursore)
      try{ const _w=cell.querySelector('.vc-controls'); _w && _w._scrubTipShow && _w._scrubTipShow(p._wTargetT); }catch(_){}
      if(!p._wRaf){
        p._wCurT=vid.currentTime||0;
        const tick=()=>{
          const v=p.vidEl;
          if(!v||p._wTargetT==null){p._wRaf=null;return;}
          p._wCurT+=(p._wTargetT-p._wCurT)*(S.wheelLerp||0.30); // lerp 30%/frame default; configurabile
          try{ v.fastSeek?v.fastSeek(p._wCurT):(v.currentTime=p._wCurT); }catch(_){}
          if(Math.abs(p._wTargetT-p._wCurT)<0.05){
            try{ v.fastSeek?v.fastSeek(p._wTargetT):(v.currentTime=p._wTargetT); }catch(_){}
            p._wTargetT=null;p._wRaf=null;return;
          }
          p._wRaf=requestAnimationFrame(tick);
        };
        p._wRaf=requestAnimationFrame(tick);
      }
    }else{
      // Volume funziona anche su player vuoti
      p.vol=Math.max(0,Math.min(100,p.vol+(e.deltaY<0?5:-5)));
      applyPlayerVol(p);
      // Aggiorna barra volume sulla toolbar
      const volF=cell.querySelector('.vc-vol-fill'); if(volF)volF.style.width=p.vol+'%';
      if(pid===S.activePlayer){S.vol=p.vol;const vr=$('volR');if(vr)vr.value=p.vol;const vv=$('volV');if(vv)vv.textContent=p.vol+'%';}
      showVolOverlay(e,p.vol);
      saveConfig();
    }
  },{passive:false});

  // Mouse aux buttons (3=back/4=forward) → prev/next
  // NB: regola UX — una volta selezionato un player, i seek avanti/indietro
  // con pulsanti mouse aux agiscono sempre sul player ATTIVO, non sul cell
  // sopra cui si trova il puntatore. Serve una nuova selezione (click sinistro)
  // per cambiare player.
  cell.addEventListener('mousedown',e=>{
    if(e.button===3){e.preventDefault();const tgt=(S.activePlayer!=null&&S.activePlayer<S.multi)?S.activePlayer:pid;playerPrev(tgt);}
    else if(e.button===4){e.preventDefault();const tgt=(S.activePlayer!=null&&S.activePlayer<S.multi)?S.activePlayer:pid;playerNext(tgt);}
    // Selezione player attivo (click sinistro)
    else if(e.button===0){
      if(S.activePlayer!==pid){
        S.activePlayer=pid;
        document.querySelectorAll('.vc').forEach(c=>c.classList.toggle('active',+c.getAttribute('data-pid')===pid));
        $('shufBtn').classList.toggle('on',p.shuffle);
        $('loopBtn').classList.toggle('on',p.loop);
      }
      // Auto-chiude il pannello laterale e il menu File cliccando su un video
      if(S.panel && !e.target.closest('.sp') && !e.target.closest('.vc-toolbar') && !e.target.closest('.vc-pl-drawer')) closePanel();
      closeMenus&&closeMenus();
    }
  });
  cell.addEventListener('auxclick',e=>{if(e.button===3||e.button===4)e.preventDefault();});

  cell.addEventListener('contextmenu',e=>{
    e.preventDefault();
    showContextMenu(e,pid);
  });

  // Click: selezione player. Long-press (2s): toggle play/pause. Doppio click: fullscreen
  let _lpTimer=null, _lpFired=false, _lpStartX=0, _lpStartY=0;
  const _lpReject=(e)=>{
    if(e.target.closest('.vc-toolbar'))return true;
    if(e.target.closest('.vc-progress'))return true;
    if(e.target.closest('.vc-pl-drawer'))return true;
    if(e.target.closest('.mag-mini'))return true;
    if(e.target.closest('.ph-open'))return true;
    return false;
  };
  cell.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(_lpReject(e))return;
    _lpFired=false; _lpStartX=e.clientX; _lpStartY=e.clientY;
    // Hold-to-pause: se si tiene premuto il sinistro sul video per >400ms,
    // toggle play/pausa. Soglia movimento 6px per distinguere da drag/seek.
    _lpTimer=setTimeout(()=>{
      _lpFired=true; _lpTimer=null;
      const v=p.vidEl; if(!v)return;
      if(v.paused)v.play().catch(()=>{}); else v.pause();
    },400);
  });
  const _lpCancel=()=>{ if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null;} };
  cell.addEventListener('mousemove',e=>{
    if(_lpTimer){
      const dx=Math.abs(e.clientX-_lpStartX), dy=Math.abs(e.clientY-_lpStartY);
      if(dx>6||dy>6)_lpCancel();
    }
    if(cell.classList.contains('cinema')){
      const r=cell.getBoundingClientRect();
      const yFromBottom=(r.bottom||0)-(e.clientY||0);
      cell.classList.toggle('cinema-hover-bottom', yFromBottom>=0 && yFromBottom<=80);
    }
  });
  cell.addEventListener('mouseup',_lpCancel);
  cell.addEventListener('mouseleave',()=>{ _lpCancel(); cell.classList.remove('cinema-hover-bottom'); });
  cell.addEventListener('click',e=>{
    if(_lpReject(e))return;
    // Se drawer playlist aperto → chiudi
    const drawer=cell.querySelector('.vc-pl-drawer.open');
    if(drawer){drawer.classList.remove('open');return;}
    if(_lpFired){_lpFired=false;return;}
    // Pure selection — click handling on cell is already set elsewhere
  });

  cell.addEventListener('dblclick',e=>{
    if(e.target.closest('.vc-toolbar'))return;
    if(e.target.closest('.vc-pl-drawer'))return;
    if(e.target.closest('.vc-progress'))return;
    if(cell.classList.contains('cinema')){toggleCinema(pid);return;}
    // Annulla il long-press timer eventualmente in corso (i due mousedown del
    // doppio click possono averlo armato senza che mouseup lo cancelli in tempo).
    if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null;_lpFired=false;}
    e.preventDefault();
    e.stopPropagation();
    // Fullscreen DOM sul cell cliccato. Doppio click esce. Esc esce.
    try {
      if (document.fullscreenElement === cell) {
        document.exitFullscreen();
      } else {
        if (document.fullscreenElement) try { document.exitFullscreen(); } catch(_){}
        S.activePlayer = pid;
        const req = cell.requestFullscreen ? cell.requestFullscreen() : null;
        if (req && req.catch) req.catch(()=>{ try { toggleFullscreen(); } catch(__){} });
      }
    } catch(_) { try { toggleFullscreen(); } catch(__){} }
  });

  return cell;
}

function renderGrid(){
  const g=$('vGrid');
  g.setAttribute('data-v',S.multi);
  document.body.classList.toggle('multi-mode',S.multi>1);
  document.body.classList.toggle('single-mode',S.multi===1);
  ensurePlayers(S.multi);
  if(S.activePlayer>=S.multi)S.activePlayer=0;

  // Index existing cells by player id
  const existing={};
  Array.from(g.querySelectorAll('.vc')).forEach(c=>{
    const pid=c.getAttribute('data-pid');
    if(pid!==null)existing[pid]=c;
  });

  let dragOv=g.querySelector('.drag-ov');
  if(!dragOv){dragOv=document.createElement('div');dragOv.className='drag-ov';}

  const frag=document.createDocumentFragment();
  frag.appendChild(dragOv);

  for(let i=0;i<S.multi;i++){
    const p=P(i);
    const cf=p.playlist[p.idx];
    const targetUid=cf?String(cf.uid):'';
    const ex=existing[i];
    let cell;
    if(ex && ex.getAttribute('data-file-uid')===targetUid){
      cell=ex;
      delete existing[i];
      cell.classList.toggle('active',i===S.activePlayer);
      updateBadge(cell,i);
    }else{
      cell=createCell(i);
      if(ex){
        const ov=ex.querySelector('video');
        if(ov){try{ov.pause();ov.removeAttribute('src');ov.load();}catch(e){}}
        delete existing[i];
      }
    }
    frag.appendChild(cell);
  }

  while(g.firstChild)g.removeChild(g.firstChild);
  g.appendChild(frag);

  Object.values(existing).forEach(c=>{
    const v=c.querySelector('video');
    if(v){try{v.pause();}catch(e){}}
    const pid=+c.getAttribute('data-pid');
    const p=S.players[pid];
    if(p && p.vidEl===v) p.vidEl=null;
  });

  renderPlayerTrigs();
  applyVideoFilters();
  updatePlayIcons();
}

function renderPlayerTrigs(){
  // Rimosso: ora c'è un'unica flag Playlist globale (#sideFlags). Mantenuto no-op per compatibilità.
  const wrap=$('plTrigs'); if(!wrap)return;
  wrap.innerHTML='';
  for(let i=0;i<S.multi;i++){
    const t=document.createElement('div');
    t.className='pl-trigger';
    t.style.background='var(--s2)';
    t.title='Playlist Player '+(i+1);
    t.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span class="pl-tg-num">${i+1}</span>`;
    t.onclick=()=>{S.panelPlayer=i;openPanel('playlist');};
    wrap.appendChild(t);
  }
}

function updatePlayIcons(){
  const anyPlaying=S.players.slice(0,S.multi).some(p=>p&&p.vidEl&&!p.vidEl.paused);
  $('playIco').innerHTML=anyPlaying?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5v14l11-7z"/>';
}
const updatePlayIcon=updatePlayIcons;

// ═══ MAIN CONTROLS ═══
function toggleMainPlay(){
  const active=S.players.slice(0,S.multi);
  if(active.every(p=>!p||p.playlist.length===0)){act_openFile();return;}
  // T22: se il player attivo è vuoto ma un altro ha una playlist, copia e avvia
  const ap=P(S.activePlayer);
  if(ap&&ap.playlist.length===0&&sharePlaylistEmpty(S.activePlayer))return;
  const anyPlaying=active.some(p=>p&&p.vidEl&&!p.vidEl.paused);
  active.forEach(p=>{
    if(!p||!p.vidEl)return;
    if(anyPlaying)p.vidEl.pause();
    else p.vidEl.play().catch(()=>{});
  });
  updatePlayIcons();
}

function stopAll(){
  S.players.slice(0,S.multi).forEach(p=>{if(p&&p.vidEl){p.vidEl.pause();p.vidEl.currentTime=0;}});
  updatePlayIcons();
}

function mainSkip(seconds){
  S.players.slice(0,S.multi).forEach(p=>{
    if(p&&p.vidEl){
      p.vidEl.currentTime=Math.max(0,Math.min(p.vidEl.duration||0,p.vidEl.currentTime+seconds));
    }
  });
}

function mainNext(){playerNext(S.activePlayer);}
function mainPrev(){playerPrev(S.activePlayer);}

function renderMultiDots(){
  const el=$('multiN'); if(!el)return;
  // 4 pallini (M-logo style): viola se attivo, grigio se inattivo
  const dots=[0,1,2,3].map(i=>{
    const on=i<S.multi;
    return `<span class="m-dot${on?' on':''}"></span>`;
  }).join('');
  el.innerHTML=dots;
}
function cycleMulti(){
  S.multi=S.multi>=4?1:S.multi+1;
  renderMultiDots();
  ensurePlayers(S.multi);
  renderGrid();
  saveConfig();
}
function setMulti(n){
  S.multi=Math.max(1,Math.min(4,n));
  renderMultiDots();
  ensurePlayers(S.multi);
  renderGrid();
  saveConfig();
  $('multiDD').classList.remove('show');
}

// ═══ VOLUME ═══
function setGlobalVolume(v){
  S.vol=Math.max(0,Math.min(100,v));
  $('volR').value=S.vol;
  $('volV').textContent=S.vol+'%';
  S.players.slice(0,S.multi).forEach(p=>{
    p.vol=S.vol;
    applyPlayerVol(p);
  });
  updateVolumeIcon();
  saveConfig();
}

function toggleMute(){
  if(S.muted){S.muted=false;setGlobalVolume(S.prevVol||80);}
  else{
    S.prevVol=S.vol;S.muted=true;
    S.players.slice(0,S.multi).forEach(p=>applyPlayerVol(p));
    updateVolumeIcon();
  }
}

let volOvTimer;
function showVolOverlay(e,vol){
  const ov=$('volOv');
  ov.style.left=Math.min(window.innerWidth-150,e.clientX+16)+'px';
  ov.style.top=Math.max(10,e.clientY-20)+'px';

// ═══ EQ ═══
function toggleEq(){
  S.showEq=!S.showEq;

function drawKnob(id,val,color){
  const c=$(id);if(!c)return;
  const x=c.getContext('2d'),sz=56,cx=sz/2,cy=sz/2,r=sz/2-8;
  x.clearRect(0,0,sz,sz);
  const n=(val+12)/24,ang=(-135+n*270)*Math.PI/180;
  const isLight=(S.theme==='light');
  const cTrack=isLight?'#E6E1EC':'#333';
  const cFill=isLight?'#FFFFFF':'#222';
  const cBorder=isLight?'#C4BAD0':'#444';
  x.beginPath();x.arc(cx,cy,r,-225*Math.PI/180,45*Math.PI/180);
  x.strokeStyle=cTrack;x.lineWidth=3;x.lineCap='round';x.stroke();
  x.beginPath();x.arc(cx,cy,r,-225*Math.PI/180,ang-Math.PI/2);
  x.strokeStyle=color;x.lineWidth=3;x.lineCap='round';x.stroke();
  x.beginPath();x.arc(cx,cy,r-5,0,Math.PI*2);
  x.fillStyle=cFill;x.fill();
  x.strokeStyle=cBorder;x.lineWidth=1.5;x.stroke();
  const px=cx+(r-10)*Math.cos(ang-Math.PI/2),py=cy+(r-10)*Math.sin(ang-Math.PI/2);
  x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);
  x.strokeStyle=color;x.lineWidth=2.5;x.lineCap='round';x.stroke();
}

function drawKnobs(){
  // Main top-bar EQ = active player
  const ap=activeP();
  drawKnob('kBass',ap.eqB,'#7B5EA7');drawKnob('kMid',ap.eqM,'#A47BD4');drawKnob('kHigh',ap.eqH,'#6BC5E8');
  // Settings EQ = settingsTarget
  const st=settingsTarget();
  drawKnob('kBass_s',st.eqB,'#7B5EA7');drawKnob('kMid_s',st.eqM,'#A47BD4');drawKnob('kHigh_s',st.eqH,'#6BC5E8');
  const setText=(id,v)=>{const el=$(id);if(el)el.textContent=(v>0?'+':'')+v+'dB';};
  setText('vBass',ap.eqB);setText('vMid',ap.eqM);setText('vHigh',ap.eqH);
  setText('vBass_s',st.eqB);setText('vMid_s',st.eqM);setText('vHigh_s',st.eqH);
}

function setupKnob(id,key){
  // Top-bar main EQ: opera sul player attivo SEMPRE (non sul settingsTarget)
  const c=$(id);if(!c||c.dataset.wired)return;
  c.dataset.wired='1';
  let drag=false,sy=0,sv=0;
  const target=()=>activeP();
  c.addEventListener('mousedown',e=>{drag=true;sy=e.clientY;sv=target()[key]||0;e.preventDefault()});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const v=Math.round(Math.max(-12,Math.min(12,sv+(sy-e.clientY)*(24/150))));
    target()[key]=v;
    drawKnobs();applyEqToPlayer(target());
  });
  window.addEventListener('mouseup',()=>{if(drag){drag=false;saveConfig()}});
  c.addEventListener('dblclick',e=>{e.preventDefault();target()[key]=0;drawKnobs();applyEqToPlayer(target());saveConfig();});
}
function setupKnobSettings(id,key){
  // Settings knob: opera su settingsTarget (o ALL se -1)
  const c=$(id);if(!c||c.dataset.wired)return;
  c.dataset.wired='1';
  let drag=false,sy=0,sv=0;
  c.addEventListener('mousedown',e=>{drag=true;sy=e.clientY;sv=settingsTarget()[key]||0;e.preventDefault()});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const v=Math.round(Math.max(-12,Math.min(12,sv+(sy-e.clientY)*(24/150))));
    if(S.settingsPlayer===-1){ for(let i=0;i<S.multi;i++) P(i)[key]=v; }
    else settingsTarget()[key]=v;
    drawKnobs();
    if(S.settingsPlayer===-1)applyEqToAll(); else applyEqToPlayer(settingsTarget());
  });
  window.addEventListener('mouseup',()=>{if(drag){drag=false;saveConfig()}});
  c.addEventListener('dblclick',e=>{e.preventDefault();
    if(S.settingsPlayer===-1){ for(let i=0;i<S.multi;i++) P(i)[key]=0; } else settingsTarget()[key]=0;
    drawKnobs();applyEqToAll();saveConfig();
  });
}

// ═══ AUDIO DELAY EDITOR (click-to-edit) ═══
function editAudioDelay(span){
  if(span.querySelector('input'))return;
  const cur=(settingsTarget().audioDelayMs)||0;
  const inp=document.createElement('input');
  inp.type='number';inp.min=-5000;inp.max=5000;inp.step=1;inp.value=cur;
  inp.className='ms-edit-inp';
  const commit=()=>{
    let v=parseInt(inp.value,10);if(isNaN(v))v=0;
    v=Math.max(-5000,Math.min(5000,v));
    applyToTargets('audioDelayMs',v);applyChannelMode();saveConfig();renderPanel();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}else if(e.key==='Escape'){renderPanel();}});
  inp.addEventListener('blur',commit);
  span.textContent='';span.appendChild(inp);inp.focus();inp.select();
}

function renderPanel(){
  const el=$('spContent');
  // Cattura input di ricerca col focus prima del re-render così possiamo
  // ripristinarlo dopo (le search bar perdevano focus a ogni tasto).
  let _focusSnap=null;
  try{
    const a=document.activeElement;
    if(a && a.tagName==='INPUT' && a.id && el && el.contains(a)){
      _focusSnap={id:a.id, val:a.value, start:a.selectionStart, end:a.selectionEnd};
    }
  }catch(_){}
  if(S.panel==='playlist'){$('spTitle').textContent='Playlist';el.innerHTML=renderPlaylist();}
  else if(S.panel==='settings')el.innerHTML=renderSettings();
  else if(S.panel==='ai')el.innerHTML=renderAI();
  else if(S.panel==='downloader'){el.innerHTML=renderDownload();setTimeout(wireDownloadPanel,0);setTimeout(_dlEnsureThumbnails,200);setTimeout(()=>{_dlStartSparkTimer();_drawSpeedSparkline();},50);}
  else if(S.panel==='tags')el.innerHTML=renderTags();
  else if(S.panel==='favorites')el.innerHTML=renderFavorites();
  else if(S.panel==='explore')el.innerHTML=renderExplore();
  else if(S.panel==='organizer')el.innerHTML=renderOrganizer();
  else if(S.panel==='info')el.innerHTML=renderInfo();
  else if(S.panel==='history')el.innerHTML=renderHistory();
  else if(S.panel==='file')el.innerHTML=renderFile();
  if(S.panel==='settings'&&S.stab==='audio'){
    setupKnobSettings('kBass_s','eqB');setupKnobSettings('kMid_s','eqM');setupKnobSettings('kHigh_s','eqH');
    drawKnobs();
    // Unified audio tab: setup input EQ knobs too
    if(document.getElementById('kInLow')){
      setupInEqKnob('kInLow','eqLow');setupInEqKnob('kInMid','eqMid');setupInEqKnob('kInHigh','eqHigh');
      drawInEqKnobs();
    }
    setTimeout(()=>{
      refreshAudioOutputs();refreshAudioDevices();
      // Se c'è già una chain audio input attiva, riavvia solo il meter; altrimenti crea
      if(AUDIOIN&&AUDIOIN.analyser&&AUDIOIN._kickMeter)AUDIOIN._kickMeter();
      else wireAudioInPanel();
    },30);
  }
  if(S.panel==='settings'&&S.stab==='webcam'){setTimeout(wireWebcamPanel,30);if(!S.videoInputs.length)refreshWebcamDevices();}
  if(S.panel==='settings'){setTimeout(_wireSettingsTabsEdgeScroll,0);}
  // Ripristina il focus dell'input di ricerca dopo il re-render.
  if(_focusSnap){
    const inp=document.getElementById(_focusSnap.id);
    if(inp){
      try{
        inp.focus();
        const v=inp.value||'';
        const s=Math.min(_focusSnap.start??v.length, v.length);
        const e=Math.min(_focusSnap.end??v.length, v.length);
        if(typeof inp.setSelectionRange==='function')inp.setSelectionRange(s,e);
      }catch(_){}
    }
  }
}

async function wireWebcamPanel(){
  const prev=document.getElementById('wcPrev');
  if(!prev)return;
  const pend=S._wcPend;if(!pend)return;
  // Se non c'è ancora deviceId nel pending ma il player ha uno stream attivo, usalo come preview
  const p=P(pend._pid);
  if(p&&p._stream&&!pend.deviceId){
    try{prev.srcObject=p._stream;}catch(e){}
  }
  if(pend.deviceId&&pend.deviceId!=='__ipcam__'){
    await _wcRestartPreview();
  }
}

async function _wcRestartPreview(){
  const prev=document.getElementById('wcPrev');
  const pend=S._wcPend;if(!prev||!pend||!pend.deviceId||pend.deviceId==='__ipcam__')return;
  try{
    if(prev.srcObject){try{prev.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}}
    const vc={deviceId:{exact:pend.deviceId}};
    if(pend.res&&pend.res!=='auto'){const [w,h]=pend.res.split('x').map(Number);vc.width={ideal:w};vc.height={ideal:h};}
    if(pend.fps)vc.frameRate={ideal:pend.fps};
    const s=await navigator.mediaDevices.getUserMedia({video:vc,audio:false});
    prev.srcObject=s;
  }catch(e){toast(e.message);}
}

function _wcApplyPreviewStyle(){
  const prev=document.getElementById('wcPrev');const pend=S._wcPend;if(!prev||!pend)return;
  prev.style.filter=`brightness(${pend.bright/100}) contrast(${pend.contrast/100}) saturate(${pend.sat/100}) hue-rotate(${pend.hue}deg)`;
  const rot=((pend.rotation||0)%360+360)%360;
  // Il contenitore (riquadro 16:9) NON deve cambiare dimensione.
  // Per le rotazioni 90/270 calcoliamo uno scale che mantiene tutto il
  // bounding-box ruotato dentro al contenitore — niente crop, niente resize.
  const wrap=document.getElementById('wcPrevWrap');
  let scale='';
  if(rot===90||rot===270){
    const cw=(wrap&&wrap.clientWidth)||0;
    const ch=(wrap&&wrap.clientHeight)||0;
    if(cw&&ch){
      const s=Math.min(cw,ch)/Math.max(cw,ch);
      scale=` scale(${s})`;
    }
  }
  const mirror=pend.mirror?' scaleX(-1)':'';
  prev.style.position='absolute';
  prev.style.left='50%'; prev.style.top='50%';
  prev.style.width='100%'; prev.style.height='100%';
  prev.style.objectFit='contain';
  prev.style.background='#000';
  prev.style.transform=`translate(-50%,-50%) rotate(${rot}deg)${scale}${mirror}`;
  // Latenza minima
  try{ prev.preload='none'; prev.disablePictureInPicture=true; }catch(_){}
}

function _wcSetPending(key,val){
  if(!S._wcPend)return;
  if(key==='deviceId'&&val==='__ipcam__'){act_openIPCam();return;}
  S._wcPend[key]=val;
  if(key==='deviceId'||key==='res'||key==='fps'){_wcRestartPreview();}
  else{_wcApplyPreviewStyle();}
  // I8: propaga rotazione al player in tempo reale
  if(key==='rotation'){try{setWebcamRotation(S._wcPend._pid,+val);}catch(e){}}
}

async function applyWebcamSettings(pid){
  const pend=S._wcPend;if(!pend)return;
  // Persisti res/fps/mirror globali
  S.webcamRes=pend.res;S.webcamFps=pend.fps;S.webcamMirror=pend.mirror;
  // Applica filtri colore al player
  const p=P(pid);p.bright=pend.bright;p.contrast=pend.contrast;p.sat=pend.sat;p.hue=pend.hue;
  applyVideoFilters();applyWebcamMirror();saveConfig();
  if(pend.deviceId&&pend.deviceId!=='__ipcam__'){
    await startWebcamStream(pid,pend.deviceId);
  }
  toast('Impostazioni applicate al Player '+(pid+1));
}

function setWebcamAudioMonitor(on){
  S.webcamAudioMonitor=!!on;
  document.querySelectorAll('.vc video').forEach(v=>{
    const cell=v.closest('.vc');if(!cell)return;
    const pid=parseInt(cell.dataset.pid,10);
    const p=Number.isFinite(pid)?P(pid):null;
    if(p&&(p.source==='stream'||p._stream)) v.muted=!S.webcamAudioMonitor;
  });
  saveConfig();
  toast(S.webcamAudioMonitor?'Ritorno audio abilitato':'Ritorno audio disabilitato');
}

function stopWebcam(pid){
  const p=P(pid);
  if(p._stream){try{p._stream.getTracks().forEach(t=>t.stop());}catch(e){}p._stream=null;}
  p.source='file';
  if(p.vidEl){try{p.vidEl.srcObject=null;}catch(e){}}
  toast('Webcam disattivata');
  renderGrid();
}

async function restartAudioIn(){
  try{
    // Stop previous
    if(AUDIOIN.stream){try{AUDIOIN.stream.getTracks().forEach(t=>t.stop());}catch(e){}}
    if(AUDIOIN.ctx){try{await AUDIOIN.ctx.close();}catch(e){}}
    if(AUDIOIN.rafId)cancelAnimationFrame(AUDIOIN.rafId);
    const constraints={audio:S.audioIn.deviceId?{deviceId:{exact:S.audioIn.deviceId},echoCancellation:true,noiseSuppression:true}:true};
    const stream=await navigator.mediaDevices.getUserMedia(constraints);
    AUDIOIN.stream=stream;
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    AUDIOIN.ctx=ctx;
    AUDIOIN.src=ctx.createMediaStreamSource(stream);
    AUDIOIN.lowF=ctx.createBiquadFilter();AUDIOIN.lowF.type='lowshelf';AUDIOIN.lowF.frequency.value=200;
    AUDIOIN.midF=ctx.createBiquadFilter();AUDIOIN.midF.type='peaking';AUDIOIN.midF.frequency.value=1000;AUDIOIN.midF.Q.value=0.7;
    AUDIOIN.highF=ctx.createBiquadFilter();AUDIOIN.highF.type='highshelf';AUDIOIN.highF.frequency.value=5000;
    AUDIOIN.gain=ctx.createGain();
    AUDIOIN.gate=ctx.createGain(); // implements noise gate via gain modulation
    AUDIOIN.analyser=ctx.createAnalyser();AUDIOIN.analyser.fftSize=512;
    AUDIOIN.dest=ctx.createMediaStreamDestination();
    AUDIOIN.src.connect(AUDIOIN.lowF);
    AUDIOIN.lowF.connect(AUDIOIN.midF);
    AUDIOIN.midF.connect(AUDIOIN.highF);
    AUDIOIN.highF.connect(AUDIOIN.gain);
    AUDIOIN.gain.connect(AUDIOIN.analyser);
    AUDIOIN.gain.connect(AUDIOIN.gate);
    AUDIOIN.gate.connect(AUDIOIN.dest);
    applyAudioIn();
    // Meter loop
    const buf=new Uint8Array(AUDIOIN.analyser.fftSize);
    let _lastW=-1,_lastBg='';
    const meter=()=>{
      if(!AUDIOIN.analyser){AUDIOIN.rafId=null;return;}
      AUDIOIN.analyser.getByteTimeDomainData(buf);
      let sum=0;
      for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
      const rms=Math.sqrt(sum/buf.length);
      const db=rms>0?20*Math.log10(rms):-80;
      // Noise gate
      if(AUDIOIN.gate){
        const target=(!S.audioIn.gateOn||db>=S.audioIn.gateThreshold)?1:0;
        AUDIOIN.gate.gain.setTargetAtTime(target,AUDIOIN.ctx.currentTime,0.02);
      }
      const el=document.getElementById('micMeter');
      if(!el){
        // Meter non più in DOM (siamo su un'altra scheda): stop del RAF finché non si torna sull'audio
        AUDIOIN.rafId=null;return;
      }
      const wv=Math.max(0,Math.min(100,Math.round((db+80)/80*100)));
      const bg=(!S.audioIn.gateOn||db>=S.audioIn.gateThreshold)?'#4CAF7D':'#E05565';
      // Update solo se cambia davvero (riduce repaint al minimo)
      if(wv!==_lastW){el.style.width=wv+'%';_lastW=wv;}
      if(bg!==_lastBg){el.style.background=bg;_lastBg=bg;}
      AUDIOIN.rafId=requestAnimationFrame(meter);
    };
    AUDIOIN._kickMeter=()=>{if(!AUDIOIN.rafId&&AUDIOIN.analyser)AUDIOIN.rafId=requestAnimationFrame(meter);};
    meter();
  }catch(e){toast('Mic: '+e.message);}
}

function applyAudioIn(){
  if(!AUDIOIN.ctx)return;
  if(AUDIOIN.gain)AUDIOIN.gain.gain.value=S.audioIn.gain/100;
  if(AUDIOIN.lowF)AUDIOIN.lowF.gain.value=S.audioIn.eqLow;
  if(AUDIOIN.midF)AUDIOIN.midF.gain.value=S.audioIn.eqMid;
  if(AUDIOIN.highF)AUDIOIN.highF.gain.value=S.audioIn.eqHigh;
}

function parseSRT(text){
  const out=[];
  const blocks=text.replace(/\r/g,'').split(/\n\n+/);
  blocks.forEach(b=>{
    const lines=b.split('\n').filter(Boolean);
    if(lines.length<2)return;
    const timeLine=lines.find(l=>l.includes('-->'));
    if(!timeLine)return;
    const m=timeLine.match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);
    if(!m)return;
    const toS=(h,m2,s,ms)=>+h*3600+ +m2*60+ +s+ (+ms)/1000;
    const start=toS(m[1],m[2],m[3],m[4]);
    const end=toS(m[5],m[6],m[7],m[8]);
    const textStart=lines.indexOf(timeLine)+1;
    const text=lines.slice(textStart).join('\n');
    out.push({start,end,text});
  });
  return out;
}

function parseVTT(text){
  return parseSRT(text.replace(/WEBVTT.*\n/,'').replace(/\.(\d{3})/g,',$1'));
}

function importSubtitles(pid){
  const inp=document.createElement('input');inp.type='file';inp.accept='.srt,.vtt';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const text=r.result;
      const subs=f.name.endsWith('.vtt')?parseVTT(text):parseSRT(text);
      P(pid).subtitles=subs;P(pid).subtitlesOn=true;
      // Salva il path se disponibile (Electron espone .path su File)
      if(f.path)P(pid)._subsSrtPath=f.path;
      _attachSubtitleOverlay(pid);
      toast(`${subs.length} sottotitoli caricati`);
      if(S.panel==='subtitles')renderPanel();
    };
    r.readAsText(f);
  };
  inp.click();
}

function exportSubtitles(pid){
  const p=P(pid);if(!p.subtitles||!p.subtitles.length){toast('Nessun sottotitolo');return;}
  const pad=(n,z=2)=>String(n).padStart(z,'0');
  const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60),ms=Math.round((s%1)*1000);return `${pad(h)}:${pad(m)}:${pad(sec)},${pad(ms,3)}`;};
  const srt=p.subtitles.map((s,i)=>`${i+1}\n${fmt(s.start)} --> ${fmt(s.end)}\n${s.text}\n`).join('\n');
  const blob=new Blob([srt],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='player'+(pid+1)+'.srt';a.click();
}

function toggleSubtitles(pid){
  const p=P(pid);
  p.subtitlesOn=!p.subtitlesOn;
  if(p.subtitlesOn){
    // Prima controlla se ci sono tracce embedded → mostra menu di scelta
    const tracks=(p.vidEl&&p.vidEl.textTracks)?Array.from(p.vidEl.textTracks):[];
    if(tracks.length){ _showEmbeddedSubMenu(pid,tracks); return; }
    if(!p.subtitles){importSubtitles(pid);return;}
    _attachSubtitleOverlay(pid);
  } else {
    // Disattiva tutte embedded
    const tracks=(p.vidEl&&p.vidEl.textTracks)?Array.from(p.vidEl.textTracks):[];
    tracks.forEach(tk=>{tk.mode='disabled';});
    _removeSubtitleOverlay(pid);
  }
}

function _showEmbeddedSubMenu(pid,tracks){
  document.querySelectorAll('.speed-pop').forEach(el=>el.remove());
  const cell=document.querySelector(`.vc[data-pid="${pid}"]`);
  const pop=document.createElement('div');
  pop.className='ctx speed-pop show';
  pop.style.position='fixed';
  let h='';
  tracks.forEach((tk,i)=>{
    const lbl=(tk.label||tk.language||'Traccia '+(i+1))+(tk.language?' ('+tk.language+')':'');
    h+=`<div class="ctx-item" data-tk="${i}">${lbl}</div>`;
  });
  h+=`<div class="ctx-sep"></div><div class="ctx-item" data-tk="file">Importa da file .srt/.vtt</div>`;
  pop.innerHTML=h;
  document.body.appendChild(pop);
  const r=cell?cell.getBoundingClientRect():{left:100,top:100,width:200,height:100};
  pop.style.left=Math.min(r.left+20,window.innerWidth-pop.offsetWidth-8)+'px';
  pop.style.top=Math.min(r.top+40,window.innerHeight-pop.offsetHeight-8)+'px';
  pop.querySelectorAll('[data-tk]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const v=el.getAttribute('data-tk');
      if(v==='file'){pop.remove();importSubtitles(pid);return;}
      const idx=+v;
      tracks.forEach((tk,i)=>{tk.mode=(i===idx)?'showing':'disabled';});

      toast('Traccia attivata: '+(tracks[idx].label||tracks[idx].language||'default'));
      pop.remove();
    });
  });
  const close=(e)=>{if(!pop.contains(e.target)){pop.remove();document.removeEventListener('mousedown',close,true);}};
  setTimeout(()=>document.addEventListener('mousedown',close,true),0);
}

function _attachSubtitleOverlay(pid){
  const cell=document.querySelector(`.vc[data-pid="${pid}"]`);
  if(!cell)return;
  const p=P(pid);
  let ov=cell.querySelector('.sub-ov');
  if(!ov){ov=document.createElement('div');ov.className='sub-ov';cell.appendChild(ov);}
  if(!p.vidEl)return;
  if(p._subHandler)p.vidEl.removeEventListener('timeupdate',p._subHandler);
  p._subHandler=()=>{
    if(!p.subtitlesOn||!p.subtitles){ov.textContent='';return;}
    const t=p.vidEl.currentTime;
    const cur=p.subtitles.find(s=>t>=s.start&&t<=s.end);
    ov.textContent=cur?cur.text:'';
  };
  p.vidEl.addEventListener('timeupdate',p._subHandler);
}
