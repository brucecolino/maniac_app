// Bind unico del progress IPC (per qualunque flusso: generate, translate, auto)
function _bindSubsProgress(){
  if(window._subsProgBound||!window.maniac||!window.maniac.subs||!window.maniac.subs.onProgress)return;
  window._subsProgBound=true;
  window.maniac.subs.onProgress(async evt=>{
    if(!evt||evt.jobId!==window._subsCurrentJob)return;
    const pid=window._subsCurrentPid;
    // Cattura sempre l'ultimo stderr non vuoto: in exit ≠ 0 lo mostriamo all'utente.
    if(evt.type==='stderr'&&evt.line){
      const ln=String(evt.line).trim();
      if(ln){
        // Tieni un ring buffer degli ultimi 6 line di stderr per diagnostica.
        window._subsStderrBuf=window._subsStderrBuf||[];
        window._subsStderrBuf.push(ln);
        if(window._subsStderrBuf.length>6) window._subsStderrBuf.shift();
        // Cattura fatale prioritaria
        if(/Traceback \(most recent|ImportError|ModuleNotFoundError|FileNotFoundError|OSError|Error: |Errno|RuntimeError/i.test(ln)){
          window._subsLastStderr=ln;
        }
      }
    }
    if(evt.type==='exit' && evt.code && evt.code!==0){
      _workerDec('subs');
      const buf=(window._subsStderrBuf||[]).join(' | ');
      const detail=window._subsLastStderr||buf||('exit '+evt.code);
      _subsStatus('Errore Python: '+detail.slice(0,200),'error');
      // Reset buffer per la prossima job
      window._subsStderrBuf=[]; window._subsLastStderr='';
      window._subsAutoStep=null;
      return;
    }
    if(evt.type==='exit' && evt.code===0){
      // Reset buffer su exit pulito
      window._subsStderrBuf=[]; window._subsLastStderr='';
    }
    if(evt.type==='phase'){
      _subsStatus((evt.text||evt.phase||'in corso'));
    }
    if(evt.type==='progress'){
      const pct=evt.percent!=null?Math.round(evt.percent)+'%':(evt.current&&evt.total?Math.round(evt.current*100/evt.total)+'%':'');
      _subsStatus((evt.text||evt.phase||evt.stage||'in corso')+' '+pct);
    }
    if(evt.type==='done'){
      const out=evt.srt||evt.outPath;
      if(out)window._subsLastSrt=out; // salva l'ultimo SRT per eventuale retry traduzione
      // Flusso "auto" (rileva+traduci): dopo la generazione parte la traduzione
      if(window._subsAutoStep==='gen'&&out){
        window._subsAutoStep='trans';
        const detected=evt.detectedLang||evt.language||evt.lang||'auto';
        const target=window._subsAutoTarget||S.translatorLang||'it';
        _subsStatus('Step 2/2: traduzione '+detected+' → '+target+'…');
        const jobTr='subs_tr_'+Date.now();
        window._subsCurrentJob=jobTr;
        const r2=await window.maniac.subs.translate({jobId:jobTr,srt:out,fromLang:detected,toLang:target});
        if(r2&&!r2.ok){
          _workerDec('subs');
          _subsStatus('Traduzione: '+(r2.error||'?'),'error');
          window._subsAutoStep=null;
        }
        return;
      }
      _workerDec('subs');
      _subsStatus('Completato: '+(out||''),'done');
      if(out&&pid!=null)loadSubtitlesFile(pid,out);
      window._subsAutoStep=null;
    }
    if(evt.type==='error'){
      _workerDec('subs');
      const err=String(evt.error||'?');
      // Auto-detect: pacchetto argos mancante. Offri l'auto-install.
      const missingPack=/get_translation|installa il pacchetto|argos:.*installa|pacchetto.*->/.test(err);
      if(missingPack){
        const target=window._subsAutoTarget||S.translatorLang||'it';
        _subsStatus('Lingua non installata. Sto provando ad aggiungerla…','error');
        try{
          const r=await window.maniac.subs.installLang({jobId:'lang_'+Date.now(),fromLang:'auto',toLang:target});
          if(r&&r.ok){
            // Riprova la traduzione automaticamente sull'ultimo SRT noto
            const lastSrt=window._subsLastSrt;
            if(lastSrt){
              _subsStatus('Re-traduzione → '+target+'…');
              const jobTr='subs_tr_'+Date.now();
              window._subsCurrentJob=jobTr;
              await window.maniac.subs.translate({jobId:jobTr,srt:lastSrt,fromLang:'auto',toLang:target});
              return;
            }
          }
        }catch(_){}
        _subsStatus('Impossibile installare la lingua. Aprila da Impostazioni → Sottotitoli → Aggiungi lingua.','error');
      } else {
        _subsStatus('Errore: '+err,'error');
      }
      window._subsAutoStep=null;
    }
  });
}

// F5: genera SRT/VTT da audio con whisper (faster-whisper) o OpenAI (cloud)
async function generateSubsFromAudio(pid){
  const p=P(pid); const f=p&&p.playlist[p.idx];
  if(!f||!f.path){toast('Nessun file caricato sul player');return;}
  if(!window.maniac||!window.maniac.subs||!window.maniac.subs.generate){toast('IPC subtitles non disponibile');return;}
  _bindSubsProgress();
  const useCloud=!!(S.subsUseOpenAI && S.openaiKey);
  const useModel=S.subsModel||'tiny';
  _subsStatus('Avvio generazione… ('+(useCloud?'OpenAI cloud':useModel)+')');
  const jobId='subs_'+Date.now();
  window._subsCurrentJob=jobId; window._subsCurrentPid=pid;
  _workerInc('subs');
  let r;
  if(useCloud && window.maniac.subs.openaiGenerate){
    r=await window.maniac.subs.openaiGenerate({jobId,video:f.path,lang:S.subsSrcLang||'auto',apiKey:S.openaiKey});
  } else {
    // Engine: 'aisub' (Gemini, default) o 'whisper' (locale, fallback).
    // Senza Gemini key, main.js fa fallback automatico a faster-whisper.
    const eng=(S.subsEngine||'aisub');
    r=await window.maniac.subs.generate({
      jobId, video:f.path,
      lang:S.subsSrcLang||'auto',
      model:useModel,
      engine:eng,
      geminiKey:eng==='aisub'?(S.geminiKey||''):null,
      translateTo:eng==='aisub'?(S.translatorLang||null):null
    });
  }
  if(r&&!r.ok){_workerDec('subs');_subsStatus(''+(r.error||'errore avvio'),'error');toast('Errore: '+(r.error||'?'));}
}

// F5: "Rileva e traduci" — genera con auto-lang, poi traduce verso S.translatorLang
async function autoDetectAndTranslateSubs(pid){
  const p=P(pid); const f=p&&p.playlist[p.idx];
  if(!f||!f.path){toast('Nessun file caricato sul player');return;}
  if(!window.maniac||!window.maniac.subs){toast('IPC subtitles non disponibile');return;}
  _bindSubsProgress();
  const target=S.translatorLang||'it';
  window._subsAutoTarget=target;
  const useCloud=!!(S.subsUseOpenAI && S.openaiKey);
  _subsStatus('Step 1/2: generazione sottotitoli… ('+(useCloud?'OpenAI cloud':(S.subsModel||'tiny'))+')');
  const jobGen='subs_gen_'+Date.now();
  window._subsAutoStep='gen';
  window._subsCurrentJob=jobGen; window._subsCurrentPid=pid;
  _workerInc('subs');
  let r;
  if(useCloud && window.maniac.subs.openaiGenerate){
    r=await window.maniac.subs.openaiGenerate({jobId:jobGen,video:f.path,lang:'auto',apiKey:S.openaiKey});
  } else {
    r=await window.maniac.subs.generate({jobId:jobGen,video:f.path,lang:'auto',model:S.subsModel||'tiny'});
  }
  if(r&&!r.ok){_workerDec('subs');_subsStatus(''+(r.error||'errore avvio'),'error');toast('Errore: '+(r.error||'?'));window._subsAutoStep=null;}
}

// F5: helper per caricare un file SRT/VTT generato in un player
function loadSubtitlesFile(pid,path){
  const p=P(pid); if(!p)return;
  // Memorizza path per traduzioni successive senza dover rigenerare
  p._subsSrtPath=path;
  if(p.vidEl){
    Array.from(p.vidEl.querySelectorAll('track[data-imported]')).forEach(t=>t.remove());
    const tr=document.createElement('track');
    tr.kind='subtitles'; tr.label='Generato'; tr.src=mkUrl(path);
    tr.srclang='auto'; tr.dataset.imported='1'; tr.default=true;
    p.vidEl.appendChild(tr);
    if(p.vidEl.textTracks&&p.vidEl.textTracks.length){
      Array.from(p.vidEl.textTracks).forEach(t=>{t.mode=t===p.vidEl.textTracks[p.vidEl.textTracks.length-1]?'showing':'hidden';});
    }
  }
  // Carica anche nell'overlay parsato (per traduzioni client-side)
  try{
    fetch(mkUrl(path)).then(r=>r.text()).then(txt=>{
      const subs=path.toLowerCase().endsWith('.vtt')?parseVTT(txt):parseSRT(txt);
      p.subtitles=subs; p.subtitlesOn=true;
      _attachSubtitleOverlay(pid);
    }).catch(()=>{});
  }catch(_){}
  toast('Sottotitoli caricati');
}

async function autoTranslateSubs(pid){

function _renderLangMgrBody(){
  const body=document.getElementById('langMgrBody'); if(!body)return;
  const D=window._langMgrData||{installed:[],available:[]};
  const q=(window._langMgrSearch||'').toLowerCase().trim();
  const installedKeys=new Set(D.installed.map(p=>p.from+'|'+p.to));
  const notInstalled=D.available.filter(p=>!installedKeys.has(p.from+'|'+p.to));
  const filtered=q?notInstalled.filter(p=>(p.from_name||'').toLowerCase().includes(q)||(p.to_name||'').toLowerCase().includes(q)||p.from.includes(q)||p.to.includes(q)):notInstalled;
  let h='';
  if(D.installed.length){
    h+='<div class="sg-hdr" style="margin:6px 0">Installate ('+D.installed.length+')</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">';
    D.installed.forEach(p=>{
      h+='<span style="background:var(--pd);color:var(--p);padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600">'+(p.from_name||p.from)+' → '+(p.to_name||p.to)+'</span>';
    });
    h+='</div>';
  }
  h+='<div class="sg-hdr" style="margin:6px 0">Aggiungi una lingua</div>';
  h+='<input type="text" id="langMgrSearch" placeholder="Cerca per nome o codice (es: italiano, en, español…)" value="'+q.replace(/"/g,'&quot;')+'" oninput="window._langMgrSearch=this.value;_renderLangMgrBody()" style="width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font-size:11px;margin-bottom:8px;box-sizing:border-box">';
  if(!filtered.length){
    h+='<div style="text-align:center;padding:20px 0;color:var(--t3);font-size:11px">'+(q?'Nessun risultato per «'+q.replace(/</g,'&lt;')+'»':'Nessuna lingua aggiuntiva disponibile')+'</div>';
  } else {
    h+='<div style="max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:4px;border:1px solid var(--bd);border-radius:6px;padding:6px">';
    filtered.slice(0,80).forEach(p=>{
      h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--s1);border-radius:6px"><span style="flex:1;font-size:11px">'+(p.from_name||p.from)+' <span style="color:var(--t3)">→</span> '+(p.to_name||p.to)+'</span><button class="mdl-btn primary" style="padding:4px 10px;font-size:10px" onclick="_langMgrInstall(\''+p.from+'\',\''+p.to+'\',this)">Aggiungi</button></div>';
    });
    if(filtered.length>80) h+='<div style="text-align:center;padding:6px;color:var(--t3);font-size:10px">+'+(filtered.length-80)+' altre — affina la ricerca</div>';
    h+='</div>';
  }
  body.innerHTML=h;
  // Restore focus on search input
  const inp=document.getElementById('langMgrSearch'); if(inp){try{inp.focus();const v=inp.value;inp.setSelectionRange(v.length,v.length);}catch(_){}}
}
async function _langMgrInstall(fromLang,toLang,btn){
  if(!window.maniac||!window.maniac.subs||!window.maniac.subs.installLang)return;
  if(btn){btn.disabled=true;btn.textContent='Installazione…';}
  try{
    const r=await window.maniac.subs.installLang({jobId:'lang_'+Date.now(),fromLang,toLang});
    if(r&&r.ok){
      // Aggiorna la lista locale (sposta in installati)
      const D=window._langMgrData;
      if(D){
        const idx=D.available.findIndex(p=>p.from===fromLang&&p.to===toLang);
        if(idx>=0){
          const pkg=D.available[idx];
          D.installed.push(pkg);
        }
      }
      toast('Lingua aggiunta: '+fromLang+' → '+toLang);
      _renderLangMgrBody();
    } else {
      toast('Errore: '+(r&&r.error||'?'));
      if(btn){btn.disabled=false;btn.textContent='Aggiungi';}
    }
  }catch(e){
    toast('Errore: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='Aggiungi';}
  }
}

// Traduce i sottotitoli attualmente caricati (importati o generati) verso `toLang`.
// Se non ci sono sottotitoli, chiede all'utente: importa o genera + traduci.
async function translateCurrentSubs(pid, toLang){
  const p=P(pid); const f=p&&p.playlist[p.idx];
  if(!f){toast('Nessun file caricato sul player');return;}
  if(!toLang)toLang=S.translatorLang||'it';
  if(!window.maniac||!window.maniac.subs||!window.maniac.subs.translate){
    toast('IPC traduzione non disponibile');return;
  }
  // Caso 1: SRT già su disco → traduci direttamente
  if(p._subsSrtPath){
    return _translateSrtPath(pid, p._subsSrtPath, 'auto', toLang);
  }
  // Caso 2: nessun SRT su disco → chiedi: importa o genera
  _askImportOrGenerate(pid, toLang);
}

async function _translateSrtPath(pid, srtPath, fromLang, toLang){
  _bindSubsProgress();
  const jobId='subs_tr_'+Date.now();
  const useCloud=!!(S.subsUseOpenAI && S.openaiKey);
  _subsStatus('Traduzione → '+toLang+'… ('+(useCloud?'OpenAI cloud':'argos')+')');
  window._subsCurrentJob=jobId; window._subsCurrentPid=pid;
  _workerInc('subs');
  let r;
  if(useCloud && window.maniac.subs.openaiTranslate){
    r=await window.maniac.subs.openaiTranslate({jobId, srt:srtPath, toLang, apiKey:S.openaiKey});
  } else {
    r=await window.maniac.subs.translate({jobId, srt:srtPath, fromLang:fromLang||'auto', toLang});
  }
  if(r&&!r.ok){
    _workerDec('subs');
    _subsStatus(''+(r.error||'errore avvio'),'error');
    toast('Errore: '+(r.error||'?'));
  }
}

  const items=[
    {id:'toggle',label:(subsActive?'Disattiva':'Attiva')+' sottotitoli'},
    {id:'sep'},
    {id:'import',label:'Importa .srt / .vtt'},
    {id:'generate',label:'Genera dai dialoghi'},
    {id:'genTrans',label:'Genera + Traduci'},
    {id:'translate',label:'Traduci'},
    {id:'sep'},
    {id:'settings',label:'Impostazioni sottotitoli'}
  ];
  const m=document.createElement('div');
  m.className='ctx-menu maniac-subs-tbmenu';
  m.style.cssText='position:fixed;z-index:99999;background:var(--s1);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:4px;min-width:200px;font:500 12px/1 Inter,sans-serif';
  items.forEach(it=>{
    if(it.id==='sep'){
      const s=document.createElement('div');
      s.style.cssText='height:1px;background:var(--bd);margin:4px 6px';
      m.appendChild(s); return;
    }
    const b=document.createElement('button');
    b.textContent=it.label;
    b.style.cssText='display:block;width:100%;text-align:left;padding:6px 10px;background:transparent;border:0;color:inherit;font:500 11px/1 Inter;cursor:pointer;border-radius:4px';
    b.onmouseover=()=>{b.style.background='var(--pd)';b.style.color='var(--p)';};
    b.onmouseout=()=>{b.style.background='';b.style.color='';};
    b.onclick=()=>{
      m.remove();
      const a=it.id;
      if(a==='toggle'){
        if(p.subtitles && p.subtitles.length){
          p.subtitlesOn=!p.subtitlesOn;
          if(p.subtitlesOn) _attachSubtitleOverlay(pid); else _removeSubtitleOverlay(pid);
          if(anchorBtn) anchorBtn.classList.toggle('on', p.subtitlesOn);
        } else if(p.vidEl && p.vidEl.textTracks && p.vidEl.textTracks.length){
          let anyOn=false;
          for(let i=0;i<p.vidEl.textTracks.length;i++){if(p.vidEl.textTracks[i].mode==='showing'){anyOn=true;break;}}
          for(let i=0;i<p.vidEl.textTracks.length;i++){p.vidEl.textTracks[i].mode=anyOn?'disabled':(i===0?'showing':'disabled');}
          if(anchorBtn) anchorBtn.classList.toggle('on', !anyOn);
        }
        try{saveConfig&&saveConfig();}catch(_){}
      } else if(a==='import') importSubtitles(pid);
      else if(a==='generate') generateSubsFromAudio(pid);
      else if(a==='genTrans') autoDetectAndTranslateSubs(pid);
      else if(a==='translate') autoTranslateSubs(pid);
      else if(a==='settings'){S.settingsPlayer=pid;S.stab='subtitles';openPanel('settings');}
    };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  // Posiziona sopra il bottone della toolbar
  const r=anchorBtn?anchorBtn.getBoundingClientRect():{left:ev.clientX,top:ev.clientY,bottom:ev.clientY};
  if(typeof _clampPopover==='function'){
    _clampPopover(m, r.left, r.top-4, {top:r.top, bottom:r.bottom});
  } else {
    m.style.left=r.left+'px'; m.style.top=Math.max(8,r.top-m.offsetHeight-4)+'px';
  }
  setTimeout(()=>document.addEventListener('mousedown',function cl(e){if(!m.contains(e.target)){m.remove();document.removeEventListener('mousedown',cl,true);}},true),0);
}

function _askImportOrGenerate(pid, toLang){
  // Modale centrale (funziona anche dal pannello Settings, dove la cella non è visibile).
  document.querySelectorAll('.maniac-subs-ask-ov').forEach(el=>el.remove());
  const ov=document.createElement('div');

      <button class="mdl-btn primary" data-act="generate" style="justify-content:flex-start;text-align:left;padding:10px 12px;height:auto"><b>Genera dai dialoghi + traduci</b><div style="font-size:10px;color:#fff;opacity:.85;font-weight:400;margin-top:2px">Trascrivi l'audio e traduci → ${target}</div></button>
    </div>
    <div class="mdl-btns" style="margin-top:14px"><button class="mdl-btn" data-act="cancel">Annulla</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  ov.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const a=el.getAttribute('data-act');
      close();
      if(a==='import'){
        importSubtitles(pid);
        // hook differito: appena p._subsSrtPath è pronto, traduci
        const wait=setInterval(()=>{
          const p=P(pid);
          if(p&&p._subsSrtPath){clearInterval(wait);_translateSrtPath(pid,p._subsSrtPath,'auto',target);}
        },300);
        setTimeout(()=>clearInterval(wait),20000);
      } else if(a==='generate'){
        const prev=S.translatorLang; S.translatorLang=target;
        autoDetectAndTranslateSubs(pid);
        S.translatorLang=prev;
      }
    });
  });
}

// Dots per indicatore session multi in cronologia. Coerente con multi-button:
// 1=>1 pallino, 2=>2 in fila, 3=>3 in fila, 4=>2x2 quadrato. Tutti pieni viola.
function _histMultiDots(n){
  n=Math.max(1,Math.min(4,+n||1));
  const dots=Array.from({length:n},()=>'<span class="m-dot on"></span>').join('');
  let grid='';
  if(n===1) grid='grid-template-columns:6px;grid-template-rows:6px';
  else if(n===2) grid='grid-template-columns:6px 6px;grid-template-rows:6px';
  else if(n===3) grid='grid-template-columns:6px 6px 6px;grid-template-rows:6px';
  else grid='grid-template-columns:6px 6px;grid-template-rows:6px 6px';
  return `<span class="multi-label" style="margin:0;${grid}">${dots}</span>`;
}

function renderHistory(){
  const hide=!!(S.hideThumbs&&S.hideThumbs.history);
  const histHidden=!!S.historyHidden;
  const sort=S.histSort||'new';
  const _hQ=(S._histSearch||'').toLowerCase();
  const header='<div class="sp-body">'+
    `<div class="sp-hdr-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div style="flex:1;min-width:0">${renderSearchBar('histSearch','Cerca nella cronologia…',"S._histSearch=%v;renderPanel()",{value:S._histSearch||'',inline:true})}</div>
      ${iconBtn(ICON_IMG, hide?'Mostra anteprime':'Nascondi anteprime', "toggleThumbs('history')")}
      ${iconBtn(iconEye(!histHidden), histHidden?'Mostra elenco':'Nascondi elenco', "S.historyHidden=!S.historyHidden;renderPanel()")}
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <span style="font-size:10px;color:var(--t3);line-height:var(--h-input);white-space:nowrap">${t('sortBy')||'Ordina per:'}</span>
      <select onchange="_sortHandler('hist',this.value)" style="flex:1;min-width:0;height:var(--h-input);padding:0 8px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font-size:11px;box-sizing:border-box">
        <option value="new" ${sort==='new'?'selected':''}>Più recenti</option>
        <option value="name" ${sort==='name'?'selected':''}>Nome</option>
      </select>
      ${iconBtn(_sortDir('hist')>0?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M12 4v16M5 11l7-7 7 7"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M12 4v16M5 13l7 7 7-7"/></svg>',_sortDir('hist')>0?'Ordine crescente':'Ordine decrescente',"_sortHandler('hist',S.histSort||'new')")}
    </div>`;
  if(histHidden)return header+'</div>';
  // Filtro per-player: se S.historyPlayer >= 0 mostra solo voci di quel player.
  const _hpFilter=Number.isFinite(S.historyPlayer)?S.historyPlayer:-1;
  let _baseHist=S.history;
  if(_hpFilter>=0)_baseHist=_baseHist.filter(h=>h&&h.playerId===_hpFilter);
  // Filtro testuale: cerca su nome + path
  if(_hQ)_baseHist=_baseHist.filter(h=>h&&((h.name||'').toLowerCase().includes(_hQ)||(h.path||'').toLowerCase().includes(_hQ)));
  if(!_baseHist.length)return header+`<div style="text-align:center;padding:40px 0;color:var(--t3);font-size:12px">${_hQ?'Nessun risultato per «'+_hQ.replace(/</g,'&lt;')+'»':(_hpFilter>=0?'Nessuna voce per Player '+(_hpFilter+1):(t('noHistory')||'Nessuna voce in cronologia'))}</div></div>`;
  let h=header;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span style="font-size:11px;color:var(--t3)">${_baseHist.length} ${t('entries')||'voci'}${_hpFilter>=0?' · Player '+(_hpFilter+1):''}</span>
    <button class="reset-btn" style="background:var(--err);color:#fff;border:0;padding:6px 12px;font-size:11px" onclick="clearAllHistory()">${t('clearHistory')||'Cancella tutta'}</button>
  </div>`;
  let hist=[..._baseHist];
  const _hd=_sortDir('hist');
  if(sort==='name')hist.sort((a,b)=>((a.name||'').localeCompare(b.name||''))*_hd);
  else if(sort==='new'){ if(_hd>0) hist.reverse(); /* asc = invertito */ }
  hist.forEach((e,i)=>{
    const d=new Date(e.ts);
    const hhmm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const isMulti=e.snapshot&&e.snapshot.length>1;
    // Thumb: prova entry.thumb, poi cache LS se disponibile
    let thumbSrc=e.thumb||'';
    if(!thumbSrc && e.path){ try{ thumbSrc=localStorage.getItem(_thumbLsKey(e.path))||''; if(thumbSrc) e.thumb=thumbSrc; }catch(_){} }
    const thumb=(!hide)?(thumbSrc
      ?`<img src="${thumbSrc}" loading="lazy" decoding="async" style="width:48px;height:32px;object-fit:cover;border-radius:4px;margin-right:8px;flex-shrink:0" onerror="this.style.display='none'">`
      :`<div style="width:48px;height:32px;border-radius:4px;margin-right:8px;flex-shrink:0;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--t3)"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg></div>`):'';
    const _ts=e.ts;
    const clickHandler=isMulti?`chooseRestoreModeByTs(${_ts})`:`restoreHistoryByTs(${_ts},false)`;
    h+=`<div class="hist-item" style="display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="if(event.target.closest('.hist-btn'))return;${clickHandler}" oncontextmenu="mediaOptionsCtx(event,{name:'${escApos(e.name||'')}',path:'${escApos(e.path||'')}'})">
      ${thumb}
      <div class="hist-info" style="flex:1;min-width:0">
        <div class="hist-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${e.name}</div>
        <div class="hist-meta" style="font-size:10px;color:var(--t3)">${hhmm} · Player ${e.playerId+1}${isMulti?' · Multi '+e.layout:''}</div>
      </div>
      <button class="hist-btn" title="${e.snapshot&&e.snapshot.length>1?(t('restoreSession')||'Ripristina sessione (tutti i video)'):'Sessione singola'}" ${isMulti?`onclick="restoreHistoryByTs(${_ts},true)"`:''} style="background:0;border:0;cursor:${isMulti?'pointer':'default'};padding:4px;display:inline-flex;align-items:center;justify-content:center">${_histMultiDots(e.snapshot?e.snapshot.length:1)}</button>
      <button class="hist-btn" title="${t('deleteEntry')||'Elimina voce'}" onclick="event.stopPropagation();deleteHistoryEntryByTs(${_ts})" style="background:0;border:0;color:var(--err);cursor:pointer;padding:4px"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
    </div>`;
  });
  h+='</div>';
  return h;
}

  </div>`;
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('show'));
  const cv=ov.querySelector('#efPrev');const ctx=cv.getContext('2d');
  const VW=vid.videoWidth,VH=vid.videoHeight;
  const drawPreview=()=>{cv.width=320;cv.height=Math.round(320*(VH/VW));try{ctx.drawImage(vid,0,0,cv.width,cv.height);}catch(_){}};
  drawPreview();
  const sizeSel=ov.querySelector('#efSize');const customWrap=ov.querySelector('#efCustomWrap');
  sizeSel.onchange=()=>{customWrap.style.display=sizeSel.value==='custom'?'':'none';};
  const fmtSel=ov.querySelector('#efFmt');const qWrap=ov.querySelector('#efQWrap');
  fmtSel.onchange=()=>{qWrap.style.display=fmtSel.value==='png'?'none':'';};
  const qR=ov.querySelector('#efQ'),qV=ov.querySelector('#efQV');qR.oninput=()=>qV.textContent=qR.value;

    if(!window.maniac||!window.maniac.downloadPickDir){toast(t('ipcUnavailable')||'IPC non disponibile');return;}
    const r=await window.maniac.downloadPickDir();
    if(r&&!r.canceled&&r.path){dirInp.value=r.path;try{localStorage.setItem('exportFrameDir',r.path);}catch(e){}}

  ov.querySelector('[data-act="save"]').onclick=async()=>{

    else if(s==='480'&&VH>480){outH=480;outW=Math.round(VW*(480/VH));}
    else if(s==='custom'){outW=+ov.querySelector('#efW').value||VW;outH=Math.round(VH*(outW/VW));}
    const out=document.createElement('canvas');out.width=outW;out.height=outH;
    try{out.getContext('2d').drawImage(vid,0,0,outW,outH);}catch(e){toast('Errore: '+e.message);return;}
    const fmt=fmtSel.value;const q=(+qR.value)/100;
    const mime='image/'+fmt;
    const dir=dirInp.value||localStorage.getItem('exportFrameDir')||'';
    out.toBlob(async b=>{
      if(!b){toast('Errore blob');return;}
      const ab=await b.arrayBuffer();
      // Smart filename
      const d=new Date();const pad=n=>String(n).padStart(2,'0');
      const ts=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
      const cur=p.playlist&&p.playlist[p.idx];const rawT=(cur&&(cur.name||'')).replace(/\.[^.]+$/,'');
      const safeT=(rawT||'frame').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,12);
      const filename=`${ts}_${safeT}.${fmt}`;
      if(dir&&window.maniac&&window.maniac.saveFrameDirect){
        const r=await window.maniac.saveFrameDirect({dir,filename,buffer:ab});
        if(r&&r.success)toast((t('saved')||'Salvato')+': '+r.path);else toast((t('error')||'Errore')+': '+((r&&r.error)||''));
      } else if(window.maniac&&window.maniac.saveFrame){
        const r=await window.maniac.saveFrame({buffer:ab,ext:fmt});
        if(r&&r.success)toast((t('saved')||'Salvato')+': '+r.path);else if(r&&!r.canceled)toast((t('error')||'Errore')+': '+(r.error||''));
      } else {
        const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();
      }
      close();
    },mime,fmt==='png'?undefined:q);
  };
}

function themedConfirm(opts){
  return new Promise(resolve=>{
    const o=Object.assign({title:'Conferma',message:'',confirmText:t('confirm')||'Conferma',cancelText:t('cancel')||'Annulla',danger:false,icon:'warn'},opts||{});
    const ov=document.createElement('div');
    ov.className='mdl-ov';
    const icSvg=o.icon==='info'
      ? '<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>';
    ov.innerHTML=`<div class="mdl" role="dialog" aria-modal="true">
      <div class="mdl-ic ${o.icon==='info'?'info':''}">${icSvg}</div>
      <div class="mdl-ttl"></div>
      <div class="mdl-msg"></div>
      <div class="mdl-btns">
        <button class="mdl-btn" data-act="cancel"></button>
        <button class="mdl-btn ${o.danger?'danger':'primary'}" data-act="ok"></button>
      </div>
    </div>`;
    ov.querySelector('.mdl-ttl').textContent=o.title;
    ov.querySelector('.mdl-msg').textContent=o.message;
    ov.querySelector('[data-act="cancel"]').textContent=o.cancelText;
    ov.querySelector('[data-act="ok"]').textContent=o.confirmText;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('show'));
    const close=(v)=>{
      ov.classList.remove('show');
      setTimeout(()=>{if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);},200);
      document.removeEventListener('keydown',onKey);
    };
    const onKey=(e)=>{if(e.key==='Escape'){e.preventDefault();close(false);} else if(e.key==='Enter'){e.preventDefault();close(true);}};
    document.addEventListener('keydown',onKey);
    ov.querySelector('[data-act="cancel"]').onclick=()=>close(false);
    ov.querySelector('[data-act="ok"]').onclick=()=>close(true);
    ov.addEventListener('click',e=>{if(e.target===ov)close(false);});
    setTimeout(()=>ov.querySelector('[data-act="ok"]').focus(),220);
  });
}

async function chooseRestoreMode(idx){
  const e=S.history[idx]; if(!e)return;
  const ov=document.createElement('div');
  ov.className='mdl-ov';
  ov.innerHTML=`<div class="mdl" role="dialog" aria-modal="true">
    <div class="mdl-ttl">Voce cronologia multi</div>
    <div class="mdl-msg">Questa voce fa parte di una sessione con ${e.snapshot.length} player attivi. Cosa vuoi aprire?</div>
    <div class="mdl-btns" style="margin-top:14px;flex-direction:column;gap:6px">
      <button class="mdl-btn primary" data-act="single" style="width:100%">Apri solo questo file</button>
      <button class="mdl-btn primary" data-act="multi" style="width:100%">Ripristina sessione multi completa</button>
      <button class="mdl-btn" data-act="cancel" style="width:100%">Annulla</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('show'));
  const close=(act)=>{
    if(ov.parentNode)ov.parentNode.removeChild(ov);
    if(act==='single')restoreHistory(idx,false);
    else if(act==='multi')restoreHistory(idx,true);
  };
  ov.querySelector('[data-act="single"]').onclick=()=>close('single');
  ov.querySelector('[data-act="multi"]').onclick=()=>close('multi');
  ov.querySelector('[data-act="cancel"]').onclick=()=>close('cancel');
  ov.addEventListener('click',ev=>{if(ev.target===ov)close('cancel');});
}

// Lookup per timestamp (univoco): risolve il bug dove l'index passato dalla
// lista ORDINATA della UI non corrispondeva all'array originale di S.history,
// causando "apre solo un player" su sessioni multi.
function restoreHistoryByTs(ts, asMulti){
  const idx=(S.history||[]).findIndex(e => e && e.ts === ts);
  if(idx<0){toast('Voce cronologia non trovata');return;}
  return restoreHistory(idx, asMulti);
}
function chooseRestoreModeByTs(ts){
  const idx=(S.history||[]).findIndex(e => e && e.ts === ts);
  if(idx<0){toast('Voce cronologia non trovata');return;}
  return chooseRestoreMode(idx);
}
function deleteHistoryEntryByTs(ts){
  const idx=(S.history||[]).findIndex(e => e && e.ts === ts);
  if(idx<0)return;
  return deleteHistoryEntry(idx);
}

function restoreHistory(idx,asMulti){
  try{
    const e=S.history[idx]; if(!e){toast('Voce cronologia non trovata');return;}
    if(asMulti&&e.snapshot&&e.snapshot.length>1){
      S.multi=e.layout||Math.min(4,e.snapshot.length);
      renderMultiDots();
      ensurePlayers(S.multi);
      e.snapshot.forEach(s=>{
        const pid=Math.max(0,Math.min(S.multi-1,s.playerId||0));
        const p=P(pid); if(!p)return;
        if(Array.isArray(s.files)&&s.files.length){
          // Snapshot moderno: ripristina l'INTERA playlist (consente prev/next nel player ripristinato).
          p.playlist=s.files.map(f=>newFile(f.name,mkUrl(f.path,f.url),f.path));
          p.idx=Math.max(0,Math.min((s.idx==null?0:+s.idx),p.playlist.length-1));
        } else {
          // Backward-compat: snapshot vecchio con un solo file per player.
          let i=p.playlist.findIndex(f=>f.path===s.path);
          if(i<0){p.playlist.push(newFile(s.name,mkUrl(s.path,s.url),s.path));i=p.playlist.length-1;}
          p.idx=i;
        }
      });
      renderGrid();
      setTimeout(()=>e.snapshot.forEach(s=>{
        const pid=Math.max(0,Math.min(S.multi-1,s.playerId||0));
        try{loadFileIntoPlayer(pid);}catch(_){}
      }),120);
    }else{
      // Rispetta il LOCK utente (S.activePlayer): se valido, usa quello; il
      // playerId originale della history fa solo da fallback.
      let pid=(Number.isFinite(S.activePlayer)&&S.activePlayer>=0&&S.activePlayer<S.multi)?S.activePlayer:e.playerId;
      if(pid==null||pid<0) pid=0;
      if(pid>=S.multi){
        S.multi=Math.min(4,pid+1);
        renderMultiDots();
        ensurePlayers(S.multi);
      }
      const p=P(pid); if(!p){toast('Player non disponibile');return;}
      let i=p.playlist.findIndex(f=>f.path===e.path);
      if(i<0){p.playlist.push(newFile(e.name,mkUrl(e.path,e.url),e.path));i=p.playlist.length-1;}
      p.idx=i;
      S.activePlayer=pid;
      renderGrid();
      setTimeout(()=>{try{loadFileIntoPlayer(pid);}catch(err){toast('Errore caricamento: '+err.message);}},120);
    }
    closePanel();
  }catch(err){
    toast('Errore ripristino: '+err.message);
    console.error('restoreHistory',err);
  }
}

function _wireSettingsTabsEdgeScroll(){
  const wrap=document.getElementById('stTabsWrap');
  const tabs=document.getElementById('stTabs');
  if(!wrap||!tabs)return;
  const arrL=document.getElementById('stArrL');
  const arrR=document.getElementById('stArrR');
  const edgeL=document.getElementById('stEdgeL');
  const edgeR=document.getElementById('stEdgeR');
  const upd=()=>{
    const over=tabs.scrollWidth>tabs.clientWidth+1;
    arrL.classList.toggle('show',over&&tabs.scrollLeft>2);
    arrR.classList.toggle('show',over&&tabs.scrollLeft<tabs.scrollWidth-tabs.clientWidth-2);
  };
  upd();
  tabs.addEventListener('scroll',upd,{passive:true});
  new ResizeObserver(upd).observe(tabs);

  // Scorrimento orizzontale fluido: target + easing su requestAnimationFrame
  // (niente salti per tick né setInterval → movimento continuo e morbido).
  const maxLeft=()=>Math.max(0,tabs.scrollWidth-tabs.clientWidth);
  let target=tabs.scrollLeft, raf=null, edgeDir=0;
  const tick=()=>{
    if(edgeDir!==0) target=Math.max(0,Math.min(maxLeft(),target+edgeDir*14));
    const cur=tabs.scrollLeft, diff=target-cur;
    if(Math.abs(diff)<0.5 && edgeDir===0){ tabs.scrollLeft=target; raf=null; upd(); return; }
    tabs.scrollLeft = cur + diff*0.2;
    upd();
    raf=requestAnimationFrame(tick);
  };
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
  const scrollByAmt=(d)=>{ target=Math.max(0,Math.min(maxLeft(),target+d)); kick(); };
  const startScroll=(dir)=>{ edgeDir=dir; target=tabs.scrollLeft; kick(); };
  const stopScroll=()=>{ edgeDir=0; target=tabs.scrollLeft; };
  edgeL.addEventListener('mouseenter',()=>startScroll(-1));
  edgeL.addEventListener('mouseleave',stopScroll);
  edgeR.addEventListener('mouseenter',()=>startScroll(1));
  edgeR.addEventListener('mouseleave',stopScroll);
  tabs.addEventListener('wheel',e=>{
    if(tabs.scrollWidth<=tabs.clientWidth)return;
    e.preventDefault();
    if(!raf) target=tabs.scrollLeft;       // ri-sincronizza se fermo
    scrollByAmt(e.deltaY||e.deltaX);
  },{passive:false});
}

// G5/H2: clipboard monitor with deep page scan
let _clipMonTimer=null,_lastClip='',_clipFocusBound=false,_clipBusy=false;
async function _clipboardCheck(){
  if(_clipBusy)return; _clipBusy=true;
  try{
    if(!navigator.clipboard||!navigator.clipboard.readText)return;
    const txt=await navigator.clipboard.readText();
    const trimmed=(txt||'').trim();
    if(!trimmed||trimmed===_lastClip)return;
    if(!/^(https?:\/\/|magnet:)/i.test(trimmed))return;
    _lastClip=trimmed;
    const inp=document.getElementById('dlUrl');if(inp)inp.value=_lastClip;
    if(/\.(mp4|webm|m3u8|mpd|mkv|mov|ogv|avi|ts)(\?|#|$)/i.test(trimmed)){
      toast(t('urlDetected')||'URL rilevato');
      if(typeof dlStart==='function')dlStart();
      return;
    }
    if(!window.maniac||!window.maniac.clipboardScanPage)return;
    toast(t('scanning')||'Analizzo pagina…');
    const r=await window.maniac.clipboardScanPage(trimmed);
    if(!r||!r.ok||!r.results||!r.results.length)return;
    const uniq=[];const seen=new Set();
    r.results.forEach(x=>{const k=(x.url||'')+'|'+(x.height||'');if(!seen.has(k)){seen.add(k);uniq.push(x);}});
    // F4: notifica nativa Windows (system tray) anche se app è in background
    const autoStart=!!(S.downloaderCfg&&S.downloaderCfg.interceptorAutoStart);
    const _notify=(title,body,onClick)=>{
      try{
        if('Notification' in window){
          if(Notification.permission==='granted'){
            const n=new Notification(title,{body,silent:false,requireInteraction:false});
            if(onClick)n.onclick=()=>{try{n.close();}catch(_){}; onClick();};
          } else if(Notification.permission!=='denied'){
            Notification.requestPermission().then(p=>{if(p==='granted')_notify(title,body,onClick);});
          }
        }
      }catch(_){}
    };
    if(uniq.length===1){
      const inp2=document.getElementById('dlUrl');if(inp2)inp2.value=uniq[0].url;
      const tit=(uniq[0].title||uniq[0].url).slice(0,80);
      if(autoStart){
        _notify('Maniac · Download avviato',tit,()=>{ try{window.focus();openPanel('downloader');}catch(_){} });
        if(typeof dlStart==='function')dlStart();
      } else {
        _notify('Maniac · Video rilevato',tit+'\nClic per avviare il download',()=>{
          try{window.focus();openPanel('downloader');}catch(_){}
          if(typeof dlStart==='function')dlStart();
        });
        toast((t('videoFound')||'Video trovato')+': '+tit);
      }
    } else if(uniq.length>1){
      if(autoStart){
        // Auto-start tutti
        uniq.forEach(u=>{const inp2=document.getElementById('dlUrl');if(inp2)inp2.value=u.url;if(typeof dlStart==='function')dlStart(u.url);});
        _notify('Maniac · '+uniq.length+' download avviati','Pagina: '+trimmed.slice(0,60),()=>{ try{window.focus();openPanel('downloader');}catch(_){} });
      } else {
        _showMultiVideoModal(uniq,trimmed);
      }
    }
  }catch(e){} finally { _clipBusy=false; }
}
function toggleClipboardMonitor(){
  const on=!!(S.downloaderCfg&&S.downloaderCfg.clipboardCapture);
  if(on&&!_clipMonTimer){
    _clipMonTimer=setInterval(_clipboardCheck,300);
    if(!_clipFocusBound){
      window.addEventListener('focus',_clipboardCheck);
      _clipFocusBound=true;
    }
  } else if(!on&&_clipMonTimer){clearInterval(_clipMonTimer);_clipMonTimer=null;}
}

function formatShortcut(s){
  return (s||'').replace('Control','Ctrl').replace('ArrowUp','↑').replace('ArrowDown','↓').replace('ArrowLeft','←').replace('ArrowRight','→').replace(' ','Space');
}

function recordShortcut(btn,action){
  btn.textContent='Premi';btn.focus();
  const handler=e=>{
    e.preventDefault();
    if(e.key==='Escape'){btn.textContent=formatShortcut(S.shortcuts[action]);btn.blur();return}
    let combo='';
    if(e.ctrlKey)combo+='Ctrl+';
    if(e.shiftKey)combo+='Shift+';
    if(e.altKey)combo+='Alt+';
    const k=e.key;
    if(k==='Control'||k==='Shift'||k==='Alt'||k==='Meta')return;
    combo+=k;
    // Rileva collisione con un'altra azione
    const clash=Object.keys(S.shortcuts).find(a=>a!==action&&S.shortcuts[a]===combo);
    if(clash){
      const ok=confirm(`Il tasto '${combo}' è già assegnato alla funzione '${clash}'. Vuoi davvero effettuare le modifiche?`);
      if(!ok){btn.textContent=formatShortcut(S.shortcuts[action]);btn.removeEventListener('keydown',handler);btn.blur();return;}
      delete S.shortcuts[clash];
    }
    S.shortcuts[action]=combo;
    btn.textContent=formatShortcut(combo);
    btn.removeEventListener('keydown',handler);
    btn.blur();
    saveConfig();
    if(clash)renderPanel();
  };
  btn.addEventListener('keydown',handler);
}

function applyVideoFilters(){
  const upOn=!!S.upscaleAI;
  const upMode=S.upscaleAIMode||'lanczos';
  const upFilter=upOn?(upMode==='sharp'?' contrast(1.05) saturate(1.05)':upMode==='bicubic'?' contrast(1.02)':' contrast(1.03) saturate(1.02)'):'';
  const upRender=upOn?(upMode==='sharp'?'crisp-edges':'auto'):'';
  S.players.slice(0,S.multi).forEach(p=>{
    if(!p.vidEl)return;
    p.vidEl.style.filter=`brightness(${p.bright/100}) contrast(${p.contrast/100}) saturate(${p.sat/100}) hue-rotate(${p.hue}deg)${upFilter}`;
    if(upRender)p.vidEl.style.imageRendering=upRender; else p.vidEl.style.imageRendering='';
  });
}

async function refreshAudioOutputs(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return;
  try{
    try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());}catch(e){}
    const devs=await navigator.mediaDevices.enumerateDevices();
    const ao=devs.filter(d=>d.kind==='audiooutput');
    const ai=devs.filter(d=>d.kind==='audioinput');
    const vi=devs.filter(d=>d.kind==='videoinput');
    const sig=d=>d.map(x=>x.deviceId+'|'+x.label).join(',');
    const prev=sig(S.audioOutputs||[])+'#'+sig(S.audioInputs||[])+'#'+sig(S.videoInputs||[]);
    const next=sig(ao)+'#'+sig(ai)+'#'+sig(vi);
    S.audioOutputs=ao;S.audioInputs=ai;S.videoInputs=vi;
    if(prev===next)return;
    if(S.panel==='settings'&&S.stab!=='audio')renderPanel();
    else if(S.panel==='settings'&&S.stab==='audio')_updateAudioSelects();
  }catch(e){}
}

async function aiCollegaPickFolder(){
  if(!window.maniac||!window.maniac.openFolder){toast('Funzione disponibile solo in app');return;}

  if(r.canceled||!r.files)return;
  S._aiCollega.scope=r.folderPath||'';
  S._aiCollega.scopeFiles=(r.files||[]).map(f=>f.path||f);
  S._aiCollega.matches=[];
  renderPanel();
}
async function aiCollegaPickFiles(){
  if(!window.maniac||!window.maniac.openFiles){
    // fallback: un solo file via dialog standard (anche openFolder filtrato)
    toast('Selezione multi-file non disponibile');return;
  }
  const r=await window.maniac.openFiles();
  if(r.canceled||!r.files)return;
  S._aiCollega.scope=(r.files[0]||'').replace(/[\\\/][^\\\/]*$/,'')+' (+'+(r.files.length-1)+')';
  S._aiCollega.scopeFiles=r.files.slice();
  S._aiCollega.matches=[];
  renderPanel();

// Auto-scan: lancia il wizard sui file dello scope con modalità face e usa
// l'entità selezionata come filtro. Per ora, in attesa di un IPC dedicato al
// matching one-shot, costruiamo una lista di candidati con score=null così
// l'utente può confermarli manualmente.
function aiCollegaScan(){
  const C=S._aiCollega; if(!C.scopeFiles.length)return;
  const sel=(S.analysisElements||[]).find(e=>e.id===C.entityId);
  if(!sel){toast('Scegli prima un\'entità');return;}
  const linked=new Set(sel.files||[]);
  C.matches=C.scopeFiles
    .filter(p=>!linked.has(p))
    .map(p=>({path:p, score:null}));
  toast('Scope pronto: '+C.matches.length+' candidati. Premi V per collegare ciascuno.');
  renderPanel();
}
function aiCollegaConfirm(idx){
  const C=S._aiCollega; const mt=C.matches[idx]; if(!mt)return;
  const sel=(S.analysisElements||[]).find(e=>e.id===C.entityId); if(!sel)return;
  sel.files=sel.files||[];
  if(!sel.files.includes(mt.path)) sel.files.push(mt.path);
  sel.updatedAt=Date.now();
  C.matches.splice(idx,1);
  _saveAnalysisHistory();
  renderPanel();
}
function aiCollegaSkip(idx){
  S._aiCollega.matches.splice(idx,1);
  renderPanel();
}
function aiCollegaConfirmAll(minScore){
  const C=S._aiCollega; const sel=(S.analysisElements||[]).find(e=>e.id===C.entityId);
  if(!sel)return;
  sel.files=sel.files||[];
  const keep=[];
  C.matches.forEach(mt=>{
    if(mt.score==null || mt.score>=(minScore||0)){
      if(!sel.files.includes(mt.path)) sel.files.push(mt.path);
    } else keep.push(mt);
  });
  C.matches=keep;
  sel.updatedAt=Date.now();
  _saveAnalysisHistory();
  renderPanel();
  toast('Collegati '+(C.scopeFiles.length-C.matches.length)+' file');
}
function aiCollegaAddManual(){
  const C=S._aiCollega; const sel=(S.analysisElements||[]).find(e=>e.id===C.entityId);
  if(!sel)return;
  sel.files=sel.files||[];
  C.scopeFiles.forEach(p=>{ if(!sel.files.includes(p)) sel.files.push(p); });
  sel.updatedAt=Date.now();
  C.matches=[]; C.scopeFiles=[]; C.scope='';
  _saveAnalysisHistory();
  renderPanel();
  toast('Aggiunti '+C.scopeFiles.length+' file all\'entità');
}

function aiClearHistory(){
  if(!confirm('Svuotare la cronologia elementi analizzati?'))return;

function _firstAvailablePlayer(){
  const n=Math.min(S.multi||1,S.players.length);
  for(let i=0;i<n;i++){
    const p=S.players[i];
    if(p&&(!p.playlist||!p.playlist.length||!p.vidEl||p.vidEl.paused&&!p.vidEl.src))return i;
  }
  return S.activePlayer||0;
}
function aiOpenElement(id,filePath){
  const el=(S.analysisElements||[]).find(e=>e.id===id);if(!el||!el.files||!el.files.length)return;
  const pid=_firstAvailablePlayer();
  const p=P(pid);if(!p)return;
  if(filePath){
    p.playlist=[{path:filePath,name:filePath.split(/[\\\/]/).pop()}];
    p.idx=0;
  }else{
    p.playlist=el.files.map(fp=>({path:fp,name:fp.split(/[\\\/]/).pop()}));

  loadFileIntoPlayer(pid);saveConfig();renderPanel();

// D4: Rinomina + ri-lookup contro il resolver universale, aggiorna foto / source / external_id.
async function _aiRenameAndRelookup(el, newName){
  if(!el||!newName)return;
  el.name=newName; el.updatedAt=Date.now();
  // Reset campi match precedenti — verranno sostituiti se il resolver risponde.
  el.photoUrl=null; el.source=null; el.external_id=null; el.metadata=null;
  _saveAnalysisHistory(); renderPanel();
  if(!window.maniac||!window.maniac.entityResolve){return;}
  const tmdbKey=(S.wizardCfg&&S.wizardCfg.tmdbKey)||'';
  const kindHint=el.kindHint||el.kind||el.type||'auto';
  const out=await window.maniac.entityResolve({name:newName, kindHint, tmdbKey});
  if(!out||!out.ok||!out.result)return;
  const r=out.result;
  el.name=r.name||el.name;
  el.photoUrl=r.photoUrl||el.photoUrl||el.thumb||null;
  el.source=r.source||null;
  el.external_id=r.external_id||null;
  el.metadata=r.metadata||null;
  el.updatedAt=Date.now();
  _saveAnalysisHistory(); renderPanel();
  toast(''+el.name+' aggiornato ('+el.source+')');
}

async function _aiEditElementApply(id){
  const el=(S.analysisElements||[]).find(e=>e.id===id); if(!el)return;
  const inp=document.getElementById('aiEditName');
  const sel=document.getElementById('aiEditKind');
  const newName=String(inp&&inp.value||'').trim();
  const newKind=sel?sel.value:null;
  if(!newName){toast('Nome obbligatorio');return;}
  // Snapshot dei valori "pre-edit" per decidere cosa è cambiato.
  const oldName=String(el.name||'').trim();
  const oldKind=el.kindHint||el.kind||'auto';
  const nameChanged=(newName!==oldName);
  const kindChanged=(newKind && newKind!==oldKind);
  // Se l'utente ha cliccato un suggerimento (typeahead) applichiamo direttamente.
  let applyPerf=null; try{ if(inp&&inp.dataset.applyPerformer) applyPerf=JSON.parse(inp.dataset.applyPerformer); }catch(_){}
  document.querySelector('.maniac-ai-edit-ov').remove();
  // Aggiorna kind sempre, anche per "performer" (che non è in resolver path) — niente rename.
  if(kindChanged){el.kindHint=newKind; el.kind=newKind;}
  if(applyPerf){
    el.name=newName;
    if(applyPerf.photo)el.photoUrl=applyPerf.photo;
    el.source=applyPerf.source||el.source;
    el.external_id=applyPerf.external_id||el.external_id;
    if(applyPerf.metadata)el.metadata=applyPerf.metadata;
    el.updatedAt=Date.now();
    _saveAnalysisHistory(); renderPanel();
    toast(''+el.name+' ('+el.source+')');
    return;
  }
  // Re-lookup SOLO se il nome è effettivamente cambiato.
  if(nameChanged){
    await _aiRenameAndRelookup(el, newName);
    return;
  }
  // Solo kind (o nessun cambio) → persisti senza chiamare il resolver (niente rename indesiderato).
  el.updatedAt=Date.now();
  _saveAnalysisHistory(); renderPanel();
  if(kindChanged) toast('Tipologia: '+newKind);
}

// Assegnazione manuale: l'utente sceglie uno o più file e li lega all'entità selezionata.
async function aiAddFilesToElement(id){
  const el=(S.analysisElements||[]).find(e=>e.id===id); if(!el){toast('Entità non trovata');return;}
  if(!window.maniac||!window.maniac.openFiles){toast('Selezione file non disponibile');return;}
  const r=await window.maniac.openFiles();
  if(!r||r.canceled||!r.files||!r.files.length)return;
  el.files=el.files||[];
  let added=0;
  r.files.forEach(p=>{
    if(!el.files.includes(p)){el.files.push(p); added++;}
  });
  if(added){
    el.updatedAt=Date.now();
    _saveAnalysisHistory();
    renderPanel();
    toast(''+added+' file aggiunti a '+el.name);
  } else {
    toast('Tutti i file selezionati erano già collegati');
  }
}

// Anteprime mancanti: per ogni download Done senza thumb e con filePath, lazy-fire
// l'estrazione di un frame con ffmpeg (cache lato main in userData/thumbnails).
// Limitiamo a 3 chiamate concorrenti per non saturare il decoder.
let _dlThumbInflight=0;
function _dlEnsureThumbnails(){
  if(!window.maniac||!window.maniac.download||!window.maniac.download.extractThumb)return;
  const list=_dlLoad();
  let touched=false;
  for(const d of list){
    if(_dlThumbInflight>=3)break;
    if(d.thumb)continue;
    if(d.status!=='Done'||!d.filePath)continue;
    if(d._thumbTried)continue;
    d._thumbTried=true; _dlThumbInflight++;
    (async()=>{
      try{
        const r=await window.maniac.download.extractThumb(d.filePath);
        if(r&&r.ok&&r.dataUrl){
          const cur=_dlLoad(); const dd=cur.find(x=>x.id===d.id);
          if(dd){dd.thumb=r.dataUrl;_dlSave(cur);if(S.panel==='downloader'){const el=document.getElementById('dlList');if(el)el.innerHTML=_dlRenderList(_dlSorted(_dlFiltered(cur)));}}
        }
      }catch(_){}
      finally{_dlThumbInflight--;}
    })();
    touched=true;
  }
  if(touched)_dlSave(list); // persiste _thumbTried
}

// ─── Sparkline velocità download (totale + per-row) ───
S._dlSpeedHist = S._dlSpeedHist || [];   // array di {ts, bps} ultimi 60 punti (1Hz)

// Asse Y deterministico: 0..50 Mb/s di default; passa a 0..100 Mb/s appena il picco supera 50.
// Valori sopra 100 Mb/s vengono clippati. Niente più auto-scale "fake".
const _DL_AXIS_LOW = 50 * 1000 * 1000;   // 50 Mb/s in bytes/sec
const _DL_AXIS_HIGH = 100 * 1000 * 1000; // 100 Mb/s
function _dlAxisCap(peak){ return peak < _DL_AXIS_LOW ? _DL_AXIS_LOW : _DL_AXIS_HIGH; }

function _drawSpeedSparkline(){
  const cv = document.getElementById('dlSpeedChart'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth || cv.width;
  const cssH = cv.clientHeight || cv.height;
  if (cv.width !== cssW * dpr) { cv.width = cssW * dpr; cv.height = cssH * dpr; ctx.scale(dpr, dpr); }
  const w = cssW, h = cssH;
  ctx.clearRect(0, 0, w, h);
  const data = S._dlSpeedHist || [];
  if (!data.length) return;
  const peak = data.reduce((m,p)=>p.bps>m?p.bps:m, 0);
  // Se non c'è alcun traffico reale, il grafico resta vuoto (niente ribbon).
  if (peak <= 0) return;
  const max = _dlAxisCap(peak);
  // Area
  ctx.fillStyle = 'rgba(123,94,167,.20)';
  ctx.beginPath(); ctx.moveTo(0, h);
  data.forEach((p, i) => {
    const x = (i / (Math.max(1, data.length - 1))) * w;
    const v = Math.min(p.bps, max);
    const y = h - (v / max) * (h - 4) - 2;
    ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  // Line
  ctx.strokeStyle = '#7B5EA7'; ctx.lineWidth = 1.5; ctx.beginPath();
  data.forEach((p, i) => {
    const x = (i / (Math.max(1, data.length - 1))) * w;
    const v = Math.min(p.bps, max);
    const y = h - (v / max) * (h - 4) - 2;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function _drawRowSparkline(canvas, hist){
  if (!canvas || !hist || !hist.length) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const peak = hist.reduce((m,b)=>b>m?b:m, 0);
  if (peak <= 0) return; // niente da disegnare
  const max = _dlAxisCap(peak);
  ctx.strokeStyle = '#7B5EA7'; ctx.lineWidth = 1.2; ctx.beginPath();
  hist.forEach((bps, i) => {
    const x = (i / (Math.max(1, hist.length - 1))) * w;
    const v = Math.min(bps, max);
    const y = h - (v / max) * (h - 2) - 1;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// Tick 1Hz: aggrega speed di tutti i download attivi in S._dlSpeedHist e
// disegna sparkline. Per-row: ogni d._speedHist (ultimi 30 punti).
let _dlSparkTimer = null;
function _dlStartSparkTimer(){
  if (_dlSparkTimer) return;
  _dlSparkTimer = setInterval(() => {
    try {
      const list = _dlLoad();
      let total = 0;
      let activeCount = 0;
      for (const d of list) {
        const isActive = d.status === 'Downloading' || d.status === 'Seeding';
        const bps = isActive ? (+d.speed || 0) : 0;
        total += bps;
        if (isActive) {
          activeCount++;
          d._speedHist = d._speedHist || [];
          d._speedHist.push(bps);
          if (d._speedHist.length > 30) d._speedHist.shift();
        }
      }
      // Se non ci sono download attivi per 3+ tick consecutivi, azzera la history
      // così il grafico non mostra "code" di sessioni precedenti.
      if (activeCount === 0) {
        window._dlIdleTicks = (window._dlIdleTicks || 0) + 1;
        if (window._dlIdleTicks >= 3) {
          S._dlSpeedHist = [];
          // Reset anche le history per-row dei download terminati
          for (const d of list) { if (d._speedHist) d._speedHist = []; }
        }
      } else {
        window._dlIdleTicks = 0;
      }
      S._dlSpeedHist.push({ ts: Date.now(), bps: total });
      if (S._dlSpeedHist.length > 60) S._dlSpeedHist.shift();
      _dlSave(list);
      if (S.panel === 'downloader') {
        _drawSpeedSparkline();
        const tot = document.getElementById('dlSpeedTotal');
        if (tot) tot.textContent = total ? (typeof fmtSpeed === 'function' ? fmtSpeed(total) : (Math.round(total/1024)+' KB/s')) : '— KB/s';
        // Per ogni canvas .dl-row-spark, ridisegna con d._speedHist
        document.querySelectorAll('.dl-row-spark[data-id]').forEach(cv => {
          const id = cv.getAttribute('data-id');
          const d = list.find(x => x.id === id);
          if (d && d._speedHist) _drawRowSparkline(cv, d._speedHist);
        });
      }
    } catch(_){}
  }, 1000);
}

function wireDownloadPanel(){
  if(!window.maniac||!window.maniac.onDownloadProgress)return;
  if(window._dlWired)return; window._dlWired=true;
  if(window.maniac.onDownloadQualityChoice){
    window.maniac.onDownloadQualityChoice(async data=>{
      const pol=await showQualityChoice(data);
      if(window.maniac.downloadPickQuality)window.maniac.downloadPickQuality(data.id,pol||{kind:'best'});
    });
  }
  window.maniac.onDownloadProgress(evt=>{
    const list=_dlLoad();
    const d=list.find(x=>x.id===evt.id);
    if(!d)return;
    if(evt.percent!=null)d.percent=evt.percent;
    if(evt.speed)d.speed=evt.speed;
    if(evt.eta)d.eta=evt.eta;
    if(evt.status)d.status=evt.status;
    if(evt.size!=null)d.size=evt.size;
    if(evt.title&&!d._titleEdited){d.title=evt.title;}
    if(evt.resolution||evt.height){d.quality=evt.resolution||(evt.height+'p');if(d.title&&!d._titleEdited&&!(d.title.includes('['+(d.quality)+']')))d.title=d.title.replace(/\s*\[\d+p?\]\s*$/,'')+' ['+d.quality+']';}
    if(evt.thumbnail)d.thumb=evt.thumbnail;
    if(evt.filePath)d.filePath=evt.filePath;
    if(evt.note!==undefined)d.note=evt.note;
    if(evt.error)d.error=evt.error;
    // F4: log errori download nel pannello Info → Logs
    if(evt.status==='Error'&&evt.error&&!d._loggedError){
      d._loggedError=true;
      try{ if(typeof logError==='function')logError('Download fallito: '+(d.title||d.url),String(evt.error).slice(0,500)); }catch(_){}
    }
    if(evt.status==='Canceled'&&!d._loggedError){
      try{ if(typeof logError==='function')logError('Download annullato: '+(d.title||d.url),''); }catch(_){}
    }
    _dlSave(list);
    if(S.panel==='downloader'){const el=document.getElementById('dlList');if(el)el.innerHTML=_dlRenderList(_dlSorted(list));}
  });
  if(window.maniac.onTorrentProgress){
    window.maniac.onTorrentProgress(evt=>{
      const list=_dlLoad();
      // Match by torId first, then id
      const d=list.find(x=>x.torId===evt.id||x.id===evt.id);
      if(!d)return;
      if(evt.percent!=null)d.percent=evt.percent*(evt.percent>1?1:100);
      if(evt.percent!=null&&evt.percent<=1)d.percent=evt.percent*100;
      if(evt.speed!=null)d.speed=evt.speed;
      if(evt.peers!=null)d.peers=evt.peers;
      if(evt.seeds!=null)d.seeds=evt.seeds;
      if(evt.trackers!=null)d.trackers=evt.trackers;
      if(evt.trackersOnline!=null)d.trackersOnline=evt.trackersOnline;
      if(evt.dhtReady!=null)d.dhtReady=!!evt.dhtReady;
      if(evt.eta!=null)d.eta=_humanEta(evt.eta);
      if(evt.length!=null)d.length=evt.length;
      if(evt.downloaded!=null)d.downloaded=evt.downloaded;
      if(evt.status)d.status=evt.status;
      if(evt.name&&!d._titleEdited)d.title=evt.name;
      if(evt.filePath)d.filePath=evt.filePath;
      if(evt.folderPath)d.folderPath=evt.folderPath;
      _dlSave(list);
      if(S.panel==='downloader'){const el=document.getElementById('dlList');if(el)el.innerHTML=_dlRenderList(_dlSorted(list));}
    });
  }
}

  const r=await window.maniac.torrentPickFile();
  if(!r||r.canceled)return;
  if(!r.success){toast('Errore: '+(r.error||''));return;}
  const cfg=_dlCfg();
  const id='tor_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const list=_dlLoad();
  list.unshift({id,url:r.name||'(torrent file)',domain:'torrent',title:r.name||'Torrent',percent:0,status:'Queued',ts:Date.now(),torrent:true});
  _dlSave(list);
  if(S.panel==='downloader')renderPanel();
  const rr=await window.maniac.torrentAddBuffer({buffer:r.buffer,outputDir:cfg.outputDir||''});
  if(rr&&!rr.ok){const l2=_dlLoad();const d=l2.find(x=>x.id===id);if(d){d.status='Error';d.error=rr.error||'';}_dlSave(l2);if(S.panel==='downloader')renderPanel();toast('Errore torrent: '+(rr.error||''));}
  else if(rr&&rr.id){const l2=_dlLoad();const d=l2.find(x=>x.id===id);if(d){d.torId=rr.id;if(rr.name)d.title=rr.name;_dlSave(l2);}}
}
async function dlStart(url, opts){
  const inp=document.getElementById('dlUrl');
  // Compat: dlStart può essere chiamato con (url) oppure (url, {auto:true})
  if (typeof url === 'object' && url !== null && !opts) { opts = url; url = undefined; }
  opts = opts || {};
  url=url||(inp&&inp.value.trim());
  if(!url){toast('Inserisci un URL');return;}
  if(!window.maniac||!window.maniac.downloadStart){toast('IPC non disponibile');return;}
  dlUpdateCfg();
  const cfg=_dlCfg();
  const isTorrent=/^magnet:/i.test(url)||/\.torrent(\?|$)/i.test(url);
  // Wizard streamingcommunity: serie → stagione → episodio (skip in modalità auto)
  if(!opts.auto && !isTorrent && /streamingcommunity|stream(ing)?community|cb01|animeworld|animeunity/i.test(url)){
    try{
      const chosen=await scStreamWizard(url);
      if(chosen===null)return; // annullato
      if(chosen&&chosen.url)url=chosen.url;
    }catch(e){}
  }
  const id=(isTorrent?'tor_':'dl_')+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  let domain='';try{domain=new URL(url).hostname.replace(/^www\./,'');}catch(e){}
  const list=_dlLoad();
  const entry={id,url,domain,title:url,percent:0,status:'Queued',ts:Date.now(),torrent:isTorrent};
  _dlImproveTitle(entry);
  list.unshift(entry);
  _dlSave(list);
  if(inp)inp.value='';
  const el=document.getElementById('dlList');if(el)el.innerHTML=_dlRenderList(_dlSorted(list));
  wireDownloadPanel();
  // Notifica visibile di avvio (user request: pop-up quando parte download)
  try{
    const active=_dlLoad().filter(x=>x.status==='Queued'||x.status==='Downloading'||x.status==='Preparing').length;
    toast(active>1?('Sto scaricando '+active+' file'):(isTorrent?'Avvio download torrent…':'Avvio download…'));
  }catch(e){}
  if(isTorrent){
    if(!window.maniac.torrentAdd){toast('Torrent engine non disponibile');return;}
    const r=await window.maniac.torrentAdd(url,cfg.outputDir||'');
    if(r&&!r.ok){
      const l2=_dlLoad();const d=l2.find(x=>x.id===id);
      if(d){d.status='Error';d.error=r.error||'';d.id=id;}
      _dlSave(l2);
      if(S.panel==='downloader')renderPanel();
      toast('Errore torrent: '+(r.error||''));
    }else if(r&&r.id){
      // Map torrent engine id back to our display id
      const l2=_dlLoad();const d=l2.find(x=>x.id===id);
      if(d){d.torId=r.id;if(r.name)d.title=r.name;_dlSave(l2);}
    }
    return;
  }
  const policy=_dlGetPolicy();
  const _cb = cfg.cookieBrowser && cfg.cookieBrowser !== 'auto' ? cfg.cookieBrowser : null;
  const r=await window.maniac.downloadStart({id,url,quality:cfg.quality,format:cfg.format,outputDir:cfg.outputDir,vibraVidPath:cfg.vibraVidPath,policy,cookieBrowser:_cb});
  if(r&&!r.success){
    const l2=_dlLoad();const d=l2.find(x=>x.id===id);
    if(d){d.status='Error';d.error=r.error||'';}
    _dlSave(l2);
    if(S.panel==='downloader')renderPanel();
    toast('Errore: '+(r.error||'yt-dlp non trovato'));
    // Auto-suggest wizard when URL was unresolvable
    const cfgW=S.downloaderCfg||{};
    const autoWiz=cfgW.autoWizardOnFail!==false;
    if(autoWiz){
      const err=(r&&r.error||'').toLowerCase();
      const unresolved=/unsupported url|no video|unable to extract|404|not found|no suitable|unsupported/i.test(err)||!err;
      if(unresolved){setTimeout(()=>{try{dlWizardOpen(url);}catch(e){}},400);}
    }
  }
}

// Rinomina inline tramite doppio click sul titolo nella lista download.
// Aggiorna sia il record (UI) sia il file fisico se già scaricato (fs.rename via IPC).
function dlRenameInline(spanEl,id){
  if(!spanEl||spanEl.querySelector('input'))return;
  const list=_dlLoad();const d=list.find(x=>x.id===id);if(!d)return;
  const cur=d.title||'';
  // Estrai estensione dal titolo (se presente) per preservarla
  const dotIdx=cur.lastIndexOf('.');
  const ext=(dotIdx>0&&dotIdx>cur.length-7)?cur.slice(dotIdx):'';
  const base=ext?cur.slice(0,-ext.length):cur;
  const inp=document.createElement('input');
  inp.type='text'; inp.value=base; inp.spellcheck=false;
  inp.style.cssText='font:inherit;color:var(--t1);background:var(--s2);border:1px solid var(--p);border-radius:4px;padding:2px 6px;width:min(60ch,80%);outline:none';
  spanEl.replaceWith(inp);
  inp.focus(); inp.select();
  let done=false;
  const finish=async (commit)=>{
    if(done)return; done=true;
    if(!commit){restore(cur);return;}
    const newBase=(inp.value||'').trim();
    if(!newBase||newBase===base){restore(cur);return;}
    const newTitle=newBase+ext;
    const oldFilePath=d.filePath||'';
    let newFilePath=oldFilePath;
    if(oldFilePath){
      // Sanifica per filesystem (solo caratteri vietati Windows)
      const safe=newTitle.replace(/[\\/:*?"<>|]/g,'_');
      const sep=oldFilePath.includes('\\')?'\\':'/';
      const dir=oldFilePath.split(sep).slice(0,-1).join(sep);
      const oldExt=oldFilePath.match(/\.[^.\\/]+$/);
      const finalName=ext?safe:safe+(oldExt?oldExt[0]:'');
      newFilePath=dir+sep+finalName;
      if(window.maniac&&window.maniac.fileRename){
        const r=await window.maniac.fileRename(oldFilePath,newFilePath);
        if(!r||!r.success){toast('Errore rinomina: '+(r&&r.error||'?'));restore(cur);return;}
      } else {
        toast('IPC rinomina non disponibile');restore(cur);return;
      }
    }
    d.title=newTitle; d._titleEdited=true;
    if(newFilePath)d.filePath=newFilePath;
    _dlSave(list);
    if(S.panel==='downloader'){const el=document.getElementById('dlList');if(el)el.innerHTML=_dlRenderList(_dlSorted(list));}
    toast('Rinominato: '+newTitle);
  };
  function restore(t){
    const sp=document.createElement('span');
    sp.className='m2-dl-titletxt';
    sp.title='Doppio click per rinominare';
    sp.textContent=t;
    sp.ondblclick=(e)=>{e.stopPropagation();dlRenameInline(sp,id);};
    inp.replaceWith(sp);
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();finish(true);}
    else if(e.key==='Escape'){e.preventDefault();finish(false);}
  });
  inp.addEventListener('blur',()=>finish(true));
}
// F4: retry come RESUME — riusa lo stesso id, passa --continue a yt-dlp
async function dlRetry(id){
  const list=_dlLoad();const d=list.find(x=>x.id===id);
  if(!d)return;
  if(d.torrent){
    // Se il torrent ha torId valido (sessione corrente) → semplice resume.
    // Altrimenti (es. dopo riavvio app), il torrent non è più nel client
    // webtorrent: lo ri-aggiungiamo dall'URL/magnet originale e resettiamo torId.
    let resumed=false;
    if(d.torId&&window.maniac&&window.maniac.torrentResume){
      try{const r=await window.maniac.torrentResume(d.torId);if(r&&r.success)resumed=true;}catch(_){}
    }
    if(!resumed){
      // Re-aggiungi: usa magnet/url originale. NB: un .torrent file caricato
      // dal disco non è ri-aggiungibile senza il file → mostriamo errore chiaro.
      const isMagnet=/^magnet:/i.test(d.url||'');
      if(isMagnet&&window.maniac&&window.maniac.torrentAdd){
        d.status='Preparing';d.error='';d.note='Ri-aggiungo torrent al client…';
        _dlSave(list);if(S.panel==='downloader')renderPanel();
        const cfg=_dlCfg();
        // Riusa la stessa cartella in cui i piece parziali sono già stati scritti.
        // Se passassimo cfg.outputDir cambiata, webtorrent non troverebbe i .part esistenti
        // e ripartirebbe da zero. d.folderPath è impostato al primo `done` dell'aggiunta.
        const outDir=d.folderPath||cfg.outputDir||'';
        const rr=await window.maniac.torrentAdd(d.url,outDir);
        if(rr&&rr.ok&&rr.id){d.torId=rr.id;d.status='Downloading';d.error='';d.note='';}
        else{d.status='Error';d.error=(rr&&rr.error)||'ri-aggiunta fallita';d.note='';}
      } else {
        d.status='Error';d.error='Sessione torrent persa. Re-importa il file .torrent dal pulsante in alto.';
      }
    } else {
      d.status='Downloading';d.error='';d.note='';
    }
    _dlSave(list);
    if(S.panel==='downloader')renderPanel();
    return;
  }
  if(!window.maniac||!window.maniac.downloadStart){toast('IPC non disponibile');return;}
  // Se l'errore precedente è extractor-obsolete o cookie-locked, forza update yt-dlp prima.
  // Evita lo stesso ciclo "Errore · Analizzo formati…" che riappare identico al retry.
  const prevErr=String(d.error||'');
  const needsUpdate=/Unable to extract|Unsupported URL|generic extractor|This website is not supported/i.test(prevErr);
  if(needsUpdate&&window.maniac&&window.maniac.downloadUpdateBin){
    d.status='Preparing';d.error='';d.note='Aggiorno yt-dlp prima del retry…';
    _dlSave(list);
    if(S.panel==='downloader')renderPanel();
    try{await window.maniac.downloadUpdateBin();}catch(_){}
  }
  d.status='Preparing';d.error='';d.note='Riprendo download…';
  _dlSave(list);
  if(S.panel==='downloader')renderPanel();
  const cfg=_dlCfg();const _cb=cfg.cookieBrowser&&cfg.cookieBrowser!=='auto'?cfg.cookieBrowser:null;
  // F: resume — passa il path file noto così yt-dlp riprende sullo stesso .part invece
  // di rigenerare un nuovo nome (probe/fetch title potrebbero differire al retry).
  const r=await window.maniac.downloadStart({
    id,url:d.url,
    quality:cfg.quality,format:cfg.format,
    outputDir:cfg.outputDir,vibraVidPath:cfg.vibraVidPath,
    cookieBrowser:_cb,resume:true,priority:d.priority||'high',
    resumeFilePath:d.filePath||null
  });
  if(r&&!r.success){
    const l2=_dlLoad();const dd=l2.find(x=>x.id===id);
    if(dd){dd.status='Error';dd.error=r.error||'';}
    _dlSave(l2);
    if(typeof logError==='function')logError('Download fallito: '+(d.title||d.url),'error: '+(r.error||'?'));
    if(S.panel==='downloader')renderPanel();
    toast('Errore: '+(r.error||'?'));
  }
}

// Riavvia download da zero: cancella il file parziale (o quello completo) e ricomincia
// senza --continue. Funziona sia per yt-dlp che per torrent (ri-aggiunge il magnet).
async function dlRestart(id){
  const list=_dlLoad();const d=list.find(x=>x.id===id);
  if(!d)return;
  const oldPath=d.filePath||'';
  if(!confirm('Riavviare il download da zero?\n\nQuesto eliminerà il file '+(oldPath?'esistente ('+oldPath.split(/[\\\/]/).pop()+')':'parziale')+' e ricomincerà dall\'inizio.'))return;
  // Se è in corso, interrompi prima
  try{
    if(d.torrent && d.torId && window.maniac && window.maniac.torrentCancel){
      await window.maniac.torrentCancel(d.torId);
    } else if(window.maniac && window.maniac.downloadCancel){
      await window.maniac.downloadCancel(id);
    }
  }catch(_){}
  // Elimina il file su disco se esiste
  if(oldPath && window.maniac && window.maniac.fileDelete){
    try{ await window.maniac.fileDelete(oldPath); }catch(_){}
  }
  // Reset stato
  d.status='Preparing';d.error='';d.note='Riavvio da zero…';
  d.progress=0;d.size=0;d.speed=0;d.eta=0;d.filePath='';d.torId=null;
  _dlSave(list);
  if(S.panel==='downloader')renderPanel();
  // Ri-avvio
  if(d.torrent){
    const isMagnet=/^magnet:/i.test(d.url||'');
    if(isMagnet && window.maniac && window.maniac.torrentAdd){
      const cfg=_dlCfg();
      const rr=await window.maniac.torrentAdd(d.url, d.folderPath||cfg.outputDir||'');
      if(rr&&rr.ok&&rr.id){d.torId=rr.id;d.status='Downloading';d.error='';d.note='';}
      else{d.status='Error';d.error=(rr&&rr.error)||'ri-aggiunta fallita';}
      _dlSave(list);
      if(S.panel==='downloader')renderPanel();
    } else {
      toast('Riavvio torrent richiede il magnet originale');
    }
    return;
  }
  if(!window.maniac||!window.maniac.downloadStart){toast('IPC non disponibile');return;}
  const cfg=_dlCfg();const _cb=cfg.cookieBrowser&&cfg.cookieBrowser!=='auto'?cfg.cookieBrowser:null;
  const r=await window.maniac.downloadStart({
    id,url:d.url,
    quality:cfg.quality,format:cfg.format,
    outputDir:cfg.outputDir,vibraVidPath:cfg.vibraVidPath,
    cookieBrowser:_cb,resume:false,priority:d.priority||'high',
    resumeFilePath:null
  });
  if(r&&!r.success){
    const l2=_dlLoad();const dd=l2.find(x=>x.id===id);
    if(dd){dd.status='Error';dd.error=r.error||'';}
    _dlSave(l2);
    if(S.panel==='downloader')renderPanel();
    toast('Errore: '+(r.error||'?'));
  }
}

// Context menu sulla riga della lista download.
// Riusa .ctx-menu per coerenza con mediaOptionsCtx (light/dark via CSS esistente).
function dlOptionsCtx(ev,id){
  if(!ev||!id)return;
  ev.preventDefault(); ev.stopPropagation();
  if(window._mediaCtxEl){_mediaCtxClose();}
  if(window._dlCtxEl){window._dlCtxEl.remove();window._dlCtxEl=null;}
  const d=_dlLoad().find(x=>x.id===id); if(!d)return;
  const items=[];
  if(d.filePath){
    items.push({label:'Apri file', click:()=>dlOpen(id)});
    items.push({label:'Apri cartella', click:()=>{try{window.maniac&&window.maniac.showInFolder&&window.maniac.showInFolder(d.filePath);}catch(_){}}});
    items.push({sep:true});
    items.push({label:'Analizza (Wizard)', click:()=>{try{S.aiPaths=[d.filePath];if(typeof openPanel==='function')openPanel('ai');}catch(_){}}});
  }
  items.push({label:'Rinomina', click:()=>dlEditTitle(id)});
  items.push({label:'Riavvia download', click:()=>dlRestart(id)});
  // Priorità banda — applica al prossimo retry/start. yt-dlp: --limit-rate
  const curPrio=d.priority||'high';
  const _prio=v=>` ${curPrio===v?'•':'  '}`;
  items.push({sep:true});
  items.push({label:`Priorità — Alta${_prio('high')}`, click:()=>dlSetPriority(id,'high')});
  items.push({label:`Priorità — Media${_prio('med')}`, click:()=>dlSetPriority(id,'med')});
  items.push({label:`Priorità — Bassa${_prio('low')}`, click:()=>dlSetPriority(id,'low')});
  items.push({sep:true});
  items.push({label:'Rimuovi da elenco', click:()=>dlRemove(id)});
  if(d.filePath) items.push({label:'Sposta nel Cestino', danger:true, click:()=>dlTrash(id)});
  const m=document.createElement('div');
  m.className='ctx-menu';
  m.style.cssText='position:fixed;z-index:99999;background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:4px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4);font:500 12px/1 \'Inter\'';
  m.innerHTML=items.map(it=>{
    if(it.sep)return '<div class="ctx-sep" style="height:1px;background:var(--bd);margin:4px 0"></div>';
    const col=it.danger?'var(--err,#e55)':'var(--t1)';
    return `<div class="ctx-item" style="padding:6px 12px;cursor:pointer;color:${col};white-space:nowrap" onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='transparent'">${it.label}</div>`;
  }).join('');
  document.body.appendChild(m);
  _clampPopover(m, ev.clientX, ev.clientY, {top:ev.clientY, bottom:ev.clientY});
  // Wire click handlers (dopo rendering)
  let idx=0;
  m.querySelectorAll('.ctx-item').forEach(el=>{
    while(items[idx]&&items[idx].sep)idx++;
    const it=items[idx++];
    if(it&&it.click)el.onclick=()=>{try{it.click();}finally{m.remove();window._dlCtxEl=null;document.removeEventListener('mousedown',_dlCtxOutside,true);}};
  });
  window._dlCtxEl=m;
  setTimeout(()=>document.addEventListener('mousedown',_dlCtxOutside,true),0);
}
function _dlCtxOutside(e){
  const m=window._dlCtxEl; if(!m)return;
  if(!m.contains(e.target)){m.remove();window._dlCtxEl=null;document.removeEventListener('mousedown',_dlCtxOutside,true);}
}
// Priorità banda per singolo download. Salvata nel record (d.priority).
// Applicata al prossimo start/retry tramite --limit-rate (yt-dlp).
//   high  → illimitato (default)
//   med   → 2M (2 MB/s)
//   low   → 500K
// Doppio click su row download → carica nel primo player libero (senza picker).
// Se non ci sono player liberi, usa il player attivo (S.activePlayer).
function dlOpenInFreePlayer(id){
  const d=_dlLoad().find(x=>x.id===id);
  if(!d||!d.filePath){toast('File non disponibile (download non completato)');return;}
  let target=null;
  for(let i=0;i<S.multi;i++){
    const p=P(i);
    if(!p||!p.playlist||!p.playlist.length){target=i;break;}
  }
  if(target==null) target=Number.isFinite(S.activePlayer)?S.activePlayer:0;
  S.activePlayer=target;
  try{closePanel&&closePanel();}catch(_){}
  if(typeof addFileByPath==='function'){
    addFileByPath(d.filePath,d.title||d.filePath.split(/[\\/]/).pop(),{playNow:true,playerId:target});
    toast('Aperto su Player '+(target+1));
  }
}

function dlSetPriority(id,prio){
  const list=_dlLoad();const d=list.find(x=>x.id===id);
  if(!d)return;
  d.priority=prio||'high'; _dlSave(list);
  toast(`Priorità impostata: ${({high:'Alta',med:'Media',low:'Bassa'})[d.priority]||d.priority}. Si applica al prossimo riavvio del download.`);
  if(S.panel==='downloader'){const el=document.getElementById('dlList');if(el)el.innerHTML=_dlRenderList(_dlSorted(_dlFiltered(list)));}
}
function _dlPriorityRateArg(prio){
  if(prio==='med') return ['--limit-rate','2M'];
  if(prio==='low') return ['--limit-rate','500K'];
  return null; // high → niente limit
}

async function dlTrash(id){
  const d=_dlLoad().find(x=>x.id===id); if(!d||!d.filePath){toast('File non disponibile');return;}
  if(!confirm('Spostare il file nel Cestino di Windows?\n\n'+d.filePath))return;
  if(!window.maniac||!window.maniac.download||!window.maniac.download.trashFile){
    toast('API cestino non disponibile'); return;
  }
  const r=await window.maniac.download.trashFile(d.filePath);
  if(r&&r.ok){ dlRemove(id); toast('File spostato nel Cestino'); }
  else toast('Errore: '+((r&&r.error)||'cestino non disponibile'));
}

// F4: pausa download yt-dlp (kill proc; riprende con --continue via dlRetry)
async function dlPause(id){
  const list=_dlLoad();const d=list.find(x=>x.id===id);
  if(!d)return;
  if(d.torrent){
    if(window.maniac&&window.maniac.torrentPause)await window.maniac.torrentPause(d.torId||id);
    d.status='Paused'; _dlSave(list);
  } else {
    if(window.maniac&&window.maniac.downloadCancel)await window.maniac.downloadCancel(id);
    d.status='Paused';d._pausedAt=Date.now();
    _dlSave(list);
  }
  if(S.panel==='downloader')renderPanel();
}

// F4: pausa/riprendi MASSIVA (dei selezionati)
function dlPauseSelected(){
  const list=_dlLoad();
  let n=0;
  list.forEach(d=>{
    if(d._sel&&(d.status==='Downloading'||d.status==='Seeding'||d.status==='Queued'||d.status==='Preparing')){
      dlPause(d.id);n++;
    }
  });
  toast(n?(n+' download in pausa'):'Nessun download selezionato attivo');
}
function dlResumeSelected(){
  const list=_dlLoad();
  let n=0;
  list.forEach(d=>{
    if(d._sel&&(d.status==='Paused'||d.status==='Error'||d.status==='Canceled')){
      dlRetry(d.id);n++;
    }
  });
  toast(n?(n+' download ripresi'):'Nessun download selezionato in pausa');
}
function dlToggleSelect(id){
  const list=_dlLoad();const d=list.find(x=>x.id===id);
  if(!d)return;

// G3: open completed download in player
async function dlOpen(id){
  const list=_dlLoad();const d=list.find(x=>x.id===id);
  if(!d||!d.filePath){toast('Percorso non disponibile');return;}
  // Rispetta il lock utente (S.activePlayer): se è valido, usa quello senza chiedere.
  // Solo se non è valido cerchiamo un player vuoto / mostriamo il picker.
  const _lockedT=(Number.isFinite(S.activePlayer)&&S.activePlayer>=0&&S.activePlayer<S.multi)?S.activePlayer:null;
  let target=_lockedT;
  if(target==null){
    if(S.multi>1){
      const pick=await _dlPickPlayer();
      if(pick===null)return;
      target=pick;
    }else{
      target=0;
      for(let i=0;i<S.multi;i++){if(P(i)&&P(i).playlist.length===0){target=i;break;}}
    }
  }
  S.activePlayer=target;
  try{closePanel&&closePanel();}catch(e){}
  S.panel=null;try{renderPanel&&renderPanel();}catch(e){}
  addFileByPath(d.filePath,d.title||d.filePath.split(/[\\/]/).pop(),{playNow:true,playerId:target});

}
