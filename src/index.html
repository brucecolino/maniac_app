<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maniac</title>
<link rel="icon" href="../assets/maniac_logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="locales/i18n.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* === Maniac 2.0 design tokens (allineati a design/mockups.html) === */
  --bg-base:#0A0A0F;--bg-elev-1:#14141C;--bg-elev-2:#1C1C27;--bg-elev-3:#262632;
  --stroke:#2E2E3D;--stroke-soft:rgba(255,255,255,.06);
  --text-1:#F2F2F5;--text-2:#A0A0B3;--text-3:#60607A;
  --accent:#8B6FD1;--accent-hi:#A68FE0;
  --accent-tint:rgba(139,111,209,.12);--accent-glow:rgba(139,111,209,.22);
  --success:#3FB883;--danger:#E05565;--warn:#E0B24C;
  --r-sm:8px;--r-md:14px;
  --sh-card:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.3);
  --sh-modal:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;

  /* === Alias retro-compat (mantiene tutto il CSS esistente) === */
  --bg:var(--bg-base);
  --s1:var(--bg-elev-1);--s2:var(--bg-elev-2);--s3:var(--bg-elev-3);
  --t1:var(--text-1);--t2:var(--text-2);--t3:var(--text-3);
  --bd:var(--stroke);
  --p:var(--accent);--pl:var(--accent-hi);
  --pg:var(--accent-glow);--pd:var(--accent-tint);
  --ac:var(--accent-hi);--ok:var(--success);--err:var(--danger);
  --vbg:#06060B;

  /* Altezze/spaziature/font scale */
  --h-btn:32px;--h-input:32px;--h-chip:32px;--h-switch:20px;
  --radius-sm:8px;--radius-md:14px;--radius-lg:18px;
  --gap-xs:4px;--gap-sm:6px;--gap-md:10px;--gap-lg:16px;
  --fs-xs:10px;--fs-sm:11px;--fs-md:12px;--fs-lg:13px;--fs-xl:16px;--fs-2xl:20px;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Inter',monospace;
  --icon-sm:12px;--icon-md:16px;--icon-lg:22px;--icon-xl:32px;
}
/* Font unificato su tutta l'app: stesso family ovunque, scale predefinite */
html,body,button,input,select,textarea,.sp,.vc,.wiz,.mdl,.ctx,.toast,.pb,.ball-pick-lg,div,span,p,h1,h2,h3,h4,h5,h6,label,li,a,pre,code{font-family:var(--font-ui)!important}

/* ════════════════════════════════════════════════════════════════
   MANIAC 2.0 — Primitives (override coerente con design/mockups.html)
   ════════════════════════════════════════════════════════════════ */
.m2-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--r-sm);background:var(--bg-elev-2);color:var(--text-1);border:1px solid var(--stroke);font:500 13px/1 'Inter';cursor:pointer;transition:background .15s,border-color .15s}
.m2-btn:hover{background:var(--bg-elev-3)}
.m2-btn.sm{height:28px;padding:0 10px;font-size:12px}
.m2-btn.lg{height:40px;padding:0 18px}
.m2-btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 4px 12px rgba(139,111,209,.25)}
.m2-btn.primary:hover{background:var(--accent-hi)}
.m2-btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.m2-btn.ghost:hover{background:var(--bg-elev-2);color:var(--text-1)}
.m2-btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.m2-btn.danger:hover{filter:brightness(1.08)}
.m2-btn.icon{width:32px;padding:0}
.m2-btn.icon.sm{width:28px}

.m2-seg{display:inline-flex;align-items:center;padding:2px;background:var(--bg-elev-2);border:1px solid var(--stroke);border-radius:10px;gap:2px;height:32px;box-sizing:border-box}
.m2-seg>button{height:26px;padding:0 12px;border:0;background:transparent;color:var(--text-2);font:500 12px 'Inter';border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s}
.m2-seg>button:hover{color:var(--text-1)}
.m2-seg>button.on{background:var(--accent-tint);color:var(--accent-hi);box-shadow:0 0 0 1px var(--accent-hi) inset}

.m2-sw{width:36px;height:20px;border-radius:999px;background:var(--bg-elev-3);position:relative;cursor:pointer;transition:background .15s;display:inline-block;flex-shrink:0;border:0;padding:0}
.m2-sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.m2-sw.on{background:var(--accent)}
.m2-sw.on::after{left:18px}

.m2-micro,.section-label{font:700 10px/1.2 'Inter';letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.section-label{margin:14px 0 6px;display:block}
.m2-micro.accent{color:var(--accent)}

/* Override globali sulle classi LEGACY per allinearle al look 2.0 */
body{background:var(--bg-base);color:var(--text-1)}
.tb{background:rgba(10,10,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--stroke);height:40px;padding:0 12px}
.mb>button{height:28px;padding:0 10px;font:500 13px/1 'Inter';border-radius:6px;color:var(--text-2)}
.mb>button:hover,.mb>button.on{background:var(--bg-elev-2);color:var(--text-1)}
.dd{background:var(--bg-elev-1);border:1px solid var(--stroke);border-radius:var(--r-sm);box-shadow:var(--sh-modal);padding:6px 0}
.dd-item{padding:8px 14px;font-size:13px;color:var(--text-1);gap:10px}
.dd-item:hover{background:var(--bg-elev-2)}
.dd-item.danger{color:var(--danger)}
.dd-sep{background:var(--stroke);margin:6px 8px}
.tb-r{gap:4px;padding-right:0}
.ib{width:32px;height:28px;color:var(--text-2);border-radius:6px}
.ib:hover{background:var(--bg-elev-2);color:var(--text-1)}
.ib.on{background:var(--accent-tint);color:var(--accent-hi)}
.wctrl{height:40px;margin-left:8px;gap:0}
.wctrl button{width:38px;height:40px;color:var(--text-3)}
.wctrl button:hover{background:var(--bg-elev-2);color:var(--text-1)}
.wctrl button.close:hover{background:var(--danger);color:#fff}
.logo{margin-right:14px;gap:8px}
.logo-box{width:24px;height:24px;border-radius:7px}
.logo-box::after{display:none}
.logo-txt{display:none}

/* Controlli unificati — altezze/padding/radius */
.mdl-btn,.ai-btn,.reset-btn,.wiz-btn{height:var(--h-btn);padding:0 14px;border-radius:var(--radius-sm);font:600 var(--fs-sm)/1 'Inter';display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box}
.pl-pchip{height:var(--h-chip);padding:0 10px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;gap:4px;box-sizing:border-box}
.pl-pswitch{display:flex;gap:var(--gap-xs)}
.pl-pswitch button{height:var(--h-chip)}
/* text inputs + select */
.m-input,.sp-body input[type=text]:not(.clr-hex):not(.tag-hex-input),.sp-body select{height:var(--h-input);padding:0 10px;border-radius:var(--radius-sm);border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:400 var(--fs-sm)/1 'Inter';box-sizing:border-box;outline:0}
.sp-body select{padding-right:28px}
/* Search bar component */
.m-search{position:relative;display:flex;align-items:center;height:var(--h-input)}
/* sp-hdr-row: tutti i bottoni allineati alla stessa altezza var(--h-input) */
.sp-hdr-row>*{align-self:center}
.sp-hdr-row .m-search{flex:1;min-width:0}
.sp-hdr-row .icon-btn,.sp-hdr-row button.reset-btn,.sp-hdr-row .ib{height:var(--h-input)!important;min-height:var(--h-input)!important;box-sizing:border-box;margin:0!important}
.m-search svg.m-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t3);pointer-events:none}
.m-search input{width:100%;height:var(--h-input);padding:0 10px 0 30px;border-radius:var(--radius-sm);border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:400 var(--fs-sm)/1 'Inter';box-sizing:border-box;outline:0}
.m-search input:focus{border-color:var(--p)}
/* Player balls selector (sostituisce chip P1..P4) */
.pb-row{display:flex;gap:var(--gap-xs);align-items:center}
.pb{width:var(--h-chip);height:var(--h-chip);padding:0;border:1px solid var(--bd);background:var(--s2);border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.pb:hover{background:var(--pd);border-color:var(--p)}
.pb.on{background:var(--pd);border-color:var(--p)}
.pb svg{width:18px;height:18px}
.pb circle{fill:var(--t3);transition:fill .12s}
.pb.on circle.on{fill:var(--p)}
.pb.on circle.off{fill:var(--t3)}
.pb-lg{width:64px;height:64px;border-radius:10px}
.pb-lg svg{width:46px;height:46px}
.pb-lg circle{r:7!important}
.pb-row-lg{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 0}
.pb-lg-lbl{font:600 var(--fs-xs)/1 var(--font-ui);color:var(--t3);margin-top:4px;text-align:center}
.pb-lg-wrap{display:inline-flex;flex-direction:column;align-items:center}
.pb .pb-lbl{position:absolute;font:700 8px/1 'JetBrains Mono',monospace;color:transparent}
/* ═══ v2: Single-button Player Cycle (all → p1 → ... → p4 → all) ═══ */
.pcyc{width:var(--h-chip);height:var(--h-chip);padding:0;border:1px solid var(--bd);background:var(--s2);border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.pcyc:hover{background:var(--pd);border-color:var(--p)}
.pcyc.on{background:var(--pd);border-color:var(--p)}
.pcyc svg{width:18px;height:18px;display:block}
.pcyc .d{fill:var(--t3);opacity:.55;transition:fill .15s,opacity .15s}
.pcyc .d.on{fill:var(--p);opacity:1}
.pcyc.p0 .d{fill:var(--p);opacity:.45}
.pcyc.p0:hover .d{opacity:.7}
.pcyc-wrap{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;flex-shrink:0;min-width:54px}
.pcyc-lbl{font:700 var(--fs-xs)/1 var(--font-ui);color:var(--t3);letter-spacing:.04em;min-width:24px;text-align:left}
.pcyc-wrap.on .pcyc-lbl{color:var(--p)}
/* Maniac icon (Streamline) inline */
.mi{display:inline-block;vertical-align:-2px;width:14px;height:14px;flex-shrink:0;object-fit:contain;pointer-events:none}
.mi-sm{width:12px;height:12px;vertical-align:-1px}
.mi-lg{width:18px;height:18px;vertical-align:-4px}
.mi-xl{width:22px;height:22px;vertical-align:-5px}
[data-theme="light"]{
  --bg-base:#F6F5F9;--bg-elev-1:#FFFFFF;--bg-elev-2:#F0EDF4;--bg-elev-3:#E6E1EC;
  --stroke:#DCD6E3;--stroke-soft:rgba(0,0,0,.05);
  --text-1:#1A1A2E;--text-2:#5B5B75;--text-3:#8A8AA0;
  --accent:#7B5EA7;--accent-hi:#6B4E97;
  --accent-tint:rgba(123,94,167,.10);--accent-glow:rgba(123,94,167,.18);
  --vbg:#EDEAF1;
  --sh-card:0 1px 0 rgba(255,255,255,.6) inset,0 1px 2px rgba(0,0,0,.06);
  --sh-modal:0 30px 70px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04) inset;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);overflow:hidden;height:100vh;font-size:13px;user-select:none;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--p)}

.app{display:flex;flex-direction:column;height:100vh}

/* ═══ TITLEBAR ═══ */
.tb{height:34px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 0 0 12px;flex-shrink:0;-webkit-app-region:drag}
.tb *{-webkit-app-region:no-drag}
.logo{display:flex;align-items:center;gap:10px;margin-right:16px}
.logo-box{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:7px;position:relative}
.logo-box::after{content:"";position:absolute;inset:-2px;border-radius:9px;box-shadow:0 0 0 1px rgba(123,94,167,.35),0 0 10px rgba(123,94,167,.25);pointer-events:none}
.logo-box img{width:100%;height:100%;object-fit:contain;display:block;position:relative;z-index:1}
.logo-txt{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--p);text-shadow:0 0 12px rgba(123,94,167,.4);text-transform:uppercase}

.mb{position:relative}
.mb>button{background:0;border:0;color:var(--t2);font:500 12px/1 'Inter',sans-serif;padding:6px 12px;border-radius:4px;cursor:pointer;transition:all .15s}
.mb>button:hover,.mb>button.on{background:var(--pd);color:var(--pl)}
.dd{position:absolute;top:100%;left:0;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:4px 0;min-width:220px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;margin-top:2px}
.dd.show{display:block}
.dd-item{padding:8px 14px;font-size:12px;color:var(--t1);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s}
.dd-item:hover{background:var(--pd)}
.dd-item svg{width:14px;height:14px;color:var(--t3);flex-shrink:0}
.dd-sep{height:1px;background:var(--bd);margin:4px 8px}
.dd-item.danger{color:var(--err)}
.dd-item.danger svg{color:var(--err)}
.dd-item.has-sub{position:relative}
.dd-item.has-sub>.dd-arr{margin-left:auto;opacity:.6;font-size:10px}

/* Per-player playlist (side drawer on left of player) */
.vc-pl-drawer{position:absolute;top:0;left:0;bottom:44px;width:280px;background:var(--s1);border-right:1px solid var(--bd);box-shadow:4px 0 18px rgba(0,0,0,.4);z-index:30;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .2s cubic-bezier(.4,0,.2,1)}
.vc-pl-drawer.open{transform:translateX(0)}
.vc-pl-drawer-head{padding:10px 12px;font:700 11px/1 'Inter';color:var(--p);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.06em}
.vc-pl-drawer-body{flex:1;overflow-y:auto;padding:4px}
.vc-pl-drawer .pl-item{padding:7px 8px;font-size:11px}
.vc.multi .vc-pl-drawer{width:220px;bottom:38px}
.vc.cinema .vc-pl-drawer{display:none}

/* Cinema mode (YouTube-style): player maximized, panels hidden */
body.cinema-mode .sp,body.cinema-mode .sp.open{transform:translate3d(-100%,0,0)!important;visibility:hidden!important;pointer-events:none!important}
/* Downloader FDM-style fullscreen takeover */
body.downloader-mode .vg{display:none!important}
body.downloader-mode .sp.open{width:100%!important;max-width:100%!important;right:0;left:0;position:absolute;inset:0;z-index:60}
.vc.cinema:not(.cinema-multi){position:fixed!important;inset:34px 0 0 0!important;z-index:200;background:#000}
/* Cinema in multi: NON fullscreen, mantiene layout griglia, nasconde solo i controlli del singolo video */
.vc.cinema.cinema-multi{position:relative!important;inset:auto!important;z-index:auto!important}
.vc.cinema.cinema-multi .vc-controls{opacity:0;transition:opacity .2s;pointer-events:none;position:absolute;left:0;right:0;bottom:0;z-index:5}
.vc.cinema.cinema-multi.cinema-hover-bottom .vc-controls{opacity:1;pointer-events:auto}
.vc.cinema:not(.cinema-multi) .vc-controls{opacity:0;transition:opacity .2s;pointer-events:none}
.vc.cinema:not(.cinema-multi).cinema-hover-bottom .vc-controls{opacity:1;pointer-events:auto}
/* T7: Hide decorative icons (menus, dropdowns, side panels) — keep functional player control glyphs */
.mb .dd-item svg{display:none!important}
.dd-item{gap:0!important}
.wctrl button svg{display:none!important}
.wctrl button::before{font:600 12px/1 'JetBrains Mono',monospace;color:currentColor}
.wctrl button:nth-child(1)::before{content:"\2014"}
.wctrl button:nth-child(2)::before{content:"\25A2"}
.wctrl button.close::before{content:"\2715"}
/* T9: clickable log entries */
.log-item{cursor:pointer}
.log-item pre.log-stack{display:none;white-space:pre-wrap;font:400 10px/1.3 'JetBrains Mono',monospace;color:var(--t2);background:var(--s1);border:1px solid var(--bd);border-radius:4px;padding:6px 8px;margin-top:6px;max-height:200px;overflow:auto}
.log-item.open pre.log-stack{display:block}

.tb-r{margin-left:auto;display:flex;align-items:center;height:100%}
.ib{background:0;border:0;color:var(--t3);width:32px;height:28px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin:0 1px}
.ib:hover{color:var(--pl);background:var(--pd)}
.ib.on{background:var(--pd);color:var(--p)}

/* Window controls Windows-style */
.wctrl{display:flex;margin-left:6px;height:34px}
.wctrl button{width:46px;height:34px;background:0;border:0;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.wctrl button:hover{background:var(--s3)}
.wctrl button.close:hover{background:#E81123;color:#fff}
.wctrl svg{width:10px;height:10px}

/* ═══ MAIN ═══ */
.main{flex:1;display:flex;overflow:hidden;position:relative}
.player-area{flex:1;display:flex;flex-direction:column;min-width:0}

.vg{flex:1;display:grid;gap:1px;background:var(--bd);position:relative;min-height:0;contain:layout paint;transform:translateZ(0)}
.vg[data-v="1"]{grid-template-columns:1fr}
.vg[data-v="2"]{grid-template-columns:1fr 1fr}
.vg[data-v="3"]{grid-template-columns:1fr 1fr 1fr}
.vg[data-v="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

.vc{background:var(--vbg);display:flex;flex-direction:column;position:relative;overflow:hidden;min-width:0;min-height:0;contain:layout paint;transform:translateZ(0)}
.vc .video-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
.vc video{width:100%;height:100%;object-fit:contain;display:block;background:#000;transform:translateZ(0);backface-visibility:hidden}
[data-theme="light"] .vc video{background:var(--s1)}
.vc .ph{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.75;transition:opacity .3s}
.ph-open{background:var(--p);border:0;color:#fff;padding:6px 14px;border-radius:6px;font:600 11px/1 'Inter';cursor:pointer}
.ph-open.ghost{background:transparent;border:1px solid var(--bd);color:var(--t2)}
.ph-open:hover{filter:brightness(1.15)}
.vg.dragover .vc .ph{opacity:.8}
.cell-badge{position:absolute;top:8px;left:8px;background:var(--p);color:#fff;font:700 10px/1 'Inter';padding:2px 8px;border-radius:3px;z-index:2}
.drag-ov{position:absolute;inset:0;background:rgba(123,94,167,.06);border:2px dashed var(--p);pointer-events:none;z-index:5;display:none}
.vg.dragover .drag-ov{display:block}

/* Per-cell controls wrapper: thin purple seek line above + toolbar below */
.vc-controls{display:flex;flex-direction:column;flex-shrink:0;position:relative}
.vc-progress{height:5px;background:rgba(123,94,167,.18);cursor:pointer;position:relative;border-radius:0;flex-shrink:0;border-top:1px solid var(--bd);transition:height .12s}
.vc-progress:hover{height:7px}
.vc-pf{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--pl));box-shadow:0 0 6px rgba(123,94,167,.55);pointer-events:none;position:absolute;top:0;left:0}
.vc-pthumb{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px var(--p),0 2px 6px rgba(0,0,0,.4);opacity:0;transition:opacity .12s;left:0;z-index:3}
.vc-progress:hover .vc-pthumb{opacity:1}
.vc-tip{position:absolute;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.22);padding:0;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .1s;z-index:20;overflow:hidden;line-height:0}
.vc-tip canvas{display:block;width:140px;height:80px;background:#000}
.vc-tip-t{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font:600 10px/1 'JetBrains Mono',monospace;color:#fff;padding:2px 6px;background:rgba(0,0,0,.55);border-radius:3px;line-height:1.2}

.vol-overlay{position:fixed;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.vol-overlay.show{opacity:1}
.vol-bar{width:60px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.vol-fill{height:100%;background:var(--p);border-radius:2px;transition:width .1s}
.vol-pct{font:700 11px/1 'JetBrains Mono',monospace;color:var(--p);min-width:28px}

/* ═══ EQ BAR ═══ */
.eq{background:var(--s1);border-top:1px solid var(--bd);padding:14px 24px;display:none;align-items:center;gap:28px;justify-content:center}
.eq.show{display:flex}
.eq-knobs{display:flex;gap:22px;align-items:center}
.knob-g{display:flex;flex-direction:column;align-items:center;gap:3px}
.knob-lbl{font:600 9px/1 'Inter';color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.knob-val{font:700 10px/1 'JetBrains Mono',monospace}
/* ═══ BOTTOM CONTROLS ═══ */
.main-progress{position:relative;z-index:10;height:6px;background:rgba(123,94,167,.15);cursor:pointer;flex-shrink:0;border-top:1px solid var(--bd)}
.main-progress:hover .mp-thumb{opacity:1}
.mp-tip{position:absolute;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.22);padding:0;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .1s;z-index:20;overflow:hidden;line-height:0}
.mp-tip canvas{display:block;width:180px;height:102px;background:#000}
.mp-tip-t{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font:600 11px/1 'JetBrains Mono',monospace;color:#fff;padding:2px 7px;background:rgba(0,0,0,.55);border-radius:3px;text-shadow:0 1px 2px rgba(0,0,0,.9);line-height:1.2}
.main-pb{position:absolute;inset:0;background:rgba(255,255,255,.06)}
.main-pf{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,var(--p),var(--pl));box-shadow:0 0 8px rgba(123,94,167,.55);border-radius:0 2px 2px 0;will-change:width;pointer-events:none}
.main-pb-buf{position:absolute;top:0;bottom:0;left:0;width:0;background:rgba(255,255,255,.12)}
.mp-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--p),0 2px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
.main-progress.live{cursor:default;opacity:.5}
.main-progress.live .mp-thumb{display:none}
[data-theme="light"] .vc-progress{background:rgba(123,94,167,.18)}
[data-theme="light"] .vc-vol-bar{background:rgba(0,0,0,.14)}
[data-theme="light"] .pl-pchip{background:#F0EDF4;border-color:#C4BAD0;color:#3A3A4A}
[data-theme="light"] .pl-pchip:hover{background:#E4DEEC;color:#1A1A2E}
[data-theme="light"] .sg-lbl{color:#6B6B80}
[data-theme="light"] .ctx-tag{box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

/* Themed color picker (swatch + popover) */
.clr-sw{display:inline-block;width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex-shrink:0;transition:transform .12s,border-color .12s}
.clr-sw:hover{transform:scale(1.06);border-color:var(--p)}
[data-theme="light"] .clr-sw{box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.clr-pop{position:fixed;z-index:3000;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);width:232px;opacity:0;transform:translateY(-4px);transition:opacity .12s,transform .12s;pointer-events:none}
.clr-pop.show{opacity:1;transform:translateY(0);pointer-events:auto}
.clr-pop .clr-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:10px}
.clr-pop .clr-grid .tag-sw{width:100%;aspect-ratio:1}
.clr-pop .clr-row{display:flex;align-items:center;gap:8px}
.clr-pop .clr-prev{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.clr-pop .clr-hash{font:700 11px/1 'JetBrains Mono',monospace;color:var(--t3)}
.clr-pop .clr-hex{flex:1;min-width:0;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;outline:none}
.clr-pop .clr-hex:focus{border-color:var(--p)}
.bot{height:54px;background:var(--s1);border-top:0;display:flex;align-items:center;padding:0 16px;gap:6px;flex-shrink:0}
.transport{display:flex;align-items:center;gap:4px}
.cb{background:0;border:0;color:var(--t2);width:34px;height:34px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cb:hover{color:var(--pl);background:var(--pd)}
.cb.play{background:var(--p);color:#fff;width:40px;height:40px;border-radius:10px;box-shadow:0 2px 14px rgba(123,94,167,.3)}
.cb.play:hover{filter:brightness(1.15)}
.vol-g{display:flex;align-items:center;gap:6px;margin-left:14px}
.vol-g svg{color:var(--t3);flex-shrink:0;cursor:pointer}
.vol-v{font:400 10px/1 'JetBrains Mono',monospace;color:var(--t3);width:30px}
input[type=range]{-webkit-appearance:none;height:3px;background:var(--s3);border-radius:2px;outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--p);cursor:pointer}
.spacer{flex:1}
.rc{display:flex;align-items:center;gap:4px}
.tb-btn{background:0;border:0;color:var(--t3);width:32px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tb-btn:hover{color:var(--pl);background:var(--pd)}
.tb-btn.on{background:var(--pd);color:var(--p)}
/* C3: SVG e testo dentro i bottoni transport hanno dimensioni uniformi e centrati */
.tb-btn svg{width:18px;height:18px;display:block;margin:auto}
.tb-btn .tb-label{font:700 11px/18px 'Inter',sans-serif;height:18px;display:flex;align-items:center;justify-content:center;white-space:nowrap}

/* ═══ SIDE PANEL (transform-based: nessun reflow della griglia, no flicker) ═══ */
.sp{position:absolute;top:0;left:0;bottom:0;width:440px;background:var(--s1);border-right:1px solid var(--bd);overflow:hidden;z-index:50;display:flex;flex-direction:column;transform:translate3d(-100%,0,0);transition:transform .24s cubic-bezier(.4,0,.2,1);will-change:transform;contain:layout paint style;isolation:isolate;visibility:hidden;pointer-events:none}
.sp.open{transform:translate3d(0,0,0);visibility:visible;pointer-events:auto}
.sp-head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sp-title{font:700 12px/1 'Inter';text-transform:uppercase;letter-spacing:.06em;color:var(--p)}
.sp-close{background:0;border:0;color:var(--t3);cursor:pointer;padding:4px;display:flex}
.sp-close:hover{color:var(--p)}
.sp-body{flex:1;overflow-y:auto;padding:12px;scrollbar-gutter:stable}
#spContent{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* Playlist items */
.pl-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:all .15s;display:flex;align-items:center;gap:10px}
.pl-item:hover{background:var(--s2)}
.pl-item.active{background:var(--pd);border-color:rgba(123,94,167,.2)}
.pl-thumb{width:48px;height:28px;background:var(--s3);border-radius:4px;flex-shrink:0;display:none;overflow:hidden;position:relative}
.pl-thumb.show{display:block}
.pl-thumb video,.pl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pl-info{flex:1;min-width:0}
.pl-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item.active .pl-name{font-weight:600;color:var(--p)}
.pl-dur{font:400 10px/1 'JetBrains Mono',monospace;color:var(--t3);margin-top:2px}
.pl-tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:8px;padding:1px 6px;border-radius:3px;font-weight:600;display:inline-block}

.thumb-toggle{display:flex;align-items:center;gap:var(--gap-md);padding:8px 12px;border-bottom:1px solid var(--bd);margin-bottom:8px;height:var(--h-chip);box-sizing:content-box}
.thumb-toggle span{font:600 10px/1 'Inter';color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.thumb-toggle .icon-btn{margin:0!important;width:var(--h-input)!important;height:var(--h-input)!important}
.thumb-toggle .sw{margin:0;align-self:center}

.sw{width:36px;height:20px;border-radius:10px;background:var(--s3);cursor:pointer;position:relative;transition:background .2s;border:1px solid var(--bd);flex-shrink:0}
.sw.on{background:var(--p);border-color:var(--p)}
.sw .dot{width:14px;height:14px;border-radius:50%;background:var(--t3);position:absolute;top:2px;left:2px;transition:left .2s,background .2s}
.sw.on .dot{left:19px;background:#fff}

/* Settings */
.stab-btn{background:var(--s2);border:1px solid transparent;color:var(--t2);padding:8px 14px;border-radius:8px;cursor:pointer;font:600 var(--fs-md)/1 var(--font-ui);transition:all .15s}
.stab-btn:hover{background:var(--s2);color:var(--t1);border-color:var(--bd)}
.stab-btn.on{background:var(--pd);color:var(--p);border-color:rgba(123,94,167,.2)}
.st-body{flex:1;overflow-y:auto;padding:14px;scrollbar-gutter:stable;animation:tabFade .18s ease-out}
@keyframes tabFade{from{opacity:0}to{opacity:1}}
.sg{margin-bottom:18px}
.sg-lbl{font:700 10px/1 'Inter';color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sg-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sg-txt{font-size:11px;color:var(--t2)}
select{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:400 11px/1 'Inter';outline:0;cursor:pointer}
.sl-row{display:flex;align-items:center;gap:8px}
.sl-row input[type=range]{flex:1}
.sl-v{font:400 11px/1 'JetBrains Mono',monospace;color:var(--p);width:42px;text-align:right}
.theme-btns{display:flex;gap:8px}
.theme-btn{flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);cursor:pointer;font:600 11px/1 'Inter';display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.theme-btn.on{border:2px solid var(--p);background:var(--pd);color:var(--p)}
.reset-btn{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:7px 14px;border-radius:6px;cursor:pointer;font:600 11px/1 'Inter';margin-top:6px}
.seg{display:flex;gap:0;background:var(--s2);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.seg-b{flex:1;padding:8px 10px;background:0;border:0;color:var(--t2);font:600 11px/1 'Inter';cursor:pointer;transition:all .12s}
.seg-b:hover{color:var(--t1)}
.seg-b.on{background:var(--p);color:#fff}
.meter{position:relative;height:12px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#4ade80 0%,#facc15 70%,#ef4444 100%);will-change:width;contain:layout paint size}
.meter{contain:layout paint style;isolation:isolate;overflow:hidden}
.meter-gate{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--p);box-shadow:0 0 4px var(--p)}
.reset-btn:hover{background:var(--p);color:#fff;border-color:var(--p)}
.sc-hdr{display:grid;grid-template-columns:1fr 100px;padding:5px 8px;font:700 10px/1 'Inter';color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.sc-row{display:grid;grid-template-columns:1fr 100px;padding:7px 8px;border-radius:4px;font-size:11px;align-items:center;transition:background .15s}
.sc-row:hover{background:var(--s2)}
.sc-key{background:var(--s3);border:1px solid var(--bd);color:var(--t2);padding:3px 8px;border-radius:4px;cursor:pointer;font:400 10px/1 'JetBrains Mono',monospace;text-align:center;transition:all .15s;outline:0}
.sc-key:hover,.sc-key:focus{border-color:var(--p);color:var(--p)}

.ai-box{background:var(--pd);border:1px solid rgba(123,94,167,.2);border-radius:8px;padding:12px;margin-bottom:14px}
.ai-box h4{font:600 11px/1 'Inter';color:var(--pl);margin-bottom:6px}
.ai-box p{font-size:10px;color:var(--t2);line-height:1.6}
.ai-btn{width:100%;padding:11px 14px;border-radius:8px;background:var(--p);border:0;color:#fff;font:700 12px/1 'Inter';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 14px rgba(123,94,167,.3);margin-bottom:14px}
.ai-btn:hover{filter:brightness(1.1)}

.info-section{padding:16px;display:flex;flex-direction:column;gap:12px}
.info-ver{text-align:center;padding:16px 0}
.info-ver .v{font:800 24px/1 'JetBrains Mono',monospace;color:var(--p);margin-bottom:4px}
.info-ver .sub{font:400 11px/1 'Inter';color:var(--t3)}
.info-btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:600 12px/1 'Inter';cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s}
.info-btn:hover{background:var(--pd);border-color:var(--p)}
.info-btn svg{color:var(--p);width:18px;height:18px;flex-shrink:0}

.ctx{position:fixed;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:4px 0;min-width:200px;z-index:10000;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none}
.ctx.show{display:block}
.ctx-item{padding:7px 14px;font-size:12px;color:var(--t1);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
.ctx-item:hover{background:var(--pd)}
.ctx-item.danger{color:#E05565}
.ctx-item.has-sub{position:relative}
.ctx-arr{margin-left:auto;opacity:.6;font-size:10px}
.ctx-sub{position:fixed;z-index:10000;min-width:200px}
.ctx-sep{height:1px;background:var(--bd);margin:4px 8px}
.ctx-label{font:600 10px/1 'Inter';color:var(--t3);text-transform:uppercase;letter-spacing:.05em;padding:6px 14px 3px}
.ctx-tag{display:inline-block;width:12px;height:12px;border-radius:3px;flex-shrink:0}

/* Tag color palette */
.tag-sw-grid{display:grid;grid-template-columns:repeat(8,18px);gap:4px;margin-bottom:8px;justify-content:start}
.tag-sw-grid .tag-sw{width:18px;height:18px;aspect-ratio:auto}
.tag-sw{width:100%;aspect-ratio:1;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tag-sw:hover{transform:scale(1.12)}
.tag-sw.sel{border-color:var(--p);box-shadow:0 0 0 2px var(--p),inset 0 0 0 1px rgba(255,255,255,.3)}
.tag-custom-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px}
.tag-color-preview{display:inline-block;width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);flex-shrink:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tag-hex-input{flex:1;min-width:0;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s3);color:var(--t1);font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;outline:none}
.tag-hex-input:focus{border-color:var(--p)}
.tag-hex-prefix{font:700 11px/1 'JetBrains Mono',monospace;color:var(--t3)}

/* Themed confirm modal */
.mdl-ov{position:fixed;inset:0;background:rgba(5,5,10,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:10050;opacity:0;pointer-events:none;transition:opacity .18s}
.mdl-ov.show{opacity:1;pointer-events:auto}
.mdl{background:var(--s1);border:1px solid var(--bd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(123,94,167,.15);min-width:340px;max-width:440px;padding:22px 22px 18px;transform:translateY(10px) scale(.97);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.mdl-ov.show .mdl{transform:translateY(0) scale(1)}
.mdl-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(224,85,101,.14);color:#E05565;margin-bottom:12px}
.mdl-ic.info{background:rgba(123,94,167,.18);color:var(--p)}
.mdl-ttl{font:700 15px/1.3 'Inter';color:var(--t1);margin-bottom:6px}
.mdl-msg{font:400 12px/1.55 'Inter';color:var(--t2);margin-bottom:18px}
.mdl-btns{display:flex;gap:8px;justify-content:flex-end}
.mdl-btn{padding:8px 16px;border-radius:7px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:600 12px/1 'Inter';cursor:pointer;transition:all .15s}
.mdl-btn:hover{background:var(--s3);border-color:var(--p)}
.mdl-btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.mdl-btn.primary:hover{filter:brightness(1.12)}
.mdl-btn.danger{background:#E05565;border-color:#E05565;color:#fff}
.mdl-btn.danger:hover{filter:brightness(1.1)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--p);border-radius:8px;padding:10px 16px;font-size:12px;z-index:10001;box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

.hidden{display:none!important}

/* ═══ Multi dots (M-logo style) ═══ */
.m-dot{width:6px;height:6px;border-radius:50%;background:var(--s3);transition:background .15s}
.m-dot.on{background:var(--p)}

/* ═══ Resize handle per Side Panel ═══ */
.sp.open{resize:none}
.sp-resize{position:absolute;top:0;right:0;width:6px;height:100%;cursor:ew-resize;z-index:100;background:transparent;transition:background .15s}
.sp-resize:hover,.sp-resize.active{background:var(--p)}
.sg-hdr{font:700 10px/1 'Inter';text-transform:uppercase;letter-spacing:.06em;color:var(--t3);padding:10px 0 6px;border-bottom:1px solid var(--bd);margin:6px 0 8px}
.ms-edit-inp{width:80px;padding:4px 6px;border-radius:4px;border:1px solid var(--p);background:var(--s2);color:var(--t1);font:600 11px 'JetBrains Mono',monospace;text-align:right}

/* ═══ Light-mode: player vuoti chiari ═══ */
[data-theme="light"] .vc{background:var(--s1)}
[data-theme="light"] .vc .ph{color:var(--t2)}

/* Light-mode readability fixes */
[data-theme="light"] .tag{color:#1A1A2E!important;font-weight:700}
[data-theme="light"] .tag-name,[data-theme="light"] .tag-item .t-name,[data-theme="light"] .tag-label,[data-theme="light"] .pl-tags .tag,[data-theme="light"] .ctx-tag+span{color:#1A1A2E!important}
.icon-btn{background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--t2);cursor:pointer;transition:all .12s;box-sizing:border-box;width:var(--h-input);height:var(--h-input);min-width:var(--h-input);margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0;align-self:center}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--pd);color:var(--t1)}
.icon-btn svg{pointer-events:none}
/* Allineamento universale: icon-btn deve sempre stare sulla stessa linea dei select/input accanto */
.sp-body select,.sp-body input[type=text]{box-sizing:border-box}
.sp-body .sg-row{display:flex;align-items:center;gap:8px;min-height:32px}
.sp-body .sg-row>.icon-btn,.sp-body .sg-row>button.icon-btn{align-self:center}

/* FILE MENU GRID: 2 righe x 4 colonne, tutti uguali */
.file-grid-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border:1px solid var(--bd);border-radius:8px;background:var(--s2);color:var(--t1);font:600 10px/1.2 'Inter',sans-serif;cursor:pointer;transition:all .15s;min-height:72px;text-align:center}
.file-grid-btn:hover{background:var(--pd);border-color:var(--p);color:var(--pl);transform:translateY(-1px)}
.file-grid-btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.file-grid-btn.primary:hover{background:var(--pl);border-color:var(--pl);color:#fff}
.file-grid-btn.danger:hover{background:rgba(224,85,101,.12);border-color:var(--err);color:var(--err)}
.file-grid-btn svg{flex-shrink:0}
.file-grid-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* Webcam in cinema mode: object-fit:cover invece di contain → niente barre laterali. */
.vc.webcam.cinema video{object-fit:cover!important}
/* Webcam mode: nascondi tutti i controlli non utili (prev/next/volume/fav/pl/subs/loop/shuf/mag/cinema/speed/export/recstart/recpause/recstop in tb)
   I recstart/recpause/recstop vengono soppressi perché in webcam il tasto PLAY stesso fa REC-toggle. */
.vc.webcam [data-prev],.vc.webcam [data-next],.vc.webcam [data-back10],.vc.webcam [data-fwd10],
.vc.webcam .vc-vol,.vc.webcam [data-fav],.vc.webcam [data-pl],.vc.webcam [data-subs],
.vc.webcam [data-loop],.vc.webcam [data-shuf],.vc.webcam [data-mag],.vc.webcam [data-cinema],
.vc.webcam [data-speed],.vc.webcam [data-exportframe],
.vc.webcam [data-recstart],.vc.webcam [data-recpause],.vc.webcam [data-recstop]{display:none!important}
/* data-wcsettings visibile solo in webcam */
.vc [data-wcsettings]{display:none!important}
.vc.webcam [data-wcsettings]{display:inline-flex!important}
/* In webcam niente tempo corrente/durata: il rec-timer è l'unico counter */
.vc.webcam .vc-tc,.vc.webcam .vc-td{display:none!important}
/* Rec-area subito dopo data-stop */
.vc.webcam .vc-rec-area{margin-left:4px}
.vc.webcam .vc-rec-area{display:inline-flex;align-items:center}

/* Webcam mode: play button = REC/PAUSE toggle, stile viola-bianco coerente con Maniac */
.vc.webcam [data-play]{background:var(--p)!important;color:#fff!important;position:relative}
.vc.webcam.rec [data-play]{
  background:#E05565!important;color:#fff!important;
  box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 16px rgba(224,85,101,.95);
  animation:recGlow 1.2s ease-in-out infinite
}
@keyframes recGlow{
  0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 10px rgba(224,85,101,.8)}
  50%{box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 24px rgba(224,85,101,1)}
}

/* Rec indicator chiaro: quando sta registrando il contatore pulsa rosso con prefisso "● REC" */
.vc.webcam .rd{display:none}
.vc.webcam.rec .rd{
  display:inline-block!important;width:8px;height:8px;border-radius:50%;
  background:#fff;margin-right:6px;vertical-align:middle;
  animation:recPulse .9s ease-in-out infinite
}
.vc.webcam .vc-rec-timer{color:#fff!important}
.vc.webcam.rec .vc-rec-timer{
  color:#fff!important;background:#E05565!important;
  border:1px solid rgba(255,255,255,.3);padding:2px 8px!important;border-radius:4px;
  font-weight:700!important;letter-spacing:.04em;
  animation:recTimerPulse 1.4s ease-in-out infinite
}
.vc.webcam.rec .vc-rec-timer::before{content:"REC ";font-weight:800;letter-spacing:.06em}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
@keyframes recTimerPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,85,101,.7)}50%{box-shadow:0 0 0 6px rgba(224,85,101,0)}}

/* Banner REC grande nell'angolo alto-sinistra della cella in registrazione */
.vc.webcam.rec::before{
  content:"● REC";position:absolute;top:8px;left:8px;z-index:60;
  background:#E05565;color:#fff;padding:4px 10px;border-radius:4px;
  font:800 11px/1 'Inter',sans-serif;letter-spacing:.08em;
  box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.3);
  animation:recPulseBadge 1.1s ease-in-out infinite;pointer-events:none
}
@keyframes recPulseBadge{0%,100%{opacity:1}50%{opacity:.55}}
.vc-btn.drag-ghost{opacity:.5;outline:1px dashed var(--p)}

[data-theme="light"] .stash-typeahead{background:#FFFFFF!important;border-color:#DCD6E3!important;color:#1A1A2E!important}
[data-theme="light"] .stash-typeahead button{color:#1A1A2E!important}
[data-theme="light"] .stash-typeahead button:hover{background:#E6E1EC!important;color:#1A1A2E!important}
[data-theme="light"] .stash-typeahead button:hover *{color:#1A1A2E!important}
[data-theme="light"] .stash-typeahead div{color:inherit}
[data-theme="light"] .log-item pre.log-stack{background:#F0EDF4!important;color:#1A1A2E;border-color:#DCD6E3}
@keyframes linkInBan{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
[data-theme="light"] #linkIntercept{background:#FFFFFF!important;color:#1A1A2E!important;border-color:#7B5EA7!important}

/* ═══ LIGHT MODE — Round 3: tiles Settings, EQ knobs, slider, wizards, popup ═══ */
/* Settings tabs grid: i quadrati delle 8 tab (audio, video, ...) — la regola
   .st-tabs-grid .file-grid-btn (def. line ~988) ha specificità identica al

[data-theme="light"] .st-tabs-grid .file-grid-btn,
[data-theme="light"] .stab-btn{background:#FFFFFF!important;color:#1A1A2E!important;border-color:#DCD6E3!important}
