// Rewrite numeric-only/URL titles using URL slug + resolution
function _dlImproveTitle(d){
  if(!d)return;
  const cur=(d.title||'').trim();
  const isNumeric=/^\d+$/.test(cur);
  const isUrl=/^https?:\/\//i.test(cur);
  if(!isNumeric&&!isUrl&&cur.length>4)return;
  let improved='';
  try{
    const u=new URL(d.url||'');
    // Try common slug-bearing path segments
    const segs=u.pathname.split('/').filter(Boolean);
    let slug=segs.reverse().find(s=>/[a-zA-Z]/.test(s)&&!/^v$|^watch$|^video$|^embed$/i.test(s))||'';
    slug=decodeURIComponent(slug).replace(/[-_+]+/g,' ').replace(/\.[a-z0-9]{2,4}$/i,'').replace(/\s+/g,' ').trim();
    // Pull ?v=… title from YT
    const v=u.searchParams.get('title')||u.searchParams.get('t')||'';
    improved=(v||slug||u.hostname.replace(/^www\./,''));
  }catch(e){improved=cur;}
  const res=d.quality||d.resolution||'';
  d.title=improved+(res&&!improved.toLowerCase().includes(String(res).toLowerCase())?' ['+res+']':'');
  d._titleEdited=false;
}
async function dlClearHistory(){
  const ok=await themedConfirm({title:'Cancella download',message:'Cancellare TUTTI i download dalla lista (inclusi quelli in corso)?',confirmText:'Cancella tutto',cancelText:'Annulla',danger:true});
  if(!ok)return;
  // Cancel any in-flight
  const list=_dlLoad();
  for(const d of list){
    if((d.status==='Downloading'||d.status==='Queued')&&window.maniac&&window.maniac.downloadCancel){
      try{await window.maniac.downloadCancel(d.id);}catch(e){}
    }
  }
  _dlSave([]);
  if(S.panel==='downloader')renderPanel();
}

// ═══ WIZARD STREAMINGCOMMUNITY / SERIE ═══
// Scansiona la pagina, estrae episodi/stagioni e chiede all'utente quale scaricare.
// Ritorna {url} se l'utente sceglie, null se annullato, o {url:originale} se niente da scegliere.
async function scStreamWizard(pageUrl){
  if(!window.maniac||!window.maniac.clipboardScanPage)return {url:pageUrl};
  toast('Analizzo la pagina…');
  let res=null;
  try{ res=await window.maniac.clipboardScanPage(pageUrl);}catch(e){return {url:pageUrl};}
  if(!res||!res.ok||!res.results||!res.results.length)return {url:pageUrl};
  const eps=res.results.filter(x=>x.type==='episode');
  const vids=res.results.filter(x=>x.type==='video'||x.type==='media'||x.type==='og:video'||x.type==='video-tag');
  if(!eps.length && vids.length<=1)return {url:pageUrl};
  // Raggruppa episodi per stagione via pattern S?E?
  const seasons={};
  const parseSE=(s)=>{const m=s.match(/s(?:tagione)?\s*0*(\d+).{0,10}e(?:p|pisod[io])?\s*0*(\d+)/i)||s.match(/(\d+)x(\d+)/i);return m?{s:+m[1],e:+m[2]}:null;};
  eps.forEach(ep=>{
    const se=parseSE(ep.title||'')||parseSE(ep.url||'');
    const sk=se?('S'+String(se.s).padStart(2,'0')):'—';
    seasons[sk]=seasons[sk]||[];
    seasons[sk].push(Object.assign({},ep,{_s:se?se.s:null,_e:se?se.e:null}));
  });
  const seasonKeys=Object.keys(seasons).sort();
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.className='mdl-ov';
    const epListHtml=(seasKey)=>{
      const arr=(seasons[seasKey]||[]).slice().sort((a,b)=>(a._e||0)-(b._e||0));
      if(!arr.length)return '<div style="padding:20px;text-align:center;color:var(--t3);font-size:12px">Nessun episodio rilevato</div>';
      return arr.map((e,i)=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:var(--s2)" onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='var(--s2)'">
        <input type="radio" name="scEp" value="${i}" ${i===0?'checked':''}>
        <span style="flex:1;font-size:11px;color:var(--t1)">${(e.title||e.url||'').replace(/</g,'&lt;').slice(0,100)}</span>
        ${e._s?`<span style="font-size:10px;color:var(--t3)">S${e._s}E${e._e||'?'}</span>`:''}
      </label>`).join('');
    };
    ov.innerHTML=`<div class="mdl" role="dialog" aria-modal="true" style="max-width:560px;max-height:80vh;display:flex;flex-direction:column">
      <div class="mdl-ttl">Wizard Serie — seleziona episodio</div>
      <div class="mdl-msg" style="font-size:11px;color:var(--t3)">Rilevati ${eps.length} episodi${seasonKeys.length>1?(' su '+seasonKeys.length+' stagioni'):''}${vids.length?(' + '+vids.length+' sorgenti dirette'):''}</div>
      ${seasonKeys.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${seasonKeys.map((k,i)=>`<button class="pl-pchip ${i===0?'on':''}" data-sk="${k}" style="flex:0 0 auto;padding:6px 10px;--c:var(--p)">${k}</button>`).join('')}</div>`:''}
      <div id="scEpList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-right:4px">${epListHtml(seasonKeys[0]||'—')}</div>
      <div class="mdl-btns" style="margin-top:12px">
        <button class="mdl-btn" data-act="cancel">Annulla</button>
        <button class="mdl-btn" data-act="page">Scarica pagina intera</button>
        <button class="mdl-btn primary" data-act="ok">Scarica episodio</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    let curSeas=seasonKeys[0]||'—';
    ov.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{
      curSeas=b.getAttribute('data-sk');
      ov.querySelectorAll('[data-sk]').forEach(x=>x.classList.toggle('on',x===b));
      document.getElementById('scEpList').innerHTML=epListHtml(curSeas);
    });
    const close=(v)=>{try{ov.remove();}catch(e){}resolve(v);};
    ov.querySelector('[data-act="cancel"]').onclick=()=>close(null);
    ov.querySelector('[data-act="page"]').onclick=()=>close({url:pageUrl});
    ov.querySelector('[data-act="ok"]').onclick=()=>{
      const r=ov.querySelector('input[name="scEp"]:checked');
      const arr=(seasons[curSeas]||[]).slice().sort((a,b)=>(a._e||0)-(b._e||0));
      const pick=r?arr[+r.value]:arr[0];
      close(pick?{url:pick.url,title:pick.title}:{url:pageUrl});
    };
  });
}

// ═══ POPOVER INFO DATABASE (wizard volti) ═══
// Mostra una checklist dei database consultati per il riconoscimento del volto.
// Usato dall'icona "i" accanto al chip stato nel wizard volti.
function _showSrcPopover(ev, payloadStr){
  let data={};
  try{ data=JSON.parse(payloadStr.replace(/&quot;/g,'"')); }catch(_){return;}
  // Rimuovi popover precedente
  document.querySelectorAll('.info-pop').forEach(n=>n.remove());
  const matched=(data.matched||'').toLowerCase();
  const looked=!!data.looked;
  // I database consultati nel pipeline attuale: locale → TMDB → Wikipedia
  const dbs=[
    {key:'locale',    label:'Database locale (facce salvate)'},
    {key:'tmdb',      label:'TMDB · The Movie DB'},
    {key:'wikipedia', label:'Wikipedia · enciclopedia'}
  ];
  const rows=dbs.map(db=>{
    let icon='—', col='var(--t3)', note='non consultato';
    if(matched===db.key){ icon='●'; col='var(--p)'; note='match trovato'+(data.tmdb_id&&db.key==='tmdb'?` (id ${data.tmdb_id})`:''); }
    else if(looked){ icon='○'; col='var(--t3)'; note='nessun match'; }
    return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font:500 11px/14px 'Inter'"><span style="width:14px;text-align:center;color:${col};font-weight:700">${icon}</span><span style="flex:1;color:var(--t1)">${db.label}</span><span style="color:var(--t3);font-size:10px">${note}</span></div>`;
  }).join('');
  const pop=document.createElement('div');
  pop.className='info-pop';
  pop.innerHTML=`<div style="font:700 10px/1 'Inter';color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Database consultati</div>${rows}`;
  document.body.appendChild(pop);
  // Posizione vicino al click; flip-up se sfora in basso
  const r=(ev.target&&ev.target.getBoundingClientRect)?ev.target.getBoundingClientRect():{left:ev.clientX,top:ev.clientY,bottom:ev.clientY};
  _clampPopover(pop, r.left, r.bottom+6, r);
  // Auto-close on outside click
  const off=(e)=>{ if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('click',off); } };
  setTimeout(()=>document.addEventListener('click',off),0);
}

async function _apiAutoLoad(){
  if(!(window.maniac&&window.maniac.apiAutoDetect)){ toast('Auto-rilevamento non disponibile'); return 0; }

  const f=(r&&r.found)||{}; S.wizardCfg=S.wizardCfg||{}; let n=0;
  if(f.tmdbKey){ S.wizardCfg.tmdbKey=f.tmdbKey; n++; }
  if(f.omdbKey){ S.wizardCfg.omdbKey=f.omdbKey; n++; }
  if(f.stashdbKey){ S.wizardCfg.stashdbKey=f.stashdbKey; n++;
    try{ if(window.maniac.stashdb&&window.maniac.stashdb.setKey) await window.maniac.stashdb.setKey(f.stashdbKey); }catch(_){}
  }
  if(f.openaiKey){ S.openaiKey=f.openaiKey; n++; }
  if(f.geminiKey){ S.geminiKey=f.geminiKey; n++; }
  saveConfig();
  toast(n>0?`${n} ${n===1?'chiave':'chiavi'} API caricate`:"Nessuna chiave trovata. Wikidata e Wikipedia funzionano senza chiave; inserisci le altre manualmente.");

}

// Stile JDownloader: mostra banner persistente in alto con "Aggiungi al download"
// che resta visibile anche se l'utente non è sul pannello Downloader.
function _showLinkInterceptorBanner(data){
  if(!data||!data.url)return;
  const url=data.url;
  // Rimuovi banner precedente se identico/per la stessa url
  const old=document.getElementById('linkIntercept'); if(old)old.remove();
  const bn=document.createElement('div');
  bn.id='linkIntercept';
  bn.style.cssText='position:fixed;top:42px;right:14px;z-index:9999;width:380px;max-width:calc(100vw - 28px);background:var(--s1);border:1px solid var(--p);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.4);padding:14px;display:flex;flex-direction:column;gap:10px;animation:linkInBan .25s ease-out;font:500 12px/1.4 \'Inter\'';
  const thumb=data.thumbnail?`<img src="${data.thumbnail}" style="width:80px;height:48px;border-radius:5px;object-fit:cover;flex:0 0 80px;background:#000" onerror="this.style.display='none'">`:'';
  const sizeStr=(typeof data.size==='number'&&data.size>0)?(()=>{const u=['B','KB','MB','GB'];let i=0,n=data.size;while(n>=1024&&i<3){n/=1024;i++;}return n.toFixed(n>=10||i===0?0:1)+' '+u[i];})():'';
  const title=(data.title||'Video rilevato').replace(/</g,'&lt;');
  bn.innerHTML=`
    <div style="display:flex;align-items:center;gap:6px;font:700 10px/1 'Inter';color:var(--p);text-transform:uppercase;letter-spacing:.06em">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" width="14" height="14"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Link rilevato dagli appunti
    </div>
    <div style="display:flex;gap:10px">
      ${thumb}
      <div style="flex:1;min-width:0">
        <div style="font:600 12px/1.3 'Inter';color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</div>
        <div style="font:400 10px/1.3 'JetBrains Mono',monospace;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px">${url.replace(/</g,'&lt;')}</div>
        ${sizeStr?`<div style="font:600 10px/1 'Inter';color:var(--t2);margin-top:4px">${sizeStr}</div>`:''}
      </div>
    </div>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button id="lnkIgnore" class="m2-btn">Ignora</button>
      <button id="lnkOpenWiz" class="m2-btn">Wizard…</button>
      <button id="lnkAdd" class="m2-btn primary">Scarica</button>
    </div>`;
  document.body.appendChild(bn);
  const close=()=>{bn.remove();};
  bn.querySelector('#lnkIgnore').onclick=close;
  bn.querySelector('#lnkAdd').onclick=()=>{
    try{
      const inp=document.getElementById('dlUrl'); if(inp)inp.value=url;
      if(typeof dlStart==='function')dlStart(url);
    }catch(_){}
    close();
  };
  bn.querySelector('#lnkOpenWiz').onclick=()=>{
    if(typeof dlWizardOpen==='function')dlWizardOpen(url);
    close();
  };
  // auto-dismiss dopo 30s se l'utente non interagisce
  setTimeout(()=>{ if(document.getElementById('linkIntercept')===bn)close(); },30000);
}

// Helper: il toggle "master" interceptorAutoStart implica auto-start sia per
// URL che per torrent (a meno che il toggle specifico sia esplicitamente off).
function _autoStartUrlEnabled(){
  const c=S.downloaderCfg||{};
  return c.interceptorAutoStartUrl===true || c.interceptorAutoStart===true;
}
function _autoStartTorrentEnabled(){
  const c=S.downloaderCfg||{};
  // Default ON per i magnet (cliccati dal browser è già un'azione deliberata).
  if (c.interceptorAutoStartTorrent===false) return false;
  return c.interceptorAutoStartTorrent!==false || c.interceptorAutoStart===true;
}

try {
  if (window.maniac && window.maniac.clipboard && window.maniac.clipboard.onVideoDetected) {
    window.maniac.clipboard.onVideoDetected(data => {
      try {
        const url = data && data.url; if (!url) return;
        // Pre-fill campo URL nel pannello downloads
        const inp = document.getElementById('dlUrl'); if (inp) inp.value = url;
        if (data.openWizard && typeof dlWizardOpen === 'function') {
          // Click sulla notifica OS → apri direttamente il wizard download
          dlWizardOpen(url);
          return;
        }
        if (_autoStartUrlEnabled()) {
          if (typeof dlStart === 'function') { dlStart(url, {auto:true}); toast('Download avviato: '+url.slice(0,60)); }
          return;
        }
        // Mostra banner JDownloader-style
        _showLinkInterceptorBanner(data);
      } catch(_){}
    });
  }
  // Magnet/URL intercettati dal protocollo OS o single-instance handler
  if (window.maniac && window.maniac.download && window.maniac.download.onIntercepted) {
    window.maniac.download.onIntercepted(({ url, kind } = {}) => {
      if (!url) return;
      try {
        const cfg = S.downloaderCfg || {};
        if (kind === 'magnet') {
          if (_autoStartTorrentEnabled()) {
            if (window.maniac.torrentAdd) {
              const out = (cfg.outputDir || '');
              window.maniac.torrentAdd(url, out).then(r => {
                if (r && r.id && typeof _dlLoad === 'function') {
                  const list = _dlLoad();
                  list.unshift({
                    id:'tor_'+Date.now(), torrent:true, torId:r.id, url, status:'Downloading',
                    title: r.name || 'Torrent', percent:0, peers:0, seeds:0, _sel:false
                  });
                  _dlSave(list);
                  if (S.panel === 'downloader') renderPanel();
                }
              }).catch(()=>{});
              toast('Torrent avviato dal browser');
            }
            return;
          }
          _showLinkInterceptorBanner({ url });
        } else {
          // kind = 'url' video
          if (_autoStartUrlEnabled()) {
            if (typeof dlStart === 'function') { dlStart(url, {auto:true}); toast('Download avviato dal browser'); }
            return;
          }
          _showLinkInterceptorBanner({ url });
        }
      } catch(_){}
    });
  }
} catch(_){}

        log.textContent='Errore: '+((res&&res.error)||'sconosciuto');
        logError && logError('SC download fallito',(res&&res.error)||'');
      }
    };
    updateBtnLabel();
  };

  // Listener risultati click sulle card
  grid.addEventListener('click',e=>{
    const card=e.target.closest('.sc-card'); if(!card) return;
    _renderDetailBar(card);
  });

  // F3: similarità per ordinamento (Dice coefficient su bigrammi)
  function _scSimilarity(a,b){
    a=String(a||'').toLowerCase();b=String(b||'').toLowerCase();
    if(!a||!b)return 0;
    if(a===b)return 1;
    if(b.includes(a))return 0.92;
    if(a.includes(b))return 0.85;
    const bg=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);m.set(k,(m.get(k)||0)+1);}return m;};
    const A=bg(a),B=bg(b);
    let inter=0,total=0;
    A.forEach((v,k)=>{total+=v;if(B.has(k))inter+=Math.min(v,B.get(k));});
    B.forEach(v=>total+=v);
    return total?(2*inter)/total:0;
  }

  let _scSearchSeq=0;
  const doSearch=async ()=>{
    const q=(inp.value||'').trim();
    if(!q){ status.textContent='Inserisci un termine di ricerca.'; grid.innerHTML=''; return; }
    const seq=++_scSearchSeq;
    grid.innerHTML='';
    detail.style.display='none';
    status.style.color='var(--t3)';
    status.textContent='Ricerca in corso…';
    let r=await window.maniac.wizard.scSearch(q,!!_scForceNext);
    _scForceNext=false;
    if(seq!==_scSearchSeq)return; // search obsoleta, ignora
    // F3: retry una volta in caso di anti-bot/HTML response o nessun risultato
    const needsRefresh=r&&!r.ok&&/html|anti.?bot|cookie|shell|domin/i.test(r.error||'');
    if(needsRefresh){
      status.textContent='Riprovo (warmup anti-bot)…';
      try{ if(window.maniac.wizard.scResolveDomain)await window.maniac.wizard.scResolveDomain(); }catch(_){}
      r=await window.maniac.wizard.scSearch(q,true);
      if(seq!==_scSearchSeq)return;
    }
    if(r&&r.refreshed){
      // L'IPC ha già fatto un refresh dominio dietro le quinte: informa l'utente.
      status.textContent='Dominio SC aggiornato. '+(r.results&&r.results.length?'':'Nessun risultato — riprova.');
    }
    if(!r||!r.ok){
      status.style.color='var(--er,#e55)';
      status.textContent='Errore: '+((r&&r.error)||'rete')+'. Se persiste, prova a riaprire il wizard fra qualche minuto.';
      return;
    }
    baseUrl=r.base_url||'';
    let items=r.results||[];
    // F3: ordina per match esatto sul titolo, poi per somiglianza
    if(items.length){
      const ql=q.toLowerCase();
      items=items.map(it=>({...it,_sim:_scSimilarity(it.name,q),_exact:(it.name||'').toLowerCase()===ql?1:0}));
      items.sort((a,b)=>(b._exact-a._exact)||(b._sim-a._sim)||((b.score||0)-(a.score||0)));
    }
    if(!items.length){
      status.textContent='Nessun risultato per «'+_esc(q)+'».';
      return;
    }
    status.style.color='var(--t3)';
    status.textContent=`${items.length} risultati su ${baseUrl||'StreamingCommunity'}`;
    grid.innerHTML=items.map(_renderCard).join('');
  };
  let _scForceNext=false;
  ov.querySelector('#scWizGo').onclick=doSearch;
  const refBtn=ov.querySelector('#scWizRefresh');
  if(refBtn) refBtn.onclick=()=>{
    _scForceNext=true;
    status.textContent='Aggiorno dominio SC… (può richiedere 10-30 secondi)';
    doSearch();
  };
  const domEditBtn=ov.querySelector('#scWizDomEdit');
  const _scOpenDomainDlg=async()=>{
    let cur='';
    try{
      if(window.maniac&&window.maniac.wizard&&window.maniac.wizard.scGetDomain){
        const r=await window.maniac.wizard.scGetDomain();
        if(r&&r.ok)cur=(r.current||r.url||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
      }
    }catch(_){}
    const dlg=document.createElement('div');
    dlg.className='wiz-ov sc-wiz-ov show';
    dlg.style.zIndex='99999';
    dlg.innerHTML=`<div class="wiz" role="dialog" style="max-width:440px;width:92%">
      <div class="wiz-head"><div class="t">Dominio StreamingCommunity</div><button class="x" data-act="cancel" aria-label="Chiudi">×</button></div>
      <div style="padding:8px 0 4px;font-size:11px;color:var(--t3)">Inserisci il dominio (es. <code>streamingcommunity.computer</code>). L'app validerà e ricreerà la shell.</div>
      <input id="scDomInp" type="text" value="${cur.replace(/"/g,'&quot;')}" placeholder="streamingcommunity.xxx" style="width:100%;padding:8px 10px;font:500 12px 'JetBrains Mono',monospace;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--t1);margin-top:6px">
      <div id="scDomStatus" style="font:500 11px 'JetBrains Mono',monospace;color:var(--t3);min-height:16px;margin-top:8px"></div>
      <div class="wiz-foot" style="margin-top:12px;display:flex;gap:6px;justify-content:flex-end">
        <button class="m2-btn" id="scDomAuto" title="Risolvi automaticamente il dominio corrente">Auto-detect</button>
        <button class="m2-btn" data-act="cancel">Annulla</button>
        <button class="m2-btn primary" id="scDomSave">Salva</button>
      </div>
    </div>`;
    document.body.appendChild(dlg);
    const dStatus=dlg.querySelector('#scDomStatus');
    const close=()=>{ dlg.classList.remove('show'); setTimeout(()=>{ dlg.parentNode&&dlg.parentNode.removeChild(dlg); },140); };
    dlg.addEventListener('click',e=>{ if(e.target===dlg) close(); });
    dlg.querySelectorAll('[data-act="cancel"]').forEach(b=>b.onclick=close);
    dlg.querySelector('#scDomAuto').onclick=async()=>{
      dStatus.textContent='Risolvo dominio…';
      try{
        const r=await window.maniac.wizard.scResolveDomain();
        if(r&&r.ok){ dStatus.style.color='var(--t3)'; dStatus.textContent=''+(r.url||''); dlg.querySelector('#scDomInp').value=(r.url||'').replace(/^https?:\/\//,'').replace(/\/$/,''); }
        else { dStatus.style.color='var(--er,#e55)'; dStatus.textContent=''+((r&&r.error)||'errore'); }
      }catch(e){ dStatus.style.color='var(--er,#e55)'; dStatus.textContent=''+e.message; }
    };
    dlg.querySelector('#scDomSave').onclick=async()=>{

      dStatus.style.color='var(--t3)'; dStatus.textContent='Salvo + warmup (può richiedere 10-30s)…';
      try{

// AUTO-TAG LIBRARY WIZARD
// Carica una cartella di video, per ogni file lancia lo scraper engine multi-fonte,
// e applica i tag/performer in caso di consenso ≥3 fonti.
async function openAutoTagWizard(prefilledPath){
  if(!window.maniac||!window.maniac.scrape||!window.maniac.scrape.autoTagFiles){
    toast('Auto-tag non disponibile (riavvia l\'app)');return;
  }
  // Pre-check: lista scrapers disponibili
  let scrapersInfo={count:0};
  try{ scrapersInfo=await window.maniac.scrape.listScrapers()||{}; }catch(_){}
  if(!scrapersInfo.ok||!scrapersInfo.count){
    toast('Nessuno scraper trovato in models/scrapers — vedi README');
    if(window.maniac.openExternal)window.maniac.openExternal('https://github.com/stashapp/community-scrapers');
    return;
  }
  // Cartella + lista file
  let folder=prefilledPath;
  if(!folder && API && API.openFolder){
    const r=await API.openFolder();
    if(r.canceled||!r.files||!r.files.length){toast('Annullato');return;}
    folder={path:r.folderPath||'', files:r.files};
  } else if(typeof folder==='string'&&folder){
    if(!S._aiFolderCache||S._aiFolderCache.path!==folder){
      const r=await API.openFolder();
      if(r.canceled||!r.files||!r.files.length){toast('Annullato');return;}
      folder={path:r.folderPath||folder, files:r.files};
    } else folder={path:S._aiFolderCache.path, files:S._aiFolderCache.files};
  }
  if(!folder||!folder.files||!folder.files.length){toast('Cartella vuota');return;}
  const filePaths=folder.files.map(f=>f.path||f).filter(Boolean);
  // Modale progress
  const ov=document.createElement('div'); ov.className='wiz-ov';
  ov.id='autoTagOv';
  ov.innerHTML=`<div class="wiz" role="dialog" aria-modal="true" style="max-width:720px;width:96%">
    <div class="wiz-head"><div class="t">Auto-tag library</div><button class="x" data-act="cancel">×</button></div>
    <div class="wiz-body" style="padding:18px">
      <div style="font:600 12px/1.4 'Inter';color:var(--t1)">${filePaths.length} file · ${scrapersInfo.count} scrapers attivi · consenso ≥ 3 fonti</div>
      <div id="atProg" style="margin-top:14px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:14px">
        <div id="atFile" style="font:600 12px/1.4 'Inter';color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px">In preparazione…</div>
        <div style="height:6px;background:var(--s3);border-radius:3px;overflow:hidden"><div id="atBar" style="height:100%;background:var(--p);width:0%;transition:width .25s"></div></div>
        <div id="atTxt" style="font:500 11px/1.4 'Inter';color:var(--t3);margin-top:8px">0 / ${filePaths.length}</div>
        <div id="atStats" style="font:500 11px/1.4 'Inter';color:var(--t3);margin-top:6px">— matched · — uncertain</div>
      </div>
    </div>
    <div class="wiz-foot" style="justify-content:space-between">
      <button class="m2-btn" id="atBgBtn" title="Continua in background">Esegui in background</button>
      <button class="m2-btn" data-act="cancel">Annulla</button>
    </div>
  </div>`;
  document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add('show'));
  let canceled=false; let jobId='atag_'+Date.now();
  let stats={matched:0, uncertain:0};
  const close=()=>{ ov.classList.remove('show'); setTimeout(()=>{ ov.remove(); },180); };
  ov.querySelectorAll('[data-act="cancel"]').forEach(b=>b.onclick=()=>{
    canceled=true;
    try{ window.maniac.scrape.cancel&&window.maniac.scrape.cancel(jobId); }catch(_){}
    close();
  });
  ov.querySelector('#atBgBtn').onclick=()=>{ ov.classList.remove('show');setTimeout(()=>ov.style.display='none',200); _workerInc('organizer'); };
  // Listener progress
  if(!window._autoTagProgBound){
    window._autoTagProgBound=true;
    window.maniac.scrape.onProgress(evt=>{
      if(!evt||evt.jobId!==window._autoTagCurrentJob)return;
      const fn=document.getElementById('atFile');
      const bar=document.getElementById('atBar');
      const txt=document.getElementById('atTxt');
      const ss=document.getElementById('atStats');
      if(evt.event==='start' && txt){ txt.textContent='0 / '+(evt.total||filePaths.length); }
      else if(evt.event==='file' && fn){ fn.textContent=(evt.name||evt.path||'…').slice(0,80); }
      else if(evt.event==='result'){
        if(evt.status==='matched')stats.matched++; else stats.uncertain++;
        const i=(evt.i||0)+1, tot=filePaths.length;
        if(bar)bar.style.width=Math.round(i/tot*100)+'%';
        if(txt)txt.textContent=i+' / '+tot;
        if(ss)ss.textContent=stats.matched+' matched · '+stats.uncertain+' uncertain';
        // Applica i tag al file (S._fileTags)
        if(evt.consensus && evt.consensus.Tags && Array.isArray(evt.consensus.Tags) && evt.path){
          try {
            S._fileTags=S._fileTags||{};
            const cur=S._fileTags[evt.path]||[];
            const merged=Array.from(new Set([...cur, ...evt.consensus.Tags]));
            S._fileTags[evt.path]=merged;
          } catch(_){}
        }
      }
      else if(evt.event==='done'){
        toast(`Auto-tag: ${stats.matched} matched, ${stats.uncertain} uncertain`);
        try{ saveConfig(); }catch(_){}
        _workerDec('organizer');
        if(document.getElementById('autoTagOv'))close();
      }
      else if(evt.event==='error'){
        toast((evt.error||'errore'));
        _workerDec('organizer');
        if(document.getElementById('autoTagOv'))close();
      }
    });
  }
  window._autoTagCurrentJob=jobId;
  _workerInc('organizer');
  const r=await window.maniac.scrape.autoTagFiles({jobId, files:filePaths, minVotes:3, maxSources:6});
  if(!r||!r.ok){
    _workerDec('organizer');
    toast(((r&&r.error)||'errore avvio'));
    close();
  }
}

// F1: loader unico nella topbar (no più chip in basso che invade i pulsanti)
// Worker tracking globale: AI, Organizer, Subs.
// Quando ≥1 totale → spinner ingranaggio visibile.
// Quando ≥2 totale → numerino badge col conteggio.
window._workers=window._workers||{ai:0,organizer:0,subs:0};
function _workerCount(){const w=window._workers;return (w.ai||0)+(w.organizer||0)+(w.subs||0);}
function _workerInc(kind){
  if(!window._workers[kind] && window._workers[kind]!==0)window._workers[kind]=0;
  window._workers[kind]++;
  _refreshWorkerLoader();
}
function _workerDec(kind){
  if(!window._workers[kind])return;
  window._workers[kind]=Math.max(0,window._workers[kind]-1);
  _refreshWorkerLoader();
}
function _refreshWorkerLoader(){
  const el=document.getElementById('aiLoader'); if(!el)return;
  const total=_workerCount();
  el.style.display=total>0?'inline-flex':'none';
  el.style.cursor=total>0?'pointer':'default';
  // Tooltip con riepilogo
  const w=window._workers;
  const parts=[];
  if(w.ai)parts.push(w.ai+' analisi');
  if(w.organizer)parts.push(w.organizer+' organizer');
  if(w.subs)parts.push(w.subs+' sottotitoli');
  el.title=parts.length?'In corso: '+parts.join(' · '):'Pronto';
  // Badge numerino quando ≥2
  const badge=document.getElementById('aiLoaderBadge');
  if(badge){
    if(total>=2){badge.textContent=total;badge.style.display='block';}
    else badge.style.display='none';
  }
  el.onclick=total>0?(()=>{ if(S._wizard&&S._wizard._background)wizardRestoreFromBackground(); }):null;
}
// Backward-compat: setAILoader(on) chiama l'inc/dec.
function setAILoader(on){
  if(on)_workerInc('ai');
  else _workerDec('ai');
}

function wizardSendToBackground(){

function wizardRestoreFromBackground(){

  const ov=document.getElementById('wizOv');

async function runWizardAnalysis(){
  const W=S._wizard;if(!W)return;
  if(W.modes.size===0){toast('Seleziona almeno una modalità');return;}
  const ov=document.getElementById('wizOv');
  const wiz=ov&&ov.querySelector('.wiz');
  const api=window.maniac&&window.maniac.ai;
  if(!api||!api.analyzeFolder){
    if(wiz){wiz.innerHTML=`<h3>Motore AI non disponibile</h3><div class="ai-box" style="margin-bottom:16px"><p style="font-size:12px;color:var(--t2)">IPC Python non esposto. Riavvia l'app.</p></div><div style="display:flex;justify-content:flex-end"><button class="mdl-btn primary" onclick="closeWizard()">OK</button></div>`;}
    return;
  }
  // Render progress UI (semplificata: solo titolo file + N analizzati)
  if(wiz){
    wiz.innerHTML=`<div class="wiz-head"><h3 style="margin:0">Analisi in corso…</h3></div>
      <div class="wiz-body" style="display:flex;flex-direction:column;justify-content:center;gap:14px">
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:18px">
          <div id="wizProgFile" style="font:600 13px/1.4 'Inter';color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px;text-align:center">In preparazione…</div>
          <div style="height:6px;background:var(--s3);border-radius:3px;overflow:hidden"><div id="wizProgBar" style="height:100%;background:var(--p);width:0%;transition:width .3s"></div></div>
          <div id="wizProgTxt" style="font:500 11px/1.4 'Inter';color:var(--t3);margin-top:10px;text-align:center">0 file analizzati</div>
        </div>
      </div>
      <div class="wiz-foot" style="justify-content:space-between">
        <button class="mdl-btn" id="wizBackgroundBtn" title="Continua l'analisi e usa l'app">Esegui in background</button>
        <button class="mdl-btn" id="wizCancelBtn">Annulla</button>
      </div>`;
  }
  const jobId='ai_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  W.jobId=jobId;
  W._cancelled=false; W._background=false;
  const logEl=()=>document.getElementById('wizLog');
  const appendLog=s=>{const el=logEl();if(!el)return;const d=document.createElement('div');d.textContent=s;el.appendChild(d);el.scrollTop=el.scrollHeight;};
  const cancelBtn=document.getElementById('wizCancelBtn');
  if(cancelBtn)cancelBtn.onclick=()=>{
    if(!S._wizard)return;
    S._wizard._cancelled=true;
    try{api.cancel&&api.cancel(jobId);}catch(e){}
    // attendi fino a 4s un eventuale 'done' con risultati parziali; altrimenti mostra summary "vuota"
    setTimeout(()=>{
      if(!S._wizard||S._wizard.jobId!==jobId)return;
      if(!S._wizard.results||!S._wizard.results.length){
        S._wizard.results=[]; S._wizard.selected=new Set();
      }
      try{renderWizardSummary();}catch(e){closeWizard();}
    },4000);
    // Mostra messaggio immediato "annullamento in corso, attendo risultati parziali…"
    const wf=document.getElementById('wizProgFile'); if(wf)wf.textContent='Annullamento — recupero risultati parziali…';
  };
  const bgBtn=document.getElementById('wizBackgroundBtn');
  if(bgBtn)bgBtn.onclick=()=>wizardSendToBackground();
  if(!W._aiBound&&api.onProgress){
    api.onProgress(async evt=>{
      if(!S._wizard||evt.jobId!==S._wizard.jobId)return;
      if(evt.type==='progress'){
        const bar=document.getElementById('wizProgBar');
        const txt=document.getElementById('wizProgTxt');
        const fn=document.getElementById('wizProgFile');
        if(evt.total){
          // Frame/frameTotal lato backend non viene mostrato all'utente
          const pct=Math.round(((evt.current||0)/evt.total)*100);
          if(bar)bar.style.width=pct+'%';
          if(txt)txt.textContent=(evt.current||0)+' di '+evt.total+' file analizzati';
        }
        if(evt.file&&fn){
          // Mostra solo il nome file (senza path tecnico)
          const base=(evt.file||'').split(/[\\/]/).pop();
          fn.textContent=base||'…';
        }
      }
      else if(evt.type==='phase' || evt.type==='warn' || evt.type==='stderr' || evt.type==='error'){
        // Silenziati nella UI utente (resta in console per debug)
        if(evt.type==='error')console.warn('[analisi]',evt.error);
      }
      else if(evt.type==='done'){
        const raw=evt.results||[];
        // Filtra solo i tipi richiesti dall'utente
        const requested=new Set([...W.modes]);
        const filtered=raw.filter(r=>requested.has(r.type));
        let mapped=filtered.map((r,i)=>({
          id:i+1,label:r.label||('Cluster '+(i+1)),
          path:(r.files&&r.files[0])||'',files:r.files||[],
          thumb:r.thumb||null,count:r.count||0,type:r.type,
          avgEmbedding:r.avgEmbedding||null,
          gender:r.gender||null,
          genderMatch:r.genderMatch!==false,
          detector:r.detector||null,
          className:r.className||null,
          confidence:typeof r.confidence==='number'?r.confidence:null,
          match:r.localMatch?{name:r.localMatch.name,score:r.localMatch.score,
            source:r.localMatch.source||'facedb',thumbUrl:r.localMatch.thumbnail||null,
            performerId:r.localMatch.tmdb_id||null}:null
        }));
        S._wizard.results=mapped;
        S._wizard.selected=new Set();
        // Riconoscimento attori: cluster face vengono inviati al resolver Python
        // (StashDB photo-vs-photo). I non-face passano dritti al summary.
        const faceClusters=mapped.filter(r=>r.type==='face'&&r.avgEmbedding);
        if(faceClusters.length){
          await _runActorResolver(faceClusters);
          if(!S._wizard) return;
        }
        if(S._wizard._background){
          showWizardCompleteNotification();
        } else {
          renderWizardSummary();
        }
      }else if(evt.type==='exit'){
        if(!S._wizard.results||!S._wizard.results.length){
          const w=document.querySelector('#wizOv .wiz');
          // Diagnostica più utile: distingue "nessun volto trovato" da errore Python.
          const lastErr=window._wizLastStderr||'';
          const isImportErr=/ImportError|ModuleNotFoundError|deepface/i.test(lastErr);
          const msg=isImportErr
            ? `L'analisi è terminata con un errore Python:<br><code style="display:block;background:var(--s2);padding:6px;border-radius:4px;margin-top:6px;font-size:10px;white-space:pre-wrap">${(lastErr||'').slice(-300).replace(/</g,'&lt;')}</code><br>Verifica le dipendenze con <code>python/bootstrap.py --check</code>.`
            : `L'analisi è terminata ma non ha trovato volti (o nessuno ha superato la soglia di confidence). Possibili cause:<ul style="margin:6px 0 0;padding-left:20px;font-size:11px;line-height:1.6"><li>Il video non contiene volti riconoscibili</li><li>Risoluzione/illuminazione troppo bassa per il rilevatore</li><li>Soglia <code>match-threshold</code> troppo alta nelle impostazioni avanzate</li></ul>`;
          if(w)w.innerHTML=`<div class="wiz-head"><h3 style="margin:0">Nessun risultato</h3></div><div class="wiz-body"><p style="font-size:12px;color:var(--t2);line-height:1.5">${msg}</p></div><div class="wiz-foot" style="justify-content:flex-end"><button class="mdl-btn primary" onclick="closeWizard()">OK</button></div>`;
        }
      } else if(evt.type==='stderr' && evt.line){
        window._wizLastStderr=(window._wizLastStderr||'')+evt.line;
        if((window._wizLastStderr||'').length>4000) window._wizLastStderr=window._wizLastStderr.slice(-2000);
      }
    });
    W._aiBound=true;
  }
  try{
    const ac=S.analysisCfg||{};
    // Riconoscimento attori: provider esterni nel backend disabilitati di proposito.
    // Il naming è gestito esclusivamente dal resolver StashDB (foto-vs-foto) lato JS.
    const r=await api.analyzeFolder({
      jobId,
      folder:W.folder.path,
      files:(W._singleFile && W.folder.files)?W.folder.files.map(f=>f.path||f):null,
      modes:[...W.modes],
      gender:W.gender||'both',
      maxFiles:200,
      tmdbKey:null,
      omdbKey:null,
      adultColonyBase:null,
      stashdbKey:null,
      useWikidata:false,
      useWikipedia:false,
      verifyPhoto:false,
      acoustidKey:ACOUSTID_KEY||null,
      musicWriteMode:ac.musicTagMode||'tag',
      musicNoBackup:ac.writeBackup===false,
      musicUseShazam:true
    });
    if(!r||!r.ok){
      const w=document.querySelector('#wizOv .wiz');
      if(w)w.innerHTML=`<h3>Impossibile avviare l'analisi</h3><div class="ai-box" style="margin-bottom:16px"><p style="font-size:12px;color:var(--t2)">${(r&&r.error||'errore').replace(/</g,'&lt;')}</p></div><div style="display:flex;justify-content:flex-end"><button class="mdl-btn primary" onclick="closeWizard()">OK</button></div>`;
    }
  }catch(e){appendLog(e.message);}
}

// ═══ Wizard v2: solo face-match vs StashDB (refactor) ═══
// L'unico provider per la denominazione attori è StashDB. Tokenizzazione
// nomi e verifica foto-vs-foto avvengono in python/face_actor_resolver.py.
const ACOUSTID_KEY='Sq8SoQ2rGR';

// Lancia il resolver Python sui cluster face.
// Mutua S._wizard.results in-place: ogni r riceve r.match (o null) + r.candidates.
async function _runActorResolver(faceClusters){
  const W=S._wizard; if(!W) return;
  const api=window.maniac&&window.maniac.ai;
  if(!api||!api.actorResolve) return;
  // UI: barra di stato resolver
  const wiz=document.querySelector('#wizOv .wiz');
  if(wiz){
    wiz.innerHTML=`<div class="wiz-head"><h3 style="margin:0">Riconoscimento attori…</h3></div>
      <div class="wiz-body" style="display:flex;flex-direction:column;justify-content:center;gap:14px">
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:18px">
          <div id="wizResStage" style="font:600 13px/1.4 'Inter';color:var(--t1);text-align:center;margin-bottom:10px">Clustering…</div>
          <div style="height:6px;background:var(--s3);border-radius:3px;overflow:hidden"><div id="wizResBar" style="height:100%;background:var(--p);width:0%;transition:width .3s"></div></div>
          <div id="wizResTxt" style="font:500 11px/1.4 'Inter';color:var(--t3);margin-top:10px;text-align:center">${faceClusters.length} cluster da risolvere</div>
        </div>
      </div>
      <div class="wiz-foot" style="justify-content:flex-end">
        <button class="mdl-btn" id="wizResCancel">Annulla</button>
      </div>`;
  }
  // Payload cluster (id, embedding, files, thumb, count)
  const clusters=faceClusters.map(r=>({
    id:r.id, avgEmbedding:r.avgEmbedding,
    files:r.files||[], thumb:r.thumb||'', count:r.count||1
  }));
  const stageLbl={merge:'Clustering volti…',cache:'Cache locale…',query:'Ricerca StashDB…',
                  verify:'Verifica foto…','no-candidates':'Nessun candidato',skipped:'Saltato'};
  return await new Promise((resolve)=>{
    let resolved=false;
    const finish=()=>{ if(!resolved){resolved=true;resolve();} };
    if(!W._actorBound){
      api.onActorResolveProgress(evt=>{
        if(!S._wizard||evt.jobId!==S._wizard._actorJobId)return;
        if(evt.event==='progress'){
          const lbl=stageLbl[evt.stage]||evt.stage||'';
          const stEl=document.getElementById('wizResStage');
          const txEl=document.getElementById('wizResTxt');
          const bar=document.getElementById('wizResBar');
          if(stEl)stEl.textContent=lbl+(evt.detail?(' · '+evt.detail):'');
          if(txEl&&evt.total)txEl.textContent=(evt.cluster||0)+' di '+evt.total+' cluster';
          if(bar&&evt.total){const pct=Math.round(((evt.cluster||0)/evt.total)*100);bar.style.width=pct+'%';}
        } else if(evt.event==='cluster'){
          // Match in-flight: aggiorna il cluster mutando results in-place.
          // Non sovrascrivere un match locale esistente con score più alto.
          const r=(S._wizard.results||[]).find(x=>x.id===evt.id);
          if(r){
            const newM=evt.match||null;
            const curM=r.match;
            if(newM&&(!curM||(newM.score||0)>=(curM.score||0))) r.match=newM;
            r.candidates=evt.candidates||[];
            r.files=evt.files||r.files;
            r.count=evt.count||r.count;
            if(evt.thumb)r.thumb=evt.thumb;
            if(evt.avgEmbedding)r.avgEmbedding=evt.avgEmbedding;
            r._mergedFrom=evt.mergedFrom||r._mergedFrom||[];
          }
        } else if(evt.event==='result'){
          // Riconcilia: alcuni cluster possono essere stati fusi dal resolver.
          // Ricostruisci results dal payload finale (per i cluster face) e
          // mantieni i non-face originali.
          const W2=S._wizard; if(!W2){finish();return;}
          const finalFace=(evt.clusters||[]).map(c=>{
            const orig=(W2.results||[]).find(x=>x.id===c.id)||{};
            const resolverM=c.match||null;
            const localM=orig.match||null;
            const bestM=resolverM&&(!localM||(resolverM.score||0)>=(localM.score||0))
              ?resolverM:localM;
            return {
              ...orig,
              id:c.id, type:'performer',
              avgEmbedding:c.avgEmbedding||orig.avgEmbedding,
              files:c.files||orig.files||[],
              count:c.count||orig.count||1,
              thumb:c.thumb||orig.thumb||null,
              match:bestM,
              candidates:c.candidates||[],
              _mergedFrom:c.mergedFrom||[]
            };
          });
          const others=(W2.results||[]).filter(r=>r.type!=='face');
          W2.results=[...finalFace, ...others];
          W2.selected=new Set();
          finish();
        } else if(evt.event==='exit'||evt.event==='error'){
          finish();
        }
      });
      W._actorBound=true;
    }
    api.actorResolve({clusters, mergeThreshold:0.62, confirmThreshold:0.55, topk:5})
      .then(r=>{
        if(!r||!r.ok){
          if(wiz){wiz.innerHTML=`<h3>Resolver non disponibile</h3><div class="ai-box" style="margin-bottom:16px"><p style="font-size:12px;color:var(--t2)">${(r&&r.error||'errore').replace(/</g,'&lt;')}</p></div><div style="display:flex;justify-content:flex-end"><button class="mdl-btn primary" onclick="closeWizard()">OK</button></div>`;}
          finish();
          return;
        }
        S._wizard._actorJobId=r.jobId;
        const cn=document.getElementById('wizResCancel');
        if(cn)cn.onclick=()=>{ try{api.actorResolveCancel&&api.actorResolveCancel(r.jobId);}catch(_){}; finish(); };
      })
      .catch(()=>finish());
  });
}

// Backfill: per ogni elemento già salvato con external_id stashdb ma senza photoUrl,
// prova a recuperare la foto ufficiale dal DB. Esegui in background, una sola volta per session.
async function _aiBackfillPhotos(){
  if(window._aiBackfillRan)return;
  window._aiBackfillRan=true;
  const els=(S.analysisElements||[]).filter(e=>!e.photoUrl && e.external_id && (e.source==='stashdb' || e.source==='facedb-cache'));
  if(!els.length)return;
  const api=window.maniac&&window.maniac.stashdb;
  if(!api||!api.performerInfo)return;
  let touched=0;
  for(const e of els.slice(0,30)){ // limita per non saturare
    try{
      const r=await api.performerInfo(e.external_id);
      if(r&&r.ok&&r.performer&&r.performer.image){
        e.photoUrl=r.performer.image;
        e.thumb=r.performer.image;
        touched++;
      }
    }catch(_){}
  }
  if(touched){
    _saveAnalysisHistory();
    if(S.panel==='ai')renderPanel();
  }
}

async function _loadAnalysisHistory(){
  if(!window.maniac||!window.maniac.analysisLoad)return;
  try{const r=await window.maniac.analysisLoad();S.analysisElements=(r&&r.elements)||[];}catch(_){S.analysisElements=S.analysisElements||[];}
  // Lancia backfill foto in background (no await per non rallentare l'apertura del pannello)
  setTimeout(()=>{try{_aiBackfillPhotos();}catch(_){}},500);

async function _saveAnalysisHistory(){

function pushAnalysisElement(el){
  S.analysisElements=S.analysisElements||[];
  if(!el||!el.name)return;
  const now=Date.now();
  const existing=S.analysisElements.find(e=>e.type===(el.type||'face')&&e.name===el.name);
  if(existing){
    const files=new Set([...(existing.files||[]),...(el.files||[])]);
    existing.files=Array.from(files);
    // Foto DB (StashDB/TMDB) ha priorità sul crop locale: aggiorna sempre se disponibile.
    if(el.photoUrl){existing.photoUrl=el.photoUrl;existing.thumb=el.photoUrl;}
    else if(el.thumb && !existing.photoUrl)existing.thumb=el.thumb;
    if(el.avgEmbedding)existing.avgEmbedding=el.avgEmbedding;
    if(el.source)existing.source=el.source;
    if(el.external_id)existing.external_id=el.external_id;
    if(el.metadata)existing.metadata=el.metadata;
    existing.updatedAt=now;
    existing.hidden=false;
  }else{
    S.analysisElements.push({
      id:'el_'+now+'_'+Math.random().toString(36).slice(2,7),
      type:el.type||'performer',name:el.name,
      thumb:el.photoUrl||el.thumb||'',
      photoUrl:el.photoUrl||null,
      files:el.files||[],tags:el.tags||[],
      avgEmbedding:el.avgEmbedding||null,
      source:el.source||null,
      external_id:el.external_id||null,
      metadata:el.metadata||null,
      createdAt:now,updatedAt:now
    });
  }
  _saveAnalysisHistory();
}

    }

  if(changed) _saveAnalysisHistory();
}

// Cosine similarity tra due embedding (array di float)
function _cosineSim(a,b){
  if(!a||!b||a.length!==b.length)return -1;
  let s=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){s+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}
  if(na<=0||nb<=0)return -1;
  return s/(Math.sqrt(na)*Math.sqrt(nb));
}
function renderWizardSummary(){
  const W=S._wizard;if(!W)return;

  const topNames=[];
  W.results.slice(0,5).forEach(r=>{
    if(r.match&&r.match.name){
      const tag=r.match.source==='facedb-cache'?' <span style="color:var(--t3);font-size:10px">(cache locale)</span>':' <span style="color:var(--t3);font-size:10px">(StashDB)</span>';
      topNames.push(r.match.name+tag);
    }
  });
  // Conteggio per tipo richiesto: mostra esplicitamente i tipi senza risultati.
  const typeLabels={face:'Attori',music:'Musica',place:'Luoghi',object:'Oggetti',animal:'Animali',genre:'Generi',category:'Categorie'};
  const byType={};
  W.results.forEach(r=>{byType[r.type]=(byType[r.type]||0)+1;});
  const requestedModes=[...W.modes];

    </div>`;
  }).join('');
  const noResults=W.results.length===0;
  wiz.innerHTML=`<div class="wiz-head"><h3 style="margin:0">Riepilogo analisi</h3></div>
    <div class="wiz-body">
      <div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px">
        <div style="font-size:13px;color:var(--t1);margin-bottom:10px">Analizzati <b>${W.folder.files.length}</b> file.</div>
        ${typeRows}
        ${topNames.length?`<div style="font-size:11px;color:var(--t2);margin-top:10px">Nomi dominanti: ${topNames.join(', ')}</div>`:''}
      </div>

        <div style="text-align:center;padding:20px;color:var(--t3);font-size:12px;line-height:1.6">
          Nessun risultato trovato per le modalità selezionate.<br>
          <span style="font-size:11px">Prova con un'altra cartella o seleziona modalità diverse.</span>
        </div>
      `:`
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="mdl-btn primary" onclick="renderWizardReview()">Suggerimenti Automatici</button>
          <button class="mdl-btn" onclick="renderWizardResults()">Seleziona manualmente</button>
        </div>
      `}
    </div>
    <div class="wiz-foot"><button class="mdl-btn" onclick="closeWizard()">Chiudi</button></div>`;
}

function renderWizardReview(){
  const W=S._wizard;if(!W)return;
  const ov=document.getElementById('wizOv');if(!ov)return;
  const wiz=ov.querySelector('.wiz');
  if(wiz)wiz.setAttribute('data-step','review');
  W.reviewState=W.reviewState||{};
  W.undoStack=W.undoStack||[];
  // Stato review: una sola fonte di verità — r.match dal resolver Python.
  // - face match: nome StashDB (o cache locale facedb)
  // - face senza match: campo nome vuoto, action='rejected' di default
  // - non-face (place/object/...): nome dal className ML come fallback (mode legacy)
  W.results.forEach(r=>{
    if(W.reviewState[r.id])return;
    let name='', photoUrl=null, source=null, externalId=null, score=null, autoReject=false;
    if(r.type==='face'){
      if(r.match){
        name=r.match.name||'';
        photoUrl=r.match.thumbUrl||null;
        source=r.match.source||'stashdb';
        externalId=r.match.performerId||null;
        score=(typeof r.match.score==='number')?r.match.score:null;
      } else {
        // Nessun match: cluster da rivedere manualmente o scartare.
        autoReject=true;
      }
    } else if(r.className){
      name=r.className.replace(/_/g,' ').replace(/\//g,' / ');
      name=name.charAt(0).toUpperCase()+name.slice(1);
      source=r.detector?(r.detector.startsWith('yolo')?'yolo':'places365'):'ml';
    }
    if(r.genderMatch===false) autoReject=true;
    // Auto-accept: match locale già confermato OPPURE score >= 0.95 OPPURE confidence='confirmed'.
    // L'utente può sempre rifiutare manualmente cliccando X dopo.
    let autoAccept=false;
    if(!autoReject && name){
      const conf=r.match&&(r.match.confidence||r.match.verdict);
      if(conf==='confirmed') autoAccept=true;
      else if(typeof score==='number' && score>=0.85) autoAccept=true;
      else if(source==='locale' || source==='facedb') autoAccept=true;
    }
    W.reviewState[r.id]={
      name, action:autoReject?'rejected':(autoAccept?'accepted':'pending'),
      photoUrl, source, external_id:externalId, score
    };
  });
  const sortMode=S.wizSort||'occurrences';
  wiz.innerHTML=`<div class="wiz-head"><h3 style="margin:0">Suggerimenti</h3></div>
    <div class="wiz-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:11px;color:var(--t3);flex:1">Rivedi ogni cluster: accetta, modifica o rifiuta. Trascina per ordine personalizzato.</span>
        <span style="font-size:10px;color:var(--t3);white-space:nowrap">Ordina:</span>
        <select onchange="_wizSort(this.value)" style="height:var(--h-input);padding:0 8px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font-size:11px">
          <option value="occurrences" ${sortMode==='occurrences'?'selected':''}>Occorrenze ↓</option>
          <option value="confidence" ${sortMode==='confidence'?'selected':''}>Confidenza ↓</option>
          <option value="name" ${sortMode==='name'?'selected':''}>Nome A→Z</option>
          <option value="files" ${sortMode==='files'?'selected':''}>File ↓</option>
          <option value="manual" ${sortMode==='manual'?'selected':''}>Manuale</option>
        </select>
      </div>
      <div id="wizReviewList" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="wiz-foot" style="justify-content:space-between">
      <button class="mdl-btn" onclick="renderWizardSummary()">← Indietro</button>
      <div style="display:flex;gap:6px">
        <button class="mdl-btn" onclick="closeWizard()">Annulla</button>
        <button class="mdl-btn primary" onclick="applyWizardReview()">Applica tutto</button>
      </div>
    </div>`;
  _renderReviewCards();
}

// Cambia il criterio di ordinamento dei cluster nel wizard
function _wizSort(mode){
  S.wizSort=mode||'occurrences';
  try{saveConfig&&saveConfig();}catch(_){}
  _renderReviewCards();
}

function _wizSortedActive(active){
  const W=S._wizard; if(!W)return active;
  const mode=S.wizSort||'occurrences';
  const a=active.slice();
  if(mode==='manual'){
    const order=W._manualOrder||[];
    const pos=new Map(order.map((id,i)=>[id,i]));
    a.sort((x,y)=>(pos.has(x.id)?pos.get(x.id):1e9)-(pos.has(y.id)?pos.get(y.id):1e9));
    return a;
  }
  if(mode==='name'){
    a.sort((x,y)=>{
      const nx=(W.reviewState[x.id]&&W.reviewState[x.id].name)||'';
      const ny=(W.reviewState[y.id]&&W.reviewState[y.id].name)||'';
      return nx.localeCompare(ny);
    });
    return a;
  }
  if(mode==='confidence'){
    a.sort((x,y)=>{
      const sx=(W.reviewState[x.id]&&typeof W.reviewState[x.id].score==='number')?W.reviewState[x.id].score:-1;
      const sy=(W.reviewState[y.id]&&typeof W.reviewState[y.id].score==='number')?W.reviewState[y.id].score:-1;
      return sy-sx;
    });
    return a;
  }
  if(mode==='files'){
    a.sort((x,y)=>((y.files&&y.files.length)||0)-((x.files&&x.files.length)||0));
    return a;
  }
  // occurrences (default)
  a.sort((x,y)=>(y.count||0)-(x.count||0));
  return a;
}

        <div style="flex:1">
          <div style="font-size:12px;color:var(--t1);font-weight:600">Non riconosciuti (${rejected.length})</div>

function _wizDragStart(e,id){try{e.dataTransfer.setData('text/plain',String(id));e.dataTransfer.effectAllowed='move';}catch(_){}}
function _wizDrop(e,dstId){
  e.preventDefault();
  const W=S._wizard;if(!W)return;
  let srcId=null;try{srcId=+e.dataTransfer.getData('text/plain');}catch(_){}
  if(!srcId||srcId===dstId)return;
  const src=W.results.find(x=>x.id===srcId),dst=W.results.find(x=>x.id===dstId);
  if(!src||!dst)return;
  // Snapshot per undo
  W.undoStack.push({kind:'merge',srcSnap:JSON.parse(JSON.stringify(src)),dstSnap:JSON.parse(JSON.stringify(dst)),srcState:JSON.parse(JSON.stringify(W.reviewState[srcId]||{})),dstState:JSON.parse(JSON.stringify(W.reviewState[dstId]||{}))});
  // Merge files (dedup)
  const files=new Set([...(dst.files||[]),...(src.files||[])]);
  dst.files=Array.from(files);
  // Weighted avg embedding
  if(dst.avgEmbedding&&src.avgEmbedding&&dst.avgEmbedding.length===src.avgEmbedding.length){
    const na=dst.count||1,nb=src.count||1,tot=na+nb;
    dst.avgEmbedding=dst.avgEmbedding.map((v,i)=>(v*na+src.avgEmbedding[i]*nb)/tot);
  }
  dst.count=(dst.count||0)+(src.count||0);
  dst._mergedFrom=(dst._mergedFrom||[]).concat([srcId]);
  // Rimuovi src
  W.results=W.results.filter(r=>r.id!==srcId);
  delete W.reviewState[srcId];
  _renderReviewCards();
}
function _wizUndo(){
  const W=S._wizard;if(!W||!W.undoStack||!W.undoStack.length)return;
  const op=W.undoStack.pop();
  if(op.kind==='merge'){
    const dstIdx=W.results.findIndex(r=>r.id===op.dstSnap.id);
    if(dstIdx>=0)W.results[dstIdx]=op.dstSnap;
    // Reinserisci src dopo dst
    if(!W.results.find(r=>r.id===op.srcSnap.id))W.results.splice(dstIdx>=0?dstIdx+1:W.results.length,0,op.srcSnap);
    W.reviewState[op.srcSnap.id]=op.srcState;
    W.reviewState[op.dstSnap.id]=op.dstState;
  }
  _renderReviewCards();
}

function _wizSetName(id,val){
  const W=S._wizard;if(!W||!W.reviewState[id])return;
  const newName=String(val||'').trim();
  const st=W.reviewState[id];
  if(st.name===newName)return;
  st.name=newName;
  if(!newName){
    st.source=null; st.photoUrl=null; st.external_id=null; st.score=null; st.metadata=null;
    _renderReviewCards();
    return;
  }
  // Reset stato match precedente e lancia il resolver universale.
  st.source='__searching__'; st.photoUrl=null; st.external_id=null; st.score=null; st.metadata=null;
  st.action=st.action==='accepted'?'pending':st.action;
  _renderReviewCards();
  _wizRelookup(id, newName).catch(()=>{});
}

// Risolve il nome via main process (TMDB/MB/Wikipedia) e aggiorna la card.
async function _wizRelookup(id, name){
  const W=S._wizard; if(!W||!W.reviewState[id])return;
  const st=W.reviewState[id];
  const r=W.results.find(x=>x.id===id);
  const kindHint=(st.kindHint||(r&&(r.kindHint||r.type))||'auto');
  if(!window.maniac||!window.maniac.entityResolve){st.source=null;_renderReviewCards();return;}
  const tmdbKey=(S.wizardCfg&&S.wizardCfg.tmdbKey)||'';
  const out=await window.maniac.entityResolve({name, kindHint, tmdbKey});
  if(!W.reviewState[id]||W.reviewState[id].name!==name)return; // l'utente ha già cambiato di nuovo
  if(out&&out.ok&&out.result){
    const res=out.result;
    st.name=res.name||name;
    st.photoUrl=res.photoUrl||null;
    st.source=res.source||null;
    st.external_id=res.external_id||null;
    st.score=typeof res.score==='number'?res.score:null;
    st.metadata=res.metadata||null;
    if(typeof st.score==='number' && st.score>=0.85) st.action='accepted';
  } else {
    st.source=null;
  }
  _renderReviewCards();
}
// Typeahead StashDB: cache 5min in-memory, debounced 300ms, top-8 suggerimenti.
window._stashTypeCache=window._stashTypeCache||new Map();
function _wizNameTypeahead(id, input){
  const W=S._wizard; if(!W||!W.reviewState[id])return;
  W.reviewState[id].name=String(input.value||'').trim();
  const q=W.reviewState[id].name;
  // Chiudi dropdown se troppo corto o solo whitespace
  _wizNameTypeaheadClose(input);
  if(!q||q.length<2)return;
  // Debounce per-input
  if(input._taT)clearTimeout(input._taT);
  input._taT=setTimeout(async()=>{
    const cacheKey=q.toLowerCase();
    const cache=window._stashTypeCache;
    let items=null;
    const ent=cache.get(cacheKey);
    if(ent && (Date.now()-ent.ts < 5*60*1000)) items=ent.items;
    if(!items){
      const api=window.maniac&&window.maniac.stashdb;
      if(!api||!api.searchPerformer)return;
      try{
        const r=await api.searchPerformer(q,8);
        items=(r&&r.ok&&Array.isArray(r.items))?r.items:[];
        cache.set(cacheKey,{items,ts:Date.now()});
      }catch(_){items=[];}
    }
    // Verifica che l'input sia ancora attivo + valore inalterato
    if(!input.isConnected || (input.value||'').trim()!==q)return;
    // In parallelo lancia anche il resolver universale (TMDB/MB/Wiki) per arricchire la lista.
    let extDb=null;
    try{
      if(window.maniac && window.maniac.entityResolve){
        const tmdbKey=(S.wizardCfg&&S.wizardCfg.tmdbKey)||'';
        const W2=S._wizard; const r2=W2&&W2.reviewState&&W2.reviewState[id];
        const kindHint=(r2&&r2.kindHint)||'auto';
        const out=await window.maniac.entityResolve({name:q,kindHint,tmdbKey});
        if(out&&out.ok&&out.result) extDb=out.result;
      }
    }catch(_){}
    if(!input.isConnected || (input.value||'').trim()!==q)return;
    if(!items.length && !extDb)return;
    _wizNameTypeaheadOpen(input, id, items, extDb);
  },300);
}
function _wizNameTypeaheadClose(input){
  const wrap=input&&input.parentElement;
  if(!wrap)return;
  const dd=wrap.querySelector('.stash-typeahead');
  if(dd)dd.remove();
}
function _wizNameTypeaheadOpen(input, id, items, extDb){
  const wrap=input.parentElement; if(!wrap)return;
  _wizNameTypeaheadClose(input);

function _wizApplyStashSuggestion(id, performer){
  const W=S._wizard; if(!W||!W.reviewState[id])return;
  const st=W.reviewState[id];
  st.name=performer.name||st.name;
  st.photoUrl=performer.image||st.photoUrl;
  st.source='stashdb';
  st.external_id=performer.id||null;
  // score sconosciuto: l'utente ha confermato manualmente — usiamo 1.0 come "manual-stashdb"
  st.score=1.0;
  st.action='accepted';
  _renderReviewCards();
  // Persistenza immediata: associa subito il volto al performer nel DB locale
  // così la prossima analisi riconosce automaticamente senza intervento.
  try{
    const r=W.results.find(x=>x.id===id);
    if(r && r.avgEmbedding && window.maniac && window.maniac.ai && window.maniac.ai.faceDb){
      window.maniac.ai.faceDb.add({

        source:'stashdb', external_id:st.external_id||null
      }).then(res=>{
        if(res&&res.ok) toast(st.name+' aggiunto al DB volti');

function _randomTagColor(){return TAG_PALETTE_32[Math.floor(Math.random()*TAG_PALETTE_32.length)];}

function ensureFaceTag(label){ return ensureKindTag(label,'face'); }
function ensureKindTag(label,kind){
  kind=kind||'face';
  S.customTags=S.customTags||[];
  const existing=allTags().find(t=>t.label===label);
  if(existing){
    if(!existing.builtin){
      const idx=(S.customTags||[]).findIndex(t=>t.label===label);
      if(idx>=0){
        if(kind==='face'&&!S.customTags[idx].isFace)S.customTags[idx].isFace=true;
        if(!S.customTags[idx].kind)S.customTags[idx].kind=kind;
      }
    }
    return existing;
  }
  const tc={color:_randomTagColor(),label,kind};
  if(kind==='face')tc.isFace=true;
  S.customTags.push(tc);
  return tc;
}

async function applyWizardReview(){
  const W=S._wizard;if(!W)return;
  const faceDb=window.maniac&&window.maniac.ai&&window.maniac.ai.faceDb;
  const entityDb=window.maniac&&window.maniac.ai&&window.maniac.ai.entityDb;
  let applied=0, saved=0;
  for(const r of W.results){
    const st=W.reviewState[r.id];
    if(!st||st.action!=='accepted'||!st.name)continue;
    // Performer: face match con source StashDB → tipo logico "performer" (icona fiamma).
    const isPerformer=(r.type==='face') && (st.source==='stashdb' || st.source==='facedb-cache' || st.kindHint==='performer');
    const kindForTag=isPerformer?'performer':(r.type||'face');
    const tc=ensureKindTag(st.name,kindForTag);
    S._fileTags=S._fileTags||{};
    r.files.forEach(fp=>{
      const existing=S._fileTags[fp]||[];
      if(!existing.some(e=>e.label===tc.label)){existing.push({color:tc.color,label:tc.label});applied++;}
      S._fileTags[fp]=existing;
      S.players.forEach(p=>p&&p.playlist.forEach(f=>{
        if(f.path===fp){f.tags=f.tags||[];if(!f.tags.some(t=>t.label===tc.label))f.tags.push({color:tc.color,label:tc.label});}
      }));
    });
    const kind=r.type||'face';
    // Salva SEMPRE il volto nel DB locale quando abbiamo un embedding e un nome.
    // Anche per cache hits (facedb-cache) facciamo upsert: aggiorna foto/external_id
    // se il match StashDB è migliore di quello già salvato. Senza questo step,
    // un MATCH 100% del wizard non si traduceva in riconoscimento futuro automatico.
    if(faceDb&&kind==='face'&&r.avgEmbedding){
      try{
        const res=await faceDb.add({
          name:st.name,embedding:r.avgEmbedding,
          thumbnail:st.photoUrl||r.thumb||null, // preferisci foto DB
          source:st.source||'manual',
          external_id:st.external_id||null
        });
        if(res&&res.ok)saved++;
      }catch(e){}
    }
    // 2) DB unificato entities (qualunque kind: face/object/place/animal/genre/category)
    if(entityDb){
      try{
        await entityDb.add({
          kind, name:st.name,
          thumbnail:st.photoUrl||r.thumb||null,
          source:st.source||'manual', external_id:st.external_id||null,
          embedding:(kind==='face'&&r.avgEmbedding)?r.avgEmbedding:null,
          metadata:st.metadata||null
        });
      }catch(e){}
    }
    // Cronologia elementi analizzati. Preferisci la foto del database (StashDB/TMDB)
    // come thumb se disponibile — più pulita e riconoscibile del crop locale.
    const dbPhoto=st.photoUrl||null;
    pushAnalysisElement({
      type:kindForTag,name:st.name,
      thumb:dbPhoto||r.thumb||'',
      photoUrl:dbPhoto,
      files:r.files||[],
      avgEmbedding:r.avgEmbedding||null,source:st.source||null,
      external_id:st.external_id||null, metadata:st.metadata||null,
      tags:[{color:tc.color,label:tc.label}]
    });
  }
  persistFileTags();saveConfig();renderPanel();
  toast(applied+' file taggati · '+saved+' volti salvati');
  closeWizard();
}

async function runSubsGen(){
  const api=window.maniac&&window.maniac.subs; if(!api)return;

  }
  const r=await api.generate({jobId,video:path,lang,model});

async function importSubsFile(pid){

  const r=await api.openFile();

  // Lettura del file e creazione text track via Blob URL
  try{
    const fs=require?require('fs'):null;
    const txt = fs ? fs.readFileSync(r.path,'utf8') :
      await fetch('file:///'+r.path.replace(/\\/g,'/')).then(x=>x.text());
    const vtt=/\.vtt$/i.test(r.path)?txt:_srtToVtt(txt);
    const blob=new Blob([vtt],{type:'text/vtt'});
    const url=URL.createObjectURL(blob);
    const p=S.players[pid]; const vid=p&&p.vid;
    if(!vid){toast('Player non trovato');return;}
    // Rimuovi track precedenti add-by-import
    Array.from(vid.querySelectorAll('track[data-imported]')).forEach(t=>t.remove());
    const tr=document.createElement('track');
    tr.kind='subtitles';tr.label=r.path.split(/[\\\/]/).pop();tr.src=url;tr.srclang='auto';tr.dataset.imported='1';tr.default=true;
    vid.appendChild(tr);
    setTimeout(()=>{ try{ for(let i=0;i<vid.textTracks.length;i++){vid.textTracks[i].mode = (i===vid.textTracks.length-1)?'showing':'disabled';} }catch(_){} },50);
    toast('Sottotitoli caricati');
  }catch(e){toast('Errore import: '+e.message);}
}
function _srtToVtt(srt){
  return 'WEBVTT\n\n'+srt
    .replace(/\r+/g,'')
    .replace(/^\d+\s*$/gm,'')
    .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2')
    .replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

// ═══ Organizer side panel (header + recenti + snapshot + azioni rapide) ═══
// State: S.organizerRecents (array, persistito), S._orgPanelKindFilter, S._orgPanelSearch,
// S._orgPanelHidden, S._orgPanelSnaps (cache snapshot list).
const _ORG_KIND_EXT={
  video:['mp4','mkv','webm','mov','avi','m4v','flv','wmv','mpg','mpeg','ts','m2ts','ogv','3gp'],
  audio:['mp3','flac','m4a','aac','ogg','opus','wma','wav','aiff','aif','alac','ape'],
  image:['jpg','jpeg','png','bmp','webp','gif','tif','tiff'],
  doc:  ['txt','md','pdf','doc','docx','xls','xlsx','ppt','pptx','rtf','csv','json','xml','html','htm','srt','vtt','ass','sub']
};
function _orgKindOfPath(p){
  const m=(p||'').match(/\.([^.\\\/]+)$/);
  if(!m)return 'other';
  const ext=m[1].toLowerCase();
  for(const k in _ORG_KIND_EXT){if(_ORG_KIND_EXT[k].includes(ext))return k;}
  return 'other';
}
function _orgKindLabel(k){return ({all:'Tutti',video:'Video',audio:'Audio',image:'Immagini',doc:'Documenti',other:'Altri'}[k]||k);}
function _orgKindIcon(k){
  if(k==='video')return icon('film');
  if(k==='audio')return icon('music');
  if(k==='image')return icon('palette');
  if(k==='doc')return icon('object');
  return icon('folder');
}
async function _orgPanelRefreshSnaps(){
  try{
    if(!window.maniac||!window.maniac.organizer)return;
    const r=await window.maniac.organizer.snapshots();
    S._orgPanelSnaps=(r&&r.ok)?(r.snapshots||[]):[];
    if(S.panel==='organizer'&&typeof renderPanel==='function')renderPanel();
  }catch(_){S._orgPanelSnaps=[];}
}
async function _orgPanelExploreFolder(){
  const api=window.maniac||{};
  let chosen=null;
  if(api.chooseFolder){const r=await api.chooseFolder();if(r&&!r.canceled&&r.path)chosen=r.path;}
  if(!chosen&&api.openFolder){const r=await api.openFolder();if(r&&!r.canceled){chosen=r.folderPath||r.path||null;}}
  if(chosen&&api.showInFolder)api.showInFolder(chosen);
}
function _orgPanelClearRecents(){

  // ── RECENTI ──

        <span style="font-size:14px">${_orgKindIcon(x.kind)}</span>

  // ── SNAPSHOT ──
  const snaps=S._orgPanelSnaps||[];

  if(!snaps.length){

// ═══ Organizer wizard (5 step) ═══
const _orgState={step:1,sources:[],pref:{type:true,year:true,genre:false,actor:false},
  root:'',files:[],ops:[],jobId:null,results:null};

async function openOrganizerWizard(){
  _orgState.step=1; _orgState.files=[]; _orgState.ops=[]; _orgState.jobId=null; _orgState.results=null;
  const api=window.maniac&&window.maniac.organizer;
  if(!api){toast('Organizer IPC non disponibile');return;}
  if(!_orgState.bound&&api.onProgress){
    api.onProgress(evt=>_orgOnProgress(evt));
    _orgState.bound=true;
  }
  _orgRender();
}
function _orgRender(){
  let ov=document.getElementById('orgOv');
  if(!ov){ov=document.createElement('div');ov.id='orgOv';ov.className='wiz-ov';document.body.appendChild(ov);}
  ov.innerHTML=`<div class="wiz" style="width:680px;max-width:94vw">${_orgRenderStep()}</div>`;
  requestAnimationFrame(()=>ov.classList.add('show'));
}
function closeOrgWizard(){
  const ov=document.getElementById('orgOv');
  if(ov){ov.classList.remove('show');setTimeout(()=>ov.remove(),200);}
}
function _orgStepHeader(){
  const labels=['Cartelle','Preferenze','Analisi','Anteprima','Conferma'];
  return `<div class="wiz-head" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
    <h3 style="margin:0;display:flex;align-items:center;gap:10px">
      <span>Organizer</span>
      <span style="font:500 11px 'Inter';color:var(--t3)">Step ${_orgState.step}/5 — ${labels[_orgState.step-1]}</span>
    </h3>
    ${panelCloseBtn('closeOrgWizard()')}
  </div>`;
}
function _orgRenderStep(){
  if(_orgState.step===1)return _orgStep1();
  if(_orgState.step===2)return _orgStep2();
  if(_orgState.step===3)return _orgStep3();
  if(_orgState.step===4)return _orgStep4();
  return _orgStep5();
}

function _orgStep1(){
  const list=_orgState.sources.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:6px">
      <span style="flex:1;font:500 12px 'Inter';color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p}</span>
      <button class="mdl-btn" style="height:24px;padding:0 8px;font-size:10px" onclick="_orgState.sources.splice(${i},1);_orgRender()">×</button>

    <div class="wiz-body">
      <div style="font:400 12px/1.5 'Inter';color:var(--t2);margin-bottom:12px">Seleziona una o più cartelle da analizzare. Nessun file viene spostato finché non confermi alla fine.</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">${list}</div>
      <button class="mdl-btn" style="width:100%" onclick="_orgPickSource()">+ Aggiungi cartella</button>

      <button class="mdl-btn primary" onclick="_orgGoStep2()">Avanti →</button>
    </div>`;
}
async function _orgPickSource(){
  // Preferisci chooseFolder (ritorna {path}); se assente, usa openFolder che ritorna {folderPath}
  const api=window.maniac||{};
  let chosen=null;
  if(api.chooseFolder){
    const r=await api.chooseFolder();
    if(r&&!r.canceled&&r.path)chosen=r.path;
  }
  if(!chosen&&api.openFolder){
    const r=await api.openFolder();
    if(r&&!r.canceled){chosen=r.folderPath||r.path||null;}
  }
  if(chosen&&!_orgState.sources.includes(chosen)){_orgState.sources.push(chosen);_orgRender();}
}
async function _orgPickRoot(){
  const api=window.maniac||{};
  let chosen=null;
  if(api.chooseFolder){
    const r=await api.chooseFolder();
    if(r&&!r.canceled&&r.path)chosen=r.path;
  }
  if(!chosen&&api.openFolder){
    const r=await api.openFolder();
    if(r&&!r.canceled){chosen=r.folderPath||r.path||null;}
  }
  if(chosen){_orgState.root=chosen;_orgRender();}
}
function _orgGoStep2(){
  const root=document.getElementById('orgRoot');

  if(!_orgState.root){toast('Seleziona la destinazione');return;}
  _orgState.step=2; _orgRender();
}

  const ck=(k,lbl,help)=>`
    <label style="display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:${_orgState.pref[k]?'var(--pd)':'var(--s2)'}">

      </div>

      <div style="font:400 12px/1.5 'Inter';color:var(--t2);margin-bottom:12px">Come vuoi raggruppare i file? Le opzioni si combinano (es: Tipo + Anno → /Movies/2024/…).</div>

      </div>

      <button class="mdl-btn primary" onclick="_orgRunScan()">Analizza →</button>
    </div>`;

async function _orgRunScan(){
  _orgState.step=3; _orgState.results=null; _orgRender();
  const api=window.maniac.organizer;
  const jobId='org_'+Date.now(); _orgState.jobId=jobId;
  const r=await api.scan({jobId,folders:_orgState.sources,max:5000});

}

async function _orgGoStep4(files){
  _orgState.files=files||[];
  // Calcola operations via IPC
  const by=Object.entries(_orgState.pref).filter(([_,v])=>v).map(([k])=>k);
  const r=await window.maniac.organizer.buildOps({files:_orgState.files,root:_orgState.root,by});
  if(!r||!r.ok){toast('Build ops fallito: '+(r&&r.error||''));return;}
  _orgState.ops=r.ops||[]; _orgState.step=4; _orgRender();
}
function _orgStep4(){
  const ops=_orgState.ops||[];
  const rows=ops.slice(0,200).map(o=>`
    <div style="display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:11px">

function _orgOnProgress(evt){
  if(!_orgState.jobId||evt.jobId!==_orgState.jobId)return;
  const ph=document.getElementById('orgPhase'),fn=document.getElementById('orgFile'),
        bar=document.getElementById('orgBar'),txt=document.getElementById('orgTxt');
  if(evt.type==='phase'&&ph)ph.textContent=evt.text||'';
  else if(evt.type==='progress'){
    const cur=evt.current||0,tot=evt.total||0;
    if(fn&&evt.file)fn.textContent=(evt.file||'').split(/[\\\/]/).pop();
    if(tot){const pct=Math.round((cur/tot)*100);if(bar)bar.style.width=pct+'%';if(txt)txt.textContent=cur+' / '+tot+' file';}
    else if(txt)txt.textContent=String(cur)+' file';
  }
  else if(evt.type==='warn'){console.warn('[organizer]',evt.error);}
  else if(evt.type==='done'){
    if(_orgState.step===3){_orgGoStep4(evt.files||[]);}
    else if(_orgState.step===5){
      _workerDec('organizer'); // job execute terminato
      _orgState.results={moved:evt.moved,failed:evt.failed,snapshot:evt.snapshot};
      // Traccia operazione completata in S.organizerRecents (pannello laterale Organizer)
      try{
        if(!Array.isArray(S.organizerRecents))S.organizerRecents=[];
        S.organizerRecents.unshift({
          ts:Date.now(),
          moved:evt.moved||0,
          failed:evt.failed||0,
          snapshot:evt.snapshot||'',
          sources:[...(_orgState.sources||[])],
          root:_orgState.root||'',
          sample:(_orgState.ops||[]).slice(0,12).map(o=>({from:o.from,to:o.to}))
        });
        S.organizerRecents=S.organizerRecents.slice(0,50);
        saveConfig&&saveConfig();
        if(S.panel==='organizer'&&typeof renderPanel==='function')renderPanel();
      }catch(_){}
      _orgRender();
    }
  }
  else if(evt.type==='error'){
    if(_orgState.step===5)_workerDec('organizer');
    toast('Errore: '+(evt.error||''));
  }
}

function abLoopClick(pid,btn){
  const p=P(pid); if(!p||!p.vid){toast('Nessun video');return;}
  p.abLoop=p.abLoop||{a:null,b:null,on:false,h:null};
  const t=p.vid.currentTime||0;
  if(p.abLoop.a===null){
    p.abLoop.a=t;
    toast('A impostato a '+fmtTime(t)+' — clicca di nuovo per B');
  } else if(p.abLoop.b===null){
    if(t<=p.abLoop.a){toast('B deve essere dopo A');return;}
    p.abLoop.b=t;p.abLoop.on=true;
    if(p.abLoop.h){try{p.vid.removeEventListener('timeupdate',p.abLoop.h);}catch(_){}}
    p.abLoop.h=()=>{ if(!p.abLoop||!p.abLoop.on)return; if(p.vid.currentTime>=p.abLoop.b||p.vid.currentTime<p.abLoop.a-.1){try{p.vid.currentTime=p.abLoop.a;}catch(_){}}};
    p.vid.addEventListener('timeupdate',p.abLoop.h);
    btn.classList.add('on');
    toast('Loop A-B: '+fmtTime(p.abLoop.a)+' → '+fmtTime(p.abLoop.b));
  } else {
    abLoopReset(pid,btn);
  }
}
function abLoopReset(pid,btn){
  const p=P(pid); if(!p)return;
  if(p.abLoop&&p.abLoop.h&&p.vid){try{p.vid.removeEventListener('timeupdate',p.abLoop.h);}catch(_){}}
  p.abLoop={a:null,b:null,on:false,h:null};
  if(btn)btn.classList.remove('on');
  toast('Loop A-B disattivato');
}

// Analisi "mock" ma reale: estrae anno/lingua dal nome, assegna attore da elenco comune
function runAnalyze(){
  const all=allFiles();
  if(!all.length){toast(t('loadFilesFirst')||'Carica file prima di analizzare');return;}
  const LANG_HINTS={ita:'Italiano',eng:'English',ger:'Deutsch',fre:'Français',spa:'Español',jpn:'日本語',kor:'한국어',chi:'中文',rus:'Русский'};
  let count=0;
  all.forEach(f=>{
    const nm=(f.name||'').toLowerCase();
    // Anno (1900-2099)
    if(!f.year){const m=nm.match(/(19|20)\d{2}/);if(m)f.year=+m[0];}
    // Lingua
    if(!f.language){
      for(const k in LANG_HINTS){if(nm.includes(k)||nm.includes('['+k+']')||nm.includes('.'+k+'.')){f.language=LANG_HINTS[k];break;}}
      if(!f.language&&/\b(sub\s*ita|ita\s*sub)\b/i.test(nm))f.language='Italiano';
    }
    // Attore: euristica, cerca "nome cognome" (2 parole capitalizzate)
    if(!f.actor){
      const base=(f.name||'').replace(/\.[^.]+$/,'').replace(/[._-]/g,' ');
      const mt=base.match(/\b([A-Z][a-z]{2,})\s+([A-Z][a-z]{2,})\b/);
      if(mt&&!['Season','Episode','Episodio','Volume'].includes(mt[1]))f.actor=mt[1]+' '+mt[2];
    }
    count++;
  });
  saveConfig();
  toast((t('analyzed')||'Analizzati')+' '+count+' file');
  renderPanel();
}

// Player balls selector: 2x2 grid di cerchi. sel=-1 → ALL (tutti outline); sel=0..N-1 → uno pieno.
// Ritorna una stringa HTML con N+1 pulsanti: ALL + per ogni player.
function renderPlayerBalls(sel, count, onClickFn, opts){
  const n=Math.max(1,count||1);
  const fn=onClickFn||'';
  const skipAll=!!(opts&&opts.skipAll);
  const ball=(pid,active)=>{
    // pid=-1 → ALL: tutti outline. Altrimenti il cerchio in posizione pid è pieno.
    const circles=[];
    for(let i=0;i<4;i++){
      const cx=i%2===0?6:14, cy=i<2?6:14;
      const isActive=(pid===-1&&active)||(pid===i&&active);
      const isFilled=(pid===-1)?false:(i===pid);
      circles.push(`<circle cx="${cx}" cy="${cy}" r="3.2" ${isFilled?'class="on" fill="var(--p)"':'class="off" fill="none" stroke="currentColor" stroke-width="1.3"'}/>`);
    }
    const label=pid===-1?'ALL':('P'+(pid+1));
    const title=pid===-1?'Tutti i player':('Player '+(pid+1));
    return `<button class="pb ${active?'on':''}" title="${title}" aria-label="${label}" onclick="${fn.replace('%p',pid)}"><svg viewBox="0 0 20 20">${circles.join('')}</svg></button>`;
  };
  const all=skipAll?'':ball(-1,sel===-1);
  const players=Array.from({length:n},(_,i)=>ball(i,sel===i)).join('');
  return `<div class="pb-row">${all}${players}</div>`;
}
