[data-theme="light"] .st-tabs-grid .file-grid-btn:hover,
[data-theme="light"] .stab-btn:hover{background:#F0EDF4!important;color:#7B5EA7!important;border-color:#C4BAD0!important}
[data-theme="light"] .file-grid-btn.on,
[data-theme="light"] .file-grid-btn.primary,
[data-theme="light"] .st-tabs-grid .file-grid-btn.on,
[data-theme="light"] .stab-btn.on{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}
[data-theme="light"] .file-grid-btn.on:hover,
[data-theme="light"] .st-tabs-grid .file-grid-btn.on:hover{background:#6B4E97!important;border-color:#6B4E97!important}

/* Equalizzatore + slider audio + sezioni knob */
[data-theme="light"] .eq{background:#FFFFFF!important;border-top:1px solid #DCD6E3!important}
[data-theme="light"] .knob,
[data-theme="light"] .knob-bg,
[data-theme="light"] .knob-circle{background:#FFFFFF!important;border:1px solid #DCD6E3!important}
[data-theme="light"] .knob-track{background:#F0EDF4!important}
[data-theme="light"] .knob-lbl{color:#5B5B75!important}
[data-theme="light"] .knob-val{color:#1A1A2E!important}
[data-theme="light"] input[type=range]{background:transparent!important}
[data-theme="light"] input[type=range]::-webkit-slider-runnable-track{background:#DCD6E3!important;height:4px;border-radius:2px}
[data-theme="light"] input[type=range]::-webkit-slider-thumb{background:#7B5EA7!important;border:2px solid #FFFFFF!important}

/* Linee separatrici */
[data-theme="light"] hr,
[data-theme="light"] .sg-hdr,
[data-theme="light"] .st-tabs-grid,
[data-theme="light"] .sg-row,
[data-theme="light"] .pl-item{border-color:#DCD6E3!important}
[data-theme="light"] .pl-item{border-bottom:1px solid #DCD6E3!important}

/* Wizard / dialoghi modali */
[data-theme="light"] .wiz,
[data-theme="light"] .wiz-body,
[data-theme="light"] .wiz-foot,
[data-theme="light"] .mdl,
[data-theme="light"] .mdl-msg,
[data-theme="light"] .ai-box,
[data-theme="light"] .wiz-rev-card,
[data-theme="light"] .wiz-tile,
[data-theme="light"] .wiz-act-btn{background:#FFFFFF!important;border-color:#DCD6E3!important;color:#1A1A2E!important}
[data-theme="light"] .wiz-rev-card{background:#FFFFFF!important}
[data-theme="light"] .wiz-rev-card:hover,
[data-theme="light"] .wiz-tile:hover,
[data-theme="light"] .wiz-act-btn:hover{background:#F0EDF4!important;border-color:#C4BAD0!important}
[data-theme="light"] .wiz-btn,
[data-theme="light"] .mdl-btn{background:#F0EDF4!important;color:#1A1A2E!important;border-color:#DCD6E3!important}
[data-theme="light"] .wiz-btn:hover,
[data-theme="light"] .mdl-btn:hover{background:#E4DEEC!important}
[data-theme="light"] .wiz-btn.primary,
[data-theme="light"] .mdl-btn.primary,
[data-theme="light"] .wiz-act-btn.on-acc{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}
[data-theme="light"] .wiz-act-btn.on-rej{background:#E05565!important;color:#FFFFFF!important;border-color:#E05565!important}

/* Sub-dialoghi (cookie banner, search wizard SC) */
[data-theme="light"] .wiz-head{background:#FFFFFF!important;color:#1A1A2E!important;border-bottom:1px solid #DCD6E3!important}
[data-theme="light"] .wiz-foot{background:#F8F6FB!important}

/* Toast / pill / log entries */
[data-theme="light"] .log-item{background:#FFFFFF!important;border-color:#DCD6E3!important;color:#1A1A2E!important}
[data-theme="light"] .pl-pswitch,
[data-theme="light"] .seg{background:#F0EDF4!important;border-color:#DCD6E3!important}

/* Element-selector + filter chips ed altre kind chips */
[data-theme="light"] .pchip,
[data-theme="light"] .ai-el-chip,
[data-theme="light"] .multi-dd .mdd-opt{background:#F0EDF4!important;color:#1A1A2E!important;border-color:#DCD6E3!important}
[data-theme="light"] .pchip.on{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}

/* Top header row (.tb) → forza in caso ci siano regioni rimaste dark */
[data-theme="light"] .tb,
[data-theme="light"] .tb .mb,
[data-theme="light"] .topbar{background:#FFFFFF!important;color:#1A1A2E!important;border-color:#DCD6E3!important}
[data-theme="light"] .tb .mb>button,
[data-theme="light"] .tb .ib{color:#1A1A2E!important}
[data-theme="light"] .tb .mb>button:hover,
[data-theme="light"] .tb .ib:hover{background:#F0EDF4!important;color:#7B5EA7!important}

/* Wizard StreamingCommunity overlay */
[data-theme="light"] .sc-detail,
[data-theme="light"] .sc-row,
[data-theme="light"] .sc-card{background:#FFFFFF!important;color:#1A1A2E!important;border-color:#DCD6E3!important}
[data-theme="light"] .sc-card .sc-meta,
[data-theme="light"] .sc-card .sc-name{color:#1A1A2E!important}

/* Side panel scrollbar + hover */
[data-theme="light"] .sp,
[data-theme="light"] .sp-body,
[data-theme="light"] #sideP{background:#F8F6FB!important;color:#1A1A2E!important}
[data-theme="light"] .sp-head{background:#FFFFFF!important;border-bottom:1px solid #DCD6E3!important;color:#1A1A2E!important}

/* ═══ Multi-mode: barre sempre visibili su ogni cella (stile big) ═══ */
body.multi-mode .vc-toolbar{display:flex!important}
/* Toolbar visibile sempre, anche su player vuoti */
.vc.empty .vc-toolbar{opacity:.55}
.vc.empty{border:0!important;background:transparent!important}
.vc.empty.active{border:0!important}
/* Modalità live (webcam/stream): nascondi progress + timeline, mostra recording UI */
.vc.live .vc-progress,.vc.live .vc-tc,.vc.live .vc-td,.vc.live [data-prev],.vc.live [data-next],.vc.live [data-loop],.vc.live [data-shuf]{display:none!important}
.vc.live .vc-rec-area{display:flex!important}
.vc-rec-area{display:none;align-items:center;gap:6px;flex:1;margin:0 6px;justify-content:center}
.vc-rec-btn{background:transparent;border:1px solid rgba(255,255,255,.18);color:#fff;width:28px;height:24px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s}
.vc-rec-btn:hover{background:rgba(255,255,255,.1)}
.vc-rec-btn.rec-start{color:#E05565}
.vc-rec-btn.on{background:rgba(224,85,101,.25);border-color:#E05565}
.vc-rec-timer{font:700 12px/1 'JetBrains Mono',monospace;color:#fff;min-width:68px;text-align:center;padding:4px 6px;border-radius:4px;background:rgba(0,0,0,.4);display:inline-flex;align-items:center;gap:5px}
.vc-rec-timer.on{color:#E05565}
.vc-rec-timer .rd{width:8px;height:8px;border-radius:50%;background:#E05565;display:inline-block}
.vc-rec-timer.on .rd{animation:recPulse 1s infinite}
/* Multi toolbars: same colors as P0, just slightly smaller */
body.multi-mode .vc-toolbar{height:38px;padding:0 8px;gap:3px}
body.multi-mode .vc-toolbar .vc-btn{width:26px;height:26px;border-radius:5px}
body.multi-mode .vc-toolbar .vc-btn svg{width:13px!important;height:13px!important}
body.multi-mode .vc-toolbar .vc-play{width:30px;height:30px}
body.multi-mode .vc-toolbar .vc-play svg{width:14px!important;height:14px!important}
body.multi-mode .vc-time{font-size:10px;min-width:38px}

/* ═══ Settings: layout flex dinamico ═══ */
.st-body{display:flex;flex-direction:column;gap:6px}
.st-body .sg{margin-bottom:14px;min-width:0}

/* ═══ Animazioni fluide ovunque ═══ */
.dd,.ctx,.multi-dd{animation:fadeIn .14s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.seg-b,.info-btn,.theme-btn,.ib,.mb>button{transition:all .15s}
.vc{transition:outline-color .15s}
.vol-fill,.vc-pf{transition:width .1s linear}

/* ═══ Range input più cliccabile ═══ */
input[type=range]{height:16px;background:transparent;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--s3);border-radius:2px}
input[type=range]::-webkit-slider-thumb{margin-top:-4.5px}

/* ═══ Audio delay editor ═══ */
.ms-edit{display:flex;align-items:center;gap:6px;margin-top:4px}
.ms-edit input[type=number]{width:72px;padding:5px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:400 11px 'JetBrains Mono',monospace;text-align:right}
.ms-edit button{background:var(--s2);border:1px solid var(--bd);color:var(--t2);width:24px;height:24px;border-radius:4px;cursor:pointer}

/* ═══ Zoom dropup (magnifier) ═══ */
.zoom-dropup{position:fixed;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:4px 0;min-width:140px;display:flex;flex-direction:column;gap:0;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.45);animation:fadeIn .12s ease-out}
.zoom-dropup .dd-item{padding:8px 14px;font-size:12px;color:var(--t1);cursor:pointer;transition:background .1s;border-radius:4px}
.zoom-dropup .dd-item:hover{background:var(--p);color:#fff}

/* ═══ UNIFIED TOOLBAR (usata per P0 single + P1..P4 multi) ═══ */
.vc-toolbar{height:44px;background:var(--s1);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:4px;flex-shrink:0;flex-wrap:nowrap;overflow:hidden;min-width:0}
.vc.multi .vc-toolbar{height:38px;padding:0 8px;gap:3px}
.vc-toolbar .vc-btn{background:0;border:0;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:5px;transition:all .12s;padding:0;flex:0 0 28px;min-width:0;font:700 14px/1 'Inter',sans-serif}
/* C3: allineamento globale icone/glifi nei pulsanti transport (no piu' icone disallineate fra prev/next e ±10) */
.vc-toolbar .vc-btn svg{display:block;margin:auto;width:14px;height:14px}
.transport .cb svg{display:block;margin:auto}
.transport .cb{display:flex;align-items:center;justify-content:center;line-height:1}
.vc-toolbar .vc-play{flex:0 0 34px!important}
.vc.multi .vc-toolbar .vc-btn{flex:0 0 24px}
.vc.multi .vc-toolbar .vc-play{flex:0 0 28px!important}
.vc.multi .vc-toolbar .vc-btn{width:24px;height:24px;border-radius:4px}
.vc-toolbar .vc-btn:hover{color:var(--pl);background:var(--pd)}
.vc-toolbar .vc-btn.on{color:var(--p);background:var(--pd)}
.vc-toolbar .vc-play{background:var(--p);color:#fff;width:34px;height:34px;border-radius:8px;box-shadow:0 2px 10px rgba(123,94,167,.28)}
.vc.multi .vc-toolbar .vc-play{width:28px;height:28px;border-radius:6px}
.vc-toolbar .vc-play:hover{filter:brightness(1.15);background:var(--p);color:#fff}
.vc-toolbar .vc-time{font:600 10px/1 'JetBrains Mono',monospace;color:var(--t3);min-width:36px;text-align:center}
.vc.multi .vc-toolbar .vc-time{font-size:9px;min-width:32px}
.vc-vol{display:flex;align-items:center;margin:0 2px}
.vc-toolbar .vc-btn.ov-hide{display:none!important}
.vc-toolbar [data-overflow]{display:none}
.vc-toolbar.has-overflow [data-overflow]{display:flex}
.vc-ov-menu{position:fixed;z-index:9999;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(4,32px);gap:4px;backdrop-filter:blur(4px)}
.vc-ov-menu .vc-btn{background:0;border:0;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;padding:0;flex:0 0 32px}
.vc-ov-menu .vc-btn:hover{background:var(--p);color:#fff}
.main-progress{display:none!important}
.bot{display:none!important}
.cell-badge{display:none!important}
.rec-btn{background:transparent;border:none;color:var(--t3);cursor:pointer;padding:5px;border-radius:6px;display:flex;align-items:center;gap:4px;font-size:11px}
.rec-btn:hover{color:var(--t1);background:var(--s2)}
.rec-btn.on{color:#E05565}
.rec-btn.on .rec-dot{animation:recPulse 1s infinite}
.rec-dot{width:8px;height:8px;background:#E05565;border-radius:50%;display:inline-block}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.3}}
.mag-mini{position:absolute;bottom:52px;right:12px;width:220px;height:130px;background:rgba(0,0,0,.75);border:1px solid var(--bd);border-radius:6px;z-index:48;overflow:hidden;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.5);user-select:none}
.mag-mini canvas{width:100%;height:100%;display:block;pointer-events:none}
.mag-mini-rect{position:absolute;border:2px solid var(--p);background:rgba(123,94,167,.18);cursor:grab;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.mag-mini-rect:active{cursor:grabbing;background:rgba(123,94,167,.3)}
.vc video.magnified{transform-origin:var(--mag-ox,50%) var(--mag-oy,50%);transform:scale(var(--mag-z,1));transition:transform .08s linear}
.sub-ov{position:absolute;bottom:48px;left:0;right:0;text-align:center;color:var(--sub-color,#fff);font:600 var(--sub-size,18px)/1.3 'Inter';text-shadow:0 2px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.9);padding:0 40px;pointer-events:none;z-index:45;white-space:pre-wrap}
.sub-ov.title-start-ov{font:inherit}
.meter{position:relative;height:16px;background:var(--s3);border-radius:3px;overflow:hidden;contain:layout paint style;isolation:isolate}
.meter-fill{height:100%;width:0%;background:#4CAF7D;will-change:width;contain:layout paint size}
.meter-gate{position:absolute;top:-2px;bottom:-2px;width:2px;background:#E05565;pointer-events:none}
.vc-vol-bar{width:36px;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.vc-vol-fill{height:100%;background:var(--pl);border-radius:2px}

/* Multi dropdown */
.multi-dd{position:absolute;top:100%;left:0;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:6px;z-index:1000;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5);margin-top:4px;width:148px}
.multi-dd.show{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mdd-opt{padding:8px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--bd);transition:all .12s}
.mdd-opt:hover,.mdd-opt.on{border-color:var(--p);background:var(--pd)}
/* Anteprima player: pallini stile .m-dot (coerenti col multi-button del topbar) */
.mdd-prev{display:inline-grid;gap:5px;padding:4px;background:transparent}
.mdd-prev div{width:7px;height:7px;border-radius:50%;background:var(--p);box-shadow:0 0 4px rgba(123,94,167,.5)}
.mdd-prev[data-n="1"]{grid-template-columns:1fr}
.mdd-prev[data-n="2"]{grid-template-columns:1fr 1fr}
.mdd-prev[data-n="3"]{grid-template-columns:repeat(3,1fr)}
.mdd-prev[data-n="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mdd-lbl{font:700 10px/1 'Inter';color:var(--t2)}

/* Multi dots (M-logo) */
.multi-label{display:inline-grid;grid-template-columns:6px 6px;grid-template-rows:6px 6px;gap:3px;margin-left:6px;vertical-align:middle;overflow:visible}

.pl-tg-num{font:800 8px/1 'JetBrains Mono',monospace}

/* Playlist panel per-player chips */
.pl-pswitch{display:flex;gap:4px}
.pl-pchip{flex:1;padding:5px 0;border-radius:5px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);font:700 10px/1 'Inter';cursor:pointer;transition:all .12s}
.pl-pchip:hover:not(.on){background:var(--p);color:#fff;border-color:var(--p)}
.pl-pchip.on{background:var(--c,var(--p));color:#fff;border-color:var(--c,var(--p))}

/* History */
.hist-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;margin-bottom:3px;transition:background .12s}
.hist-item:hover{background:var(--s2)}
.hist-info{flex:1;min-width:0;cursor:pointer}
.hist-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-meta{font:400 10px/1 'JetBrains Mono',monospace;color:var(--t3);margin-top:3px}
.hist-btn{background:var(--pd);border:0;color:var(--p);width:26px;height:26px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hist-btn:hover{background:var(--p);color:#fff}

/* Logs */
.log-item{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:6px;background:var(--s2);border:1px solid var(--bd);margin-bottom:5px;border-left:3px solid var(--err)}
.log-item .log-ts{font:600 10px/1 'JetBrains Mono',monospace;color:var(--t3)}
.log-item .log-msg{font-size:11px;color:var(--t1);word-break:break-word}
.log-item .log-extra{font:400 10px/1.3 'JetBrains Mono',monospace;color:var(--t3);margin-top:2px;opacity:.85;word-break:break-all}

/* Wizard */
.wiz-ov{position:fixed;inset:0;background:rgba(5,5,10,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:10060;opacity:0;pointer-events:none;transition:opacity .18s}
.wiz-ov.show{opacity:1;pointer-events:auto}
.wiz{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.6);width:560px;height:560px;max-width:92vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.wiz[data-step="1"]{height:auto;max-height:92vh}
.wiz[data-step="1"] .wiz-body{overflow:hidden}
.wiz[data-step="1"] .wiz-opts{grid-auto-rows:auto;gap:8px;margin-bottom:12px}
.wiz[data-step="1"] .wiz-btn{aspect-ratio:auto;height:74px;padding:8px 6px}
.wiz[data-step="1"] .wiz-btn svg, .wiz[data-step="1"] .wiz-btn img.mi{width:20px!important;height:20px!important}
.wiz-head{padding:18px 22px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.wiz-body{flex:1;overflow-y:auto;padding:16px 22px;min-height:0;scrollbar-gutter:stable}
.wiz-foot{padding:12px 22px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;background:var(--s1)}
.wiz-foot .wiz-foot-r{display:flex;gap:var(--gap-sm)}
.wiz h3{font:700 15px 'Inter';color:var(--p);margin:0}
.wiz-opts{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;margin-bottom:16px}
.wiz-btn{height:auto!important;aspect-ratio:1/.95;padding:10px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:600 11px/1.2 'Inter';cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .15s;min-height:0}
.wiz-btn:hover{border-color:var(--p);background:var(--pd);transform:translateY(-1px)}
.wiz-btn.on{border-color:var(--p);background:var(--pd);color:var(--p);box-shadow:0 0 0 2px rgba(141,108,192,.25)}
.wiz-btn svg, .wiz-btn img.mi{width:24px!important;height:24px!important}

/* UFO scan animation */
.ufo-scan{position:relative;height:120px;display:flex;align-items:flex-start;justify-content:center;margin:8px 0 14px;overflow:hidden;background:linear-gradient(180deg, transparent 0%, rgba(141,108,192,.06) 100%);border-radius:10px}
.ufo-scan .ufo{width:64px;height:64px;position:relative;animation:ufoHover 2.4s ease-in-out infinite alternate;filter:drop-shadow(0 4px 10px rgba(141,108,192,.55))}
.ufo-scan .ufo img.mi, .ufo-scan .ufo svg{width:64px!important;height:64px!important;color:#8d6cc0}
.ufo-scan .beam{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:64px solid rgba(141,108,192,.28);filter:drop-shadow(0 0 12px rgba(141,108,192,.8));animation:beamPulse 1.2s ease-in-out infinite}
.ufo-scan .laser{position:absolute;top:112px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#c0aae2,#8d6cc0,#c0aae2,transparent);box-shadow:0 0 8px #8d6cc0;animation:laserSweep 1.6s linear infinite;border-radius:2px}
@keyframes ufoHover{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-6px) rotate(3deg)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes wizEq1{0%{height:8px}100%{height:32px}}
@keyframes wizEq2{0%{height:14px}100%{height:24px}}
@keyframes wizEq3{0%{height:6px}100%{height:36px}}
@keyframes beamPulse{0%,100%{opacity:.45;border-top-color:rgba(141,108,192,.25)}50%{opacity:.9;border-top-color:rgba(141,108,192,.55)}}
@keyframes laserSweep{0%{transform:translateX(-30%);opacity:.2}50%{opacity:1}100%{transform:translateX(30%);opacity:.2}}
.wiz-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.wiz-thumb{border:2px solid var(--bd);border-radius:6px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:16/9;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t3);text-align:center;padding:4px}
.wiz-thumb.sel{border-color:var(--p);box-shadow:0 0 0 2px var(--pd)}
.wiz-thumb img{width:100%;height:100%;object-fit:cover}
.wiz-thumb .wiz-lbl{position:absolute;bottom:2px;left:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:2px 4px;border-radius:3px;text-align:center}
.wiz-rev-card{display:flex;gap:10px;align-items:center;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;cursor:grab;transition:border-color .15s,background .15s,transform .12s,box-shadow .15s}
.wiz-rev-card:hover{border-color:var(--p);background:var(--pd);transform:translateY(-1px);box-shadow:0 2px 12px rgba(141,108,192,.18)}
.wiz-rev-card.accepted{border-left:3px solid var(--p)}
.wiz-rev-card.rejected{opacity:.6;border-left:3px solid var(--t3)}
.wiz-rev-card.drop-tgt{border-color:var(--p);background:var(--pd);box-shadow:inset 0 0 0 2px var(--p)}
.wiz-act-btn{width:24px;height:24px;padding:0;border-radius:4px;border:1px solid var(--bd);background:var(--s1);color:var(--t1);font:700 12px/1 'Inter';cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.wiz-act-btn:hover{border-color:var(--p);background:var(--pd);color:var(--p)}
.wiz-act-btn.on-acc{background:var(--p);color:#fff;border-color:var(--p)}
.wiz-act-btn.on-rej{background:var(--s3);color:var(--t1);border-color:var(--t3)}

/* ════════════════════════════════════════════════════════════════
   MANIAC 2.0 — LEGACY OVERRIDES (cascade winner: ultimo blocco)
   Ridisegna i componenti vecchi senza rinominare classi.
   ════════════════════════════════════════════════════════════════ */
/* Side panel — header micro accent + body padding */
.sp{width:440px;background:var(--bg-elev-1);border-right:1px solid var(--stroke)}
.sp-head{height:52px;padding:0 20px;border-bottom:1px solid var(--stroke)}
.sp-title{font:600 10px/12px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sp-close{color:var(--text-3);width:28px;height:28px;border-radius:6px;align-items:center;justify-content:center}
.sp-close:hover{background:var(--bg-elev-2);color:var(--text-1)}
.sp-body{padding:20px}

/* Bottom bar e transport — leggero refresh */
.bot{background:var(--bg-elev-1);border-top:1px solid var(--stroke);height:54px;padding:0 16px;gap:8px}
.cb{color:var(--text-2);width:32px;height:32px;border-radius:8px}
.cb:hover{color:var(--accent-hi);background:var(--bg-elev-2)}
.cb.play{background:var(--accent);color:#fff;width:38px;height:38px;border-radius:12px;box-shadow:0 4px 14px rgba(139,111,209,.35)}

/* Settings tabs grid (file-grid look) */
.st-tabs-grid{padding:12px!important;gap:8px!important;border-bottom:1px solid var(--stroke);background:transparent;display:grid!important;grid-template-columns:repeat(4,1fr)!important}
.st-tabs-grid .file-grid-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border:1px solid var(--bd);border-radius:8px;background:var(--s2);color:var(--t1);font:600 10px/1.2 'Inter',sans-serif;cursor:pointer;transition:all .15s;min-height:72px;text-align:center}
.st-tabs-grid .file-grid-btn:hover{background:var(--pd);border-color:var(--p);color:var(--pl);transform:translateY(-1px)}
.st-tabs-grid .file-grid-btn.on{background:var(--p);border-color:var(--p);color:#fff}
.st-tabs-grid .file-grid-btn.on:hover{background:var(--pl);border-color:var(--pl);color:#fff}
/* Player chip + cycle — proporzioni nuove ma SVG sphere intoccata */
.pcyc,.pb{height:32px;width:32px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--bg-elev-2)}
.pl-pchip{height:32px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--bg-elev-2);box-sizing:border-box}
.pl-pchip:hover,.pcyc:hover,.pb:hover{background:var(--bg-elev-3);border-color:var(--accent)}
.pcyc.on,.pb.on{background:var(--accent-tint);border-color:var(--accent-hi)}
.pcyc svg,.pb svg{width:16px;height:16px}
.pb-lg{width:64px;height:64px;border-radius:var(--r-md)}

/* Switch — usa lo stile mockup ovunque */
.sw{width:36px;height:20px;border-radius:999px;background:var(--bg-elev-3);border:0}
.sw .dot{width:14px;height:14px;background:#fff;top:3px;left:3px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.sw.on{background:var(--accent);border:0}
.sw.on .dot{left:19px;background:#fff}

/* Modal themed (mdl) — accent-tint header iconato + r-md */
.mdl-ov{background:rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.mdl{background:var(--bg-elev-1);border:1px solid var(--stroke);border-radius:var(--r-md);box-shadow:var(--sh-modal);min-width:380px;max-width:520px;padding:24px}
.mdl-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-tint);color:var(--accent-hi);margin-bottom:14px}
.mdl-ic.info{background:var(--accent-tint);color:var(--accent-hi)}
.mdl-ttl{font:600 16px/20px 'Inter';color:var(--text-1)}
.mdl-msg{font:400 13px/18px 'Inter';color:var(--text-2)}
.mdl-btn{height:32px;padding:0 14px;border-radius:var(--r-sm);background:var(--bg-elev-2);border:1px solid var(--stroke);color:var(--text-1);font:500 13px/1 'Inter'}
.mdl-btn:hover{background:var(--bg-elev-3);border-color:var(--accent)}
.mdl-btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(139,111,209,.25)}
.mdl-btn.primary:hover{background:var(--accent-hi);filter:none}
.mdl-btn.danger{background:var(--danger);border-color:transparent;color:#fff}

/* Toast */
.toast{background:var(--bg-elev-1);border:1px solid var(--stroke);border-left:3px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--sh-modal)}

/* Segmented legacy → look mockup */
.seg{background:var(--bg-elev-2);border:1px solid var(--stroke);border-radius:10px;padding:3px;gap:2px;display:inline-flex;overflow:visible}
.seg-b{height:26px;padding:0 12px;border-radius:7px;font:500 12px/1 'Inter';color:var(--text-2);background:transparent;flex:0 0 auto}
.seg-b:hover{color:var(--text-1)}
.seg-b.on{background:var(--accent-tint);color:var(--accent-hi);box-shadow:0 0 0 1px var(--accent-hi) inset}

/* Inputs/select — refresh */
.m-input,.sp-body input[type=text]:not(.clr-hex):not(.tag-hex-input),.sp-body select,select{height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--bg-elev-2);color:var(--text-1);font:400 13px/1 'Inter'}
.m-input:focus,.sp-body input[type=text]:focus,select:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-tint)}
.m-search input{height:32px;padding-left:32px;border-radius:var(--r-sm);background:var(--bg-elev-2);border:1px solid var(--stroke)}
.m-search svg.m-search-icon{width:14px;height:14px;left:11px;color:var(--text-3)}

/* AI primary button */
.ai-btn,.mdl-btn.primary{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);height:36px;font:600 13px/1 'Inter';box-shadow:0 4px 12px rgba(139,111,209,.25)}
.ai-btn:hover{background:var(--accent-hi)}
.ai-box{background:var(--accent-tint);border:1px solid rgba(139,111,209,.22);border-radius:var(--r-md);padding:14px}
.ai-box h4{color:var(--accent-hi);font:600 12px 'Inter'}
.ai-box p{color:var(--text-2);font-size:11px;line-height:1.6}

/* History/playlist items */
.pl-item{padding:10px 12px;border-radius:var(--r-sm);margin-bottom:2px;border:1px solid transparent}
.pl-item:hover{background:var(--bg-elev-2)}
.pl-item.active{background:var(--accent-tint);border-color:rgba(139,111,209,.20)}
.pl-thumb{width:48px;height:32px;border-radius:6px;background:linear-gradient(135deg,#8B6FD1,#5C3F8E);overflow:hidden}
.pl-thumb.show{display:block}

/* Tag color palette — quadrati 28×28 come mockup */
.tag-sw-grid{grid-template-columns:repeat(8,28px);gap:8px;margin-bottom:10px}
.tag-sw-grid .tag-sw{width:28px;height:28px;border-radius:var(--r-sm)}
.tag-sw.sel{box-shadow:0 0 0 2px var(--bg-elev-1),0 0 0 4px var(--accent-hi);border-color:transparent}
.tag-custom-row{background:var(--bg-elev-2);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:0 12px;height:36px;gap:8px}
.tag-hex-input{background:transparent;border:0;font:600 12px/1 'JetBrains Mono',monospace;color:var(--text-1)}
.tag-hex-prefix{color:var(--text-3)}


/* Cell badge for multi (P1..P4) */
.cell-badge{display:inline-flex!important;position:absolute;top:8px;left:8px;z-index:10;height:22px;padding:0 8px;border-radius:999px;background:rgba(10,10,15,.65);color:#fff;font:600 11px/22px 'Inter';letter-spacing:.04em;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08)}

/* Downloader list rows — compact list with optional thumb before title */
/* Griglia download: colonne fisse → ogni file allineato in modo identico */
.m2-dl-row{display:grid;grid-template-columns:24px 56px minmax(0,1fr) 110px 70px 130px;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--bd);border-radius:6px}
.m2-dl-row .m2-dl-chip{justify-self:end;font:600 9px/1 'JetBrains Mono',monospace;color:var(--t3);background:var(--s3);padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.m2-dl-row .m2-dl-size{justify-self:end;font:600 11px 'JetBrains Mono',monospace;color:var(--t2);white-space:nowrap}
.m2-dl-row .m2-dl-acts{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.m2-dl-act-trash{color:var(--err,#e55)!important}
.m2-dl-act-trash:hover{background:rgba(229,85,85,.14)!important;color:#fff!important}
[data-theme="light"] .m2-dl-act-trash:hover{background:rgba(229,85,85,.18)!important;color:var(--err,#c0392b)!important}
.m2-dl-size{text-align:right;font:600 12px/1 'JetBrains Mono',monospace;color:var(--t1);white-space:nowrap;letter-spacing:.02em}
.m2-dl-acts{justify-content:flex-end}
.m2-dl-row:hover{background:var(--s2)}
.m2-dl-thumbwrap{position:relative;width:56px;height:36px;flex:0 0 56px;border-radius:4px;overflow:hidden;background:var(--s3)}
.m2-dl-thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.m2-dl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.m2-dl-err{position:absolute;top:2px;right:2px;color:var(--err);background:rgba(0,0,0,.55);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.m2-dl-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.m2-dl-title{display:flex;align-items:center;gap:6px;font:600 12px/1.2 'Inter';color:var(--t1);overflow:hidden}
.m2-dl-title>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m2-dl-rename{background:0;border:0;color:var(--t3);cursor:pointer;padding:0 2px;display:inline-flex;align-items:center}
.m2-dl-rename:hover{color:var(--t1)}
.m2-dl-chip{font:500 9px/1 'JetBrains Mono',monospace;text-transform:uppercase;color:var(--t3);background:var(--s3);padding:3px 6px;border-radius:4px;flex-shrink:0}
.m2-dl-meta{font:400 10px/1.2 'JetBrains Mono',monospace;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m2-dl-bar{width:100%;height:3px;border-radius:999px;background:var(--s3);overflow:hidden;margin-top:2px}
.m2-dl-fill{height:100%;transition:width .2s}
.m2-dl-acts{display:flex;align-items:center;gap:4px;flex-shrink:0}
.m2-dl-act{width:24px;height:24px;border:0;background:transparent;color:var(--t2);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.m2-dl-act:hover{background:var(--s3);color:var(--t1)}
.m2-dl-empty{text-align:center;padding:40px 0;color:var(--t3);font-size:12px}

/* Empty state main */
.m2-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-1);text-align:center;padding:40px}
.m2-empty .ic{width:80px;height:80px;border-radius:18px;background:var(--bg-elev-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);box-shadow:var(--sh-card)}
.m2-empty .ic svg{width:36px;height:36px}
.m2-empty .t{font:700 18px/22px 'Inter';color:var(--text-1);margin-top:6px}
.m2-empty .s{font:400 13px/18px 'Inter';color:var(--text-2);max-width:380px}
.m2-empty .a{display:flex;gap:10px;margin-top:8px}
/* Minimal empty state: only an opaque eject icon; tooltip after 5s hover */
.m2-empty-min{gap:0;padding:0;background:transparent}
.m2-empty-eject{background:transparent;border:0;cursor:pointer;color:var(--text-2);opacity:.35;transition:opacity .15s,color .15s;padding:0;display:inline-flex;align-items:center;justify-content:center}
.m2-empty-eject:hover{opacity:.85;color:var(--text-1)}
.m2-empty-tip{position:absolute;opacity:0;pointer-events:none;background:var(--bg-elev-2);color:var(--text-1);border:1px solid var(--stroke);border-radius:6px;padding:6px 10px;font:500 11px/1.35 'Inter';max-width:160px;text-align:center;transform:translate(14px,-38px);transition:opacity .18s;box-shadow:var(--sh-card)}
.m2-empty-min.tip-on .m2-empty-tip{opacity:1}

/* Wizard download modal */
.wiz-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9000}
.wiz-ov.show{display:flex}
.wiz{width:640px;max-width:92vw;background:var(--bg-elev-1);border:1px solid var(--stroke);border-radius:var(--r-md);box-shadow:var(--sh-modal);padding:24px;color:var(--text-1)}
.wiz-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.wiz-head .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-tint);color:var(--accent-hi);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wiz-head .t{font:600 16px/20px 'Inter';flex:1}
.wiz-head .x{width:28px;height:28px;border:0;background:transparent;color:var(--text-3);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.wiz-head .x:hover{background:var(--bg-elev-3);color:var(--text-1)}
.wiz-msg{font:400 13px/18px 'Inter';color:var(--text-2);margin:0 0 16px}
.wiz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.wiz-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 14px;border:1px solid var(--stroke);background:var(--bg-elev-2);border-radius:var(--r-md);cursor:pointer;text-align:center;transition:background .15s,border-color .15s;color:var(--text-1)}
.wiz-tile:hover{background:var(--bg-elev-3);border-color:var(--accent)}
.wiz-tile.dashed{border-style:dashed}
.wiz-tile .ic{width:24px;height:24px;color:var(--text-1);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.wiz-tile .lbl{font:600 13px/16px 'Inter';color:var(--text-1)}
.wiz-tile .sub{font:400 11px/14px 'Inter';color:var(--text-3)}
.wiz-tile.featured{border-color:var(--accent);background:linear-gradient(135deg,var(--bg-elev-2),color-mix(in srgb, var(--accent) 12%, var(--bg-elev-2)))}
.sc-card{cursor:pointer;border-radius:8px;overflow:hidden;background:var(--bg-elev-2);border:1px solid var(--stroke);transition:transform .12s,border-color .12s;display:flex;flex-direction:column}
.sc-card:hover,.sc-card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.sc-poster{aspect-ratio:2/3;background:#0c0c12 center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:32px}
.sc-poster-fallback{font-size:34px;opacity:.45}
.sc-meta{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.sc-name{font:600 12px/15px 'Inter',sans-serif;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sc-row{display:flex;justify-content:space-between;align-items:center;gap:6px;font:500 11px/14px 'JetBrains Mono',monospace;color:var(--text-3)}
.sc-badge{padding:2px 6px;border-radius:4px;background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent);font:600 10px/12px 'JetBrains Mono',monospace;letter-spacing:.04em}
.sc-badge.film{background:color-mix(in srgb, #ffaa33 18%, transparent);color:#ffaa33}
.sc-detail-bar{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg-elev-2)}
.sc-detail-thumb{width:90px;height:130px;flex-shrink:0;border-radius:6px;background:#0c0c12 center/cover no-repeat;border:1px solid var(--stroke)}
.sc-detail-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sc-detail-title{font:700 16px/20px 'Inter',sans-serif;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-detail-meta{font:500 12px/14px 'JetBrains Mono',monospace;color:var(--text-3)}
.sc-detail-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
@media (max-width:640px){.sc-detail-bar{flex-direction:column;align-items:stretch}.sc-detail-thumb{width:100px;height:140px;align-self:center}}
.maniac-tip{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,var(--bg-elev-3,#1a1a22),color-mix(in srgb,var(--accent,#7d6dff) 18%,var(--bg-elev-3,#1a1a22)));border:1px solid var(--accent,#7d6dff);box-shadow:0 8px 30px rgba(0,0,0,.45);min-width:220px;max-width:380px;color:var(--text-1,#eee);font:500 12px/16px 'Inter',sans-serif;opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s}
.maniac-tip.show{opacity:1;transform:translateY(0)}
.maniac-tip-bullet{font-size:18px;flex-shrink:0;line-height:1}
.maniac-tip-body{flex:1}
.maniac-tip-x{flex-shrink:0;padding:4px 8px;border-radius:6px;border:1px solid var(--stroke,#333);background:transparent;color:var(--text-1,#eee);font:600 11px 'Inter',sans-serif;cursor:pointer}
.maniac-tip-x:hover{background:rgba(255,255,255,.08)}
.info-row{display:contents}
.info-lbl{font:600 11px 'Inter',sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.info-val{font:500 12px 'Inter',sans-serif;color:var(--t1)}
.info-chip{padding:2px 8px;background:var(--pd);color:var(--p);border-radius:10px;font:500 10px 'Inter',sans-serif;display:inline-block}
[data-theme="light"] .info-chip{background:#F0EDF4!important;color:#7B5EA7!important}

[data-theme="light"] .wiz-body, [data-theme="light"] .wiz-step,

[data-theme="light"] .wiz-pill.on{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}
[data-theme="light"] .wiz-step-header h3,
[data-theme="light"] .wiz-step-header h2,
[data-theme="light"] .wiz-card h4{color:#1A1A2E!important}
[data-theme="light"] .wiz-step-header p,
[data-theme="light"] .wiz-card p,
[data-theme="light"] .wiz-card .desc{color:#5B5B75!important}

[data-theme="light"] .wiz select,
[data-theme="light"] .wiz textarea{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important}

/* Context menu (mediaOptionsCtx, dlOptionsCtx, tagOptionsCtx, aiElementMenu, ecc.) */
[data-theme="light"] .ctx-menu{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important;box-shadow:0 10px 30px rgba(0,0,0,.16)!important}
[data-theme="light"] .ctx-menu .ctx-item{color:#1A1A2E!important}
[data-theme="light"] .ctx-menu .ctx-item:hover{background:#F0EDF4!important;color:#1A1A2E!important}

/* Theme picker / quality choice modal — eredita modali ma forziamo testo scuro */

/* ═══ ANIMAZIONI RIMOSSE: pannelli/dropdown/finestre istantanei ═══ */
.sp,.vc-pl-drawer,.mdl-ov,.mdl,.wiz-ov,.dd,.ctx,.multi-dd,.ctx-sub,.clr-pop,.vol-overlay,.toast,.zoom-dropup{transition:none!important;animation:none!important}
.sp.open{transform:translate3d(0,0,0)!important;visibility:visible!important;pointer-events:auto!important}
.vc-pl-drawer.open{transform:translateX(0)!important}
.mdl-ov.show{opacity:1!important}
.mdl-ov.show .mdl{transform:none!important}
.wiz-ov.show{opacity:1!important}
.st-body{animation:none!important}

/* ════════════════════════════════════════════════════════════════════════
   LIGHT MODE — BLOCCO FINALE CONSISTENCY (deve restare alla fine del <style>!)
   Le definizioni precedenti (es. .bot a riga 1080, .mdl a 1107, .wiz a 1200)
   arrivano DOPO i miei override e vincono la cascata. Qui forziamo tutto
   con !important e selettori robusti per ottenere coerenza totale.
   ──────────────────────────────────────────────────────────────────────── */
[data-theme="light"]{
  /* Token primari — forziamo per essere sicuri che cascade non li alteri */
  --bg-base:#F6F5F9!important; --bg-elev-1:#FFFFFF!important;
  --bg-elev-2:#F0EDF4!important; --bg-elev-3:#E6E1EC!important;
  --stroke:#DCD6E3!important; --stroke-soft:rgba(0,0,0,.05)!important;
  --text-1:#1A1A2E!important; --text-2:#5B5B75!important; --text-3:#8A8AA0!important;
  --accent:#7B5EA7!important; --accent-hi:#6B4E97!important;
  --vbg:#FFFFFF!important;
  /* Alias retro-compat (il :root li ha come var(--bg-elev-N), riforziamoli
     anche come HEX così se qualche regola legge --s2 *via uno specifico path*
     ottiene comunque il valore light. */
  --bg:#F6F5F9!important;
  --s1:#FFFFFF!important; --s2:#F0EDF4!important; --s3:#E6E1EC!important;
  --t1:#1A1A2E!important; --t2:#5B5B75!important; --t3:#8A8AA0!important;
  --bd:#DCD6E3!important;
  --p:#7B5EA7!important; --pl:#6B4E97!important;
  --pd:rgba(123,94,167,.10)!important; --pg:rgba(123,94,167,.18)!important;
}

/* Player bar — niente più strisce scure */
[data-theme="light"] .bot,
[data-theme="light"] body.downloader-mode .bot{background:#FFFFFF!important;border-top:0!important;color:#1A1A2E!important}
[data-theme="light"] .vc-progress{background:#F0EDF4!important;border-top:1px solid #F0EDF4!important}
[data-theme="light"] .main-progress{background:#F0EDF4!important;border-top:1px solid #F0EDF4!important}
[data-theme="light"] .vg{background:#E6E1EC!important;gap:1px}
[data-theme="light"] .vc{background:#FFFFFF!important}
[data-theme="light"] .vc.empty{background:#FFFFFF!important;border:1px dashed #C4BAD0!important}
[data-theme="light"] .vc video{background:#FFFFFF!important}
[data-theme="light"] .vc .video-area{background:#FFFFFF!important}
[data-theme="light"] .vc-controls{background:#FFFFFF!important}
[data-theme="light"] .vc-toolbar{background:rgba(255,255,255,.92)!important;backdrop-filter:blur(6px);color:#1A1A2E!important}
[data-theme="light"] .vc-toolbar .vc-btn{color:#3A3A4E!important}

/* Modali e wizards — forza bianchi */
[data-theme="light"] .mdl-ov,
[data-theme="light"] .wiz-ov{background:rgba(0,0,0,.32)!important;backdrop-filter:blur(4px)}
[data-theme="light"] .mdl,
[data-theme="light"] .wiz{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important;box-shadow:0 16px 48px rgba(0,0,0,.18)!important}
[data-theme="light"] .mdl-ttl,
[data-theme="light"] .wiz-head h3,
[data-theme="light"] .wiz-head .t{color:#1A1A2E!important}
[data-theme="light"] .mdl-msg{color:#3A3A4E!important}
[data-theme="light"] .wiz-head{background:#FFFFFF!important;color:#1A1A2E!important;border-bottom:1px solid #DCD6E3!important}
[data-theme="light"] .wiz-body{background:#FFFFFF!important;color:#1A1A2E!important}
[data-theme="light"] .wiz-foot{background:#F8F6FB!important;border-top:1px solid #DCD6E3!important;color:#1A1A2E!important}
[data-theme="light"] .wiz-foot-l{color:#5B5B75!important}
[data-theme="light"] .wiz-search-row .m-search,

/* Wizard tiles, SC card grid, dettaglio episodio — sfondi chiari coerenti */

[data-theme="light"] .wiz-tile .lbl{color:#1A1A2E!important}
[data-theme="light"] .wiz-tile .sub{color:#5B5B75!important}
[data-theme="light"] .wiz-cat-h{color:#5B5B75!important}
[data-theme="light"] .sc-card{background:#FFFFFF!important;border-color:#DCD6E3!important}
[data-theme="light"] .sc-card:hover,

[data-theme="light"] .sc-poster{background:#F0EDF4!important;color:#8A8AA0!important}
[data-theme="light"] .sc-name{color:#1A1A2E!important}
[data-theme="light"] .sc-row,
[data-theme="light"] .sc-year{color:#5B5B75!important}
[data-theme="light"] .sc-detail-bar{background:#FFFFFF!important;border-color:#DCD6E3!important}
[data-theme="light"] .sc-detail-thumb{background:#F0EDF4!important;border-color:#DCD6E3!important}
[data-theme="light"] .sc-detail-title{color:#1A1A2E!important}
[data-theme="light"] .sc-detail-meta{color:#5B5B75!important}

/* Banner clipboard interceptor — esplicito per superare gli inline style.
   Il banner viene appeso al body con style.cssText="background:var(--s1)…" ma alcune
   var() non vengono propagate consistentemente: forziamo override light. */
[data-theme="light"] #linkIntercept{background:#FFFFFF!important;border:1px solid #7B5EA7!important;color:#1A1A2E!important;box-shadow:0 12px 40px rgba(0,0,0,.18)!important}

[data-theme="light"] #linkIntercept .m2-btn:hover{background:#E6E1EC!important;border-color:#C4BAD0!important}
[data-theme="light"] #linkIntercept .m2-btn.primary{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}
[data-theme="light"] #linkIntercept .m2-btn.primary:hover{background:#6B4E97!important}

/* Bottoni generici — niente più nero */
[data-theme="light"] button,
[data-theme="light"] .btn,
[data-theme="light"] .m2-btn,
[data-theme="light"] .mdl-btn,
[data-theme="light"] .wiz-btn,
[data-theme="light"] .file-grid-btn,
[data-theme="light"] .stab-btn,
[data-theme="light"] .reset-btn,
[data-theme="light"] .icon-btn{color:#1A1A2E}

[data-theme="light"] .mdl-btn:not(.primary):not(.danger),

[data-theme="light"] .mdl-btn:not(.primary):not(.danger):hover,
[data-theme="light"] .wiz-btn:not(.primary):not(.danger):hover{background:#F0EDF4!important;border-color:#C4BAD0!important}
[data-theme="light"] .m2-btn.primary,
[data-theme="light"] .mdl-btn.primary,
[data-theme="light"] .wiz-btn.primary{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}
[data-theme="light"] .m2-btn.primary:hover,
[data-theme="light"] .mdl-btn.primary:hover,
[data-theme="light"] .wiz-btn.primary:hover{background:#6B4E97!important;border-color:#6B4E97!important}
[data-theme="light"] .m2-btn.icon{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important}
[data-theme="light"] .m2-btn.icon:hover{background:#F0EDF4!important}

/* Topbar voci menu */
[data-theme="light"] .tb{background:#FFFFFF!important;color:#1A1A2E!important;border-bottom:1px solid #DCD6E3!important}
[data-theme="light"] .tb .mb>button{background:transparent!important;color:#1A1A2E!important}
[data-theme="light"] .tb .mb>button:hover,[data-theme="light"] .tb .mb>button.on{background:#F0EDF4!important;color:#7B5EA7!important}
[data-theme="light"] .tb .ib{color:#1A1A2E!important}

/* Side panel */

[data-theme="light"] .sp-title{color:#1A1A2E!important}
[data-theme="light"] .sp-close{color:#1A1A2E!important}
[data-theme="light"] .sp-body{background:transparent!important;color:#1A1A2E!important}

/* Tutte le card / liste */
[data-theme="light"] .pl-item,
[data-theme="light"] .recent-item,
[data-theme="light"] .fav-cell,
[data-theme="light"] .m2-dl-row,
[data-theme="light"] .sc-card,
[data-theme="light"] .sc-detail-bar,

[data-theme="light"] .wiz-tile,
[data-theme="light"] .file-grid-btn,

[data-theme="light"] .fav-cell:hover,
[data-theme="light"] .m2-dl-row:hover,
[data-theme="light"] .recent-item:hover,
[data-theme="light"] .sc-card:hover,
[data-theme="light"] .wiz-rev-card:hover,
[data-theme="light"] .wiz-tile:hover,
[data-theme="light"] .file-grid-btn:hover,

[data-theme="light"] .file-grid-btn.on,
[data-theme="light"] .file-grid-btn.primary,
[data-theme="light"] .stab-btn.on,
[data-theme="light"] .st-tabs-grid .file-grid-btn.on{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}

/* Form elements ovunque (input, select, textarea, m-input) */
[data-theme="light"] input[type=text],
[data-theme="light"] input[type=search],
[data-theme="light"] input[type=url],
[data-theme="light"] input[type=email],
[data-theme="light"] input[type=number],
[data-theme="light"] input[type=password],
[data-theme="light"] textarea,
[data-theme="light"] select,
[data-theme="light"] .m-input{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important}
[data-theme="light"] input:focus,
[data-theme="light"] select:focus,
[data-theme="light"] textarea:focus{border-color:#7B5EA7!important;outline:0!important}
[data-theme="light"] input::placeholder,
[data-theme="light"] textarea::placeholder{color:#9090A8!important}
[data-theme="light"] select option{background:#FFFFFF!important;color:#1A1A2E!important}
/* .m-search wrapper resta trasparente: il bordo lo porta solo .m-input */

[data-theme="light"] .m-search-icon{color:#5B5B75!important}

/* Slider (range) */

[data-theme="light"] input[type=range]::-webkit-slider-thumb{background:#7B5EA7!important;border:2px solid #FFFFFF!important}

/* Segmented control */

[data-theme="light"] .m2-seg,

/* Pchip (filter chips) */

[data-theme="light"] .pchip{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important}
[data-theme="light"] .pl-pchip.on,
[data-theme="light"] .pchip.on{background:#7B5EA7!important;color:#FFFFFF!important;border-color:#7B5EA7!important}

/* Dropdown menu (.dd) */

[data-theme="light"] .dd-item:hover{background:#F0EDF4!important;color:#7B5EA7!important}
[data-theme="light"] .dd-sep{background:#DCD6E3!important}

/* Context menu — coprire TUTTE le varianti runtime (.ctx-menu, .ctx, .ai-el-ctx, ecc.) */

[data-theme="light"] .ctx,
[data-theme="light"] .ai-el-ctx,
[data-theme="light"] .dl-ctx,
[data-theme="light"] .tag-ctx,
[data-theme="light"] [data-ctx-menu]{background:#FFFFFF!important;color:#1A1A2E!important;border:1px solid #DCD6E3!important;box-shadow:0 8px 24px rgba(0,0,0,.18)!important}

[data-theme="light"] .ctx .ctx-item,
[data-theme="light"] .ctx .item,

[data-theme="light"] .ctx .ctx-item:hover,
[data-theme="light"] .ctx .item:hover,

[data-theme="light"] .knob-lbl{color:#5B5B75!important}
[data-theme="light"] .knob-val{color:#1A1A2E!important}

/* Toast e banner */

[data-theme="light"] .maniac-tip-x{color:#1A1A2E!important;border:1px solid #DCD6E3!important;background:#F0EDF4!important}
[data-theme="light"] .maniac-tip-x:hover{background:#E6E1EC!important}

/* Logs / cronologia */
[data-theme="light"] .log-item{background:#FFFFFF!important;color:#1A1A2E!important;border-color:#DCD6E3!important}
[data-theme="light"] .log-item .log-msg{color:#1A1A2E!important}

[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:#A89DB8!important}

/* Banner link interceptor */

/* Tag chips */
[data-theme="light"] .tag,
[data-theme="light"] .ctx-tag{color:#1A1A2E!important;font-weight:700}
[data-theme="light"] .tag-name,
[data-theme="light"] .pl-tags .tag{color:#1A1A2E!important}

/* Fix specifico: body e #app sempre chiari */
[data-theme="light"],
[data-theme="light"] body,
[data-theme="light"] .main,
[data-theme="light"] .player-area{background:#F6F5F9!important;color:#1A1A2E!important}

/* ════════════════════════════════════════════════════════════════════════
   COMMAND PALETTE (Ctrl+K) — overlay con search universale
   ──────────────────────────────────────────────────────────────────────── */
.cmdp-ov{position:fixed;inset:0;background:rgba(5,5,10,.55);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;z-index:10100;
  padding-top:14vh;animation:cmdpFade .15s ease-out}
.cmdp-ov.show{display:flex}
.cmdp{width:640px;max-width:92vw;background:var(--s1);border:1px solid var(--bd);
  border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(123,94,167,.18);
  display:flex;flex-direction:column;overflow:hidden;max-height:64vh}
.cmdp-input-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.cmdp-input-row svg{color:var(--t3);flex-shrink:0}
.cmdp-input{flex:1;background:transparent;border:0;outline:0;color:var(--t1);
  font:500 14px/1.4 'Inter';padding:4px 0}
.cmdp-input::placeholder{color:var(--t3)}
.cmdp-kbd{background:var(--s2);border:1px solid var(--bd);border-radius:4px;
  padding:2px 6px;font:600 10px/1 'JetBrains Mono',monospace;color:var(--t3);flex-shrink:0}
.cmdp-list{flex:1;overflow-y:auto;padding:6px;min-height:80px}
.cmdp-section{font:700 9px/1 'Inter';color:var(--t3);text-transform:uppercase;
  letter-spacing:.08em;padding:10px 10px 4px}
.cmdp-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;
  cursor:pointer;color:var(--t1);font:500 13px/1.3 'Inter';transition:background .08s}
.cmdp-item:hover,.cmdp-item.active{background:var(--pd);color:var(--p)}
.cmdp-item.active{box-shadow:inset 2px 0 0 var(--p)}
.cmdp-item-ico{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;color:var(--t2)}
.cmdp-item-ico img{width:22px;height:22px;border-radius:4px;object-fit:cover}
.cmdp-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdp-item-hint{font:500 11px 'Inter';color:var(--t3);flex-shrink:0;margin-left:8px;text-transform:none;letter-spacing:0}
.cmdp-item.active .cmdp-item-hint{color:var(--pl)}
.cmdp-empty{padding:30px 16px;text-align:center;color:var(--t3);font:400 12px/1.5 'Inter'}
.cmdp-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 14px;
  border-top:1px solid var(--bd);font:500 10px/1 'Inter';color:var(--t3);flex-shrink:0;background:var(--s2)}
.cmdp-foot kbd{background:var(--s1);border:1px solid var(--bd);border-radius:3px;padding:2px 5px;
  font:600 9px/1 'JetBrains Mono',monospace;color:var(--t2);margin-right:4px}
@keyframes cmdpFade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
[data-theme="light"] .cmdp-ov{background:rgba(0,0,0,.32)!important}
[data-theme="light"] .cmdp{background:#FFFFFF!important;border-color:#DCD6E3!important;
  box-shadow:0 30px 80px rgba(0,0,0,.18),0 0 0 1px rgba(123,94,167,.18)!important}
[data-theme="light"] .cmdp-foot{background:#F8F6FB!important;border-top-color:#DCD6E3!important}
[data-theme="light"] .cmdp-kbd,
[data-theme="light"] .cmdp-foot kbd{background:#F0EDF4!important;color:#5B5B75!important;border-color:#DCD6E3!important}
[data-theme="light"] .cmdp-item.active{background:#F0EDF4!important;color:#7B5EA7!important;box-shadow:inset 2px 0 0 #7B5EA7!important}
</style>
</head>

    <button class="ib" id="btnCmdp" onclick="openCommandPalette()" title="Cerca comandi (Ctrl+K)">

<!-- MAIN -->

  <div class="sp" id="sideP">

<script>
// ═══════════════════════════════════════════════
// MANIAC — Real Working Player
// ═══════════════════════════════════════════════

// Global logger
function logError(msg,extra){
  try{
    const stack=(new Error()).stack||'';
    const entry={ts:Date.now(),msg:String(msg||''),extra:extra?String(extra).slice(0,500):'',stack:stack.slice(0,2000)};
    (window.S&&S.logs?S.logs:(window._pendingLogs=window._pendingLogs||[])).unshift(entry);
    if(window.S&&S.logs&&S.logs.length>500)S.logs.length=500;
    if(window.S&&typeof saveConfig==='function'){clearTimeout(window._logSaveT);window._logSaveT=setTimeout(()=>saveConfig(),500);}
    // Persist anche su localStorage per sopravvivere a sessioni senza config
    try{ localStorage.setItem('maniac_logs', JSON.stringify((window.S&&S.logs)||window._pendingLogs||[])); }catch(e){}
    if(window.S&&S.panel==='info'&&typeof renderPanel==='function')renderPanel();
    console.warn('[LOG]',msg,extra||'');
  }catch(e){}
}
window.addEventListener('error',e=>{logError(e.message||'Errore',(e.filename||'')+':'+(e.lineno||''));});
window.addEventListener('unhandledrejection',e=>{logError('Promise rejection: '+(e.reason&&e.reason.message||e.reason),e.reason&&e.reason.stack||'');});
// Carica i log della sessione precedente da localStorage
try{
  const _prevLogs=JSON.parse(localStorage.getItem('maniac_logs')||'[]');
  if(Array.isArray(_prevLogs)&&_prevLogs.length){window._pendingLogs=_prevLogs.slice(0,500);}
}catch(e){}
const $=id=>document.getElementById(id);
const $$=s=>document.querySelectorAll(s);
const API=window.maniac||null;
const isElectron=!!API;

// ═══ STATE ═══
const S={
  theme:'dark', panel:null, panelPlayer:0, stab:'audio', settingsPlayer:0, audioSub:'output',
  vol:80, muted:false, prevVol:80,
  showEq:false, voice:false,
  autoStart:true, defaultPlayer:false, hideCtrl:true, showTitle:true, scrubPreview:true,
  lang:'it', thumbs:false, histThumbs:true,
  hideThumbs:{recent:false,history:false,downloader:false,playlist:false},
  dlFilter:'all', dlSort:'new', dlHideThumbs:false,
  multi:1, activePlayer:0,
  players:[],
  audioContexts:{},
  audioOutputs:[], videoInputs:[], audioInputs:[],
  history:[], shortcuts:null, nextUid:1, webcamPlayer:0,
  webcamRes:'auto', webcamFps:30, webcamMirror:false, webcamAudioMonitor:false,
  subsFromMetadata:true, subsSize:18, subsColor:'#ffffff',
  audioIn:{deviceId:'',gain:100,gateOn:false,gateThreshold:-50,eqLow:0,eqMid:0,eqHigh:0,testOn:false},
  // Tag system
  tagsDef:[], // [{id,label,color}]
  tagsFav:[], // ordered ids of favorite tag
  tagsByPath:{}, // {path: [tagId,...]}
  // Playback defaults (applied at app start)
  playback:{autoplay:true,startView:1,startMode:'linear'},
  // Toolbar icons visibility (global)
  toolbarIcons:{tc:false,td:true,loop:true,shuf:true,mag:true,fav:true,pl:true,fs:true},
  // Title-at-start settings
  titleAtStart:false, titleAtStartPath:false,
  // Logs
  logs:[]
};
// Target per knobs/settings = settingsPlayer chip (o active se fuori settings).
function settingsTarget(){
  if(S.panel==='settings' && S.settingsPlayer>=0) return P(S.settingsPlayer);
  return activeP();
}
// Accessori globali: scrivono sul target contestuale
Object.defineProperty(S,'eqB',{get(){return settingsTarget().eqB},set(v){applyToTargets('eqB',v)}});
Object.defineProperty(S,'eqM',{get(){return settingsTarget().eqM},set(v){applyToTargets('eqM',v)}});
Object.defineProperty(S,'eqH',{get(){return settingsTarget().eqH},set(v){applyToTargets('eqH',v)}});
Object.defineProperty(S,'boost',{get(){return settingsTarget().boost},set(v){applyToTargets('boost',v)}});
Object.defineProperty(S,'audioChannels',{get(){return settingsTarget().audioChannels},set(v){applyToTargets('audioChannels',v)}});
Object.defineProperty(S,'audioBalance',{get(){return settingsTarget().audioBalance},set(v){applyToTargets('audioBalance',v)}});
function applyToTargets(key,val){
  if(S.panel==='settings' && S.settingsPlayer===-1){
    for(let i=0;i<S.multi;i++) P(i)[key]=val;
  }else{
    settingsTarget()[key]=val;
  }
}

function makePlayer(id){
  return {
    id, playlist:[], idx:-1,
    vol:80, muted:false, loop:false, shuffle:false,
    bright:100, contrast:100, sat:100, hue:0, gamma:100,
    sinkId:'', source:'file',
    magZoom:2,
    subtitles:null, subtitlesOn:false,
    vidEl:null,
    // Per-player audio (indipendenti)
    audioChannels:'stereo', audioBalance:0, audioDelayMs:0,
    eqB:0, eqM:0, eqH:0, boost:100,
    // Per-player playback settings
    speed:1, autoplay:true, playMode:'linear'
  };
}
function P(i){ if(!S.players[i]) S.players[i]=makePlayer(i); return S.players[i]; }
function ensurePlayers(n){ for(let i=0;i<n;i++) P(i); }
function activeP(){ return P(S.activePlayer); }

const PLAYER_COLORS=['#7B5EA7','#E05565','#4CAF7D','#FFB836'];
// Icon helpers (image + eye open/closed + broom + trash + refresh + rec)
const ICON_IMG='<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>';
const ICON_EYE_OPEN='<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
const ICON_EYE_CLOSED='<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27z"/></svg>';

async function _mediaCtxOpen(path,name,pid){

function _mediaCtxShowInFolder(path){

async function _mediaCtxMove(p,name){
  if(!window.maniac||!window.maniac.fileMove){toast&&toast('IPC non disponibile');return;}
  const r=await window.maniac.fileMove(p,null);
  if(r&&r.canceled)return;
  if(!r||!r.success){toast&&toast('Errore spostamento: '+(r&&r.error||'?'));return;}
  // Aggiorna riferimenti UI
  try{
    (S.players||[]).forEach(pp=>(pp.playlist||[]).forEach(f=>{if(f.path===p){f.path=r.path;f.url=mkUrl(r.path);}}));
    (S.recent||[]).forEach(rr=>{if(rr.path===p)rr.path=r.path;});
    (S.history||[]).forEach(h=>{if(h.path===p)h.path=r.path;});
  }catch(_){}
  saveConfig&&saveConfig();
  if(typeof renderPanel==='function')renderPanel();
  toast&&toast('Spostato: '+name);

function _mediaCtxAnalyze(p){

  const dir=p.split(sep).slice(0,-1).join(sep);
  S.aiFolder=dir;
  saveConfig&&saveConfig();
  openAnalyzeWizard(dir);

async function _mediaCtxRename(path,name){
  const cur=name||(path||'').split(/[\\\/]/).pop()||'';
  const nv=await (typeof themedPrompt==='function'?themedPrompt({title:'Rinomina',message:'Nuovo nome (con estensione):',value:cur}):Promise.resolve(prompt('Nuovo nome:',cur)));
  if(!nv||nv===cur)return;
  const safe=String(nv).replace(/[\\/:*?"<>|]/g,'_');
  const sep=path.includes('\\')?'\\':'/';
  const dir=path.split(sep).slice(0,-1).join(sep);
  const np=dir+sep+safe;
  if(window.maniac&&window.maniac.fileRename){
    const r=await window.maniac.fileRename(path,np);
    if(!r||!r.success){toast&&toast('Errore rinomina: '+(r&&r.error||'?'));return;}
    // Aggiorna riferimenti UI: playlist, recent, history, favorites
    try{
      (S.players||[]).forEach(p=>(p.playlist||[]).forEach(f=>{if(f.path===path){f.path=np;f.name=safe;f.url=mkUrl(np);}}));
      (S.recent||[]).forEach(r=>{if(r.path===path){r.path=np;r.name=safe;}});
      (S.history||[]).forEach(h=>{if(h.path===path){h.path=np;h.name=safe;}});
    }catch(_){}
    saveConfig&&saveConfig();
    if(typeof renderPanel==='function')renderPanel();
    toast&&toast('Rinominato: '+safe);
  }
}
async function _mediaCtxDelete(path,name){
  const ok=await (typeof themedConfirm==='function'?themedConfirm({title:'Elimina file',message:'Eliminare definitivamente "'+(name||path)+'"?',danger:true}):Promise.resolve(confirm('Eliminare il file?')));
  if(!ok)return;
  if(window.maniac&&window.maniac.fileDelete){
    const r=await window.maniac.fileDelete(path);
    if(!r||!r.success){toast&&toast('Errore eliminazione: '+(r&&r.error||'?'));return;}
  } else {
    toast&&toast('IPC eliminazione non disponibile');return;
  }
  // Rimuovi dalle liste UI
  try{
    (S.players||[]).forEach(p=>{p.playlist=(p.playlist||[]).filter(f=>f.path!==path);});
    S.recent=(S.recent||[]).filter(r=>r.path!==path);
    S.history=(S.history||[]).filter(h=>h.path!==path);
  }catch(_){}
  saveConfig&&saveConfig();
  if(typeof renderPanel==='function')renderPanel();
  toast&&toast('Eliminato');
}
function _mediaCtxAddTag(path,label){
  if(!path||!label)return;
  // Cerca il file in playlist e aggiungi il tag
  const tc=(typeof allTags==='function'?allTags():[]).find(t=>t.label===label);
  if(!tc)return;
  let touched=false;
  (S.players||[]).forEach(p=>(p.playlist||[]).forEach(f=>{
    if(f.path===path){f.tags=f.tags||[];if(!f.tags.some(x=>x.label===label)){f.tags.push({label,color:tc.color});touched=true;}}
  }));
  // Persisti anche in S._fileTags per file non in playlist
  S._fileTags=S._fileTags||{};
  S._fileTags[path]=S._fileTags[path]||[];
  if(!S._fileTags[path].some(x=>x.label===label)){S._fileTags[path].push({label,color:tc.color});touched=true;}
  if(touched){if(typeof persistFileTags==='function')persistFileTags();saveConfig&&saveConfig();if(typeof renderPanel==='function')renderPanel();toast&&toast('Tag aggiunto: '+label);}
}

      sugg.innerHTML=matches.length?matches.map(t=>`<button class="reset-btn" data-tag="${escApos(t.label)}" style="font-size:10px;padding:3px 8px;border-radius:10px;background:${t.color||'var(--s2)'}22;border:1px solid ${t.color||'var(--bd)'};color:var(--t1);cursor:pointer">${(t.label||'').replace(/</g,'&lt;')}</button>`).join(''):'<span style="font-size:10px;color:var(--t3)">Nessun tag esistente con questo nome — verrà creato</span>';
      sugg.querySelectorAll('button[data-tag]').forEach(b=>{
        b.onclick=()=>{ inp.value=b.getAttribute('data-tag'); sugg.innerHTML=''; };
      });
    });
    const close=v=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),180);resolve(v);};
    ov.querySelector('[data-act="cancel"]').onclick=()=>close(null);
    ov.querySelector('[data-act="ok"]').onclick=()=>{
      const label=(inp.value||'').trim();
      if(!label){inp.focus();return;}
      const exists=existingTags.some(t=>t.label===label);
      if(!exists){
        S.customTags=S.customTags||[];
        S.customTags.push({label,color:chosenColor,kind:chosenKind,isFace:chosenKind==='face'});
      }
      close(label);
    };
    ov.addEventListener('click',e=>{if(e.target===ov)close(null);});
  }).then(label=>{
    if(label)_mediaCtxAddTag(path,label);
  });
}

  `;

async function _tagCtxRename(label){
  const nv=await (typeof themedPrompt==='function'?themedPrompt({title:'Rinomina tag',message:'Nuovo nome:',value:label}):Promise.resolve(prompt('Nuovo nome:',label)));
  if(!nv||nv===label)return;
  if(typeof renameTag==='function')renameTag(label,String(nv).trim());
}
function _tagCtxDuplicate(label){
  S.customTags=S.customTags||[];
  const tc=(typeof allTags==='function'?allTags():[]).find(t=>t.label===label);
  if(!tc){toast&&toast('Tag non trovato');return;}
  const newLabel=label+' (copia)';
  S.customTags.push({label:newLabel,color:tc.color,kind:tc.kind,isFace:!!tc.isFace});
  saveConfig&&saveConfig();
  if(typeof renderPanel==='function')renderPanel();
  toast&&toast('Duplicato: '+newLabel);
}
async function _tagCtxColor(label){
  const tc=(typeof allTags==='function'?allTags():[]).find(t=>t.label===label);
  const cur=tc&&tc.color||'#7B5EA7';
  if(typeof openCustomColorPicker==='function'){
    openCustomColorPicker(cur,(hex)=>{
      if(!hex)return;
      S.customTags=S.customTags||[];
      const idx=S.customTags.findIndex(t=>t.label===label);
      if(idx>=0){S.customTags[idx].color=hex;}
      else {S.tagColors=S.tagColors||{}; S.tagColors[label]=hex;}
      saveConfig&&saveConfig();
      if(typeof renderPanel==='function')renderPanel();
    });
  }
}
async function _tagCtxDelete(label){
  const ok=await (typeof themedConfirm==='function'?themedConfirm({title:'Elimina tag',message:'Eliminare il tag "'+label+'"?',danger:true}):Promise.resolve(confirm('Eliminare?')));
  if(!ok)return;
  if(typeof deleteTagDef==='function')deleteTagDef(label);
}

// per-pannello (ALL → P1 → … → ALL). Quando opts.allOnly è true mostra 4 pallini
// "aperti" (non-cliccabile, simbolo "tutti i player").
const _PANEL_PLAYER_KEYS={
  settings:'settingsPlayer',
  playlist:'panelPlayer',
  explore:'explorePlayer',
  analizza:'analizzaPlayer',
  history:'historyPlayer',
  tags:'tagPlayerFilter'
};
function _panelPlayerStateKey(scope){return _PANEL_PLAYER_KEYS[scope]||scope+'Player';}

// Clamp un popover/menu dentro al viewport. Usa le dimensioni reali (offsetW/H).
// Se la posizione iniziale fa uscire dal basso, riprova flippando in alto rispetto all'anchor.
// el: elemento già in DOM. x/y: posizione preferita top-left. anchorRect (opz): rect di riferimento per il flip-up.
function _clampPopover(el, x, y, anchorRect){
  const m=8;
  const w=el.offsetWidth||220, h=el.offsetHeight||120;
  let L=Math.min(Math.max(m,x), Math.max(m, window.innerWidth-w-m));
  let T=y;
  if(T+h>window.innerHeight-m){
    if(anchorRect && anchorRect.top-h-m>=m){
      T=anchorRect.top-h-m;
    } else {
      T=Math.max(m, window.innerHeight-h-m);
    }
  }
  if(T<m)T=m;
  el.style.left=L+'px';
  el.style.top=T+'px';
  return {L,T,w,h};
}

function panelPlayerBtn(scope, opts){
  opts=opts||{};
  const stateKey=_panelPlayerStateKey(scope);
  const max=opts.maxP||Math.max(1,S.multi||1);
  const sel=opts.allOnly?-1:(Number.isFinite(S[stateKey])?S[stateKey]:-1);
  const dots=[0,1,2,3].map(i=>{
    const on = sel===-1 ? false : (i===sel);
    return `<span class="m-dot${on?' on':''}"></span>`;
  }).join('');
  const label=sel===-1?'Tutti i player':'Player '+(sel+1);
  if(opts.allOnly){
    return `<span class="ib panel-mb" title="Tutti i player" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:28px;cursor:default;opacity:.85"><span class="multi-label" style="margin:0">${dots}</span></span>`;
  }
  const onclick=`_panelPlayerCycle('${scope}',${max})`;
  return `<button class="ib panel-mb" onclick="${onclick}" title="${label} — clic per cambiare" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:28px"><span class="multi-label" style="margin:0">${dots}</span></button>`;
}
function _panelPlayerCycle(scope, max){
  const key=_panelPlayerStateKey(scope);
  const cur=Number.isFinite(S[key])?S[key]:-1;
  const next=cur>=max-1?-1:cur+1;
  S[key]=next;
  try{saveConfig&&saveConfig();}catch(_){}
  // Aggiorna anche il pulsante multi nel header (#spMulti) — renderPanel non lo tocca.
  try{
    const spMul=document.getElementById('spMulti');
    if(spMul) spMul.innerHTML=panelPlayerBtn(scope,{maxP:Math.max(1,S.multi||1)});
  }catch(_){}
  if(typeof renderPanel==='function')renderPanel();
}

// Mostra i puntini-player allineati col logo verticalmente, prima del titolo del pannello.
// Quando il pannello non ha selezione per-player → icona "generale" (4 pallini pieni).
function multiDotsHeader(opts){
  opts=opts||{};

  if(generale){
    return `<span class="m-dots m-dots-generale" title="Sezione generale" style="display:inline-flex;align-items:center;gap:3px;padding:0 4px;flex-shrink:0">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--p)"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:var(--p)"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:var(--p)"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:var(--p)"></span>
    </span>`;
  }
  const sel=Number.isFinite(opts.selected)?opts.selected:(S.activePlayer||0);
  const max=Math.max(1,opts.max||S.multi||1);
  const cb=opts.onclick||'';
  const dots=Array.from({length:max}).map((_,i)=>{
    const on=i===sel;
    const c=PLAYER_COLORS[i%PLAYER_COLORS.length];
    return `<span class="m-dot" data-pid="${i}" onclick="${cb.replace('%p',i)}" style="width:8px;height:8px;border-radius:50%;background:${on?c:'var(--bd)'};cursor:pointer;transition:transform .12s${on?';transform:scale(1.25)':''}" title="Player ${i+1}"></span>`;
  }).join('');
  return `<span class="m-dots" style="display:inline-flex;align-items:center;gap:4px;padding:0 6px;flex-shrink:0">${dots}</span>`;
}

// T22: se solo un player ha una playlist, copia a quello vuoto e avvia
function sharePlaylistEmpty(targetPid){
  const tp=P(targetPid); if(!tp||tp.playlist.length>0)return false;
  // Sorgente preferita: il player ATTIVO (se ha materiale e non è il target),
  // così premendo play/avanti sul 2° lettore eredita la playlist che stai
  // guardando. Fallback: primo player non vuoto in ordine di id.
  let sourcePid=-1;
  const act=S.activePlayer;
  if(act!=null&&act!==targetPid&&act<S.multi&&P(act)&&P(act).playlist&&P(act).playlist.length>0){
    sourcePid=act;
  }else{
    for(let i=0;i<S.multi;i++){
      if(i===targetPid)continue;
      const pp=P(i); if(pp&&pp.playlist&&pp.playlist.length>0){sourcePid=i;break;}
    }
  }
  if(sourcePid<0)return false;
  const sp=P(sourcePid);
  // Copia silenziosa (batch) → un solo renderGrid()/saveConfig() invece che per file.
  sp.playlist.forEach(f=>{
    if(f.path)addFileByPathInto(targetPid,f.path,f.name,{silent:true});
    else tp.playlist.push({name:f.name,url:f.url,path:f.path,duration:f.duration,tags:f.tags});
  });
  tp.idx=Math.max(0,Math.min(sp.idx||0,tp.playlist.length-1));
  renderGrid();
  saveConfig();
  loadFileIntoPlayer(targetPid);
  setTimeout(()=>{if(tp.vidEl)tp.vidEl.play().catch(()=>{});},80);
  return true;
}

// Feature 8: riempie automaticamente un player vuoto pescando dalla shared queue
function autoFillEmptyPlayer(pid){
  const p=P(pid); if(p.playlist.length>0)return false;
  const q=S.sharedFolderQueue; if(!q||!q.length)return false;
  // Raccogli i path già in uso in qualsiasi player
  const used=new Set();
  for(let i=0;i<S.multi;i++){P(i).playlist.forEach(f=>used.add(f.path));}
  const next=q.find(f=>!used.has(f.path));
  if(!next)return false;
  addFileByPathInto(pid,next.path,next.name);
  p.idx=p.playlist.length-1;
  loadFileIntoPlayer(pid);
  return true;
}

async function act_savePlaylist(){
  closeMenus();
  if(!API){toast('Funzione disponibile solo in app');return;}
  // H12: ask which playlist to export
  const available=[];
  for(let i=0;i<S.multi;i++){const pp=P(i);if(pp&&pp.playlist&&pp.playlist.length)available.push(i);}
  if(!available.length){toast(t('noPlaylist')||'Nessuna playlist');return;}
  let choice=available[0];
  if(available.length>1){
    const res=await pickPlayerWithBalls(t('whichPlaylistExport')||'Quale playlist esportare?', null, available, {showAll:true});
    if(res==null)return;
    choice=res;
  }
  const pack=f=>({name:f.name,path:f.path,duration:f.duration,tags:f.tags||[],thumb:f.thumb||null});
  if(choice==='all'){
    const bundle={version:1,playlists:available.map(i=>({idx:i,items:(P(i).playlist||[]).map(pack)}))};
    const r=await API.savePlaylist(bundle);
    if(!r.canceled)toast(t('bundleSaved')||'Bundle salvato');
  } else {
    const idx=+choice;const pl=(P(idx).playlist||[]).map(pack);
    const r=await API.savePlaylist(pl);
    if(!r.canceled)toast('Playlist P'+(idx+1)+' '+(t('saved')||'salvata'));
  }
}

async function act_importPlaylist(){
  closeMenus();
  if(!API){toast('Funzione disponibile solo in app');return}
  const r=await API.importPlaylist();
  if(r.canceled||!r.items)return;
  // H12: detect bundle format
  const raw=r.items;
  if(raw&&!Array.isArray(raw)&&raw.version&&Array.isArray(raw.playlists)){
    let tot=0;
    raw.playlists.forEach(pl=>{
      const pid=pl.idx|0;if(pid<0||pid>3)return;
      ensurePlayers(pid+1);
      if(pid>=S.multi){S.multi=pid+1;renderMultiDots();}
      const pp=P(pid);(pl.items||[]).forEach(it=>{pp.playlist.push(newFile(it.name,mkUrl(it.path,it.url),it.path));if(it.tags)pp.playlist[pp.playlist.length-1].tags=it.tags;tot++;});
    });
    renderGrid();toast((t('imported')||'Importati')+' '+tot+' file');
  } else if(Array.isArray(raw)){
    raw.forEach(it=>addFileByPath(it.path,it.name));
    toast((t('imported')||'Importati')+' '+raw.length+' file');
  } else if(Array.isArray(raw&&raw.items)){
    raw.items.forEach(it=>addFileByPath(it.path,it.name));
  }
}

// ═══ Apri URL (feature 3) ═══
async function act_openURL(targetPid){
  const url=await themedPrompt({title:'Apri URL',message:'Inserisci URL video (mp4/webm/stream HLS/DASH/URL diretto)',placeholder:'https://...'});
  if(!url)return;
  const pid=(targetPid!=null)?targetPid:S.activePlayer;
  const p=P(pid);
  const name=url.split(/[?#]/)[0].split('/').pop()||url;
  // G6: try yt-dlp -g first for non-direct URLs
  const isDirect=/\.(mp4|webm|m3u8|mpd|mkv|mov|avi|ogv|mp3|m4a|wav|flac)(\?|$)/i.test(url);
  let realUrl=url;
  if(!isDirect&&window.maniac&&window.maniac.urlResolve){
    toast('Risolvo URL…');
    try{
      const cfg=_dlCfg&&_dlCfg();
      const r=await window.maniac.urlResolve(url,cfg&&cfg.vibraVidPath);
      if(r&&r.success&&r.url)realUrl=r.url;
      else if(r&&r.error){
        // fallback: try direct
        toast('yt-dlp: '+(r.error||'').slice(0,100)+' — provo diretto');
      }
    }catch(e){toast('Errore: '+e.message);}
  }
  p.playlist.push(newFile(name,realUrl,url));
  p.idx=p.playlist.length-1;
  S.activePlayer=pid;
  loadFileIntoPlayer(pid);
  toast('URL caricato in P'+(pid+1));
}

// Helper slider banda — step 0..21: 0=off(illim), 1..20=100Kb..20Mb, 21=illimitato
function _bwStepToKbps(step){
  if(step<=0||step>=21)return 0; // 0 = illimitato per yt-dlp
  // step 1..20 → 100..20000 Kb/s (lineare a scaglioni utili)
  // 1=100, 2=250, 3=500, 4=750, 5=1000(1Mb), poi 6..20 = 1500,2000,...,20000
  const map=[0,100,250,500,750,1000,1500,2000,3000,4000,5000,6000,8000,10000,12000,14000,16000,18000,19000,19500,20000];
  return map[step]||0;
}
function _bwLimitToStep(kbps){
  if(!kbps||kbps<=0)return 21;
  const map=[0,100,250,500,750,1000,1500,2000,3000,4000,5000,6000,8000,10000,12000,14000,16000,18000,19000,19500,20000];
  let best=21,bestD=Infinity;
  for(let i=1;i<=20;i++){const d=Math.abs(map[i]-kbps);if(d<bestD){bestD=d;best=i;}}
  return best;
}
function _bwLabel(kbps){
  if(!kbps||kbps<=0)return 'illimitato';
  if(kbps>=1000)return (kbps/1000).toFixed(kbps%1000?1:0)+' MB/s';
  return kbps+' KB/s';
}

// Prompt tematico semplice
function themedPrompt(opts){
  return new Promise(resolve=>{
    const o=Object.assign({title:'Input',message:'',placeholder:'',value:''},opts||{});
    const ov=document.createElement('div');
    ov.className='mdl-ov';
    ov.innerHTML=`<div class="mdl" role="dialog" aria-modal="true">
      <div class="mdl-ttl"></div>
      <div class="mdl-msg"></div>
      <input class="tp-inp" type="text" style="width:100%;padding:8px 10px;margin-top:10px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:400 12px 'Inter'">
      <div class="mdl-btns" style="margin-top:14px">
        <button class="mdl-btn" data-act="cancel">Annulla</button>
        <button class="mdl-btn primary" data-act="ok">OK</button>
      </div>
    </div>`;
    ov.querySelector('.mdl-ttl').textContent=o.title;
    ov.querySelector('.mdl-msg').textContent=o.message;
    const inp=ov.querySelector('.tp-inp');
    inp.placeholder=o.placeholder;inp.value=o.value;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('show'));
    const close=(v)=>{if(ov.parentNode)ov.parentNode.removeChild(ov);resolve(v);};
    ov.querySelector('[data-act="cancel"]').onclick=()=>close(null);
    ov.querySelector('[data-act="ok"]').onclick=()=>close(inp.value.trim()||null);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')close(inp.value.trim()||null);else if(e.key==='Escape')close(null);});
    setTimeout(()=>inp.focus(),80);
  });
}
