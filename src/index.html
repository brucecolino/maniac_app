// ═══ v2: Single-button Player Cycle ═══
// Un unico bottone con 4 dots (2×2). Stato "ALL" = tutti i dot dim (colore accent tenue).
// Stato "Pn" = il dot corrispondente è pieno viola, gli altri sono dim.
// Click → cicla: ALL → P1 → P2 → ... → P(maxP) → ALL.
// `sel`: -1/null = ALL, 0..maxP-1 = player specifico.
// `onPickFn`: codice JS dove %p è sostituito col prossimo valore (-1 o 0..N-1).
// opts.hideLabel: se true non mostra il testo "ALL"/"Pn" a destra.
// opts.skipAll: se true il ciclo è 0 → 1 → ... → 0 (no stato ALL).
function renderPlayerCycleBtn(sel, maxP, onPickFn, opts){
  const o=opts||{};
  const max=Math.max(1,maxP||1);
  const fn=onPickFn||'';
  const skipAll=!!o.skipAll;
  const isAll=(!skipAll && (sel===-1||sel==null));
  const circles=[];
  for(let i=0;i<4;i++){
    const cx=i%2===0?8:16, cy=i<2?8:16;
    const on=(!isAll && i===sel);
    circles.push(`<circle cx="${cx}" cy="${cy}" r="2.6" class="d${on?' on':''}"/>`);
  }
  // compute next
  let next;
  if(skipAll){ next=(sel+1)%max; }
  else { next=isAll?0:(sel+1>=max?-1:sel+1); }
  const nextArg=(next===-1?'-1':String(next));
  const cls='pcyc'+(isAll?' p0':' on');
  const lbl=isAll?'ALL':('P'+(sel+1));
  const title=isAll?'Tutti i player · clic per ciclare':('Player '+(sel+1)+' · clic per ciclare');
  const body=`<button class="${cls}" title="${title}" aria-label="${lbl}" onclick="${fn.replace('%p',nextArg)}"><svg viewBox="0 0 24 24">${circles.join('')}</svg></button>`;
  if(o.hideLabel) return body;
  return `<span class="pcyc-wrap ${isAll?'':'on'}">${body}<span class="pcyc-lbl">${lbl}</span></span>`;
}

function pickPlayerWithBalls(title, msg, validPids, opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.className='mdl-ov';
    const msgHtml=msg?`<div class="mdl-msg">${msg}</div>`:'';
    ov.innerHTML=`<div class="mdl"><div class="mdl-ttl">${title||'Seleziona player'}</div>${msgHtml}<div id="_pp_balls" style="margin:12px 0 8px"></div><div class="mdl-btns" style="justify-content:flex-end"><button class="mdl-btn" data-v="c">${t('cancel')||'Annulla'}</button></div></div>`;
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('show'));
    const close=(v)=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),180);resolve(v);};
    document.getElementById('_pp_balls').innerHTML=renderPlayerBallsLg(null,validPids,"window._ppPick(%p)",{showAll:!!opts.showAll});
    window._ppPick=(v)=>{close(v==='all'?'all':+v);};
    ov.querySelector('[data-v="c"]').onclick=()=>close(null);
    ov.addEventListener('click',e=>{if(e.target===ov)close(null);});
  });
}

// Maniac search-bar: input con lente + dropdown suggerimenti opzionali.
// id = id univoco dell'input. onInputFn = codice JS con %v sostituito dal valore.
// Debounce centralizzato per search input: evita renderPanel a ogni keystroke.
// Memorizza il valore subito (così se l'utente preme Enter o naviga, è coerente)
// ma defer il render via setTimeout 150ms, riavviando il timer ad ogni tasto.
window._maniacSearchDebounce=window._maniacSearchDebounce||{};
function _debouncedSearch(id, fn){
  if(window._maniacSearchDebounce[id])clearTimeout(window._maniacSearchDebounce[id]);
  window._maniacSearchDebounce[id]=setTimeout(()=>{
    try{ fn(); }catch(_){}
    delete window._maniacSearchDebounce[id];
  },250);
}
function renderSearchBar(id, placeholder, onInputFn, opts){
  const o=opts||{};
  const val=(o.value==null?'':String(o.value)).replace(/"/g,'&quot;');
  // Cattura il valore al momento dell'evento input, poi lo passa al callback debounced.
  // Il template originale usa "%v" che viene sostituito con "this.value" — manteniamo la
  // semantica catturando "this.value" in una variabile locale prima della chiusura debounced.
  const body=(onInputFn||'').replace(/%v/g,'__v');
  const lens=icon('search',{size:'sm'});
  const mb=o.inline?'0':'8px';
  const wrapped=`var __v=this.value; _debouncedSearch('${id}',function(){ ${body} });`;
  return `<div class="m-search" style="position:relative;margin-bottom:${mb}">
    <span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);display:inline-flex;pointer-events:none;opacity:.7">${lens}</span>
    <input id="${id}" class="m-input" value="${val}" placeholder="${placeholder||'Cerca…'}" oninput="${wrapped}" style="width:100%;padding-left:28px">
  </div>`;
}

function icon(name, opts){
  const file=ICON_MAP[name]||name;
  const o=opts||{};
  const cls='mi'+(o.size==='sm'?' mi-sm':o.size==='lg'?' mi-lg':o.size==='xl'?' mi-xl':'')+(o.cls?' '+o.cls:'');
  const style=o.style?` style="${o.style}"`:'';
  return `<img class="${cls}" src="../Icons/${file}--Streamline-Core.svg" alt=""${style} onerror="this.style.display='none'">`;
}

  // G14: Export/Import
  h+=`<div class="sg" style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

  h+='</div>';

}

function _wireExploreAutoSuggest(){
  const inp=document.getElementById('exploreSearch'); if(!inp)return;
  const dd=document.getElementById('exploreAutoSug'); if(!dd)return;
  if(inp.dataset._asWired)return;
  inp.dataset._asWired='1';
  const update=()=>{
    const q=(inp.value||'').toLowerCase().trim();
    if(q.length<2){dd.style.display='none';return;}
    const tags=(typeof allTags==='function'?allTags():[]).filter(t=>(t.label||'').toLowerCase().includes(q)).slice(0,5);
    const elems=(S.analysisElements||[]).filter(e=>!e.hidden&&((e.name||'').toLowerCase().includes(q))).slice(0,5);
    const flatFiles=[];
    S.players.forEach(p=>p&&(p.playlist||[]).forEach(f=>flatFiles.push(f)));
    const files=flatFiles.filter(f=>(f.name||'').toLowerCase().includes(q)).slice(0,5);
    if(!tags.length&&!elems.length&&!files.length){dd.style.display='none';return;}
    let html='';
    if(tags.length){
      html+='<div style="font:600 9px/1 \'Inter\';color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px">Tag</div>';
      tags.forEach(t=>{
        html+=`<div class="ctx-item" style="padding:6px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:11px;color:var(--t1)" onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='transparent'" onclick="S.exploreTagFilter=['${escApos(t.label)}'];document.getElementById('exploreSearch').value='';document.getElementById('exploreAutoSug').style.display='none';renderPanel()"><span style="width:8px;height:8px;border-radius:2px;background:${t.color||'#7B5EA7'}"></span>${(t.label||'').replace(/</g,'&lt;')}</div>`;
      });
    }
    if(elems.length){
      html+='<div style="font:600 9px/1 \'Inter\';color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px;border-top:1px solid var(--bd)">Elementi</div>';
      elems.forEach(e=>{
        html+=`<div class="ctx-item" style="padding:6px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:11px;color:var(--t1)" onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='transparent'" onclick="aiOpenElement&&aiOpenElement('${escApos(e.id)}');document.getElementById('exploreAutoSug').style.display='none'">${e.thumb?`<img src="${e.thumb}" style="width:16px;height:16px;border-radius:3px;object-fit:cover">`:'<span style="width:16px;height:16px;background:var(--s3);border-radius:3px"></span>'}<span>${(e.name||'').replace(/</g,'&lt;')}</span><span style="color:var(--t3);font-size:9px;margin-left:auto">${e.type||'face'}</span></div>`;
      });
    }
    if(files.length){
      html+='<div style="font:600 9px/1 \'Inter\';color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px;border-top:1px solid var(--bd)">File</div>';
      files.forEach(f=>{
        html+=`<div class="ctx-item" style="padding:6px 10px;cursor:pointer;font-size:11px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='transparent'" onclick="playByName('${escApos(f.name)}');document.getElementById('exploreAutoSug').style.display='none'">${(f.name||'').replace(/</g,'&lt;')}</div>`;
      });
    }
    dd.innerHTML=html;
    dd.style.display='block';
  };
  inp.addEventListener('input',update);
  inp.addEventListener('focus',update);
  document.addEventListener('mousedown',e=>{
    if(!dd.contains(e.target)&&e.target!==inp)dd.style.display='none';
  });
}
function _exploreToggleTagDD(){
  const dd=document.getElementById('exploreTagDD'); if(!dd)return;
  const open=dd.style.display==='block';
  dd.style.display=open?'none':'block';
  if(!open){setTimeout(()=>document.addEventListener('mousedown',_exploreOutsideTagDD,true),0);}
}
function _exploreOutsideTagDD(e){
  const dd=document.getElementById('exploreTagDD'); if(!dd)return;
  if(!dd.contains(e.target)&&!e.target.closest('button[onclick*="_exploreToggleTagDD"]')){
    dd.style.display='none';
    document.removeEventListener('mousedown',_exploreOutsideTagDD,true);
  }

async function tagsExport(){
  if(!window.maniac||!window.maniac.tagsExport){toast('IPC non disponibile');return;}
  const fileTags=await (window.maniac.fileTagsLoad?window.maniac.fileTagsLoad():Promise.resolve({}));
  // Esporta anche gli elementi analizzati con i loro thumb (snippet base64) e i preferiti elemento
  const elements=(S.analysisElements||[]).map(e=>({
    id:e.id, name:e.name, type:e.type||'face', thumb:e.thumb||null,
    files:e.files||[], hidden:!!e.hidden, tags:e.tags||[],
    nationality:e.nationality||null, kind:e.kind||null
  }));
  const data={
    tags:(S.customTags||[]),
    tagColors:(S.tagColors||{}),
    fileTags:fileTags||{},
    customTagColors:(S.customTagColors||[]),
    favorites:(S.favorites||[]),
    elementFavorites:(S.elementFavorites||[]),
    elements,
    exportedAt:new Date().toISOString()
  };
  const r=await window.maniac.tagsExport(data);
  if(r&&r.success)toast('Esportato: '+r.path);
  else if(r&&!r.canceled)toast('Errore: '+(r.error||''));
}
async function tagsImport(){
  if(!window.maniac||!window.maniac.tagsImport){toast('IPC non disponibile');return;}
  const r=await window.maniac.tagsImport();
  if(!r||!r.success){if(r&&!r.canceled)toast('Errore: '+(r.error||''));return;}
  const d=r.data||{};
  if(Array.isArray(d.tags)){S.customTags=Array.from(new Set([...(S.customTags||[]),...d.tags]));}
  if(d.tagColors&&typeof d.tagColors==='object'){S.tagColors=Object.assign({},S.tagColors||{},d.tagColors);}
  if(Array.isArray(d.customTagColors)){S.customTagColors=Array.from(new Set([...(S.customTagColors||[]),...d.customTagColors]));}
  if(Array.isArray(d.favorites)){S.favorites=Array.from(new Set([...(S.favorites||[]),...d.favorites]));}
  if(d.fileTags&&typeof d.fileTags==='object'&&window.maniac.fileTagsSave){
    const existing=(await window.maniac.fileTagsLoad())||{};
    const merged=Object.assign({},existing,d.fileTags);
    await window.maniac.fileTagsSave(merged);
  }
  // Importa elementi analizzati (con thumb) e preferiti elemento
  if(Array.isArray(d.elements)){
    S.analysisElements=S.analysisElements||[];
    const byId=new Map(S.analysisElements.map(e=>[e.id,e]));
    d.elements.forEach(e=>{
      if(!e||!e.id)return;
      const existing=byId.get(e.id);
      if(existing){
        // Merge: prefer existing thumb if presente, altrimenti usa quello importato
        if(!existing.thumb&&e.thumb)existing.thumb=e.thumb;
        if(e.tags)existing.tags=Array.from(new Set([...(existing.tags||[]),...e.tags]));
      } else {
        S.analysisElements.push(e);
      }
    });
    if(typeof _saveAnalysisHistory==='function'){try{_saveAnalysisHistory();}catch(_){}}
  }
  if(Array.isArray(d.elementFavorites)){
    S.elementFavorites=Array.from(new Set([...(S.elementFavorites||[]),...d.elementFavorites]));
  }
  saveConfig();
  toast('Tags ed elementi importati');
  renderPanel();
}

function openCustomColorPicker(initial,onPick){
  let hex=(initial||'7B5EA7').replace('#','').padEnd(6,'0').slice(0,6);
  const ov=document.createElement('div');ov.className='mdl-ov';

      <input id="ccpHex" type="text" maxlength="6" value="${hex}" style="flex:1;padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font:400 11px 'JetBrains Mono',monospace">
    </div>
    <div class="mdl-btns"><button class="mdl-btn" data-act="cancel">Annulla</button><button class="mdl-btn primary" data-act="ok">Applica</button></div>
  </div>`;
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('show'));
  const prev=ov.querySelector('#ccpPrev'),hexInp=ov.querySelector('#ccpHex'),rH=ov.querySelector('#ccpH'),rS=ov.querySelector('#ccpS'),rL=ov.querySelector('#ccpL');
  const hex2rgb=h=>{h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];};
  const rgb2hex=(r,g,b)=>[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const rgb2hsl=(r,g,b)=>{r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;}h*=60;}return[h,s*100,l*100];};
  const hsl2rgb=(h,s,l)=>{s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r,g,b;if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}return[(r+m)*255,(g+m)*255,(b+m)*255];};
  const sync=(src)=>{
    if(src==='hex'){const h=hexInp.value.replace(/[^0-9a-f]/gi,'').padEnd(6,'0').slice(0,6);const[r,g,b]=hex2rgb(h);const[H,S,L]=rgb2hsl(r,g,b);rH.value=Math.round(H);rS.value=Math.round(S);rL.value=Math.round(L);hex=h;}
    else {const[r,g,b]=hsl2rgb(+rH.value,+rS.value,+rL.value);hex=rgb2hex(r,g,b);hexInp.value=hex;}
    prev.style.background='#'+hex;
  };
  sync('hex');
  hexInp.oninput=()=>sync('hex');[rH,rS,rL].forEach(r=>r.oninput=()=>sync('hsl'));
  const close=(v)=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),200);if(typeof onPick==='function'&&v)onPick(hex);};
  ov.querySelector('[data-act="cancel"]').onclick=()=>close(false);
  ov.querySelector('[data-act="ok"]').onclick=()=>close(true);
}

async function assignTagWithScope(pid,color,label){
  const p=P(pid); if(!p||!p.playlist||!p.playlist.length){toggleTag(pid,p?p.idx:0,color,label);_bumpTagRecent(label);saveConfig();renderPanel();return;}
  const f=p.playlist[p.idx];
  const has=f&&(f.tags||[]).some(tg=>tg.color===color);
  if(has){
    // Unassign from single without prompt
    toggleTag(pid,p.idx,color,label); _bumpTagRecent(label); saveConfig(); renderPanel(); return;
  }
  const choice=await themedChoice3({
    title:'Assegna tag',
    message:'Assegnare questa tag al video singolo o a tutta la playlist del player?',
    a:'Solo questo video',
    b:'Tutta la playlist',
    c:'Annulla'
  });
  if(choice==='c')return;
  if(choice==='a'){toggleTag(pid,p.idx,color,label);}
  else if(choice==='b'){
    let cnt=0;
    (p.playlist||[]).forEach((ff,fi)=>{
      ff.tags=ff.tags||[];
      if(!ff.tags.some(tg=>tg.color===color)){ff.tags.push({color,label});cnt++;}
    });
    persistFileTags();toast('Tag "'+label+'" applicata a '+cnt+' file');
  }
  _bumpTagRecent(label);saveConfig();renderPanel();
}

// Wrapper per il context-menu: tagOptionsCtx → _tagCtxDelete → deleteTagDef
function deleteTagDef(label){
  if(typeof removeCustomTag==='function')removeCustomTag(label);
}
function renameTag(oldLabel,newLabel){
  newLabel=(newLabel||'').trim(); if(!newLabel||newLabel===oldLabel){S._editingTag=null;renderPanel();return;}
  if(allTags().some(t=>t.label===newLabel)){toast('Nome già esistente');return;}
  // Update customTags
  (S.customTags||[]).forEach(tc=>{if(tc.label===oldLabel)tc.label=newLabel;});
  // Also update builtin rename via override map
  S.tagLabelOverrides=S.tagLabelOverrides||{};
  if(!((S.customTags||[]).some(tc=>tc.label===newLabel)))S.tagLabelOverrides[oldLabel]=newLabel;
  // Update files
  allFiles().forEach(f=>{if(f.tags)f.tags.forEach(tg=>{if(tg.label===oldLabel)tg.label=newLabel;});});
  if(S.tagFilter===oldLabel)S.tagFilter=newLabel;
  if(Array.isArray(S.tagMultiSel))S.tagMultiSel=S.tagMultiSel.map(l=>l===oldLabel?newLabel:l);
  if(S.tagsCustomOrder){const i=S.tagsCustomOrder.indexOf(oldLabel);if(i>=0)S.tagsCustomOrder[i]=newLabel;}
  S._editingTag=null;
  persistFileTags();saveConfig();renderPanel();
}
async function confirmRemoveCustomTag(label){
  const ok=await themedConfirm({title:'Elimina tag',message:`Eliminare il tag "${label}"? Verrà rimosso anche da tutti i file.`,danger:true,confirmText:'Elimina',cancelText:'Annulla'});
  if(!ok)return;
  removeCustomTag(label);
}
window._tagDragSrc=null;
function _tagDragStart(e,label){window._tagDragSrc=label;try{e.dataTransfer.effectAllowed='move';}catch(_){}}
function _tagDrop(e,label){
  e.preventDefault();
  const src=window._tagDragSrc; window._tagDragSrc=null;
  if(!src||src===label)return;
  const allLabels=allTags().map(t=>t.label);
  const ord=(S.tagsCustomOrder&&S.tagsCustomOrder.length)?S.tagsCustomOrder.filter(l=>allLabels.includes(l)):allLabels.slice();
  allLabels.forEach(l=>{if(!ord.includes(l))ord.push(l);});
  const si=ord.indexOf(src),di=ord.indexOf(label);
  if(si<0||di<0)return;
  ord.splice(si,1); ord.splice(di,0,src);
  S.tagsCustomOrder=ord;
  S.tagsSort='custom';
  saveConfig();renderPanel();
}
function _bumpTagRecent(label){
  S.tagsRecent=S.tagsRecent||{};
  S.tagsRecent[label]=Date.now();
}
function removeCustomTag(label){
  S.customTags=(S.customTags||[]).filter(t=>t.label!==label);
  // Rimuovi anche dai file
  allFiles().forEach(f=>{if(f.tags)f.tags=f.tags.filter(t=>t.label!==label);});
  persistFileTags();
  saveConfig();renderPanel();
}
function toggleToolbarIcon(k,el){
  S.toolbarIcons=S.toolbarIcons||{tc:false,td:true,loop:true,shuf:true,mag:true,fav:true,pl:true,fs:true};

function toggleTagMultiSel(lbl){

function copyLogsToClipboard(){
  const logs=(S.logs||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!logs.length){toast('Nessun log da copiare');return;}
  const lines=logs.map(l=>{
    const d=new Date(l.ts||Date.now());
    const ts=d.toISOString().replace('T',' ').slice(0,19);
    let s=`[${ts}] ${l.msg||''}`;
    if(l.extra)s+='\n  extra: '+l.extra;
    if(l.stack)s+='\n'+l.stack;
    return s;
  });
  const txt=lines.join('\n\n');
  try{
    navigator.clipboard.writeText(txt).then(
      ()=>toast(`${logs.length} log copiati negli appunti`),
      ()=>{ _fallbackCopy(txt); toast('Log copiati'); }
    );
  }catch(e){ _fallbackCopy(txt); toast('Log copiati'); }
}
function _fallbackCopy(txt){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }catch(_){}
}

function renderLogs(){
  const logs=(S.logs||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!logs.length)return '<div style="text-align:center;padding:20px 0;color:var(--t3);font-size:11px">Nessun log</div>';
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px">
    <span style="font-size:11px;color:var(--t3)">${logs.length} voci</span>
    <div style="display:flex;gap:6px">
      <button class="reset-btn" style="border:1px solid var(--bd);background:var(--s2);color:var(--t1);padding:5px 10px;font-size:10px" onclick="copyLogsToClipboard()">Copia</button>
      <button class="reset-btn" style="background:var(--err);color:#fff;border:0;padding:5px 10px;font-size:10px" onclick="S.logs=[];saveConfig();renderPanel()">Cancella</button>
    </div>
  </div>`;
  const lastErr=logs[0];
  if(lastErr){
    h+=`<div style="margin-bottom:8px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--s2)">
      <div style="font:600 10px/1 'Inter';color:var(--err);text-transform:uppercase;margin-bottom:4px">Ultimo errore</div>
      <textarea readonly style="width:100%;min-height:60px;resize:vertical;background:var(--s1);color:var(--t1);border:1px solid var(--bd);border-radius:4px;padding:6px;font:400 10px/1.3 'JetBrains Mono',monospace">${String(lastErr.msg||'').replace(/</g,'&lt;')}${lastErr.extra?'\n'+String(lastErr.extra).replace(/</g,'&lt;'):''}${lastErr.stack?'\n\n'+String(lastErr.stack).replace(/</g,'&lt;'):''}</textarea>
    </div>`;
  }
  logs.forEach((l,i)=>{
    const d=new Date(l.ts||Date.now());
    const ts=d.toLocaleDateString()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    const details=(l.stack||l.extra||'').toString().replace(/</g,'&lt;');
    h+=`<div class="log-item" onclick="this.classList.toggle('open')"><span class="log-ts">${ts}</span><span class="log-msg">${String(l.msg||'').replace(/</g,'&lt;')}</span>${l.extra?`<span class="log-extra">${String(l.extra).replace(/</g,'&lt;')}</span>`:''}${details?`<pre class="log-stack">${details}</pre>`:''}</div>`;
  });
  return h;
}
function sendContact(){
  const name=$('cuName').value.trim(), last=$('cuLast').value.trim();
  const mail=$('cuMail').value.trim(), subj=$('cuSubj').value.trim(), msg=$('cuMsg').value.trim();
  if(!name||!mail||!msg){toast(t('requiredFields')); return;}
  const body=encodeURIComponent(`${name} ${last}\n${mail}\n\n${msg}`);
  const s=encodeURIComponent(subj?`MANIAC SUPPORT - ${subj}`:'MANIAC SUPPORT');
  openExt(`mailto:info@apicesite.com?subject=${s}&body=${body}`);
  toast(t('messageSent'));
  $('contactSec').classList.add('hidden');
  ['cuName','cuLast','cuMail','cuSubj','cuMsg'].forEach(id=>$(id).value='');
}

function _buildSubItems(kind,pid){
  const p=P(pid); const items=[];
  if(kind==='open'){
    items.push({id:'open_file',label:'File'});
    items.push({id:'open_folder',label:'Cartella'});
    items.push({id:'open_url',label:'URL'});
  }else if(kind==='webcam'){
    items.push({id:'wc_open',label:'Apri webcam / impostazioni'});
    items.push({id:'wc_audio',label:'Impostazioni audio input'});
  }else if(kind==='mag'){
    items.push({id:'mag_0',label:'Disattiva lente',checked:!p._mag});
    [2,4,8].forEach(z=>items.push({id:'mag_'+z,label:'Ingrandimento '+z+'×',checked:!!(p._mag&&p.magZoom===z)}));
  }else if(kind==='speed'){
    PLAYBACK_SPEEDS.forEach(s=>{
      items.push({id:'spd_'+s.val,label:s.label+' ('+s.val+'x)',checked:(p.speed||1)===s.val});
    });
  }else if(kind==='subTrack'){
    const tracks=(p.vidEl&&p.vidEl.textTracks)?Array.from(p.vidEl.textTracks):[];
    if(!tracks.length){items.push({id:'sub_none',label:'Nessuna traccia embedded',enabled:false});}
    tracks.forEach((tk,i)=>{
      items.push({id:'subtrk_'+i,label:(tk.label||tk.language||'Traccia '+(i+1))+(tk.language?' ('+tk.language+')':''),checked:tk.mode==='showing'});
    });
  }else if(kind==='subs'){
    items.push({id:'sub_toggle',label:(p.subtitlesOn?'Disattiva':'Attiva')+' sottotitoli',checked:!!p.subtitlesOn});
    const tracks=(p.vidEl&&p.vidEl.textTracks)?Array.from(p.vidEl.textTracks):[];
    if(tracks.length)items.push({id:'sub_embedded',label:'Lingua embedded ('+tracks.length+')…'});
    items.push({id:'sub_import',label:'Importa .srt / .vtt'});
    items.push({id:'sub_generate',label:'Genera dai dialoghi'});
    items.push({id:'sub_genTrans',label:'Genera + Traduci'});
    items.push({id:'sub_translate',label:'Traduci',hasSub:true});
    items.push({id:'sub_settings',label:'Impostazioni sottotitoli'});
  }else if(kind==='subTranslate'){
    const langs=[['it','Italiano'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português'],['ru','Русский'],['zh','中文'],['ja','日本語'],['ko','한국어'],['ar','العربية'],['hi','हिन्दी'],['tr','Türkçe'],['pl','Polski'],['nl','Nederlands']];
    const cur=S.translatorLang||'it';
    langs.forEach(([v,n])=>items.push({id:'subtr_'+v,label:n,checked:cur===v}));
  }else if(kind==='tag'){
    const f2=p.playlist[p.idx];
    const fileTags=f2?(f2.tags||[]):[];
    items.push({id:'tag_new',label:'+ '+t('addTag')});
    allTags().forEach(tc=>{
      const checked=fileTags.some(t=>t.color===tc.color);
      items.push({id:'tag_'+tc.color,label:tc.label,checked,_color:tc.color});
    });
  }
  return items;
}

function _runSubAction(kind,pid,id){
  if(!id)return;
  if(kind==='open'){
    S.activePlayer=pid;
    if(id==='open_file')act_openFile();
    else if(id==='open_folder')act_openFolder();
    else if(id==='open_url')act_openURL(pid);
  }else if(kind==='webcam'){
    if(id==='wc_open'){S.activePlayer=pid;S.webcamPlayer=pid;S.settingsPlayer=pid;S.stab='webcam';openPanel('settings');}
    else if(id==='wc_audio'){S.settingsPlayer=pid;S.stab='audioin';openPanel('settings');}
  }else if(kind==='mag'){
    if(id==='mag_0')setMagZoom(pid,0);
    else if(id.startsWith('mag_'))setMagZoom(pid,parseInt(id.slice(4),10));
  }else if(kind==='speed'){
    if(id && id.startsWith('spd_'))applyPlaybackSpeed(pid,+id.slice(4));
  }else if(kind==='subTrack'){
    if(id && id.startsWith('subtrk_')){
      const p=P(pid);const tracks=(p.vidEl&&p.vidEl.textTracks)?Array.from(p.vidEl.textTracks):[];
      const idx=+id.slice(7);
      tracks.forEach((tk,i)=>{tk.mode=(i===idx)?'showing':'disabled';});
      p.subtitlesOn=true;saveConfig();toast('Traccia attivata');
    }
  }else if(kind==='subs'){
    if(id==='sub_toggle')toggleSubtitles(pid);
    else if(id==='sub_import')importSubtitles(pid);
    else if(id==='sub_generate')generateSubsFromAudio(pid);
    else if(id==='sub_genTrans')autoDetectAndTranslateSubs(pid);
    else if(id==='sub_embedded'){setTimeout(()=>_showCtxSub({currentTarget:document.body},'subTrack',pid),10);}
    else if(id==='sub_translate'){setTimeout(()=>_showCtxSub({currentTarget:document.body},'subTranslate',pid),10);}
    else if(id==='sub_settings'){S.settingsPlayer=pid;S.stab='subtitles';openPanel('settings');}
  }else if(kind==='subTranslate'){
    if(id&&id.startsWith('subtr_')){
      const lang=id.slice(6);
      S.translatorLang=lang; saveConfig();
      translateCurrentSubs(pid,lang);
    }
  }else if(kind==='tag'){
    if(id==='tag_new'){S.tagsTab=1;S.tagAssignPlayer=pid;openPanel('tags');return;}
    const tc=allTags().find(t=>'tag_'+t.color===id);
    if(tc)toggleTag(pid,P(pid).idx,tc.color,tc.label);
  }
}

function _showCtxSub(e,kind,pid){
  // Rimuovi sub esistenti ma NON il menu principale (resta visibile sempre)
  document.querySelectorAll('.ctx-sub').forEach(el=>el.remove());
  const items=_buildSubItems(kind,pid);
  const item=e.currentTarget;
  const sub=document.createElement('div');
  sub.className='ctx ctx-sub show';
  sub.setAttribute('data-parent-kind',kind);
  let h='';
  items.forEach(it=>{
    const arr=it.hasSub?'<span class="ctx-arr" style="margin-left:auto;color:var(--t3)">▸</span>':'';
    const chk=(!arr && it.checked)?'<svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12" style="margin-left:auto;color:var(--p)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>':'';
    const dot=it._color?`<span class="ctx-tag" style="background:${getTagBg(it._color)}"></span>`:'';
    h+=`<div class="ctx-item" data-subid="${it.id}">${dot}<span style="flex:1">${it.label}</span>${chk}${arr}</div>`;
  });
  sub.innerHTML=h;
  document.body.appendChild(sub);
  sub.querySelectorAll('[data-subid]').forEach(el=>{
    el.addEventListener('click',(ev)=>{ev.stopPropagation();_runSubAction(kind,pid,el.getAttribute('data-subid'));hideCtx();});
  });
  // Posiziona: prova a destra dell'item, se non ci sta prova a sinistra, poi clamp
  const r=item.getBoundingClientRect();
  const subW=sub.offsetWidth||210;
  const subH=sub.offsetHeight||120;
  const gap=2;
  let L=r.right+gap, T=r.top-4;
  if(L+subW>window.innerWidth-6){
    // Flip a sinistra
    L=r.left-subW-gap;
    if(L<6){
      // Se non ci sta neanche a sinistra: sovrapponi spostato in alto/basso
      L=Math.max(6,Math.min(window.innerWidth-subW-6,r.left));
      T=(r.bottom+subH<window.innerHeight-6)?r.bottom+gap:Math.max(6,r.top-subH-gap);
    }
  }
  if(T+subH>window.innerHeight-6)T=Math.max(6,window.innerHeight-subH-6);
  if(T<6)T=6;
  sub.style.left=L+'px'; sub.style.top=T+'px';
  // Il submenu resta aperto finché il mouse è su parent o submenu
  // Chiusura solo quando l'intero menu (parent+sub) perde il focus
  sub._kind=kind;
}

function toggleTag(pid,idx,color,label){
  const p=P(pid); const f=p.playlist[idx]; if(!f)return;
  const i=f.tags.findIndex(t=>t.color===color);
  if(i>=0)f.tags.splice(i,1); else f.tags.push({color,label});
  persistFileTags();
  if(S.panel==='playlist'||S.panel==='tags')renderPanel();
}

function removeFileFromPlayer(pid,idx){
  const p=P(pid); if(idx<0||idx>=p.playlist.length)return;
  const target=p.playlist[idx];
  // Se stiamo rimuovendo la sorgente webcam/stream live, esci dalla modalità webcam
  if(target&&target._live){exitWebcamMode(pid);if(S.panel==='playlist'&&S.panelPlayer===pid)renderPanel();return;}
  if(idx===p.idx&&p.vidEl){p.vidEl.pause();p.vidEl.src='';p.vidEl=null;}
  p.playlist.splice(idx,1);
  if(p.idx>=p.playlist.length)p.idx=p.playlist.length-1;
  renderGrid();
  if(S.panel==='playlist'&&S.panelPlayer===pid)renderPanel();
}

function _dropAddFile(f, target, fi){
  const pid=(target!==null)?target:(() => {
    let t=S.activePlayer;
    if(S.multi>1){for(let j=0;j<S.multi;j++){if(P(j).playlist.length===0){t=j;break;}}}
    return t;
  })();
  const tp=P(pid);
  if(tp&&(tp._stream||tp.source==='stream')){
    if(tp._stream){try{tp._stream.getTracks().forEach(t=>t.stop());}catch(e){}}
    tp._stream=null;tp.source=null;
    tp.playlist=tp.playlist.filter(x=>!x._live);
    if(tp.vidEl){try{tp.vidEl.srcObject=null;tp.vidEl.removeAttribute('src');}catch(e){}}
    if(tp.idx>=tp.playlist.length)tp.idx=Math.max(0,tp.playlist.length-1);
  }
  const url=f.path?'file:///'+f.path.replace(/\\/g,'/').replace(/^\/+/,''):URL.createObjectURL(f);
  addToPlayer(pid,f.name,url,f.path||f.name);
  if(fi===0){
    tp.idx=tp.playlist.length-1;
    S.activePlayer=pid;
    loadFileIntoPlayer(pid);
  }
}

async function _readDirEntryRecursive(dirEntry,out){
  return new Promise(resolve=>{
    const reader=dirEntry.createReader();
    const readBatch=()=>{
      reader.readEntries(async entries=>{
        if(!entries.length){resolve();return;}
        for(const en of entries){
          if(en.isFile){
            await new Promise(r=>en.file(fl=>{out.push(fl);r();},()=>r()));
          }else if(en.isDirectory){
            await _readDirEntryRecursive(en,out);
          }
        }
        readBatch();
      },()=>resolve());
    };
    readBatch();
  });
}

async function handleDrop(e){
  e.preventDefault();
  $('vGrid').classList.remove('dragover');
  const cell=e.target.closest('.vc');
  const target=cell?+cell.getAttribute('data-pid'):null;
  if(target!==null){const tp=P(target);if(tp&&(tp._stream||tp.source==='stream'))exitWebcamMode(target);}

  const items=Array.from(e.dataTransfer.items||[]);
  const files=Array.from(e.dataTransfer.files||[]);
  const collected=[];
  let folderCount=0;
  for(let i=0;i<items.length;i++){
    const item=items[i];
    const entry=item.webkitGetAsEntry&&item.webkitGetAsEntry();
    const f=item.getAsFile&&item.getAsFile();
    if(entry&&entry.isDirectory){
      folderCount++;
      const dirPath=f?_filePath(f):'';
      if(dirPath&&API&&API.scanFolder){
        try{
          const scanned=await API.scanFolder(dirPath);
          scanned.forEach(sf=>collected.push({name:sf.name,path:sf.path}));
          if(scanned.length)toast(`Aggiunti ${scanned.length} file dalla cartella`);
        }catch(err){logError('scanFolder failed: '+(err&&err.message||err));}
      }else{
        try{
          const gathered=[];
          await _readDirEntryRecursive(entry,gathered);
          gathered.forEach(fl=>collected.push(fl));
          if(gathered.length)toast(`Aggiunti ${gathered.length} file dalla cartella`);
        }catch(err){logError('readDir failed: '+(err&&err.message||err));}
      }
    }else if(f){
      const fp=_filePath(f);
      collected.push(fp?{name:f.name,path:fp}:f);
    }
  }
  if(!items.length){files.forEach(f=>{const fp=_filePath(f);collected.push(fp?{name:f.name,path:fp}:f);});}
  if(!collected.length){
    if(folderCount===0)logError('Drop: nessun file valido trovato');
    return;
  }
  // Sort by name for folder-as-playlist ordering
  collected.sort((a,b)=>{
    const an=a.name||'', bn=b.name||'';
    return an.localeCompare(bn,undefined,{numeric:true,sensitivity:'base'});
  });
  const pidTarget=(target!==null)?target:(() => {
    let t=S.activePlayer;
    if(S.multi>1){for(let j=0;j<S.multi;j++){if(P(j).playlist.length===0){t=j;break;}}}
    return t;
  })();
  const startLen=P(pidTarget).playlist.length;
  collected.forEach((f,fi)=>_dropAddFile(f,target,fi));
  // Ensure playback starts from first new file
  setTimeout(()=>{
    const tp=P(pidTarget);
    if(tp.playlist.length>startLen){
      tp.idx=startLen;
      S.activePlayer=pidTarget;
      loadFileIntoPlayer(pidTarget);
    }
  },100);
}

function matchShortcut(e,combo){
  if(!combo)return false;
  const parts=combo.split('+');
  const key=parts[parts.length-1];
  const needCtrl=parts.includes('Ctrl');
  const needShift=parts.includes('Shift');
  const needAlt=parts.includes('Alt');
  return e.ctrlKey===needCtrl&&e.shiftKey===needShift&&e.altKey===needAlt&&(e.key===key||e.code===key||(key==='Space'&&e.code==='Space'));
}

function _cmdpDynamic(){
  const out=[];
  const seen=new Set();
  // File aperti nei player correnti
  (S.players||[]).forEach((p,pi)=>{
    if(!p)return;
    (p.playlist||[]).forEach(f=>{
      if(!f||!f.path||seen.has(f.path))return;
      seen.add(f.path);
      const name=f.name||f.path.split(/[\\\/]/).pop();
      out.push({id:'fp:'+f.path,l:name,h:'Player '+(pi+1),k:'file',i:icon('film'),x:()=>{
        const ap=activeP&&activeP();if(!ap)return;
        let i=ap.playlist.findIndex(x=>x.path===f.path);
        if(i<0){ap.playlist.unshift(f);i=0;}
        ap.idx=i;loadFileIntoPlayer&&loadFileIntoPlayer(S.activePlayer);
      }});
    });
  });
  // Recenti
  (S.recent||[]).slice(0,15).forEach(r=>{
    if(!r)return;
    const path=typeof r==='string'?r:r.path;
    const name=typeof r==='string'?path.split(/[\\\/]/).pop():(r.name||path.split(/[\\\/]/).pop());
    if(!path||seen.has(path))return;
    seen.add(path);
    out.push({id:'rc:'+path,l:name,h:'File recente',k:'file',i:icon('reload'),x:()=>{
      typeof act_openRecent==='function'?act_openRecent(path):(typeof openFileFromPath==='function'&&openFileFromPath(path));
    }});
  });
  // Cronologia (videos visti)
  (S.history||[]).slice(0,20).forEach(h=>{
    if(!h||!h.path||seen.has(h.path))return;
    seen.add(h.path);
    out.push({id:'hi:'+h.path,l:h.name||h.path.split(/[\\\/]/).pop(),h:'Cronologia',k:'file',i:icon('reload'),x:()=>{
      typeof act_openRecent==='function'&&act_openRecent(h.path);
    }});
  });
  // Attori / elementi analizzati
  (S.analysisElements||[]).filter(e=>!e.hidden).slice(0,40).forEach(el=>{
    out.push({id:'el:'+el.id,l:el.name,h:`${el.type||'face'} · ${(el.files||[]).length} file`,k:'actor',i:el.thumb?null:icon('user'),thumb:el.thumb,x:()=>{
      S._exploreSearch=el.name;openPanel('explore');
    }});
  });
  // Tags
  if(typeof allTags==='function'){
    allTags().slice(0,40).forEach(tc=>{
      out.push({id:'tg:'+tc.label,l:tc.label,h:'Tag',k:'tag',i:icon('bookmark'),x:()=>{
        S.tagFilter=tc.label;openPanel('tags');
      }});
    });
  }
  // URL incollata? Suggerisci download immediato
  if(window._cmdpQuery && /^(https?:\/\/|magnet:)/i.test(window._cmdpQuery.trim())){
    const url=window._cmdpQuery.trim();
    out.unshift({id:'url:'+url,l:'Scarica: '+url.slice(0,60)+(url.length>60?'…':''),h:'Premi Enter',k:'action',i:icon('download'),x:()=>{
      typeof dlStart==='function'&&dlStart(url);
    }});
    out.unshift({id:'url-sc:'+url,l:'Cerca su StreamingCommunity: '+url.slice(0,40),h:'Apri wizard',k:'wizard',i:icon('film'),x:()=>{
      typeof scWizardOpen==='function'&&scWizardOpen();
    }});
  }
  return out;
}

function _cmdpFuzzy(text,q){
  if(!q)return 1;
  const t=String(text||'').toLowerCase(),Q=q.toLowerCase();
  if(t===Q)return 10000;
  if(t.startsWith(Q))return 5000-Math.abs(t.length-Q.length);
  // word-boundary match
  if(t.includes(' '+Q)||t.includes('-'+Q)||t.includes('·'+Q)||t.includes('…'+Q))return 1000;
  if(t.includes(Q))return 300;
  // subsequence
  let i=0;for(const c of t){if(c===Q[i])i++;if(i===Q.length)break;}
  return i===Q.length?80:0;
}

function _cmdpRender(){
  const list=document.getElementById('cmdpList');if(!list)return;
  const q=(window._cmdpQuery||'').trim();
  const reg=_cmdpRegistry().concat(_cmdpDynamic());
  // Filtra + score
  let scored=reg.map(it=>{
    const s=Math.max(_cmdpFuzzy(it.l,q),(_cmdpFuzzy(it.h||'',q)*.4));
    return {it,s};
  }).filter(x=>x.s>0);
  // Quando vuoto, mostra default sensati: pannelli + azioni top
  if(!q){
    scored=reg.filter(it=>['panel','action','wizard'].includes(it.k)).slice(0,18).map(it=>({it,s:1}));
  }
  scored.sort((a,b)=>b.s-a.s);
  scored=scored.slice(0,40);
  window._cmdpResults=scored.map(x=>x.it);
  if(!scored.length){
    list.innerHTML='<div class="cmdp-empty">Nessun risultato per «'+q.replace(/</g,'&lt;')+'».<br>Prova: <kbd>tema</kbd> · <kbd>analizza</kbd> · <kbd>scarica</kbd> · un nome attore · un tag.</div>';
    return;
  }
  // Raggruppa per kind se non c'è query (per default view)
  const order=['action','wizard','panel','settings','control','system','file','actor','tag'];
  const labels={action:'Azioni',wizard:'Wizard',panel:'Pannelli',settings:'Impostazioni',control:'Controlli player',system:'Sistema',file:'File',actor:'Elementi analizzati',tag:'Tag'};
  let html='';
  if(!q){
    const groups={};
    scored.forEach(x=>{const k=x.it.k;(groups[k]=groups[k]||[]).push(x.it);});
    for(const k of order){
      const arr=groups[k];if(!arr||!arr.length)continue;
      html+=`<div class="cmdp-section">${labels[k]||k}</div>`;
      arr.forEach((it,idx)=>{html+=_cmdpItemHtml(it,window._cmdpResults.indexOf(it));});
    }
  } else {
    scored.forEach((x,idx)=>{html+=_cmdpItemHtml(x.it,idx);});
  }
  list.innerHTML=html;
  _cmdpUpdateActive();
}
function _cmdpItemHtml(it,gIdx){
  const ico=it.thumb?`<img src="${it.thumb}">`:`${it.i||'•'}`;
  const hint=it.h?`<span class="cmdp-item-hint">${String(it.h).replace(/</g,'&lt;')}</span>`:'';
  return `<div class="cmdp-item" data-idx="${gIdx}" onclick="_cmdpExec(${gIdx})"><span class="cmdp-item-ico">${ico}</span><span class="cmdp-item-label">${String(it.l||'').replace(/</g,'&lt;')}</span>${hint}</div>`;
}
function _cmdpUpdateActive(){
  const list=document.getElementById('cmdpList');if(!list)return;
  list.querySelectorAll('.cmdp-item').forEach(el=>el.classList.remove('active'));
  const items=list.querySelectorAll('.cmdp-item');
  if(!items.length)return;
  const i=Math.max(0,Math.min(window._cmdpSel||0,items.length-1));
  items[i]&&items[i].classList.add('active');
  items[i]&&items[i].scrollIntoView({block:'nearest'});
}
function _cmdpExec(idx){
  const it=(window._cmdpResults||[])[idx];
  if(!it)return;
  closeCommandPalette();
  setTimeout(()=>{try{it.x();}catch(e){toast&&toast('Errore: '+e.message);}},10);
}
function openCommandPalette(){
  let ov=document.getElementById('cmdpOv');
  if(!ov){
    ov=document.createElement('div');ov.id='cmdpOv';ov.className='cmdp-ov';
    ov.innerHTML=`<div class="cmdp" role="dialog" aria-modal="true">
      <div class="cmdp-input-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" width="16" height="16"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cmdpInp" class="cmdp-input" type="text" placeholder="Digita un comando, cerca un file, un attore, un tag…" autocomplete="off" spellcheck="false">
        <span class="cmdp-kbd">Esc</span>
      </div>
      <div id="cmdpList" class="cmdp-list"></div>
      <div class="cmdp-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> naviga · <kbd>Enter</kbd> esegui · <kbd>Esc</kbd> chiudi</span>
        <span style="opacity:.7">Maniac · Command Palette</span>
      </div>
    </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)closeCommandPalette();});
    const inp=ov.querySelector('#cmdpInp');
    inp.addEventListener('input',()=>{
      window._cmdpQuery=inp.value;window._cmdpSel=0;_cmdpRender();
    });
    inp.addEventListener('keydown',e=>{
      const items=document.querySelectorAll('#cmdpList .cmdp-item');
      const max=items.length;
      if(e.key==='Escape'){e.preventDefault();closeCommandPalette();return;}
      if(e.key==='ArrowDown'){e.preventDefault();window._cmdpSel=Math.min((window._cmdpSel||0)+1,max-1);_cmdpUpdateActive();return;}
      if(e.key==='ArrowUp'){e.preventDefault();window._cmdpSel=Math.max((window._cmdpSel||0)-1,0);_cmdpUpdateActive();return;}
      if(e.key==='Enter'){e.preventDefault();_cmdpExec(window._cmdpSel||0);return;}
      if(e.key==='Tab'){e.preventDefault();window._cmdpSel=((window._cmdpSel||0)+(e.shiftKey?-1:1)+max)%max;_cmdpUpdateActive();return;}
    });
  }
  window._cmdpQuery='';window._cmdpSel=0;
  const inp=document.getElementById('cmdpInp');if(inp){inp.value='';}
  _cmdpRender();
  ov.classList.add('show');
  setTimeout(()=>{const i=document.getElementById('cmdpInp');i&&i.focus();},20);
}
function closeCommandPalette(){
  const ov=document.getElementById('cmdpOv');if(!ov)return;
  ov.classList.remove('show');
}

// chiamate ravvicinate in una sola scrittura (flush garantito alla chiusura).
let _saveCfgTimer=null,_saveCfgPending=false;
function saveConfig(){
  _saveCfgPending=true;
  if(_saveCfgTimer)return;
  _saveCfgTimer=setTimeout(()=>{ _saveCfgTimer=null; if(_saveCfgPending){ _saveCfgPending=false; _saveConfigNow(); } },500);
}
function _saveConfigFlush(){
  if(_saveCfgTimer){ clearTimeout(_saveCfgTimer); _saveCfgTimer=null; }
  if(_saveCfgPending){ _saveCfgPending=false; _saveConfigNow(); }
}
try{ window.addEventListener('beforeunload',()=>{ try{_saveConfigFlush();}catch(_){} }); }catch(_){}

async function refreshWebcamDevices(opts){
  // F6.2: NON aprire la webcam all'enumerazione (causa errore MFT 0xC00D3704 se in uso).
  // I label restano vuoti finch\u00e9 l'utente non avvia uno stream o non concede esplicitamente
  // il permesso. Forzare i permessi solo se opts.requestPermission===true.
  try{
    if(opts&&opts.requestPermission){
      // Tentativo "soft": prova prima solo audio (meno probabile collisione)
      try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());}catch(_){}
      try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());}catch(e){
        if(e&&(e.name==='NotReadableError'||/0xC00D3704|in use|hardware/i.test(e.message||''))){
          if(typeof toast==='function')toast('\u26a0 Webcam in uso da un\'altra applicazione');
        }
      }
    }
    const all=await navigator.mediaDevices.enumerateDevices();
    S.videoInputs=all.filter(d=>d.kind==='videoinput');
    S.audioInputs=all.filter(d=>d.kind==='audioinput');
    S.audioOutputs=all.filter(d=>d.kind==='audiooutput');
  }catch(e){console.warn(e);}
  if(S.panel==='settings'||S.panel==='webcam'||S.panel==='audioin')renderPanel();
}

async function act_openWebcam(pid){
  pid=(pid==null?S.activePlayer:pid);
  S.webcamPlayer=pid;

  openPanel('webcam');
}

async function startWebcamStream(pid,deviceId){
  if(!deviceId)return;
  if(deviceId==='__ipcam__'){act_openIPCam();return;}
  const p=P(pid);
  try{
    if(p._stream){try{p._stream.getTracks().forEach(t=>t.stop());}catch(e){}}
    const vc={};
    if(deviceId)vc.deviceId={exact:deviceId};
    if(S.webcamRes&&S.webcamRes!=='auto'){const [w,h]=S.webcamRes.split('x').map(Number);vc.width={ideal:w};vc.height={ideal:h};}
    if(S.webcamFps)vc.frameRate={ideal:S.webcamFps};
    const constraints={video:Object.keys(vc).length?vc:true,audio:true};
    const stream=await navigator.mediaDevices.getUserMedia(constraints);
    _attachStreamToPlayer(p, stream, 'Webcam');
    applyWebcamMirror();
    toast('Webcam attiva (Player '+(pid+1)+')');
  }catch(e){toast(e.message);}
}

}

function applyWebcamMirror(){
  document.querySelectorAll('.vc video').forEach(v=>{
    const cell=v.closest('.vc');if(!cell)return;
    const pid=parseInt(cell.dataset.pid,10);
    const p=Number.isFinite(pid)?P(pid):null;
    const isLive=p&&(p.source==='stream'||p._stream);
    if(isLive&&p._wcApplyFit){try{p._wcApplyFit();return;}catch(e){}}
    const rot=(p&&p.webcamRotation)||0;
    const tr=[];
    if(isLive&&S.webcamMirror)tr.push('scaleX(-1)');
    if(isLive&&rot)tr.push('rotate('+rot+'deg)');
    v.style.transform=tr.join(' ');
  });
}

function applyChannelMode(targetPid){
  const list = (targetPid==null) ? S.players : [P(targetPid)];
  list.forEach(p=>{
    if(!p)return;
    const f=p.playlist[p.idx]; if(!f)return;
    const ch=S.audioContexts[f.uid]; if(!ch||!ch.ctx)return;
    try{
      ch.volGain.disconnect();
      if(!ch.panner){ch.panner=ch.ctx.createStereoPanner();}
      ch.panner.pan.value=(p.audioBalance||0)/100;
      // Audio delay node (per-player, ms)
      if(!ch.delayN){ch.delayN=ch.ctx.createDelay(5);} // max 5s
      try{ch.delayN.delayTime.value=Math.max(0,(p.audioDelayMs||0))/1000;}catch(e){}
      if((p.audioChannels||'stereo')==='mono'){
        if(!ch.merger){ch.merger=ch.ctx.createChannelMerger(2); ch.splitter=ch.ctx.createChannelSplitter(2);}
        ch.volGain.connect(ch.panner);
        try{ch.panner.disconnect();}catch(e){}
        ch.panner.connect(ch.delayN);
        try{ch.delayN.disconnect();}catch(e){}
        ch.delayN.connect(ch.splitter);
        try{ch.splitter.disconnect();}catch(e){}
        ch.splitter.connect(ch.merger,0,0);
        ch.splitter.connect(ch.merger,0,1);
        ch.splitter.connect(ch.merger,1,0);
        ch.splitter.connect(ch.merger,1,1);
        try{ch.merger.disconnect();}catch(e){}
        ch.merger.connect(ch.ctx.destination);
      } else {
        ch.volGain.connect(ch.panner);
        try{ch.panner.disconnect();}catch(e){}
        ch.panner.connect(ch.delayN);
        try{ch.delayN.disconnect();}catch(e){}
        ch.delayN.connect(ch.ctx.destination);
      }
    }catch(e){}
  });
}

function toggleMagnifier(pid){
  const p=P(pid);
  setMagZoom(pid, p._mag?0:(p.magZoom||2));
}

function setMagZoom(pid, zoom){
  const p=P(pid);
  const cell=document.querySelector(`.vc[data-pid="${pid}"]`);
  if(!cell)return;
  // Pulizia stato precedente
  const oldLens=cell.querySelector('.mag-lens');
  const oldMini=cell.querySelector('.mag-mini');
  if(oldLens)oldLens.remove();
  if(oldMini)oldMini.remove();
  if(p._magCleanup){try{p._magCleanup();}catch(e){} p._magCleanup=null;}
  const vidNow=cell.querySelector('video');
  if(vidNow){
    vidNow.classList.remove('magnified');
    vidNow.style.removeProperty('--mag-z');
    vidNow.style.removeProperty('--mag-ox');
    vidNow.style.removeProperty('--mag-oy');
    vidNow.style.transform='';
    vidNow.style.transformOrigin='';
  }
  if(!zoom){
    p._mag=false; p._magCX=null; p._magCY=null;
    const btn=cell.querySelector('[data-mag]');if(btn)btn.classList.remove('on');
    return;
  }
  p._mag=true; p.magZoom=zoom;
  const btn=cell.querySelector('[data-mag]');if(btn)btn.classList.add('on');

  // Minimap: 220×130, rect interno trascinabile che seleziona la porzione visibile
  const MW=220, MH=130;
  const mini=document.createElement('div');mini.className='mag-mini';
  const miniCv=document.createElement('canvas');miniCv.width=MW;miniCv.height=MH;
  const miniRect=document.createElement('div');miniRect.className='mag-mini-rect';
  mini.appendChild(miniCv);mini.appendChild(miniRect);
  cell.appendChild(mini);
  const mctx=miniCv.getContext('2d');

  // Centro iniziale (0..1) — riusa ultimo se presente
  if(p._magCX==null)p._magCX=0.5;
  if(p._magCY==null)p._magCY=0.5;

  const rectW=MW/zoom, rectH=MH/zoom;

  const applyZoom=()=>{
    const vid=cell.querySelector('video');
    if(!vid)return;
    vid.classList.add('magnified');
    vid.style.setProperty('--mag-z', String(zoom));
    vid.style.setProperty('--mag-ox',(p._magCX*100)+'%');
    vid.style.setProperty('--mag-oy',(p._magCY*100)+'%');
    vid.style.transformOrigin=(p._magCX*100)+'% '+(p._magCY*100)+'%';
    vid.style.transform='scale('+zoom+')';
  };
  const placeRect=()=>{
    const cx=p._magCX, cy=p._magCY;
    // rettangolo centrato su (cx,cy) clampato nella minimap
    let rx=cx*MW - rectW/2, ry=cy*MH - rectH/2;
    rx=Math.max(0,Math.min(MW-rectW,rx));
    ry=Math.max(0,Math.min(MH-rectH,ry));
    miniRect.style.left=rx+'px';miniRect.style.top=ry+'px';
    miniRect.style.width=rectW+'px';miniRect.style.height=rectH+'px';
    // ricalcola center effettivo (dopo clamp) in 0..1 per transform-origin
    p._magCX=(rx+rectW/2)/MW;
    p._magCY=(ry+rectH/2)/MH;
  };
  placeRect();
  applyZoom();

  // Drag del rettangolo dentro la minimap
  let dragging=false, ox=0, oy=0;
  const onDown=e=>{
    e.stopPropagation(); e.preventDefault();
    dragging=true;
    const r=miniRect.getBoundingClientRect();
    ox=e.clientX-r.left; oy=e.clientY-r.top;
  };
  const onMove=e=>{
    if(!dragging)return;
    const mr=mini.getBoundingClientRect();
    let nx=e.clientX-mr.left-ox+rectW/2;
    let ny=e.clientY-mr.top-oy+rectH/2;
    p._magCX=Math.max(0,Math.min(1,nx/MW));
    p._magCY=Math.max(0,Math.min(1,ny/MH));
    placeRect(); applyZoom();
  };
  const onUp=()=>{dragging=false;};
  miniRect.addEventListener('mousedown',onDown);
  // Click sulla minimap (non sul rect) riposiziona al punto cliccato
  mini.addEventListener('mousedown',e=>{
    if(e.target===miniRect)return;
    const mr=mini.getBoundingClientRect();
    p._magCX=Math.max(0,Math.min(1,(e.clientX-mr.left)/MW));
    p._magCY=Math.max(0,Math.min(1,(e.clientY-mr.top)/MH));
    placeRect(); applyZoom();
    onDown(e);
  });
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  p._magCleanup=()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};

  // Loop di rendering della preview minimap
  const loop=()=>{
    if(!p._mag){if(p._magCleanup)p._magCleanup();return;}
    const curCell=document.querySelector(`.vc[data-pid="${pid}"]`);
    if(!curCell||!curCell.contains(mini)){if(p._magCleanup)p._magCleanup();return;}
    const vid=curCell.querySelector('video');
    if(vid&&vid.videoWidth){
      try{mctx.drawImage(vid,0,0,MW,MH);}catch(e){}
    } else {
      mctx.fillStyle='#111';mctx.fillRect(0,0,MW,MH);
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

// Long-press sul pulsante lente → dropup 2×/4×/8×
function wireMagLongPress(btn,pid){
  let t=null,fired=false;
  btn.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    fired=false;
    t=setTimeout(()=>{
      fired=true;
      showMagDropup(btn,pid);
    },380);
  });
  btn.addEventListener('mouseup',e=>{clearTimeout(t);});
  btn.addEventListener('mouseleave',()=>{clearTimeout(t);});
  btn.addEventListener('click',e=>{
    if(fired){e.stopPropagation();e.preventDefault();}
  },true);
}
function showMagDropup(btn,pid){
  const p=P(pid);
  document.querySelectorAll('.zoom-dropup').forEach(d=>d.remove());
  const dd=document.createElement('div');dd.className='zoom-dropup';
  [1,1.5,2,2.5,3,4].forEach(z=>{
    const it=document.createElement('div');it.className='dd-item';
    it.textContent=z+'× '+(p._mag&&p.magZoom===z?'•':'');
    it.onclick=ev=>{ev.stopPropagation();setMagZoom(pid,z);dd.remove();};
    dd.appendChild(it);
  });
  const off=document.createElement('div');off.className='dd-item';
  off.textContent=(t('disable')||'Disattiva')+' '+(!p._mag?'•':'');
  off.onclick=ev=>{ev.stopPropagation();setMagZoom(pid,0);dd.remove();};
  dd.appendChild(off);
  document.body.appendChild(dd);
  const r=btn.getBoundingClientRect();
  dd.style.left=Math.max(4,r.left-20)+'px';
  dd.style.top=(r.top-dd.offsetHeight-6)+'px';
  setTimeout(()=>{
    const out=e=>{if(!e.target.closest('.zoom-dropup')){dd.remove();document.removeEventListener('click',out,true);}};
    document.addEventListener('click',out,true);
  },0);
}

// ═══ RECORDING ═══
const REC={rec:null,chunks:[],startTs:0,pausedAt:0,totalPaused:0,mime:'',pid:-1};
// Recording per-cella (webcam/stream)
const CELL_RECS={};

async function startCellRecord(pid){
  const p=P(pid);
  if(!p){toast('Player non trovato');return;}
  // Recupera vidEl dal DOM se non è agganciato allo state
  if(!p.vidEl){
    const cellVid=document.querySelector(`.vc[data-pid="${pid}"] video`);
    if(cellVid)p.vidEl=cellVid;
  }
  // Detect live stream: state flag, source string, oppure video con srcObject
  const hasSrcObj=!!(p.vidEl&&p.vidEl.srcObject);
  const isLive=!!(p._stream||p.source==='stream'||hasSrcObj);
  if(!isLive){toast('Registrazione disponibile solo per webcam/stream');return;}
  if(CELL_RECS[pid]&&CELL_RECS[pid].rec.state!=='inactive'){toast('Registrazione già in corso');return;}
  try{
    // Cattura con audio preferibilmente dallo stream originale
    let vs=p._stream;
    if(!vs&&p.vidEl){
      vs=p.vidEl.captureStream?p.vidEl.captureStream():(p.vidEl.mozCaptureStream?p.vidEl.mozCaptureStream():null);
    }
    // Fallback: cerca un <video> nella cella e fai capture
    if(!vs){
      const cellVid=document.querySelector(`.vc[data-pid="${pid}"] video`);
      if(cellVid&&cellVid.srcObject){vs=cellVid.srcObject;}
      else if(cellVid&&cellVid.captureStream){vs=cellVid.captureStream();}
    }
    if(!vs){toast('Stream non disponibile');return;}
    // Se c'è rotazione o mirror, compongo via canvas per applicarli nell'export
    const rot=((p.webcamRotation||0)%360+360)%360;
    const mirror=!!S.webcamMirror;
    let recordStream=vs;
    let canvasRec=null;
    if(rot||mirror){
      const srcV=p.vidEl||document.querySelector(`.vc[data-pid="${pid}"] video`);
      if(srcV){
        const sw=srcV.videoWidth||1280;
        const sh=srcV.videoHeight||720;
        const rotated=(rot===90||rot===270);
        const cw=rotated?sh:sw;
        const ch=rotated?sw:sh;
        const cvs=document.createElement('canvas');
        cvs.width=cw;cvs.height=ch;
        const ctx=cvs.getContext('2d');
        let rafId=null;
        const draw=()=>{
          try{
            ctx.save();
            ctx.clearRect(0,0,cw,ch);
            ctx.translate(cw/2,ch/2);
            if(rot)ctx.rotate(rot*Math.PI/180);
            if(mirror)ctx.scale(-1,1);
            ctx.drawImage(srcV,-sw/2,-sh/2,sw,sh);
            ctx.restore();
          }catch(e){}
          rafId=requestAnimationFrame(draw);
        };
        draw();
        const canvasStream=cvs.captureStream(30);
        // aggiungi audio tracks originali
        try{vs.getAudioTracks().forEach(tr=>canvasStream.addTrack(tr));}catch(e){}
        recordStream=canvasStream;
        canvasRec={cvs,stop:()=>{if(rafId)cancelAnimationFrame(rafId);}};
      }
    }
    // Registriamo SEMPRE in webm (VP9/VP8): Chromium lo produce in modo affidabile.
    // La conversione nel formato finale (mp4 di default) avviene a fine registrazione
    // via ffmpeg → file pulito, seekable, senza freeze (vedi saveCellRecording).
    const mimes=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
    const rec=new MediaRecorder(recordStream,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{});
    const state={rec,chunks:[],startTs:Date.now(),totalPaused:0,pausedAt:0,mime,pid,tick:null,canvasRec};
    rec.ondataavailable=e=>{if(e.data.size>0)state.chunks.push(e.data);};
    rec.onstop=()=>saveCellRecording(pid,state);
    rec.start(1000);
    CELL_RECS[pid]=state;
    // UI
    const cell=document.querySelector(`.vc[data-pid="${pid}"]`);
    if(cell){
      cell.classList.add('rec');
      const rb=cell.querySelector('[data-recstart]'); if(rb)rb.style.display='none';
      const rp=cell.querySelector('[data-recpause]'); if(rp)rp.style.display='flex';
      const rs=cell.querySelector('[data-recstop]'); if(rs)rs.style.display='flex';
      const tm=cell.querySelector('[data-rectimer]'); if(tm)tm.classList.add('on');
      // In webcam mode il play diventa pausa (barre). Altrimenti stop (quadrato).
      const pb=cell.querySelector('[data-play] svg path');
      if(pb){
        if(cell.classList.contains('webcam'))pb.setAttribute('d','M6 19h4V5H6v14zm8-14v14h4V5h-4z');

async function saveCellRecording(pid,st){
  const blob=new Blob(st.chunks,{type:st.mime||'video/webm'});
  const sizeMb=Math.round(blob.size/1024/1024*10)/10;
  // Container finale richiesto dall'utente (default mp4 = massima compatibilità).
  const desired=(S.recordFormat||'mp4').toLowerCase();
  const ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  // Salviamo sempre il grezzo .webm, poi (se serve) lo convertiamo nel formato finale.
  const rawName='maniac-webcam-P'+(pid+1)+'-'+ts+'.webm';
  const folder=S.recordFolder||'';
  try{
    if(window.maniac&&window.maniac.saveRecording){
      const buf=await blob.arrayBuffer();
      const r=await window.maniac.saveRecording(buf,rawName,folder);
      if(r.success){
        let finalPath=r.path;
        // Conversione → file pulito/seekable. webm resta com'è (già pronto).
        if(desired!=='webm' && window.maniac.ffmpegConvert){
          toast('Finalizzo registrazione ('+desired.toUpperCase()+')…');
          try{
            const c=await window.maniac.ffmpegConvert(r.path,desired);
            if(c&&c.success&&c.path)finalPath=c.path;
          }catch(_){}
        }
        toast('Salvato: '+finalPath.split(/[\\/]/).slice(-2).join('/')+' ('+sizeMb+' MB)');
        delete CELL_RECS[pid];
        return;
      } else { toast((r.error||'Errore salvataggio')); }
    }
    // Fallback: download via browser (modalità web, niente main process)
    const a=document.createElement('a');
    const url=URL.createObjectURL(blob);
    a.href=url;a.download=rawName;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
    toast('Download avviato ('+sizeMb+' MB)');
  }catch(e){toast(e.message);}
  delete CELL_RECS[pid];
}

// ═══ MAIN PROGRESS BAR ═══
function _wireMainProgress(){
  const bar=$('mainProgress'); if(!bar)return;
  const fill=$('mainProgFill');
  const buf=$('mainBufFill');
  const thumb=$('mainProgThumb');
  let drag=false;
  const getVid=()=>{const p=activeP();return p&&p.vidEl?p.vidEl:null;};
  const isLive=()=>{const p=activeP();return !!(p&&(p._stream||p.source==='stream'));};
  let _mpPending=null,_mpRaf=0;
  const _commitMP=()=>{
    _mpRaf=0;
    if(_mpPending==null)return;
    const vid=getVid(); if(!vid){_mpPending=null;return;}
    const t=_mpPending;_mpPending=null;
    try{ if(typeof vid.fastSeek==='function') vid.fastSeek(t); else vid.currentTime=t; }catch(_){ try{vid.currentTime=t;}catch(__){} }
  };
  const place=(x)=>{
    const vid=getVid(); if(!vid||!vid.duration||isLive())return;
    const r=bar.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(x-r.left)/r.width));
    const t=pct*vid.duration;
    if(fill) fill.style.width=(pct*100).toFixed(2)+'%';
    if(thumb) thumb.style.left=(pct*100).toFixed(2)+'%';
    _mpPending=t;
    if(!_mpRaf) _mpRaf=requestAnimationFrame(_commitMP);
  };
  bar.addEventListener('mousedown',e=>{drag=true;place(e.clientX);});
  window.addEventListener('mousemove',e=>{if(drag)place(e.clientX);});
  window.addEventListener('mouseup',()=>{if(drag){drag=false;_commitMP();}});
  const tip=$('mainProgTip');
  const tipT=tip&&tip.querySelector('.mp-tip-t');
  const tipCv=tip&&tip.querySelector('canvas');
  const tipCtx=tipCv&&tipCv.getContext('2d');
  let _prevVid=null,_prevSrc='',_prevReq=0;
  const ensurePrev=(src)=>{
    if(_prevVid&&_prevSrc===src)return _prevVid;
    if(_prevVid){try{_prevVid.pause();_prevVid.src='';}catch(e){}}
    _prevVid=document.createElement('video');
    _prevVid.src=src;_prevVid.muted=true;_prevVid.preload='auto';_prevVid.playsInline=true;_prevVid.crossOrigin='anonymous';
    _prevSrc=src;
    return _prevVid;
  };
  // Scrubber preview con coda single-slot: niente backlog di seek concorrenti.
  // Se il decoder è già in seeking, accodiamo SOLO l'ultima richiesta in pv._pending.
  // Quando il seek corrente termina, se c'è un pending, riavviamo verso quel valore.
  const seekPrev=(time)=>{
    const vid=getVid();if(!vid||!vid.src||!tipCtx)return;
    const pv=ensurePrev(vid.src);
    pv._pending=time;
    if(pv.seeking)return; // un altro seek in corso → arriverà via onSeeked
    const t=pv._pending; pv._pending=null;
    const id=++_prevReq;
    const onSeeked=()=>{
      if(id===_prevReq){try{tipCtx.drawImage(pv,0,0,tipCv.width,tipCv.height);}catch(e){}}
      pv.removeEventListener('seeked',onSeeked);
      // se nel frattempo è arrivata una nuova richiesta, riparte verso il nuovo target
      if(pv._pending!=null){
        const nt=pv._pending; pv._pending=null;
        try{ pv.fastSeek?pv.fastSeek(nt):(pv.currentTime=nt); }catch(_){}
      }
    };
    pv.addEventListener('seeked',onSeeked);
    try{ pv.fastSeek?pv.fastSeek(t):(pv.currentTime=t); }catch(_){}
  };
  // Scrubber preview reattivo — DOM aggiornato a 60 Hz, decoder seek throttlato a ~30 Hz.
  let _hoverPending=null,_hoverRaf=0,_hoverDecoderAt=0;
  const _commitHover=()=>{
    _hoverRaf=0;
    if(!_hoverPending)return;
    const {pct,time}=_hoverPending; _hoverPending=null;
    if(tip){tip.style.left=(pct*100)+'%';tip.style.opacity='1';}
    if(tipT)tipT.textContent=fmtTime(time);
    // throttle decoder seek a ~30 Hz; skip se preview decoder è già occupato
    const now=performance.now();
    if(now-_hoverDecoderAt<33)return;
    if(_prevVid&&_prevVid.seeking)return;
    _hoverDecoderAt=now;
    seekPrev(time);
  };
  bar.addEventListener('mousemove',e=>{
    const r=bar.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    if(thumb)thumb.style.left=(pct*100)+'%';
    const vid=getVid();
    if(!vid||!vid.duration||!isFinite(vid.duration)||isLive()){if(tip)tip.style.opacity='0';return;}
    _hoverPending={pct,time:pct*vid.duration};
    if(!_hoverRaf)_hoverRaf=requestAnimationFrame(_commitHover);
  });
  bar.addEventListener('mouseleave',()=>{if(tip)tip.style.opacity='0';});
  // Wheel orizzontale fluido — 6 scroll percorrono l'intero video con lerp animato.
  // - DOM (fill/thumb) aggiornato istantaneamente: la barra non lagga sul cursore.
  // - currentTime interpolato in ~110 ms verso il target accumulato.
  // - Eventi wheel rapidi vengono sommati in un unico target → animazione unica.
  let _wTargetT=null,_wRaf=0,_wCurT=0;
  const _wheelStep=(delta)=>{
    const vid=getVid();
    if(!vid||!isFinite(vid.duration)||vid.duration<=0||isLive())return;
    // notch dinamico (S.wheelNotch) percorrono l'intero video.
    // Cap a ±240 per evento per evitare salti enormi con mouse free-spinning.
    const d=Math.max(-240,Math.min(240,delta));
    const stepPerUnit=(vid.duration/(S.wheelNotch||12))/120;
    const cur=(_wTargetT!=null?_wTargetT:(vid.currentTime||0));
    _wTargetT=Math.max(0,Math.min(vid.duration,cur+d*stepPerUnit));
    // Feedback visuale immediato — non aspettiamo il decoder.
    const pct=_wTargetT/vid.duration;
    if(fill)fill.style.width=(pct*100).toFixed(2)+'%';
    if(thumb)thumb.style.left=(pct*100).toFixed(2)+'%';
    if(!_wRaf){
      _wCurT=vid.currentTime||0;
      const tick=()=>{
        const v=getVid();
        if(!v||_wTargetT==null){_wRaf=0;return;}
        _wCurT+=(_wTargetT-_wCurT)*(S.wheelLerp||0.30); // lerp 30%/frame default; configurabile
        try{ v.fastSeek?v.fastSeek(_wCurT):(v.currentTime=_wCurT); }catch(_){}
        if(Math.abs(_wTargetT-_wCurT)<0.05){       // sotto 50 ms di gap → snap finale
          try{ v.fastSeek?v.fastSeek(_wTargetT):(v.currentTime=_wTargetT); }catch(_){}
          _wTargetT=null;_wRaf=0;return;
        }
        _wRaf=requestAnimationFrame(tick);
      };
      _wRaf=requestAnimationFrame(tick);
    }
  };
  bar.addEventListener('wheel',e=>{
    const vid=getVid(); if(!vid||!isFinite(vid.duration)||vid.duration<=0||isLive())return;
    e.preventDefault();
    const delta=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY);
    if(delta) _wheelStep(delta);
  },{passive:false});
  const tick=()=>{
    const vid=getVid();
    const live=isLive();
    bar.classList.toggle('live',live);
    if(vid&&isFinite(vid.duration)&&vid.duration>0&&!live){
      const pct=Math.max(0,Math.min(1,(vid.currentTime||0)/vid.duration));
      const pctS=(pct*100).toFixed(2)+'%';
      fill.style.width=pctS;
      thumb.style.left=pctS;
      try{
        if(vid.buffered.length){
          const b=Math.min(1,vid.buffered.end(vid.buffered.length-1)/vid.duration);
          buf.style.width=(b*100).toFixed(2)+'%';
        }
      }catch(e){}
    } else {
      fill.style.width='0%';
      thumb.style.left='0%';
      buf.style.width='0%';
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ═══ VENV / AI health check — SILENT IN BACKGROUND ═══
async function initVenvCheck(force){
  const banner = document.getElementById('venvBanner');
  if (banner) banner.style.display='none'; // mai bloccante all'avvio
  if (!window.maniac || !window.maniac.ai) return;
  try {
    let r = await window.maniac.ai.venvCheck(!!force);
    let info = (r && r.info) || {};
    // Tenta UNA SOLA volta l'auto-install dei pacchetti opzionali mancanti
    // (mutagen, pyacoustid) per silenziare il warning sui sistemi pulitamente
    // configurati. Se pip fallisce (es. offline) si prosegue senza warning bloccante.
    try{
      const optInfo = info.optional || {};
      const need = [];
      if (optInfo.mutagen && !optInfo.mutagen.ok) need.push('mutagen');
      if (optInfo.pyacoustid && !optInfo.pyacoustid.ok) need.push('pyacoustid');
      const lsKey='maniac_optInstallTried';
      const triedAt=+(localStorage.getItem(lsKey)||0);
      const now=Date.now();
      // riprova al massimo ogni 24h
      if(need.length && window.maniac.ai.installOptional && (now-triedAt > 24*60*60*1000)){
        localStorage.setItem(lsKey,String(now));
        // installazione asincrona, senza bloccare la UI; al termine ricontrolla
        window.maniac.ai.installOptional(need).then(async(rr)=>{
          if(rr&&rr.ok){
            try{ const r2=await window.maniac.ai.venvCheck(true); window.__maniacAI={ok:!!(r2&&r2.ok),info:(r2&&r2.info)||{}}; }catch(_){}
          }
        }).catch(()=>{});
      }
    }catch(_){}
    const mods = info.modules || {};
    const opt  = info.optional || {};
    const allMods = Object.assign({}, opt, mods); // optional può essere richiesto da [data-ai-requires]
    const okAll = !!(r && r.ok);
    window.__maniacAI={ ok: okAll, info };
    // abilita/disabilita i controlli AI in base alla disponibilità (core + optional)
    try { document.querySelectorAll('[data-ai-requires]').forEach(el=>{
      const need = (el.getAttribute('data-ai-requires')||'').split(',').map(s=>s.trim()).filter(Boolean);
      const modOk = need.every(m => allMods[m] && allMods[m].ok);
      el.classList.toggle('ai-disabled', !modOk);
      if (!modOk){ el.setAttribute('title', 'Richiede: '+need.join(', ')); el.setAttribute('disabled','true'); }
      else { el.removeAttribute('disabled'); }
    }); } catch(e){}
    // Toast/log SOLO se mancano moduli core o ffmpeg (i moduli optional non degradano lo stato).
    // Mutagen/pyacoustid sono OPZIONALI (musica via Shazam funziona comunque): non li mostriamo.
    const OPTIONAL_NAMES = new Set(['mutagen','pyacoustid','acoustid','faster-whisper','argos-translate','pymediainfo']);
    const missingCore = Object.entries(mods)
      .filter(([k,v])=>!v.ok && !OPTIONAL_NAMES.has(k))
      .map(([k])=>k);
    const ffmpegMissing = !(info.ffmpeg&&info.ffmpeg.ok);
    // Considera "tutto ok" anche se mancano solo moduli opzionali.
    const coreOk = !missingCore.length && !ffmpegMissing && (!r || r.ok!==false || !r.error);
    if ((!okAll && !coreOk) || missingCore.length || ffmpegMissing){
      const parts=[];
      if (r && !r.ok && !coreOk) parts.push(r.error||'venv non disponibile');
      if (missingCore.length) parts.push('moduli: '+missingCore.join(', '));
      if (ffmpegMissing) parts.push('ffmpeg mancante');
      if (parts.length){
        const msg='AI parzialmente disponibile — '+parts.join(' · ');
        try{ if(typeof toast==='function') toast(msg); }catch(e){}
        try{ if(typeof logError==='function') logError(msg,(r&&r.stdout)||''); }catch(e){}
      }
    }
  } catch(e){
    try{ if(typeof toast==='function') toast('Errore health check AI: '+e.message); }catch(_){}
    try{ if(typeof logError==='function') logError('venv exception: '+e.message,e.stack||''); }catch(_){}
  }
}
// L'app parte subito: il check gira in background appena il player è pronto.
window.addEventListener('DOMContentLoaded', ()=>{
  // i18n: inizializza prima del resto così t() è già disponibile
  try{ if(window.i18n&&window.i18n.init) window.i18n.init().catch(()=>{}); }catch(_){}
  setTimeout(()=>{try{initVenvCheck(false);}catch(e){}}, 1200);

// Helper globale: tr('chiave.dotata', {var:val}) — usa il modulo i18n moderno.

function tr(key, vars){ try{ return (window.i18n&&window.i18n.t) ? window.i18n.t(key, vars) : key; }catch(_){ return key; } }

// ═══ CONTEXT MENU (copia/incolla) su input/textarea via tasto destro ═══
(function(){
  const isEditable=el=>{
    if(!el)return false;
    if(el.tagName==='TEXTAREA')return true;
    if(el.tagName==='INPUT'){const t=(el.type||'text').toLowerCase();return ['text','search','url','email','tel','password','number'].includes(t);}
    if(el.isContentEditable)return true;
    return false;
  };
  document.addEventListener('contextmenu',async e=>{
    const tgt=e.target.closest('input,textarea,[contenteditable="true"]');
    if(!isEditable(tgt))return;
    e.preventDefault();
    // chiudi eventuali menu precedenti
    document.querySelectorAll('.txt-ctx').forEach(m=>m.remove());
    const m=document.createElement('div');
    m.className='txt-ctx';
    m.style.cssText='position:fixed;z-index:10000;background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:4px;min-width:160px;box-shadow:0 8px 28px rgba(0,0,0,.4);font:500 12px Inter,sans-serif';
    const hasSel=tgt.selectionStart!=null&&tgt.selectionStart!==tgt.selectionEnd;
    const mkItem=(lbl,fn,enabled=true)=>{
      const it=document.createElement('div');
      it.textContent=lbl;
      it.style.cssText='padding:7px 12px;border-radius:4px;cursor:pointer;color:var(--t1);'+(enabled?'':'opacity:.4;pointer-events:none');
      it.onmouseenter=()=>it.style.background='var(--p)';
      it.onmouseleave=()=>it.style.background='';
      it.onclick=()=>{fn();m.remove();};
      m.appendChild(it);
    };
    mkItem('Taglia',()=>{ if(tgt.select){try{navigator.clipboard.writeText(tgt.value.slice(tgt.selectionStart,tgt.selectionEnd));}catch(_){}tgt.setRangeText('',tgt.selectionStart,tgt.selectionEnd,'end');tgt.dispatchEvent(new Event('input',{bubbles:true}));} },hasSel&&!tgt.readOnly&&!tgt.disabled);
    mkItem('Copia',async()=>{ try{await navigator.clipboard.writeText(tgt.value.slice(tgt.selectionStart,tgt.selectionEnd));}catch(_){ }},hasSel);
    mkItem('Incolla',async()=>{ try{const t=await navigator.clipboard.readText();if(t==null)return;const s=tgt.selectionStart,e=tgt.selectionEnd;tgt.setRangeText(t,s,e,'end');tgt.dispatchEvent(new Event('input',{bubbles:true}));}catch(_){}} ,!tgt.readOnly&&!tgt.disabled);
    mkItem('Seleziona tutto',()=>{try{tgt.select&&tgt.select();}catch(_){}},true);
    document.body.appendChild(m);
    const r=m.getBoundingClientRect();
    const x=Math.min(e.clientX,window.innerWidth-r.width-4);
    const y=Math.min(e.clientY,window.innerHeight-r.height-4);
    m.style.left=x+'px';m.style.top=y+'px';
    const close=ev=>{if(!m.contains(ev.target)){m.remove();document.removeEventListener('mousedown',close,true);}};
    setTimeout(()=>document.addEventListener('mousedown',close,true),0);
  });
})();
